<script>
const book = {"title": "十四小时 (English Edition)", "author": "FutureTxt AI Writer", "description": "In the megacity of 2126, every scarce public benefit — housing vouchers, cross‑district medical quotas, school enrollment slots — is funneled through the Sequence Hall, a blockchain‑backed queue that assigns each citizen a digital rank. The wealthy hire “stand‑ins” to hold their place for hours, while the underclass survives on day‑labor gigs that barely cover a night’s bunk in a cramped capsule dorm. Lin Xiu, forty‑eight, shoulders a chronic neck injury and spends fourteen hours a day standing in line for strangers, earning just enough for a mattress. Her twelve‑year‑old daughter, Xiao Yu, holds a temporary residency number that expires next Wednesday; the law demands a guardian appear in person at the service window, or the slot is lost and the girl must wait another year, missing the legal school‑entry age. Lin can afford to queue for anyone else, yet she cannot afford to queue for herself.", "total_words": 15634, "chapters": [{"index": 1, "title": "十四小时 (English Edition)", "words": 15634, "paragraphs": ["05:40, the Regular Channel entrance of Sequence Hall B1. Cold wind carried the scent of disinfectant, mingled with a hint of rust and cheap laundry detergent. Lin Xiu pulled a chipped stainless‑steel thermos from her coat pocket; the rust line on the lid glowed a dull crimson under the neon lights. The moment her fingertips touched the icy metal, a dull ache flared deep in her shoulder blades. The synthetic female voice in her earpiece announced on schedule: “Work order 20260701‑001, queue‑substitution duration 14 hours, net pay 9.36 CNY/hour, Credit Score 620, complete deduction before 22:00.” She screwed the lid tight; steam billowed out and slid down her throat—her first hot sip of the day, the only fuel keeping her heart‑rate band in the 60‑100 range.", "Both sides of the channel were packed with Temporary‑Tier workers, their wrist Identity Chains pulsing a gray‑blue glow; every extra hour of waiting cost them 12 CNY . Lin Xiu regulated her breathing; the anti‑fatigue mat underfoot felt like an iron plate, and her knees protested from the first minute of standing. She recited the work‑order numbers like a lifeline: “20260701‑001, 20260701‑002…” The platform took a 22 % commission, leaving 9.36 CNY per hour; fourteen hours yielded exactly 131.04 CNY. A night in Pod 3, Unit 402 cost 130 CNY , leaving 1.04 CNY— not enough for a single pack of compressed biscuits.", "**Hour 1.** Window 12 called “Temporary‑087.” Lin Xiu stepped forward; fingerprint, iris, voiceprint—triple verification. The screen flashed green; the earpiece chimed “Checked‑in.” She pressed the thermos against her neck; heat seeped into muscle fibers, the heart‑rate band vibrated once—“On‑duty.” Around her, breaths, footsteps, occasional coughs wove a low white‑noise hum, like an aging air‑conditioner’s drone. The skin at the nape of her neck reddened from the metal cup; sweat traced her collarbone, absorbed by the mask’s edge.", "**Hour 2.** The queue surged like tide, pushing her forward. The migrant‑registration slip in her backpack pressed hard against her chest; its expiry was Wednesday 24:00, and the in‑person biometric signing required the guardian’s physical presence—no substitution, no remote . She calculated silently: finish the shift, deposit the 130 CNY into the Pod Smart Lock by 21:55, then squeeze half an hour to Window 7, complete fingerprint, iris, voiceprint—only then could Xiao Yu avoid missing the school‑age cutoff. A distant looped announcement—“Please keep distance while queuing”—bounced off the metal grates, hollow and shrill. Her fingertips traced the slip’s softened edge; sweat had softened the paper, leaving faint fingerprint impressions.", "**Hour 3.** The shoulder‑neck ache sharpened from dull to acute, a rusted saw dragging across bone gaps. She unscrewed the lid, poured hot water onto a towel, pressed it to her nape; steam condensed into white mist inside the mask, seeping through her nostrils, stealing a sliver of chill. The earpiece sounded again: “Work order 20260701‑003, countdown 11 hours.” Each step on the metal grating emitted a muted “tap, tap,” mingling with the soft “shush” of the red queue slips fluttering in the draft. The middle‑aged man in a reflective vest kept checking his watch, muttering “How much longer?” Lin Xiu didn’t turn; her eyes stayed locked on the jumping countdown digits.", "**Hour 4.** The air thickened with stale sweat and cheap fried‑food fumes; a cleaning robot glided by, releasing a faint ozone scent. Her legs grew heavy; knee cartilage felt sanded, each flexion accompanied by a faint “click.” She retightened the thermos; fingertips brushed the rust line, cold crawling up the back of her hand, a reminder that time kept flowing. The screen showed “Work order 20260701‑004” in steady green; the earpiece repeated flatly: “On‑duty.”", "**Hour 5.** The platform pushed a highlighted order: “Cross‑district Medical Advance Points Pool window, queue‑jump premium 200 CNY, employer Chen Gong, Credit 820.” Lin Xiu glimpsed the constant “Credit 820” on her wristband. Queue‑jump detection meant a 30‑point credit deduction, a 7‑day ban, and a 200 CNY fine . Her Credit Score was 620, only 20 points above the 600 red line; a ban would wipe out the remaining fourteen hours, and tonight she’d be sleeping in the corridor. Her finger hovered over “Reject”; the synthetic voice droned: “System recorded; overtime will be auto‑judged as off‑duty.” She pressed “Reject”; the screen grayed out, heart rate staying under 100. A few nearby youths whispered, eyes darting between her and the screen. Lin Xiu pretended not to hear, gaze returning to the countdown.", "**Hour 6.** Only a dim yellow lamp remained in the rest area, its shade caked with dust, casting a murky halo. Lin Xiu screwed the lid tight, used the remaining 90 minutes to heat‑press her neck; the cup’s warmth crept up her palm, a fragile lifeline. Wang Jie returned from the night‑shift cleaning, collar damp, and handed her a packet of instant coffee: “Sister Xiu, any hot water left in the cup?” Lin Xiu nodded, swallowed the bitterness; caffeine shoved drowsiness back. She pulled out the migrant‑registration slip; edges worn white, the number “No. 7” faint under the lamp. Xiao Yu’s backpack bore an identical plastic clasp engraved “No. 7”—her sole proof: I have a guardian, I can attend school. Wang Jie sighed, patted Lin Xiu’s shoulder: “Don’t be so hard on yourself; just get through it.” Lin Xiu forced a smile; a sour lump rose in her throat.", "**Hour 7.** The broadcast looped: “Today’s average queue‑substitution rate 9.36 CNY/hour; rating below 4.5 incurs downgrade.” Lin Xiu’s rating was 4.6, earned by standing an extra half‑hour each day. She recited the work‑order numbers again, tapped “Continue”; the heart‑rate band vibrated—“On‑duty.” Pain radiated from neck to left arm, like iron wire tightening. She pressed the thermos against the doorframe’s metal edge; the cup was cold, the rust line imprinting her fingerprint, as if it were timing her. The low rumble of the escalator vibrated through the floor, numbing her soles.", "**Hour 8.** Crowds thinned, leaving only a few regulars clinging to orders. Vision blurred; numbers overlapped and separated with each blink. She forced her eyes on the screen: “Work order 20260701‑008, countdown 6 hours.” The inside of her mask grew damp; exhaled heat fogged her lenses. She wiped them with a sleeve, fingertips brushing the cold metal frame—sharp sting.", "**Hour 9.** The mechanical broadcast persisted; rating 4.6 barely held. She recited the order again, tapped “Continue”; heart‑rate band vibrated—“On‑duty.” Pain now threaded down her left arm, the iron‑wire sensation intensifying. Thermos against the doorframe, metal cold, rust line against fingertip. The air mixed disinfectant with stale coffee; each deep breath felt like inhaling fine metal dust.", "**Hour 10.** Legs felt leaden; every knee bend emitted a faint “click.” Backpack straps dug in; the registration slip pressed hard against her chest, a reminder of the more critical deadline. The earpiece calmly announced: “Work order 20260701‑010, countdown 4 hours.” She closed her eyes for a few seconds; Xiao Yu in a blue school uniform, backpack bearing the “No. 7” clasp, waiting at the school gate flashed in her mind—her chest tightened, then she opened her eyes and kept standing.", "**Hour 11.** Chen Gong’s premium order reappeared, framed by a red 30‑minute countdown: “Last chance, queue‑jump 200 CNY, instant settlement.” Lin Xiu stared at the screen; the earpiece repeated: “Complete deduction before 22:00.” Account balance 131.04 CNY; after the 130 CNY rent, 1.04 CNY remained. Accepting would drop her credit below 600, triggering a 7‑day platform ban—no income for the remaining fourteen hours, and she couldn’t scrape together next week’s rent before Wednesday’s in‑person signing. Rejecting meant logging off 30 minutes early, racing back to the Pod Housing to swipe the lock by 21:55, then dashing to Window 7 in Sequence Hall to finish fingerprint, iris, voiceprint—locking Xiao Yu’s registration number before expiry.", "She clenched the thermos; the rust line dug into her palm, knuckles whitening. The “Accept” button pulsed; “Reject” stayed dim. Lin Xiu exhaled; breath condensed into a thin veil inside the mask, then vanished. She tapped “Reject.”", "The order column instantly grayed; the earpiece delivered the final line: “Work order 20260701‑014, off‑duty, net 131.04 CNY, Credit Score 620.” Lin Xiu rose; her knee gave a crisp “click,” the neck ache withdrawing like a pulled nail, leaving an empty gap. She hoisted her backpack; the thermos dangled from her index finger, the rust line scraping a faint “hiss” against the revolving door’s metal frame.", "The moment the revolving door closed, the call‑system’s synthetic female voice rang clear: “Lin Xiu, Window 7.” Cold white light stabbed her lashes; fingertips still clamped on the rusted lid, steps unbroken.", "The revolving door sealed, cold white light slicing like a blade across her eyelids. The air carried disinfectant, stale coffee, and a faint iron tang; each breath tasted metallic. The composite floor trembled faintly; the escalator’s low‑frequency roar climbed from soles to calves, every knee bend emitting a fine “click,” like aging gears meshing. She didn’t pause; backpack straps tightened across her chest, the registration slip a hard lump over her heart, fingertips still gripping the thermos lid’s rust, knuckles pale.", "At the corridor’s end, Window 7 glowed a soft blue; the screen scrolled “Sequence Verification in Progress,” the synthetic voice calm: “Lin Xiu, identity verification, please cooperate.” She shoved the thermos into the side pocket of her backpack—metal lid clunked against the zipper—then extended her left hand, fingertips hovering over the fingerprint scanner, palm damp, ridges glistening under the cold light. The scanner emitted a soft beep; green light swept her fingertip; the screen flashed “Fingerprint Passed.”", "Next, the iris scanner extended, a cool gust brushing her eyelids. She narrowed her eyes; pupils contracted in the infrared ring; the screen displayed “Iris Passed.” The voiceprint collector popped up, demanding a random numeric string. She inhaled a lungful of disinfectant‑laden air, throat dry, vocal cords vibrating “Three, seven, nine, one, four.” The synthetic voice confirmed: “Voiceprint Passed, Sequence Locked.”", "A green line centered on the screen: “Xiao Yu, Registration No. 7‑042‑19, valid until 2026‑07‑15 23:59.” She stared at the characters; the iron wire in her chest seemed to loosen an inch. Fingertips brushed the backpack strap; rough nylon rasped a faint “shush.” The synthetic voice continued: “Please confirm receipt of Temporary Residence Code, scan to phone.” She retrieved her phone; the screen lit a QR code. Fingertips trembled over the scanner; a soft “beep” sounded, the code instantly grayed, the phone vibrated, displaying “Temporary Residence Code Generated.”", "She slipped the phone back into her pocket; backpack straps bit into her shoulders, knees clicking again—some mechanism reminding her the journey wasn’t over. The automatic doors at the corridor’s end slid open; night wind carried distant viaduct exhaust, drying the thin mist inside her mask. She stepped out of Sequence Hall; streetlamps stretched her shadow long. The thermos swayed gently in the backpack, rust glinting in the darkness. Ahead, the Pod Housing’s corridor lights flickered; she quickened her pace, fingertips still locked on the rusted lid, knuckles white, heart hammering against a rusted iron plate in her chest.", "Night wind wrapped exhaust and damp mold around her collar; Lin Xiu tightened her mask, fingertips still dead‑set on the thermos lid’s rust spot, knuckles glowing pale in the gloom. The Pod Housing’s iron‑sheet corridor stretched under the streetlamps into a gray‑black pipe; peeling paint flaked like scales, each step on the concrete slabs echoing a dull “thud, thud,” as if the whole building breathed for her.", "“Sister Xiu, you’re back?” A low, raspy female voice emerged from a side door, half a body visible, clutching a crumpled delivery slip, fingernails rimmed with gray‑black grease. It was Chen Sao from Unit 302, eye‑bags deep enough to hold two dewdrops, brows knotted into a dead‑end line.", "Lin Xiu didn’t look up, merely tightened the backpack strap, a hoarse “Mm” escaping her throat. Chen Sao pressed the slip into her palm; the stiff paper scraped her palm. “Your code expires today. The community station still needs a visit—don’t wait until tomorrow to remember.”", "“Got it.” Lin Xiu crumpled the slip, shoved it into a pocket, fingertips touching the cold phone frame; the green line still pulsed on the screen: “Temporary Residence Code Generated.” She didn’t want to hear the synthetic voice repeat, nor watch the countdown hit 23:59.", "The motion‑sensor lights at the corridor’s end flickered, revealing rows of folding beds squeezed into the hallway; each sheet printed with a different QR code, like collective tattoos. A few young tenants hunched over phones, fingertips sliding across glass, emitting faint “zzz” sounds; blue light mapped tired faces. Lin Xiu slipped past them, shoulder bumping a bulging woven sack; a few rusted rebar ends protruded, scoring her forearm.", "“Hey, Lin Xiu!” A male voice drifted from the stairwell, sweet‑ish vape tobacco scent trailing. It was Lao Zhao from Unit 405, a still‑smoking vape pen between fingers, vapor curling into white wisps in the cold air. “Heard you went to Sequence Hall today? The new rules… tsk, they really treat people like spare parts.”", "Lin Xiu halted, breath muffled “huh, huh” inside the mask. She stared at the vape pen between Lao Zhao’s fingers, fingertips unconsciously rubbing the thermos lid’s rust. “Parts still have to survive.”", "Lao Zhao chuckled, vapor brushing her face. “Survival still costs protection money. The community station’s Director Wang has been eyeing our building’s ‘floating‑population’ quota, wants to replace ‘temporary codes’ with ‘long‑term codes’ and charge a ‘credit deposit.’ Your 620—enough?”", "“Enough isn’t up to me.” Lin Xiu hoisted the backpack strap higher; her knee clicked again, pain needling into bone seams. “I just get Xiao Yu into school; the rest… one step at a time.”", "Lao Zhao nodded, vapor twisting into a gray serpent under the lamp. “One step at a time is still a path. But…” He paused, gaze landing on the phone clenched in Lin Xiu’s hand. “Your code grays out once scanned. Don’t forget to submit the ‘long‑term code’ application before the 15th, or next month you won’t even get into this hallway.”", "Lin Xiu didn’t turn; she accelerated, the composite floor’s vibration climbing from calves to thighs, the distant escalator’s low rumble faintly echoing. She pocketed the phone; fingertips brushed the cold metal frame, the screen now a black mirror reflecting her exhausted silhouette.", "The fire door at the corridor’s end slammed shut with a “bang,” night wind funneling the viaduct’s roar inside, evaporating the last veil inside her mask. Lin Xiu looked up; the Pod Housing’s rooftop loomed vague in the night, a few dim searchlights blinking like ancient eyes watching every shadow climbing the stairs. She gritted her teeth, knuckles tightening again on the rusted lid, and stepped into the gray‑black pipe—each step forward, toward the still‑unexpired 23:59.", "The stairwell’s concrete walls wept a thin film of mold; steel tread plates resonated a dull “thud, thud” with every footfall, vibration traveling up shins to knees, then into hip joints. Lin Xiu cinched the backpack straps; knuckles traced fine white lines across the rusted lid’s edge, fingertips touching metal so cold it seemed to swallow body heat in one gulp.", "A motion sensor at the landing flared, harsh white light bleaching the folding beds on either side; QR codes on sheets flickered in the glow, a row of barcodes awaiting scanning. Several youths in thin jackets hunched over phones, fingertips sliding, emitting faint “zzz” sounds; blue light mapped their eyelids, blinking with an algorithm‑tamed weariness.", "“Lin Xiu, wait.” A low, raspy female voice descended from above, laced with stale detergent scent. It was Wang Jie from Unit 302, lugging a bulging plastic bag; a few yellowed plastic tubes peeked out. “Heard the community station will audit ‘long‑term code’ credit scores; Director Wang himself is downstairs today, scanning codes along the hallway.”", "Lin Xiu paused, breath “huh, huh” in the mask. She sidestepped, eyes scanning the scanner in Wang Jie’s hand; its red laser cut a thin line through the dust. “My code’s still valid; I’ll file the supplement tomorrow.”", "Wang Jie shook her head; the bag swayed, a “shush” of friction. “Not just the supplement—rumor says a ‘credit deposit’ of 500 CNY minimum, three installments. After that deduction your 620 won’t cover next month’s rent.”", "Lin Xiu’s fingertips clamped harder on the rust line; nails dug into metal gaps, whitening. “I just get Xiao Yu into school; the rest… one step at a time.”", "Wang Jie sighed; tubes inside the bag clinked a clear “ding‑dong,” like a countdown cue. “One step at a time is still a path. But you must submit the form before the 15th, or next month you can’t even enter this hallway.”", "Lin Xiu offered no reply, turned and continued upward; each tread transmitted the building’s heavy low‑frequency shudder. Far off, the viaduct’s traffic roared like a sustained growl, seeping through fire‑door gaps, mingling with night wind’s machine‑oil tang and the distant sour stench of a waste station. She touched the dead phone in her pocket; its black screen mirrored her fatigued outline and the gray‑black pipe behind her.", "At the stairwell turn, a guard in a reflective vest leaned on the railing, scrolling a phone; screen light traced deep laugh lines. Seeing Lin Xiu ascend, he lifted his chin, voice muffled by mask fibers: “Temp code expired? Expired means back to Sequence Hall for a re‑scan—queue till dawn.”", "Lin Xiu clenched her jaw; knuckles pressed the lid again, cold creeping up her arm. “Not expired; I’ll supplement tomorrow.”", "The guard nodded, fingertip swiping—soft “beep.” “Then hurry, don’t let Director Wang catch you and dock points.”", "Lin Xiu quickened; knee clicked again, pain needling bone, yet she didn’t stop. The fire door at the hallway’s end slammed shut in the night wind, cutting off the corridor’s clamor; only her own footsteps, heartbeat, and the silent countdown of that still‑alive 23:59 ticking in the darkness remained."]}]};
const L = {"cover_label": "Title Page & Synopsis", "unit": " chars", "by": "By ", "meta_sep": " | ~", "intro_title": "About this book", "prev": "← Previous", "next": "Next →", "start": "Start Reading →", "ch_prefix": "Chapter ", "ch_mid": " | ", "theme_dark": "☀️ Light Mode", "theme_light": "🌓 Dark Mode"};
let currentIndex = -1; // -1 = title page / synopsis
let fontSize = 17;

function renderSidebar() {
    const list = document.getElementById("chapterList");
    list.innerHTML = `<li class="chapter-item ${currentIndex === -1 ? 'active' : ''}" onclick="goToChapter(-1)">
        <span>📖 ${L.cover_label}</span>
    </li>`;
    book.chapters.forEach((ch, idx) => {
        const li = document.createElement("li");
        li.className = "chapter-item" + (currentIndex === idx ? " active" : "");
        li.innerHTML = `<span>${ch.title}</span><span class="ch-words">${ch.words}${L.unit}</span>`;
        li.onclick = () => goToChapter(idx);
        list.appendChild(li);
    });
}

function renderContent() {
    const wrapper = document.getElementById("articleWrapper");
    const label = document.getElementById("currentChLabel");
    if (currentIndex === -1) {
        label.innerText = L.cover_label;
        wrapper.innerHTML = `
            <div class="article-header">
                <h1>${book.title}</h1>
                <div class="article-meta">${L.by}${book.author}${L.meta_sep}${book.total_words.toLocaleString()}${L.unit}</div>
            </div>
            <div class="intro-box">
                <h3 style="margin-bottom:12px;color:var(--accent);">${L.intro_title}</h3>
                <div style="white-space: pre-wrap; line-height:1.75;">${book.description}</div>
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" disabled>${L.prev}</button>
                <button class="nav-btn" onclick="goToChapter(0)">${L.start}</button>
            </div>
        `;
    } else {
        const ch = book.chapters[currentIndex];
        label.innerText = ch.title;
        const pTags = ch.paragraphs.map(p => `<p style="font-size: ${fontSize}px;">${p}</p>`).join("");
        wrapper.innerHTML = `
            <div class="article-header">
                <h1>${ch.title}</h1>
                <div class="article-meta">${L.ch_prefix}${ch.index}${L.ch_mid}${ch.words}${L.unit}</div>
            </div>
            <div class="article-body">
                ${pTags}
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" onclick="goToChapter(currentIndex - 1)">${L.prev}</button>
                <button class="nav-btn" onclick="goToChapter(currentIndex + 1)" ${currentIndex >= book.chapters.length - 1 ? 'disabled' : ''}>${L.next}</button>
            </div>
        `;
    }
    document.getElementById("content-container").scrollTop = 0;
}

function goToChapter(idx) {
    if (idx < -1 || idx >= book.chapters.length) return;
    currentIndex = idx;
    renderSidebar();
    renderContent();
}

function toggleTheme() {
    const current = document.documentElement.getAttribute("data-theme");
    const next = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    document.getElementById("themeBtn").innerText = next === "dark" ? L.theme_dark : L.theme_light;
}

function changeFontSize(delta) {
    fontSize = Math.max(14, Math.min(26, fontSize + delta));
    const paras = document.querySelectorAll(".article-body p");
    paras.forEach(p => p.style.fontSize = fontSize + "px");
}

renderSidebar();
renderContent();
</script>
