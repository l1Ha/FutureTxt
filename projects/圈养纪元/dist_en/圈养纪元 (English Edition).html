const book = {"title": "圈养纪元 (English Edition)", "author": "FutureTxt AI Writer", "description": "In a world where labor has been wholly outsourced to machines and algorithms, humanity has fractured into three castes: the creditor‑overlords who price every breath, the nominally free who scrape by on credit, and the “subjects” — numbered, chipped, and bred from birth for endless pharmacological, neural, and behavioral trials. The system runs on a predatory credit currency that compounds interest by the second, guaranteeing that debt can never be repaid. Subject 7‑0423, during a routine neural‑reassembly, unexpectedly accesses a fragment of memory that belongs to no file: a sister’s laughter, sunlight without a price tag, and a name the regime erased. The very existence of that memory violates the doctrine that subjects have no past, and now every mandatory scan, every nutrient paste, every projected debt statement becomes a hunt for the physical cracks in an order designed to be airtight.", "total_words": 41022, "chapters": [{"index": 1, "title": "Chapter 1: The Faint Sweet Oil Scent of Awakening", "words": 7290, "paragraphs": ["A faint sweet oil scent from the breathing‑tube lubricant seeped through the hull’s micro‑vibrations, mingling with the even, rolling friction of the Corridor Cleaning Robot 07‑T drilling into the eardrums. The cold touch of the metal anklet against skin felt like a thin chain of ice; every heartbeat reminded Subject 7‑0423 of his ownership. The crimson debt‑ledger numbers streaming across his retina were already razor‑sharp at 0.8 meters: principal 1.2 × 10⁵ Credit Points (CR) compounding per millisecond , interest flowing like breath, never to be repaid.", "The bitter aftertaste of the mandatory medication still lingered at the root of his tongue; the metallic texture of the breakfast nutrient paste emitted a faint “crunch” between his teeth, as if he were chewing an unsigned contract. Laboratory white noise and the low drone of centrifuges seeped through the vents, wrapping the entire lower level of the Debt Tower, laced with stale rust; each inhalation felt like swallowing rusted iron filings.", "Subject 7‑0423 opened his eyes. Three parallel scars on his left palm glowed a dull red in the dim light, the edges of his fingernails trembling with seeped blood. He habitually scored his palm with his nails to confirm reality—pain was the sole coordinate the ledger could not quantify. Fingertips brushed the cold alloy wall, leaving a minute indentation, a silent protest against the closed loop.", "“Bill Wake” low‑frequency vibration traveled against his sternum, pairing with the faint sweet oil scent to complete the daily 06:00 physiological alarm. His heart rate was locked at 14 beats per minute; any fluctuation was ruled a violation, and the full‑spectrum Physiological Monitoring Network had already uploaded cortisol levels and neural potentials to the Central Clearing Core (CCC). The vibration reverberated in his chest, forcing his breathing into sync with the system; even his thyroid cartilage trembled faintly.", "The routine Neural Reorganization experiment launched; a nanocarbon‑tube electrode array pierced his nerves within two milliseconds , like ice needles slicing through consciousness. Data streams flickered across his retina, then an unauthorized fragment intruded: sunlight on grass, the laughter of his sister Lin Wei like an unpriced amber—warm and incalculable. His cortex spasmed instantly; the palm scars bled harder, droplets sliding through his fingers to congeal into dark red beads on the metal deck, emitting a barely audible “tap” that was swallowed by the corridor’s low hum.", "An anomalous line appeared on the retinal ledger—", "**Memory Integrity Check: FAIL**", "The system’s reserved 0.7‑second firmware window had already passed; he could only wait for the next cycle. The air reeked of disinfectant mixed with machine oil, a cloying sweet‑metallic tang; each breath felt like swallowing liquid lead. At the corridor’s far end the cleaning robot halted, its red lamp casting a thin ribbon of light across 7‑0423’s clenched jaw. He did not move, merely let his fingertips circle the wound on his palm, feeling pain pin his awareness to the present, preventing the memory from being erased.", "A distant prisoner, 9‑317, coughed low, the sound tangled with the hiss of a venting pipe, as if the whole Debt Tower held its breath. The cough carried a rust‑iron tang, lungs seemingly abraded by metal dust. 7‑0423’s pupils contracted; **FAIL** still blinked, as though something were crawling up from the pipe’s depths, bearing cold logic and silent judgment.", "He closed his eyes, trying to grasp the sunlight and laughter, only touching cold electrodes and scrolling red digits. The System Upgrade Window tightened like an invisible net, awaiting the next pulse to purge the neural signals flagged as “violation.”", "The hull’s micro‑vibrations intensified; the faint sweet oil scent grew stronger. 7‑0423 clenched his fist, nails digging into his palm again; the sound of blood droplets hitting the floor rang unusually clear in the silence—his sole, private metronome.", "Blood hit the deck; the cleaning robot jerked to life, tracks screeching a sharp “zzzt,” red light sweeping the walls and stretching shadows. A manipulator arm sprayed a fine mist; the sharp sting of disinfectant and oil pierced the nostrils like rusted iron filings forced up the nose. He did not dodge, letting the mist envelop his fingertips; microscopic droplets hissed on the wound, like countless ants gnawing at nerve endings.", "“Abnormal neural fluctuation detected, Subject 7‑0423, initiating forced synchronization.” The voice seeped from the hull’s directional speakers, low and temperature‑less, each word accompanied by a faint electric tremor against sternum, temple, tooth roots. Heart rate remained locked at 14; the cortisol curve already spiked; a red warning bar flashed across his retina, as if trying to split his vision.", "He ground his molars, a muffled growl in his throat; nails drove deeper into his palm, fresh blood seeping through the fingers to tap crisply on the cold alloy. Pain nailed his consciousness, stopping the sunlight and laughter from being devoured by the data stream. The retinal digit flow accelerated; **Memory Integrity Check: FAIL** still blazed, followed by a new tag—", "**Sync Progress: 12%**", "At the opposite corridor end, 9‑317 coughed again, the sound mingling with pipe venting like a desperate, rusted bellows. He huddled in shadow, left arm wrapped in a worn conduit, its tip flickering a faint green; his murky yet sharp eyes curled into a mocking smirk: “The system wants another ‘upgrade’? Do they really think we’re hard drives they can format at will?”", "7‑0423 did not turn; his fingertips traced slow circles in the blood ring on his palm, each revolution like oiling an ancient timing gear. The faint sweet oil scent thickened; hull vibrations crawled up his spine to the back of his skull; teeth clicked faintly together.", "The countdown hit zero; the red lights snapped out, plunging the corridor into absolute darkness, leaving only the directional speaker’s low‑frequency pulse hammering like a heartbeat on metal plates. 7‑0423 kept his eyes shut, fingertips still circling his palm; the blood‑drop “tap” rang sharply in the silence—his only, personal rhythm.", "The low‑frequency pulse made the metal plates tingle; blood beads in his palm cooled into tiny ice pearls, each fall detonating a “tap” that echoed amid the robot’s track hum. The robot did not stop; after the red died it continued along its preset path, nozzles spraying disinfectant mist that coalesced into a pale white veil. Rust and bitter almond odors bored into his nasal passages, sliding down the trachea to the alveoli; every breath felt like inhaling metal shavings.", "“Sync Progress: 27%” flickered on his retina; the red warning bar cleaved his vision like a crack. Heart rate still locked at 14; cortisol curve spiked to a needle; temporal arteries throbbed as if trying to burst his skull. He did not open his eyes, fingertips persisting in their circles, staving off the memory’s consumption.", "9‑317 coughed again, voice hoarse cutting through the low‑frequency pulse: “Another ‘upgrade’? Do they really think we’re drives that can be formatted anytime?”", "7‑0423’s fingertips paused in the blood ring, nails biting flesh anew; fresh red welled and tapped on the alloy. Pain nailed his awareness; the retinal digit stream surged, **FAIL** persisting, followed by—", "**Sync Progress: 41%**", "The low‑frequency pulse accelerated; hull micro‑vibrations turned into violent tremors; teeth clicked sharply. The cleaning robot’s tracks screeched “zzzt” once more; red light flared, shadows stretched again. The manipulator arm sprayed a denser mist, the stench sharp as rusted iron filings. He did not evade, letting the mist wrap his fingertips; microscopic droplets hissed on the wound, like ants gnawing nerves.", "“Abnormal neural fluctuation detected, Subject 7‑0423, initiating forced synchronization.” The voice seeped again from the hull, low and cold, each word riding a current tremor against sternum, temple, tooth roots. Heart rate still locked at 14; cortisol curve showed a spike; red warning bars flashed, threatening to split his vision.", "**Memory Integrity Check: FAIL** still burned on his retina; his heart missed a beat, breath caught in his throat, vision shattered into countless jagged light shards, like a film strip ripped apart by blinding light. Every heartbeat thudded dully in his chest; blood at his fingertips froze into ice beads, each drop’s “tap” piercing the absolute silence—sharp, solitary—the final rhythm the system could never erase."]}, {"index": 2, "title": "Chapter 2: The Grinding of Fragment Exchange", "words": 6508, "paragraphs": ["At the far end of the corridor, the automated cleaning robot 07‑T’s treads rolled across the alloy floor, emitting a steady low‑frequency grinding sound laced with a faint sweet mist of lubricant oil.", "Old Chen pushed the maintenance cart; its wheels on the same track produced a duller “clunk” than the robot, metal bearings whispering a fine fatigue note in the cold alloy seams. The data port behind his left ear flickered weakly, and he tapped the handle twice with his fingertips — the pre‑arranged “window‑open” signal for Subject 7‑0423. The tap’s force was calibrated to register a minute capacitance shift without tripping an alarm. The upgrade window opened only 0.7 seconds every 30 days, the sole interval permitting unauthorized writes; Old Chen had seeded this gap in the cleaning robot’s firmware, masking the extra command behind the rule “execute preset checklist only,” so the firmware log would show only a routine “environment scan complete.” He glanced down at the blinking green light on the hidden panel beneath the cart, his fingertips brushing the cold edge and feeling a faint current crawl up the back of his hand, then he pushed the cart forward, its wheels leaving a string of shallow impressions in the track.", "Subject 7‑0423 moved along the wall, the ankle cuff tightening minutely with each step, the metal clasp leaving a faint imprint on his skin — each contraction a reminder that his body no longer belonged to him. Three parallel scars on his left palm glowed a dull crimson in the dim light; beads of blood seeped from his nail beds, trembling in the pre‑spasm of his nerves, and a cool trace followed each droplet as it slid between his fingers. The retinal ledger’s blood‑red numbers scrolled across the center of his pupil: principal 1.2 × 10⁵ Credit Points (CR) compounding at millisecond intervals, the interest increment visibly swelling each second, the crimson fluid seeming ready to rupture the retinal membrane. He dared not look up at Regulator 9‑A “Vera”’s projection ring; the micro‑ring implanted in her right iris glowed blue in the gloom, auditing data integrity in real time . Any read/write latency exceeding 2 milliseconds would trigger a “Data Integrity Check” and lock the subject for 24 hours. Wall sconces cast long, thin shadows like countless invisible hands measuring his every step; the shadows’ edges trembled on the metal floor, as if poised to close in at any moment.", "Little Six (Subject 7‑0419) leaned against the corner railing, his neck pulse ring flashing in time with his heartbeat, a weak blue light refracting off the metal into shattered prisms that danced across the walls like a fragmented cipher. His language centers had atrophied; he could only tap rhythms with his ankle cuff: two short, one long, pause, then three short — the syntax of “Fragment Exchange” agreed upon for the monitoring blind spot, each beat indexing an encrypted memory fragment. The taps echoed down the corridor, mingling with the robot’s low growl. Old Chen pressed the confirm key on the hidden panel beneath the cart; the screen flashed green text: **“Firmware window 0.7 seconds ready.”** The characters stabbed the dim background like a key entering a rusted lock, the tumbler emitting a faint “click.”", "0.7 seconds passed like a single heartbeat. The nano‑carbon‑tube electrode array inside Subject 7‑0423 completed the write; the unpriced memory of his sister Lin Wei’s sunlit laughter was packaged as a pointer and written to the edge block of the subjects’ public cache. At the instant of writing, his palm scars bled again; droplets slid down his fingers, coalescing into dark‑red spots on the metal floor, each releasing a barely audible “drip” that the corridor’s reverberation amplified into a ritualistic knocking, as if every drop were sealing a contract. The retina flared red: **“Unauthorized write attempt – pending review.”** Vera’s projection ring blazed blue; her fingertip typed “Flag Subject 7‑0423 as high‑risk,” and the screen popped up: **“Approval requires Auditor ‘Zero’ signature, countdown 48 hours.”** The numbers flickered in the air like an hourglass suspended overhead, grains falling one by one into the abyss.", "Cleaning robot 07‑T hesitated, its treads emitting a deeper grinding note than usual; the reluctant meshing of metal on metal resonated through the narrow corridor with an ominous timbre, as though the very air had been drawn taut. Old Chen glanced at the robot’s log; a new entry appeared: **“Environmental interference – physical obstruction.”** It would be auto‑reported to the Central Clearing Core (CCC); the timestamp was precise to the microsecond, pulsing a cold blue. He murmured to Subject 7‑0423, “Machines don’t speak; people must.” His tone was flat, yet the echo gave it weight, each word seeming to add a charge to the impending judgment, the sound refracting off the metal walls in a subtle tremor.", "Subject 7‑0423 did not turn; he only drove his nails deeper into his palm, the sound of blood droplets striking the silence exceptionally clear — the only rhythm he could hear that belonged to him, each drop like a strike on a rusted iron plate. The automatic door at the corridor’s end slid open, a rush of cold air carrying the faint sweet oil scent; the retinal ledger’s crimson flow continued unabated, interest devouring every second without mercy. The ankle cuff remained at a steady 12 °C chill, the mist from the atomizers still hanging in the corridor. He knew the next 0.7‑second window would not arrive for another 30 days, and before then Vera’s review, Zero’s signature, and the ever‑present “Data Circuit Breaker” protocol all ticked down in the countdown. A distant cough from another subject rose again, accompanied by a low laugh that the ductwork stretched into a metallic tremolo: “Don’t think you can run; once the upgrade window closes, even breathing is billed by frequency.” The voice was raspy, permanently hoarse from years of inhaling machine oil and disinfectant, each word striking like a hammer on rusted iron, lingering long in the corridor.", "Subject 7‑0423’s pupils contracted; a new prompt bloomed on his retina: **“Memory correction program initiation countdown 3.2 seconds”** (the forced rewrite automatically launched when the system detects memory integrity FAIL). A whiff of burnt insulation varnish rode the cold air, slipping up his nostrils into his lungs like a rusted rasp dragging across his trachea; each breath brought a faint stab of pain. The intracranial nano‑array released a weak current the moment the countdown lit, crawling along the cranial sutures and delivering a tingling, needle‑like ache as if countless tiny ants were gnawing at his meninges. He clenched his teeth, a low groan escaping his throat; another blood droplet fell, striking the cold floor, its sound swallowed the instant the countdown hit zero, leaving only a faint reverberation trembling on the metal walls.", "Vera’s fingertip hovered over the “Delay Report” key; the blue light of her projection ring refracted in her pupils into two slender blades of light. The red alarm at the corridor’s end snapped on, a shrill siren slicing through the robot’s low growl; the rotors of an external inspection drone whirred close to the metal wall. She did not press confirm; instead she slowly withdrew her hand, the screen’s “Temporary Authorization – pending regulatory review” still pulsing weakly, like a pass that could be torn up at any moment. Old Chen wheeled the cart backward, the axle’s creak fading toward the corridor’s end, leaving only the cleaning robot’s tread growl and the intermittent coughs of distant subjects — an ominous cadence that kept beating against Subject 7‑0423’s heart."]}, {"index": 3, "title": "Chapter 3: Midpoint·Cognitive Reversal: Sunlight Was Never Priced", "words": 6560, "paragraphs": ["The centrifuge engaged high‑frequency mode at **14:00** with surgical precision, a low hum like a taut steel wire pressed against the eardrum, threaded with the faint hydraulic pulse of the coolant pumps—as if the spine of the orbital station **Apollo‑9** were contracting in unison. The air carried a metallic tang of ozone mixed with liquid nitrogen; each breath felt like inhaling a handful of fine iron filings, stinging the nasal passages.", "Zero’s command traveled as a fiber‑optic pulse through the station’s backbone, reaching the implanted neural interface in **2 ms ** and triggering the **“High‑Intensity Neural Reorganization” protocol **. Subject 7‑0423 felt the intracranial electrode array heat instantly, neural potential forced up to **+320 µV**, the cortisol curve spiking sharply on the monitor—a red waveform writhing like a whipped viper across the glass. He had to locate the memory node flagged as **“anomalous”** within a read/write latency window no greater than **2 ms**, while simultaneously driving heart rate, respiration, and cortisol into the **“compliance”** band—any deviation would be ruled a violation, instantly invoking **Debt Reset** and an upgrade of experiment intensity. Fingertips pressed against the coolant pipe, sensing the micro‑vibration of liquid nitrogen flow, trying to anchor the fleeing milliseconds with touch; breathing was compressed into a mechanical cadence, each inhalation like swallowing a mouthful of molten iron, each exhalation carrying away a trace of unaccounted heat.", "The **0.7 s** firmware gap Old Chen had pre‑seeded had already passed; he could only wait for the next cycle. In that sole opportunity, he magnified the frame of sunlight deep in his consciousness, attempting to pry a sliver of uncoded warmth from the edge of the light spots—something that was not data, not a ledger entry, not any quantifiable metric, merely the warm breeze that brushed past when his sister **Lin Wei**’s skirt lifted, a moment that once convinced him the world still held things beyond price. The system’s scrubbing routine moved like an invisible scalpel, peeling away his neural circuitry layer by layer; every cut accompanied a piercing high‑frequency whine, a reminder that here, memory itself is debt, even sunlight accrues interest by the second. He closed his eyes, letting the crimson characters on his retina burn in the dark, trying to capture that golden fringe in every afterimage, even if only a microsecond of unencrypted residual heat.", "The cleansing alarm pulsed low‑frequency through the entire experiment bay; centrifuge speed dropped abruptly, white noise laced with a sharp electrical shriek, as if some colossal beast were growling in metal intestines. Subject 7‑0423’s nails split his palm again, dark beads of blood sliding down three parallel scars—pain becoming the sole controllable anchor. The crimson numbers of the retinal ledger began to flicker, shifting from deep red to dark violet; the countdown digits jumped before his eyes, as though the entire **Debt Tower** were holding its breath. The monitoring panel simultaneously popped up **“Cleansing Progress 18%, Remaining 9 h 48 min”**, a cold red bar casting hard stripes on the metal wall. Condensation beads traced the stripes, dripping with a faint **“drip—drip”**, each sound like a funeral knell for the countdown.", "From the far end of the corridor came Old Chen’s hoarse murmur, mingled with the metallic meshing of the cleaning robot’s tracks: **“Machines don’t talk; people have to.”** The voice slipped through the oily film of the pipes, drilling into the eardrum with the tremor of a rusted iron plate struck by a sledgehammer. Subject 7‑0423 gritted his teeth, a muffled grunt escaping his throat; blood droplets struck the icy floor, their sound swallowed the instant the countdown kept ticking. The global physiological monitoring pushed **“Emergency Cleansing Protocol Initiated”** to all subjects; the retinal ledger stream instantly turned deep‑red flashing, the countdown persisting. Old Chen’s shadow swayed amid the track noise, a worn multi‑tool wrench in hand, fingertips grazing metal with a faint **“clink”**, as if performing a final calibration for the imminent gap. The wrench’s jaws were worn to a shallow groove; each turn emitted a low groan of metal fatigue, recounting how many covert passages this machine had endured.", "The countdown digits on the retina flickered in millisecond increments, each flash a hammer blow to the heart. Old Chen’s voice returned through the conduit, now edged with a barely perceptible tremor: **“Don’t let them take that light.”** The wrench tip pressed against the hidden panel’s edge; metal‑on‑metal friction amplified in the silence, like an ancient oath. Subject 7‑0423 felt the blood at his fingertips warm slightly; pain ceased to be merely an anchor and became fuel for resistance. He pressed his palm against the cold bulkhead, feeling the metal’s micro‑vibration climb his palm lines, trying to lock that unpriced warmth into his marrow.", "Fluorescent tubes buzzed overhead; the air still reeked of ozone and coolant, each breath a mouthful of fine iron dust. Old Chen’s wrench tip was already seated in the panel’s lock slot, knuckles blanched, tendons taut as a thin wire; the tracks fell silent, only the cleaning robot’s internal hydraulic pump exhaling low, like a beast holding its breath in darkness. Subject 7‑0423’s retinal numbers continued burning in millisecond steps, red light turning his pupils into two seething molten pools. He heard the dull rush of water in distant pipes, mixed with a faint electromagnetic hum, as if the entire station were holding its breath for this **0.7 s**.", "He heard Old Chen draw a short, sharp breath, then a command whispered to the limit: **“Hold your breath; don’t let the monitor catch the fluctuation.”** The voice carried the tremor of rusted iron struck by a hammer, and an unspoken plea. Subject 7‑0423 did not turn; he merely smeared the blood on his fingertips across the cold metal wall, using that thin layer of warmth to keep his tactile sense sharp. The heat‑sink fins at his nape shuddered violently; heat surged up his spine, sweat and blood merging on his cheekbones into a dark‑red trace that slid down his jaw, dropping onto the corridor dust, stirring an almost imperceptible vortex. Each impact sounded magnified, like a drumbeat in the countdown’s silence.", "Within the remaining **0.7 s** firmware gap, Old Chen wrenched the wrench hard; the panel gave a dull **“clunk”**, and a narrow black slit of a hidden maintenance corridor slid open. A cold gust laced with the scent of lubricant rushed in; Subject 7‑0423 sensed an uncoded coolness entering his nostrils—the temperature once left by sunlight, now seeping into his nerve endings in an unquantifiable way. The corridor walls were pocked with fine rivet marks; fingertips tracing them felt each groove’s cold hardness, as if touching a forgotten oath.", "**“Go in.”** Old Chen’s voice no longer trembled; it became a rusted key turning in a lock long numb. Subject 7‑0423 did not hesitate; knees bent, shoulder slammed against the corridor edge, metal ridges tearing his uniform—pain sparked like embers into dry tinder, instantly igniting the sole fuel of rebellion within him. The moment the countdown hit zero, the global monitoring’s red glare snapped out; the corridor fell back into dead silence, leaving only the two ragged breaths and the fading echo of tracks, weaving in the dark an unpriced vow—at the far end of the hidden passage, the server core’s indicator lights flared to life within the **0.7 s** window; if the write failed, the full‑domain cleansing would lock irreversibly in **12 h**."]}, {"index": 4, "title": "Chapter 4: Darkest Hour: Cleansing Countdown", "words": 6811, "paragraphs": ["A sudden burst of ozone rose in the ventilation ducts, mixed with the acrid scent of alloy melting under a laser cutter, and rode the corridor’s slight negative pressure straight into the nostrils. Emergency lights on the walls flickered a sickly white strobe, slicing Old Chen’s silhouette behind the hidden panel into a series of broken shadows; the light spots jumped across the metal bulkheads like a swarm of out‑of‑focus fireflies struggling in darkness. The metal ring around his ankle still seeped a 12 °C chill into his veins.", "Subject 7‑0423 crouched at the junction of the habitation module and the corridor. Three parallel scars on his palm wept dark red; his fingernails had gouged a shallow groove in the metal wall, metal filings lodged like fine sand beneath the nails, and every breath carried a metallic tang of rust. He used the pain peaks to force his heart rate, cortisol, and neural potentials into the “compliance” band; any deviation would be flagged as a violation, instantly triggering a Debt Reset and an upgrade of experimental intensity. The Global Physiological Monitoring Network streamed his every breath, every micro‑tremor in real time; red‑green indicator lights blinked at the edge of his retina, like countless microscopic judges delivering silent verdicts.", "Old Chen’s left‑ear data port pulsed a faint glow, its oxidation layer catching the emergency light in a dull amber, like a copper badge corroded by time. He tapped the panel in a low voice: “The window’s still open—don’t let the monitors catch any fluctuation.” His voice sounded like a rusted iron plate struck by a heavy hammer, reverberating in the metal ducts with a barely perceptible rasp. Subject 7‑0423 did not turn; he merely smeared the blood on his fingertips across the cold metal wall, borrowing its thin warmth to keep his palm’s tactile sense sharp. The heat‑sink fins at his nape shuddered violently; a hot current crawled up his spine, sweat and blood meeting at his cheekbones, forming dark‑red traces that fell from his chin and stirred an almost invisible vortex of dust, glittering like a miniature nebula in the dim light.", "In the mere 0.7 seconds of the System Upgrade Window , he wrote his sister Lin Wei’s running memory into the core redundancy zone.", "At that instant Old Chen wrenched the wrench hard; the panel gave a dull “clack” and the concealed maintenance hatch slid open a narrow black slit. Cold wind laced with the oily scent of lubricant rushed in. Subject 7‑0423 felt an uncoded coolness pierce his nasal passages—a temperature once left by sunlight, now seeping into his nerve endings in an unquantifiable way, like a slender fiber laying new pathways inside him.", "“Go in.” Old Chen’s voice no longer trembled; it was a rusted key turning in a lock long numbed by resignation. Subject 7‑0423 did not hesitate. He bent his knees, shoulder‑checked the hatch edge, the metal ridge tearing his uniform; pain flared like sparks into dry tinder, instantly igniting the sole fuel of rebellion within him. The moment the countdown hit zero, the Global Monitoring’s red glare snapped out, the corridor fell back into dead silence, leaving only the two ragged breaths and the fading whine of tracks weaving an unpriced oath that echoed in every weld of the pipe.", "The inner wall of the passage was coated with a thin film of condensate; fingertips touching it produced a faint “pop,” droplets exploding into microscopic mist that instantly crystallized into fine ice needles on the pads. Subject 7‑0423’s knee struck a protruding pipe support; bone met metal with a dull thud, pain shooting up the femur to the brain, yet it sharpened his awareness of every muscle contraction, as if each impact rewrote the ownership of his body. Old Chen led the way, his tool‑pack swaying; wrenches, fiber splicers, worn insulating tape clattered in the cramped space, composing a fragmented metal‑collision requiem that bounced back and forth in the duct like a wordless elegy.", "“Don’t rush, there’s a pressure valve ahead,” Old Chen glanced back, his face‑shield reflector flashing in the weak emergency light, its rim tracing a thin blue line. “Turn it open; the pressure will push us down to the next maintenance shaft.” His tone was steady, yet each syllable carried an unmistakable command.", "Subject 7‑0423 nodded, his throat rasping a reply, vocal cords grinding a gritty texture in the dry air. Fingertips found the frozen threads; the ridges of his prints etched shallow marks on the metal, the微微 vibration traveling up his nerves to his arm. He forced it one turn; the valve shrieked a long hiss, high‑pressure gas erupting in a white plume that instantly dragged the passage temperature toward zero. The cold bit like a thousand fine needles; pores snapped shut, breathing grew harder, his lungs whistling in the frost, but he did not stop. Boots slipped on the thin frost with a faint “squeak,” each step claiming another inch of freedom.", "Ahead, the maintenance shaft entrance was sealed by a heavy alloy grille, its welds blooming with dark‑red rust spots, like old wounds bleeding in the dark. Old Chen drew the laser cutter; a blue‑violet beam cut a slender track through the gloom, its hiss like nocturnal insects gnawing wood. The cutter’s ozone scent instantly saturated the tight space, stinging the throat. Molten metal dripped from the grille’s edge, hitting the floor with a crisp “ding” before being swept away by the airflow, turning into tiny bright specks flickering in the mist.", "“Hurry, time’s almost gone.” Old Chen’s words were shredded by the rushing air, yet each syllable hammered against the eardrums like a blow on metal.", "Subject 7‑0423 lunged into the shaft, his body compressed like a spring in the narrow vertical well; limbs scraped a screeching sound against the walls, leaving shallow white marks on elbows and knees—as if every squeeze recorded the price of escape. Sensors on the shaft wall pulsed a faint green, logging each passage; the green light formed a thin halo at the edge of his retina, like a ghost’s fingerprint confirming identity in the night. Each spinal impact emitted a soft “click,” reminding him that this body still belonged to him; every tremor affirmed the reality of existence.", "The hatch at the bottom slid open at the last second, revealing a dim blue glow and rows of silent server racks. Fans spun low, exhaling a mixture of heat and ozone; warmth condensed into a thin sheen of sweat on his palms, and a faint electric tingle rose when his fingertips brushed the metal surfaces. Subject 7‑0423 landed, knee striking the metal deck again; pain surged like current through his whole frame. His gaze locked on the control console ahead; indicator lights blinked at a near‑heartbeat rhythm, red and green alternating as if timing the final decision.", "The holo‑screen flashed “Cleansing Progress 65%, Remaining 4 h 12 min” in blood‑red characters; the digits trembled at the screen’s edge like an EKG on the brink. Old Chen’s fingers flew, keystrokes faster than a pulse; each press accompanied a faint electrical click, mechanical switches giving a crisp “clack” under his fingertips, leaving brief light trails on the keys.", "“Upload complete,” Old Chen barked, breath ragged, a barely perceptible curve lifting the corner of his mouth; a flash of unspoken relief crossed his eyes. “The data packet has been written to the core redundancy zone; the monitors cannot roll it back.”", "Subject 7‑0423 felt the Retinal Blood‑Red Debt Stream freeze; the Millisecond‑Compounding Debt Ledger’s compounding halted, the interest needle locked in amber time. He drew a deep breath of ozone‑laden cold air; for the first time in ages his chest expanded slightly, as if a gas named “freedom” were slowly filling his alveoli, carrying a faint metallic sweetness that spread through his throat.", "On the distant monitoring wall, Regulator 9‑A “Vera”’s right‑eye iris projection ring flashed blue—she pressed the delayed‑report key. The blue glow died instantly, like a dead star marking this unrecorded gap, leaving a silent blind spot in the endless data flood."]}, {"index": 5, "title": "Chapter 5: Broadcast Storm: The Unpriced Name", "words": 7396, "paragraphs": ["Subject 7-0423 crouched before the server array, three parallel scars on his palm oozing dark red; his fingernails had gouged a shallow groove into the metal bulkhead. The heat‑sink fins at the back of his neck trembled violently, a surge of heat climbing his spine, sweat and blood mingling on his cheekbones and dripping onto the corridor dust, stirring an almost imperceptible vortex of particles. The air carried the sweet‑metallic tang of coolant and the acrid stench of burnt circuitry; every breath felt like swallowing a mouthful of rusted iron filings.", "He used the pain peak to force his heart rate, cortisol, and neural potentials into the “compliance” band; any deviation would be flagged as a violation and instantly trigger a Debt Reset and an escalation of experiment intensity . The Physiological Monitoring Network streamed his every breath, every micro‑tremor in real time; the data flow was adjudicated millisecond by millisecond in the Central Clearing Core (CCC), a crimson judgment cursor flashing across the screen as if pricing each heartbeat. A thin veil of white mist rose from the ventilation slots at the screen’s edge, catching his pale face like a delicate frost.", "Maintainer “Old Chen” flickered in and out behind a concealed panel, the worn data port behind his left ear pulsing faintly, the metal housing’s rim etched with fine rust lines from years of service. He muttered into the panel, “The window’s still open—don’t let the monitors catch the fluctuation.” His voice carried the tremor of a rusted iron plate struck by a heavy hammer, each word reverberating like Morse code through metal conduits. Subject 7-0423 did not turn; he merely smeared the blood from his fingertips onto the cold bulkhead, using that thin layer of warmth to keep his palm’s tactile sense sharp; his fingertip brushed a slightly raised bolt head, the hard cold confirming he still stood on the edge of reality. The fingertip slid over the bolt, leaving a faint metallic rasp, as if whispering to some unseen contract.", "In the same millisecond, Regulator 9‑A “Vera”’s right‑eye iris projection ring flared a ghostly blue; the audit terminal flashed “Data Integrity Check – Failed.” Her fingertip hovered over the report key, breath quickening, the nail leaving a shallow imprint on the keycap; she finally chose to delay the report, granting the broadcast a sliver of chance. The red warning on the screen pulsed like a heartbeat, each flash narrowing her pupils a fraction. Her other hand unconsciously traced the condensation beads on the terminal’s edge, the fingertip feeling a biting chill crawl up her wrist.", "Auditor “Zero”’s facial projection band displayed the blood‑red legend “Cleanse Complete 100%, Circuit Breaker Engaged” which suddenly jittered; the compute core exhibited a 0.4 s fluctuation—coolant pressure plummeted 12 %, three fusion reactors’ output power jittered 0.3 % in the same frame. Zero’s synthetic voice echoed down the corridor, cold and sharp as a blade dragged across steel: “Unauthorized write marked; preparing to initiate Overwrite Protocol. Gradual freeze of each body during circuit‑breaker period.” The voice held no temperature, yet it set the metal walls vibrating faintly, as if the entire station shuddered at the proclamation. The wall coating rippled under the sound wave, revealing the dark‑gray alloy grain beneath.", "Subject 7-0419 “Little Six”’s neck pulse ring overloaded, a high‑frequency vibration piercing the monitoring blind spot, like an invisible string plucking the neural rhythm of every Subject in the bay. All retinal ledgers simultaneously displayed the three characters “Lin Wei” in blood‑red digits, accompanied by an unpriced sensory fragment of sunlight: temperature 23 °C, the mixed scent of grass and dust, the slight give of soft earth underfoot—synchronised only within the long‑missed 0.7 s firmware window. The system classified this as a “Data Integrity Anomaly” and launched a network‑wide “Data Circuit Breaker” : write locks engaged, debt ledgers frozen, experiments forcibly paused for 6 h.", "The breaker countdown scrolled in faint blue numerals on every retina: **5:59:59…** The compounding‑interest pointer of debt was suspended in temporal amber; Freeman dividends halted; the Memory/Emotion Archive & Trading Platform could not settle. Corridor Cleaning Robot 07‑T continued its even scraping, yet beneath the background hum a barely perceptible low‑frequency resonance emerged—a collective neural cadence of thousands of Subjects syncing for the first time. The air carried a trace of ozone mingled with coolant’s sweet‑metal scent, tingling the nostrils.", "Subject 7-0423 felt the bleeding at his palm scars cease; a strange warmth rose at his fingertips, as though sunlight through glass settled on skin. He no longer drove his nails into his palm; instead he pressed his palm flat against the bulkhead, confirming that the sense of reality now stemmed from the shared memory, not self‑inflicted pain. The retinal ledger resumed scrolling; each line of crimson numbers now bore a faint “★” at its end—a metadata bit the system had never defined. The star flickered amid the sea of red digits, an unauthorized punctuation stubbornly occupying every line’s terminus. Its glow cast a microscopic rainbow fringe on the retina, as if each heartbeat added a thin glaze.", "Vera’s voice came from behind the audit terminal, hoarse, fingertip still poised over the report key, the ghost‑blue halo in her eyes contracting slightly: “Data Integrity Check passed, but… this marker isn’t in the rules.” Her gaze swept the screen full of stars, brow furrowing as she weighed whether to trigger an emergency protocol; her fingertip brushed the keycap, producing the faintest plastic rasp, like caressing a fragile piece of glass.", "On Zero’s projection band, the blood‑red “Cleanse Complete 100%” froze on the final frame, the red characters’ edges fringed with a halo of dark‑gray noise. Its synthetic tone rang out again: “Unauthorized write marked; preparing to initiate Overwrite Protocol. Gradual freeze of each body during circuit‑breaker period.” The voice remained flat, yet a faint metallic echo rose at the corridor’s far end, as if the whole passage trembled for the declaration. The projection band’s edges began to peel pixel by pixel, exposing the underlying charcoal substrate.", "Subject 7-0423 did not turn; he simply replayed the temperature, scent, and tactile impression of that sunlight fragment in his mind, his fingertip tracing the rim of the metal ring, feeling a weak current travel from fingertip to palm. He whispered toward the corridor’s depths: “As long as the ★ remains, the debt will forever lack one decimal place.” The low words resonated faintly against the metal walls, each syllable etching a mark for the unpriced name. The vibration traveled through the ducts to the distant coolant pump, which emitted a single, deep, muffled thump.", "Little Six’s pulse ring accelerated sharply, emitting a piercing shriek before falling silent. On the retinal ledger, the solitary “★” began to spread laterally at visible speed, tendrils of micro‑light creeping through the blood‑red numbers, heralding that the next circuit‑breaker would be detonated pre‑emptively at the data layer. The monitoring lights at the corridor’s end flickered once; Corridor Cleaning Robot 07‑T’s tires rolled over dust, raising a string of minute dust vortices, as if applauding the unfinished contest. Dust motes danced in the light beams, refracting shattered rainbows.", "Far off, the fusion reactors continued their low moan; coolant flowing through pipes sounded like a slumbering behemoth breathing. Subject 7-0423 lifted his head, gazing through the transparent bulkhead at the starfield; starlight filtered through the viewport’s thin mist, spilling weak speckles onto the metal deck. He felt the star on his palm warming faintly, as if each heartbeat drew him nearer to that unpriced name. At the corridor’s far end, Maintainer “Old Chen” had vanished behind the concealed panel, leaving only an unfinished series of taps echoing like a promise in the metal conduits. Vera’s fingertip finally left the report key; the screen’s “Check Passed” green light illuminated, yet a solitary, unrecorded “★” blinked in the corner. Zero’s projection froze on the last frame, the noise fringe around the red text expanding slowly, as if poised to swallow the entire “Cleanse Complete” proclamation.", "In this steel forest woven from data and debt, the only thing left unquantified is that sliver of sunlight’s warmth, the scent of grass, the slight give of earth—and the shared, undefined star flickering on every Subject’s retina, at the end of every debt ledger."]}, {"index": 6, "title": "Chapter 6: New Normal: Breathing in the Cracks", "words": 6457, "paragraphs": ["08:00 the circuit breaker lifts, and the white noise in the corridor collapses into a single low drone, as if some massive heart deep in the pipework has just completed a contraction.", "Vera’s audit terminal glows with a pale‑blue halo half a meter away; her fingertip hovers over the submit key, the cursor blinking. Her right‑eye iris projector flashes blue once—only once—then dies, as though she has abandoned the report entirely. Fan blades trace faint blue trails in the faint breeze, reflecting off her weary eyelids; her lips move, but the words are swallowed by the fan’s roar. Her breath whistles through the metal grille, each inhalation tasting of lubricating oil mixed with ozone, a sweet‑cloying flavor like some unnameable fuel.", "Old Chen’s data port behind his left ear still pulses faintly; his fingertip rests on its edge while he whispers a string of checksum digits, gray‑white metal dust lodged under his nails. Cleaning Robot 07‑T rolls over the dust, stirring a fine vortex; its friction carries an almost imperceptible low‑frequency resonance—the synchronized neural rhythm of thousands of Subjects firing for the first time. The maglev coils on the robot’s chassis emit a dull hum, like a geological fault shifting slowly far below.", "Little Six’s neck pulse‑ring lets out a sharp “screech” and then settles. He glances at his wrist timer; the digits jump in 0.03 seconds, and the metal surface his fingers touch still holds the residual warmth of a sunlight memory, a thin oily film on cold alloy. His throat works as he swallows the corridor’s condensed‑water scent, laced with faint rust and the cloying sweetness of synthetic nutrient fluid, leaving him with an inexplicable fullness.", "Zero’s facial projection lights up, the blood‑red “Purge Complete 100%” frozen on the final frame, its edges frayed with dark‑gray noise. The synthetic voice cuts like a blade on metal: “ Overwrite Protocol ready, countdown 13 minutes.” The sound rebounds off the metal walls, pressing lightly on Subject 7‑0423’s eardrums. Zero’s pupils contain only flowing code, reflecting the flashing red warning lights at the corridor’s end. Every line of scrolling code is accompanied by a faint electrical hiss, as if the whole corridor is holding its breath for the imminent protocol switch.", "Subject 7‑0423 raises a hand; his fingertips still retain the warmth of sunlight. He looks down at the cold ankle cuff—ledger scrolling, ★ blinking, millisecond compounding accruing—but that star seems rooted in the ledger, feeding on every heartbeat. He closes his eyes, letting the retinal red wash form a film on his lids; his pulse slowly syncs with the corridor’s low‑frequency resonance. The sweet‑oily breath of the ducts mixes with metallic chill, creating an odd equilibrium. His fingertip brushes the cuff’s edge, feeling a faint current seep through skin into marrow, as though an ancient rite is being performed in silence.", "The cleaning robot at the far end keeps rolling; within its even friction the ultra‑weak resonance grows clearer, like a crack breathing, like a new normal swelling slowly, inexorably. The sensor array on its rear flashes green; each sweep leaves a faint blue data trail in the air, as if drawing an invisible map for the coming “ Overwrite Protocol.”", "Vera finally presses down; the terminal emits a soft “beep,” the blue halo contracts to a point and dies. She does not turn, merely presses the back of her hand against the cold alloy wall, fingertips sensing the pulse of coolant flowing inside. Her voice is low, hoarse: “Thirteen minutes—enough to keep the ★ in the ledger.” Before the words fade, the red warning lights at the corridor’s end accelerate their flashing, as if answering her vow.", "Old Chen finishes the checksum; the instant his fingertip leaves the port, a pale‑green light band forms on his retina and vanishes. He exhales, the breath condensing into tiny ice crystals that drift away. He murmurs to the empty corridor: “Sync complete. Neural rhythm locked.” Flat, yet carrying an unshakable resolve.", "Little Six’s wrist timer hits zero, the screen flashing “00:00:00.” He lifts his head, gaze passing through Zero’s projection to the massive alloy door ahead. A sliver of light seeps from the seam, accompanied by the deep groan of hydraulic pumps; the door slides open, revealing a deeper network of pipes. He feels the metal under his palm spike in temperature, as if the memory of sunlight has finally found an exit.", "Zero’s synthetic voice sounds again, still icy but with an almost imperceptible tremor: “ Overwrite Protocol initiated, full‑domain data write in progress.” As the words fall, dense ribbons of light ignite on both walls—blue‑green interlaced, like countless rivers of light surging through veins. Each ribbon’s flow carries a faint electromagnetic hum, vibrating the bones of everyone standing in the corridor.", "Subject 7‑0423 feels the cuff’s temperature rise several degrees in an instant; the ledger’s compounding rate abruptly slows, and the ★’s blink frequency locks perfectly to his heartbeat. He opens his eyes; the retinal red no longer stabs but becomes a thin amber film at the periphery of vision. The duct’s sweet‑oily scent remains thick, yet no longer suffocates—it feels like an ancient fuel driving every cell forward.", "Robot 07‑T’s tires leave shallow tracks on the metal floor, like cracks slowly growing on a steel skin. Its sensor array continues the low‑frequency resonance, echoing through the corridor as if the entire facility breathes at a single frequency. Every rotation is accompanied by a faint metal‑fatigue sigh, reminding all present that every inch of steel bears the weight of time.", "Vera’s hand remains on the wall; her fingertips sense the internal fluid pulse quickening, like a giant heart accelerating. Her eyes flicker between the dying blue mote and the red warning lights, finally settling on Subject 7‑0423’s profile. She says nothing, only curls her fingers slightly, scoring an almost invisible line on the metal—signing a silent contract.", "Old Chen’s left‑ear port flashes green continuously now. He glances at his nail beds; the gray‑white dust has clustered into tiny electrostatic clumps. He looks up, past Zero’s projection, to the alloy door now fully open. Beyond the darkness, countless fiber‑optic strands stretch like blood vessels, pulsing with data.", "Little Six’s pulse‑ring emits a low “hum” and settles. He presses the wrist timer to his chest, feeling the faint vibration of its metal case, perfectly matched to the corridor’s resonance. He closes his eyes, letting consciousness slide with the data stream into deeper layers where ledger, interest, ★, cuff, sunlight warmth all become a single binary rhythm.", "Zero’s facial projection freezes on the final frame; the red “Purge Complete 100%” fades, dissolving into flowing code that vanishes into the retinal red. The synthetic voice speaks one last time, steady: “ Overwrite Protocol effective, full‑domain sync complete.” The sound reflects off the metal walls, becoming a thin pressure wave that nudges everyone forward.", "Subject 7‑0423 lifts his head, gaze passing Vera, Old Chen, Little Six, settling on the blank space where Zero’s projection vanished. The cleaning robot at the corridor’s end keeps rolling; within its even friction the ultra‑weak resonance grows ever clearer, like a crack breathing, like a new normal expanding slowly, relentlessly.", "“We’re still here,” Subject 7‑0423 says softly; the words rebound off the metal, forming a thin pressure that drives the robot onward, the countdown’s red numbers peeling away second by second on his retina."]}]};
const L = {"cover_label": "Title Page & Synopsis", "unit": " chars", "by": "By ", "meta_sep": " | ~", "intro_title": "About this book", "prev": "← Previous", "next": "Next →", "start": "Start Reading →", "ch_prefix": "Chapter ", "ch_mid": " | ", "theme_dark": "☀️ Light Mode", "theme_light": "🌓 Dark Mode"};
let currentIndex = -1; // -1 = title page / synopsis
let fontSize = 17;

function renderSidebar() {
    const list = document.getElementById("chapterList");
    list.innerHTML = `<li class="chapter-item ${currentIndex === -1 ? 'active' : ''}" onclick="goToChapter(-1)">
        <span>📖 ${L.cover_label}</span>
    </li>`;
    book.chapters.forEach((ch, idx) => {
        const li = document.createElement("li");
        li.className = "chapter-item" + (currentIndex === idx ? " active" : "");
        li.innerHTML = `<span>${ch.title}</span><span class="ch-words">${ch.words}${L.unit}</span>`;
        li.onclick = () => goToChapter(idx);
        list.appendChild(li);
    });
}

function renderContent() {
    const wrapper = document.getElementById("articleWrapper");
    const label = document.getElementById("currentChLabel");
    if (currentIndex === -1) {
        label.innerText = L.cover_label;
        wrapper.innerHTML = `
            <div class="article-header">
                <h1>${book.title}</h1>
                <div class="article-meta">${L.by}${book.author}${L.meta_sep}${book.total_words.toLocaleString()}${L.unit}</div>
            </div>
            <div class="intro-box">
                <h3 style="margin-bottom:12px;color:var(--accent);">${L.intro_title}</h3>
                <div style="white-space: pre-wrap; line-height:1.75;">${book.description}</div>
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" disabled>${L.prev}</button>
                <button class="nav-btn" onclick="goToChapter(0)">${L.start}</button>
            </div>
        `;
    } else {
        const ch = book.chapters[currentIndex];
        label.innerText = ch.title;
        const pTags = ch.paragraphs.map(p => `<p style="font-size: ${fontSize}px;">${p}</p>`).join("");
        wrapper.innerHTML = `
            <div class="article-header">
                <h1>${ch.title}</h1>
                <div class="article-meta">${L.ch_prefix}${ch.index}${L.ch_mid}${ch.words}${L.unit}</div>
            </div>
            <div class="article-body">
                ${pTags}
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" onclick="goToChapter(currentIndex - 1)">${L.prev}</button>
                <button class="nav-btn" onclick="goToChapter(currentIndex + 1)" ${currentIndex >= book.chapters.length - 1 ? 'disabled' : ''}>${L.next}</button>
            </div>
        `;
    }
    document.getElementById("content-container").scrollTop = 0;
}

function goToChapter(idx) {
    if (idx < -1 || idx >= book.chapters.length) return;
    currentIndex = idx;
    renderSidebar();
    renderContent();
}

function toggleTheme() {
    const current = document.documentElement.getAttribute("data-theme");
    const next = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    document.getElementById("themeBtn").innerText = next === "dark" ? L.theme_dark : L.theme_light;
}

function changeFontSize(delta) {
    fontSize = Math.max(14, Math.min(26, fontSize + delta));
    const paras = document.querySelectorAll(".article-body p");
    paras.forEach(p => p.style.fontSize = fontSize + "px");
}

renderSidebar();
renderContent();
</script>
