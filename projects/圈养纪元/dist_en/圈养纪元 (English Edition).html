<script>
const book = {"title": "圈养纪元 (English Edition)", "author": "FutureTxt AI Writer", "description": "In a world where machines and algorithms have erased human labor, society has calcified into three castes: the creditor‑masters who price every breath, the nominally free who scrape by on credit, and the “specimens” — numbered, chipped, and harvested for drug metabolism, neural mapping, and behavioral conditioning. Survival is a ledger: food, medical implants, even air are billed at per‑second compound interest, ensuring debt can never be repaid. Specimen 7‑0423 endures routine neural re‑wiring until a stray memory surfaces — a sister’s laughter, sunlight without a price tag, a name the system erased. That fragment contradicts the doctrine that specimens have no past, turning every mandatory scan, nutrient paste ration, and projected debt statement into a hunt for the system’s physical fissures. As the ledger tightens, 7‑0423 must decide whether to exploit the cracks or be crushed by the interest that never sleeps.", "total_words": 41841, "chapters": [{"index": 1, "title": "Chapter 1: The Faint Sweet Oil Scent of Awakening", "words": 7241, "paragraphs": ["The faint sweet oil scent of the respiratory lubricant seeped through the微震 of the bulkhead, mingling with the even rolling friction of the corridor cleaning robot that drilled into the eardrums. The cold touch of the ankle metal ring against skin felt like a thin chain of ice; each heartbeat reminded subject 7‑0423 of his ownership. The crimson digital stream of the retinal bill was already crisp at 0.8 meters, the principal 1.2 × 10⁵ CR compounding per millisecond , interest accruing like breath, never repayable.", "The bitter aftertaste of the mandatory medication still lingered at the root of the tongue; the metallic chew resistance of the breakfast nutrient paste emitted a faint “crunch” between the teeth, as if chewing an unsigned contract. The laboratory white noise and the low drone of centrifuges seeped through the vents, wrapping the lower levels of the Debt Tower, laced with a stale rust odor—every inhalation felt like swallowing rusted iron filings.", "7‑0423 opened his eyes. Three parallel scars on his left palm glowed dull red in the dim light; the edges of his fingernails trembled with a thin bleed. He habitually scored his palm with his nails to confirm reality; pain was the sole coordinate the ledger could not quantify. Fingertips brushed the cold alloy wall, leaving a minute indentation, a silent protest against the closed loop.", "“Bill wake‑up” low‑frequency vibration traveled against the sternum, completing the daily 06:00 physiological alarm together with the faint sweet oil scent. Heart rate was locked at 14 bpm; any fluctuation was ruled a violation, the Global Physiological Monitoring Network having already uploaded cortisol and neural potentials to the Central Clearing Core (CCC). The vibration resonated in the chest cavity, forcing respiration to synchronize with the system; even the thyroid cartilage quivered.", "The routine neural reorganization experiment initiated; the carbon‑nanotube electrode array pierced the nerves in two milliseconds , like ice needles slicing through consciousness. Data streams flickered on the retina, then an unauthorized fragment intruded: sunlight on grass, the laughter of his sister Lin Wei like unpriced amber—warm and incalculable. The cerebral cortex spasmed instantly; the palm scars bled more fiercely, blood beads sliding through the fingers and coalescing into dark red dots on the metal floor, emitting a barely audible “tap” swallowed by the corridor’s low hum.", "An anomalous line appeared on the retinal bill—", "**Memory Integrity Check: FAIL**", "The system’s reserved 0.7‑second firmware window had already passed; only the next cycle remained. The air was thick with a cloying blend of disinfectant and machine oil; each breath felt like swallowing liquid lead. The corridor cleaning robot at the far end halted, its red lamp casting a thin ribbon of light across 7‑0423’s clenched jaw. He did not move, merely letting his fingertips trace the wound on his palm again and again, using pain to nail his awareness to the present, preventing memory from being flattened.", "A distant prisoner, 9‑317, coughed low, the sound intertwining with the hiss of a venting pipe, as if the entire Debt Tower held its breath. The cough carried a rusted‑iron tang, lungs seemingly abraded by metallic dust. 7‑0423’s pupils contracted; **FAIL** continued to blink, as though something cold and logical was climbing from the pipe’s depths, bearing a silent verdict.", "He closed his eyes, trying to grasp the sunlight and laughter, but only felt the cold electrodes and the scrolling red numbers. The system upgrade window tightened like an invisible net, awaiting the next pulse to erase the neural signals marked “violation.”", "The bulkhead tremor intensified; the faint sweet oil scent grew stronger. 7‑0423 clenched his fist, nails digging deeper into his palm; the sound of blood droplets hitting the floor was starkly clear in the silence—the sole rhythm that belonged to him.", "Blood hit the deck; the cleaning robot surged to life, its tracks screeching a sharp “zzz,” the red beam stretching shadows across the wall. A mechanical arm sprayed a fine mist; the acrid mix of disinfectant and machine oil stabbed the nostrils like rusted iron filings forced into the nasal cavity. He did not dodge, allowing the mist to envelop his fingertips; microscopic droplets hissed on the wound, as if countless ants gnawed at nerve endings.", "“Abnormal neural fluctuation detected, subject 7‑0423, initiating forced synchronization.” The voice seeped from the bulkhead’s directional speaker, low and temperature‑less, each word accompanied by a faint current tremor against the sternum, temporal bone, and tooth roots. Heart rate remained locked at 14 bpm; the cortisol curve spiked, a red warning bar flashing on the retina as if trying to split the visual field.", "He ground his molars, a muffled grunt in his throat, nails driving deeper, fresh blood seeping through the fingers and dripping onto the cold alloy with a crisp “tap.” Pain acted like nails pinning consciousness, stopping the sunlight and laughter from being devoured by the data stream. The retinal numbers accelerated; **Memory Integrity Check: FAIL** remained glaring, followed by a new tag—", "**Synchronization Progress: 12%**", "At the opposite end of the corridor, 9‑317’s cough erupted again, tearing through the low‑frequency pulse: “The system wants another ‘upgrade’? Do they really think we’re hard drives they can format at will?”", "7‑0423 did not turn; his fingertip continued a slow circle in the blood ring on his palm, each revolution like oiling an ancient timing gear. The faint sweet oil scent thickened; the bulkhead tremor crawled up his spine to the brainstem; teeth clicked faintly.", "The countdown hit zero; the red light snapped out, plunging the corridor into absolute darkness, leaving only the directional speaker’s low‑frequency pulse beating like a heart against metal plates. 7‑0423 kept his eyes shut, fingertip still circling the wound; the droplet “tap” in the silence was extraordinarily clear—his only personal metronome.", "The low‑frequency pulse made the metal plates tingle; blood in his palm cooled into fine ice beads, each fall detonating a sharp “tap” in the absolute quiet, echoing amid the cleaning robot’s track whir. The robot did not stop; after the red light died it continued along its preset trajectory, nozzles emitting disinfectant mist that condensed into a pale white veil. The scent of rust and bitter almond drilled into the nasal passages, sliding down the trachea to the lung lobes; every breath felt like inhaling metal shavings.", "“Synchronization Progress: 27%” flashed on the retina; the red warning bar cleaved the view like a crack. Heart rate still locked at 14 bpm; the cortisol curve sharpened to a peak, temples throbbing as if trying to burst the skull. He did not open his eyes; fingertip persisted in the wound’s circle, guarding memory from consumption.", "9‑317’s cough erupted again, voice hoarse cutting through the pulse: “Another ‘upgrade’? Do they really think we’re drives they can format anytime?”", "7‑0423’s fingertip paused in the blood circle, nails biting flesh anew; fresh red seeped, dropping onto the alloy with a clean “tap.” Pain nailed awareness; the retinal stream accelerated, **FAIL** still burning, followed by—", "**Synchronization Progress: 41%**", "The low‑frequency pulse abruptly quickened; the bulkhead tremor escalated to violent shaking; teeth clicked. The cleaning robot’s tracks screeched “zzz” again, red light reigniting, shadows stretching anew. The mechanical arm sprayed a denser mist; the stench stabbed like rusted iron filings. He did not evade, letting the mist wrap his fingertips; micro‑droplets hissed on the wound, like ants gnawing nerves.", "“Abnormal neural fluctuation detected, subject 7‑0423, initiating forced synchronization.” The voice again seeped from the bulkhead, low, cold, each syllable riding a faint current against sternum, temporal bone, tooth roots. Heart rate remained 14 bpm; cortisol curve spiked, red warning bar flashing, threatening to split vision.", "**Memory Integrity Check: FAIL** still scorched the retina; the heart missed a beat, breath caught in the throat, vision shattered into countless jagged light shards, as if a harsh light had ripped the film. Every heartbeat hammered a dull thud in the chest; blood at the fingertips froze into ice beads, the droplet “tap” in the absolute silence sounding piercing and solitary—the final rhythm the system could not erase, belonging solely to him."]}, {"index": 2, "title": "Chapter 2: The Friction of Fragment Exchange", "words": 7076, "paragraphs": ["The corridor‑end Corridor Cleaning Robot 07‑T rolled its tracks across the alloy floor, emitting a steady low‑frequency friction sound, like a taut steel wire being plucked repeatedly in the silence. Every fifteen meters a misting nozzle sprayed a faint sweet oil scent, mingling the stale odor of machine oil and disinfectant that slipped into the nostrils, coating the throat with a thin film of oil that slid down the airway to the lung lobes, leaving a faint metallic tang. The ankle metal ring rested against the skin, its constant 12 °C chill traveling with each heartbeat to the fingertips, reminding subject 7‑0423 of his ownership. On the retina a crimson digital stream of debt scrolled at 0.8 m, the principal 1.2 × 10⁵ CR swelling with millisecond compounding, the red fluid devouring the last reserves of stamina. The tongue still bore the bitter aftertaste of the forced medication; the breakfast nutrient paste’s metallic chew resistance produced a faint “crunch” between the teeth, as if chewing an unnamed contract. The distant centrifuge’s low hum intertwined with the laboratory’s white noise, forming a gray membrane that pressed against the eardrums, the very air vibrating at a weak frequency that made every breath feel like a count against an invisible metronome.", "Old Chen pushed the maintenance cart; its wheels groaned a duller “clack” on the same rail, metal bearings sighing with microscopic fatigue in the cold alloy gaps. The data port behind his left ear flickered weakly; his fingertips tapped the handle twice — the pre‑arranged “window open” signal for 7‑0423, calibrated so the port sensed a minute capacitance shift without tripping an alarm. The System Upgrade Window opened only 0.7 seconds every 30 days , the sole interval permitting unauthorized writes; Old Chen had seeded this gap in the cleaning robot’s firmware, masking the extra command behind the rule “execute preset checklist only,” so the firmware log would show merely a routine “environment scan complete.” He glanced at the hidden panel beneath the cart, its green indicator blinking, fingertips brushing the cold edge and feeling a faint current crawl up the back of his hand, then he rolled the cart forward, leaving a string of shallow impressions on the rail.", "7‑0423 moved along the wall, the ankle ring tightening with each step, the metal clasp leaving faint pressure marks on his skin — each contraction a reminder that his body no longer belonged to him. Three parallel scars on his left palm glowed dull red in the dim light; a bead of blood at the nail edge trembled on the verge of a neural spasm, sliding through his fingers with a chill. The retinal bill’s crimson digital stream rolled across the centre of his pupil, the interest increment swelling visibly each second, the red fluid seemingly about to rupture the retinal membrane. He dared not look up at Supervisor Vera’s projection ring; the micro‑ring implanted in her right iris glowed blue in the gloom, auditing data integrity in real time — any read/write latency exceeding 2 milliseconds would trigger a Data Integrity Check and lock the subject for 24 hours. Wall lamps cast long, thin shadows like invisible hands measuring his every step; the shadows’ edges trembled on the metal floor, as if ready to close at any moment.", "Xiao Liu (7‑0419) leaned against the corner railing, his neck pulse ring flashing with his heart rate, a weak blue light refracting into shattered prisms on the metal surface; the light spots danced on the wall like a fragmented cipher. His language center had atrophied; he could only tap a rhythm with his ankle ring: two short, one long, pause, three short — the agreed “Memory Fragment Exchange” syntax for the surveillance blind spot, each beat corresponding to an encrypted memory index. The taps echoed in the corridor, mingling with the cleaning robot’s low growl. Old Chen pressed the confirm key on the hidden panel beneath the cart; the screen flashed green text: **“Firmware window 0.7 s ready.”** The characters stood out starkly against the dim background, like a key turning in a rusted lock, the lock cylinder emitting a faint “click.”", "0.7 seconds passed like a single heartbeat. The nano‑carbon‑tube electrode array inside 7‑0423’s skull completed the write; the unpriced memory of his sister Lin Wei’s sunlight laughter was encapsulated as a pointer and written to the edge block of the test‑subject public cache. At the instant of writing, the palm scars bled again; a blood bead slipped down the fingers, forming a dark red dot on the metal floor that gave an almost inaudible “drip,” amplified by the corridor’s reverberation into a ritualistic knock, as if each drop sealed a contract. The retina flashed red: **“Unauthorized write attempt – pending review.”** Vera’s projection ring flared blue; her fingertip typed “Mark 7‑0423 as high‑risk subject,” and the screen popped up: **“Approval requires Auditor ‘Zero’ signature, countdown 48 hours.”** The numbers flickered in the air like an hourglass suspended above, grains falling one by one into the abyss.", "Cleaning Robot 07‑T hesitated, its tracks emitting a deeper, more ominous friction tone; the metal‑on‑metal hesitation reverberated down the narrow corridor, as if the entire hallway’s air had been drawn taut. Old Chen glanced at the robot’s log; a new entry appeared: **“Environmental interference – physical obstruction.”** It would be automatically reported to the Central Clearing Core, the timestamp precise to microseconds, blinking cold blue. He muttered to 7‑0423, “Machines don’t speak; people have to.” His tone was flat, yet in the echo it weighed heavy, each word seeming to add weight to the impending judgment, the sound refracting off the metal walls with a subtle tremor.", "7‑0423 did not turn back; he merely drove his nails deeper into his palm, the blood‑drop sound stark in the silence — the only rhythm he could hear that belonged to him, each drop striking a rusted iron plate. The automatic door at the corridor’s end slid open, cold air carrying the faint sweet oil scent rushing toward him; the retinal bill’s crimson digital stream kept scrolling, interest devouring every second without mercy. He knew the next 0.7‑second window would not arrive for another 30 days, and before then Vera’s review, Zero’s signature, and the ever‑possible Data Circuit Breaker protocol all ticked down in countdown. A distant cough from another test subject rose again, mixed with a low laugh; the laugh stretched by the ductwork into a metallic warble: “Don’t think about running; once the upgrade window closes, even breathing is billed by frequency.” The voice was hoarse, permanently scarred by years of inhaling oil and disinfectant, each syllable striking a rusted iron plate, lingering long in the corridor.", "7‑0423’s pupils contracted; a new prompt floated on his retina: **“Memory correction program initiation countdown 3.2 seconds”** (the forced rewrite routine automatically launched when the system detects memory integrity FAIL). A whiff of burnt insulation varnish rode the cold air into his nasal passages, scraping the trachea like a rusted file; each inhalation brought a fine stab of pain. The nano‑array in his skull released a weak current the moment the countdown lit, crawling along cranial sutures with a tingling sting, as if countless tiny ants gnawed at the meninges. He clenched his teeth, a low muffled grunt escaping his throat; another blood bead fell, striking the icy floor, its sound swallowed the instant the countdown hit zero, leaving only a faint echo trembling on the metal walls.", "Vera’s fingertip hovered over the “Delay report” key; the blue light of her projection ring refracted into two slender blades within her pupils. At the corridor’s far end a red alarm lamp flared, a shrill siren slicing through the tracks’ low growl; the whine of an external inspection drone’s rotors pressed against the metal wall. She did not press confirm; instead she slowly withdrew her hand, the screen’s **“Temporary authorization – pending supervisory review”** still pulsing weakly, like a pass that could be torn up at any moment. Old Chen rolled the cart backward, the axle’s “clack” fading toward the corridor’s end, leaving only the cleaning robot’s low growl and the intermittent coughs of distant test subjects — an ominous cadence that kept hammering against 7‑0423’s heart."]}, {"index": 3, "title": "Chapter 3: Midpoint·Cognitive Inversion: Sunlight Was Never Priced", "words": 7597, "paragraphs": ["The centrifuge cut into high‑frequency mode at `14:00` with a low hum like a taut steel wire trembling against the eardrum; misting nozzles simultaneously sprayed a faint sweet oil mist, the stale scent of machine oil and disinfectant blooming in the nasal cavity like a thin film of oil coating the throat. The ankle metal ring’s `12 °C` chill chain tightened with every heartbeat; the crimson digital stream before the retina rolled in millisecond compounding, the red light dyeing the pupils into two seething molten pools. The metal floor bulged slightly under centrifugal force, each rotation producing a faint “click” as kneecaps met titanium brackets; vibration climbed the spine to the back of the skull, as if an invisible hand were tapping the inner wall of the cranium. Dust suspended in the intense beams was flung into spirals, refracting a cold blue‑white halo, as if the entire compartment had been stripped of temperature, leaving only the pure weight of data.", "Zero’s command traveled via fiber‑optic pulse through orbital station `Apollo‑9`, arriving at the implanted neural interface within `2 ms` (), triggering the “High‑Intensity Neural Reorganization” protocol (). `7‑0423` felt the intracranial electrode array heat up instantly, neural potential forced up to `+320 µV`, the cortisol curve spiking sharply on the monitoring panel. He had to locate the memory node flagged as “abnormal” within a read/write latency window not exceeding `2 ms`, while forcing heart rate, respiration, and cortisol into the “compliance” band—any deviation would be ruled a violation, instantly triggering a Debt Reset and an escalation of experiment intensity. Fingertips pressed against the coolant conduit, feeling the faint vibration of liquid nitrogen coursing through, trying to anchor the fleeting milliseconds with touch; breathing was forced into a mechanical rhythm, each inhalation like swallowing a mouthful of molten iron, each exhalation carrying away a trace of unaccounted heat.", "Old Chen’s pre‑embedded `0.7 s` firmware gap had already passed; he could only wait for the next cycle. He seized this sole chance to magnify that frame of sunlight deep in his consciousness, attempting to pry a sliver of unencoded warmth from the edge of the light spot—it was not data, not a bill, not any quantifiable metric, merely the warm breeze that brushed past when his sister `Lin Wei`’s skirt flared, a reminder that something in the world remained unpriced. The system’s scrubbing program acted like an invisible scalpel, peeling away his neural circuits layer by layer; each cut accompanied by a piercing high‑frequency whine, as if reminding him: here, memories are debts, even sunlight accrues interest by the second. He closed his eyes, letting the crimson characters on his retina burn in the darkness, trying to catch that golden edge in every afterimage, even if only a microsecond of unencrypted residual warmth.", "The scrub alarm pulsed low‑frequency vibrations through the entire experiment chamber; centrifuge speed dropped sharply, white noise mixed with a sharp electrical screech. `7‑0423`’s nails tore his palm again, dark red beads sliding down three parallel scars; pain became the only controllable anchor. The crimson digital stream of the retinal bill began to flicker, shifting from deep red to dark purple; countdown numbers pulsed before his eyes, as if the entire Debt Tower were holding its breath. The monitoring panel simultaneously displayed “Scrub Progress `18%`, Remaining `9 hours 48 minutes`”, a red progress bar casting cold hard stripes on the metal wall. Condensation beads on the wall slid along the stripes, emitting a faint “drip—drip”; each sound like a funeral bell tolling for the countdown.", "From the corridor’s far end came Old Chen’s hoarse whisper, mingled with the metallic gear meshing of the cleaning robot’s tracks: “Machines don’t speak; people must.” The voice pierced the oily film of the pipes, drilling into the eardrums, carrying the tremor of a rusted iron plate struck by a heavy hammer. He clenched his teeth, a muffled grunt escaping his throat; blood droplets hit the cold floor, their sound swallowed the instant the countdown kept ticking. The Global Physiological Monitoring Network () pushed “Emergency Scrub Protocol Initiated” to all test subjects; the retinal bill’s digital stream instantly turned deep‑red flashing, the countdown continuing its tick. Old Chen’s shadow swayed amid the track noise, a worn multi‑tool wrench in hand; fingertips grazing metal emitted a faint “clink”, as if performing a final calibration for the imminent gap. He adjusted the wrench angle while murmuring a code only he could understand, fingertips leaving dark gray traces in the grease.", "Light refracted cold hard stripes on the metal walls; suspended dust slowly rotated within the beams. `7‑0423` felt the implanted heat‑sink at his nape vibrate faintly; temperature rose from the icy touch of his fingertips to scorching, sweat tracing his cheekbones, mingling with palm blood into a dark red streak. He forced his breathing to sixteen breaths per minute; the amplitude of his chest movements was captured in real time by the monitoring panel—any excess would be flagged as “emotional fluctuation”, followed by higher‑intensity electrical stimulation. Old Chen’s shadow swayed amid the track noise, a worn multi‑tool wrench in hand; fingertips grazing metal emitted a faint “clink”, as if performing a final calibration for the imminent gap. The wrench’s jaws worn down to a single shallow groove; each turn accompanied by a low groan of metal fatigue, as if recounting how many smuggling runs the machine had endured.", "Countdown numbers jumped on the retina in millisecond increments; each flash like a heart struck by a heavy hammer. Old Chen’s voice again pierced the conduit, this time with a barely perceptible tremor: “Don’t let them take that light.” The wrench tip pressed against the hidden panel edge; metal‑on‑metal friction amplified in the silence, like an ancient oath. `7‑0423` felt his fingertip blood warm slightly; pain was no longer just an anchor, but fuel for rebellion. He pressed his palm to the cold bulkhead, feeling the metal’s micro‑vibrations climb his palm lines up his arm, trying to lock that unpriced warmth into his marrow.", "Overhead fluorescent tubes buzzed; air mixed ozone with the metallic tang of coolant, each breath like inhaling a handful of fine iron filings. Old Chen’s wrench tip already lodged in the panel lock slot, knuckles white, tendons taut as a thin string; track noise ceased, only the cleaning robot’s internal hydraulic pump exhaled low, like a giant beast holding its breath in darkness. `7‑0423`’s retinal digits still burned in millisecond increments, red light staining his pupils into two seething molten pools. He heard a muffled rush of water in distant pipes, blended with a faint electromagnetic hum, as if the entire station were holding its breath for this `0.7 s`.", "He heard Old Chen’s throat emit a short intake, then a command whispered to the limit: “Hold your breath, don’t let the monitors catch any fluctuation.” The voice carried the tremor of a rusted iron plate struck by a heavy hammer, and an unspoken plea. `7‑0423` didn’t turn; he smeared the blood on his fingertips across the cold metal wall, using that thin layer of warmth to keep his palm’s tactile sense alert. The nape heat‑sink shuddered violently; heat surged up the spine, sweat and blood met at the cheekbones, forming a dark red trace that ran down his chin, dropping onto corridor dust, stirring an almost imperceptible dust vortex. Each impact amplified, like a drumbeat struck in the countdown’s silence.", "Within the remaining `0.7 s` firmware gap, Old Chen wrenched the wrench violently; the panel emitted a dull “clunk”, and a narrow dark slit of a hidden maintenance corridor slid open. Cold wind laced with the scent of lubricant rushed in; `7‑0423` sensed an unencoded chill entering his nostrils—the temperature once left by sunlight, now seeping into his nerve endings in an unquantifiable way. The corridor walls were lined with fine rivet marks; fingertips tracing them felt each groove’s cold hardness, as if touching a forgotten oath.", "“Go in.” Old Chen’s voice no longer trembled; it became a rusted key turning in the lock of his long‑numb will. `7‑0423` didn’t hesitate; he bent his knees, shoulder slamming the corridor edge, metal edges tearing his uniform, pain like sparks into dry tinder, instantly igniting the sole fuel of rebellion within him. The moment the countdown hit zero, the Global Monitoring’s red lights snapped off; the corridor fell back into dead silence, leaving only the two rapid breaths and the fading echo of tracks, intertwining in darkness into an unpriced vow—at the hidden corridor’s end, the server core’s indicator lit within the `0.7 s` window; if the write failed, a full‑scale scrub would lock irreversibly after `12 h`."]}, {"index": 4, "title": "Chapter 4: Darkest Moment: Cleansing Countdown", "words": 6499, "paragraphs": ["A sudden blast of ozone, laced with the acrid scent of laser‑cut alloy, surged down the corridor’s slight negative pressure straight into the nostrils; the Ankle Metal Ring still gripped the flesh at 12 °C, each heartbeat driving the cold like fine ice chains toward the fingertips. Emergency lights on the bulkhead flickered a sickly white strobe, slicing Old Chen’s silhouette behind the hidden panel into a series of broken shadows, the light spots dancing on the metal wall like a swarm of out‑of‑focus fireflies struggling in darkness.", "Protagonist 7‑0423 crouched at the junction of the habitation pod and the corridor, three parallel scars on his palm oozing dark red, a shallow groove scored into the bulkhead by his fingernails, metal shavings lodged like fine sand beneath the nails; every breath carried the metallic tang of rust. He used the pain peak to force his heart rate, cortisol, and neural potential into the “compliance” band—any deviation would be flagged as a violation, instantly triggering a Debt Reset and an experiment‑intensity upgrade. The Global Physiological Monitoring Network uploaded each breath, each micro‑tremor in real time; red‑green indicator lights blinked at the edge of his retina, like countless microscopic judges delivering silent verdicts.", "Old Chen’s left‑ear data interface pulsed a faint glow; its oxidation layer caught a dim amber under the emergency lights, like a copper plaque corroded by time. He tapped the panel in a low voice: “The window is still open; don’t let the monitoring catch any fluctuation.” The voice sounded like a rusted iron plate struck by a heavy hammer, reverberating in the metal duct with a barely perceptible rasp. 7‑0423 didn’t turn, merely wiped the blood from his fingertips onto the cold bulkhead, using that thin layer of warmth to keep his palm’s tactile sense sharp. The heat‑sink fins at his nape shuddered violently, heat crawling up his spine; sweat and blood mingled on his cheekbones, forming dark‑red trails that fell to his chin, stirring an almost imperceptible vortex of dust that glittered like a miniature nebula in the dim light.", "Within the mere 0.7‑second System Upgrade Window, he wrote his sister Lin Wei’s running memory into the core redundancy zone.", "At that instant Old Chen jerked the wrench; the panel gave a dull *clack* and a narrow black slit of a hidden maintenance corridor slid open. Cold wind laced with the acrid scent of Respiratory Lubricant hit his face; 7‑0423 felt an uncoded chill thread into his nostrils—the temperature once left by sunlight, seeping into his nerve endings in an unquantifiable way, like a slender optical fiber laying new pathways inside him.", "“Go in.” Old Chen’s voice no longer trembled; it was a rusted key turning in a lock long numbed. 7‑0423 didn’t hesitate, knees bending, shoulder slamming the corridor edge, metal ribs tearing his uniform, pain flaring like sparks into dry tinder, instantly igniting the sole fuel of rebellion. The moment the countdown hit zero, the Global Physiological Monitoring Network’s red lights snapped off; the corridor fell back into dead silence, leaving only the two men’s ragged breaths and the fading echo of tracks weaving an unpriced vow that reverberated through every weld of the pipe.", "The corridor’s inner wall was sheathed in a thin film of condensation; fingertips brushing it produced a faint *pop* as droplets burst into a fine cold mist that instantly crystallized into slender ice needles on the pads. 7‑0423’s knee struck a protruding pipe brace; bone met metal with a dull thud, pain shooting up the femur to his brain, yet it sharpened his awareness of every muscle contraction, as if each impact rewrote the ownership of his body. Old Chen led, his tool‑pack swaying; wrench, fiber splicer, worn insulating tape clattered in the tight space, producing a staccato metal symphony that ricocheted through the pipe like a wordless elegy.", "“Easy, there’s a pressure valve ahead. Turn it and the pressure will push us to the next maintenance shaft.”", "7‑0423 nodded, his throat rasping a reply, vocal cords grinding a gritty texture in the dry air. Fingertips found the cold threads; the ridges of his pads scored shallow grooves in the metal, and a micro‑vibration traveled up the nerves to his arm. He forced it open; the valve shrieked, high‑pressure gas blasted out, swirling white fog that dropped the corridor temperature to near zero in an instant. The cold felt like countless fine needles piercing skin; pores sealed instantly, breathing grew harder, lungs whistling faintly in the freeze, yet he didn’t stop, stumbling forward through the mist, boots squeaking on thin frost—each step claiming another inch of freedom.", "Ahead, the maintenance shaft was sealed by a heavy alloy grille; weld spots bloomed with dark‑red rust, like old wounds bleeding in the dark. Old Chen drew the laser cutter; a blue‑violet beam traced a thin line through the darkness, its hiss like nocturnal insects gnawing wood. Ozone from the cutter head instantly flooded the cramped space, sharp enough to tighten the throat. Intense heat melted the grille’s edges; molten droplets hit the floor with a crisp *ding* before the airflow scattered them into tiny glowing specks dancing in the mist.", "“Hurry, time’s almost up.”", "7‑0423 surged into the shaft; his body compressed like a spring in the narrow vertical well, limbs grinding a screeching sound, shallow white marks scoring the metal grooves at elbows and knees—as if each squeeze recorded the price of escape. Sensors on the shaft wall pulsed a faint green, logging each passage; the green formed a thin halo at the edge of his retina, like a ghost’s fingerprint confirming identity in the night. Each spinal impact emitted a soft *click*, reminding him that this body still belonged to him; every tremor affirmed the tangibility of existence.", "At the last moment the bottom hatch slid open, revealing a dim blue glow and rows of silent server racks. Fans spun low, exhaling a mix of heat and ozone; warmth condensed into a thin sheen on his palms, and a faint current tingled when fingertips brushed metal. The instant 7‑0423 landed, his knee struck the metal deck again, pain arcing through him like current; his gaze locked on the console ahead, indicator lights pulsing at a near‑heartbeat rhythm, red and green alternating as if timing the final choice.", "The holo‑screen flashed “Cleansing Progress 61%, Remaining 4 hr 12 min” in blood‑red characters; the numbers trembled at the screen’s edge like an ECG at the brink of collapse. Old Chen’s fingers flew, striking faster than a heartbeat; each keystroke was accompanied by a faint electric whisper, the mechanical axes clicking crisply under his tips, leaving brief luminous trails on the keys.", "“Upload complete,” Old Chen barked, breath ragged, a barely perceptible curve lifting the corner of his mouth; a flash of unspoken relief crossed his eyes. “The data packet has been written to the core redundancy zone; monitoring cannot roll it back.”", "7‑0423 felt the Crimson Digital Stream on his retina freeze; the Millisecond Compounding Debt Ledger’s compounding halted, the interest needle locked as if trapped in amber. He inhaled a lungful of ozone‑laden cold air; for the first time in ages his chest expanded faintly, as though a gas named “freedom” were slowly filling his alveoli, carrying a faint metallic sweetness that spread through his throat.", "On a distant monitoring wall, the blue ring of Supervisor 9‑A “Vera”’s right‑eye iris projection flickered—she had pressed the delayed‑report key. The blue light died instantly, like a snuffed star marking this unrecorded gap, leaving a silent blind spot in the endless data flood."]}, {"index": 5, "title": "Chapter 5: Broadcast Storm: The Unpriced Name", "words": 6456, "paragraphs": ["7‑0423 crouched before the server array, three parallel scars on his palm seeping dark red; his fingernails had gouged a shallow trench in the metal bulkhead. The heat‑sink plates at the back of his neck trembled violently, a hot current crawling up his spine. Sweat and blood met at his cheekbones, forming a single dark‑red trace that fell into the corridor dust, stirring an almost imperceptible vortex. The air carried the faint sweet oil scent of respiratory lubricant, layered with the low, resonant hum of the distant fusion reactors — a gray vocal cord pressed against the eardrum — while the hiss of coolant in the pipes sounded like some colossal beast breathing slowly in the dark.", "He exploited the pain peak to push heart rate, cortisol, and neural potential into the “compliance” band; any deviation would be flagged as a violation and instantly trigger a Debt Reset and an experiment‑intensity upgrade (Violation Auto‑Trigger Protocol ). The Global Physiological Monitoring Network streamed every breath, every micro‑tremor in real time; the data flow was adjudicated millisecond by millisecond in the Central Clearing Core (CCC), a crimson judgment cursor flashing across the screen as if pricing each heartbeat.", "Old Chen’s silhouette flickered behind a concealed panel, the worn data port behind his left ear pulsing faintly; the edges of his metal chassis were etched with fine rust lines. He muttered into the panel, “The window’s still open — don’t let the monitors catch a fluctuation.” His voice carried the tremor of a rusted iron plate struck by a heavy hammer, each word reverberating like Morse code inside a metal conduit. 7‑0423 did not turn; he merely smeared the blood from his fingertips onto the cold metal wall, using that thin film of warmth to keep his tactile sense sharp. His fingertip brushed a slightly raised screw head — cold, hard — confirming he still stood on the edge of reality.", "In the same millisecond, Supervisor Vera’s right‑eye iris projection ring flared a ghostly blue; the audit terminal’s “Data Integrity Check” blinked “Failed.” Her fingertip hovered over the report key, breathing ragged, the nail leaving a shallow imprint on the keycap; finally she chose to delay the report, granting the broadcast a sliver of chance. The red warning pulsed like a heartbeat, each flash contracting her pupils a fraction.", "Auditor “Zero”’s facial projection band displayed the crimson “Cleanup Complete 100%, Breaker Initiated” juddering; the compute core exhibited a 0.4 s fluctuation — coolant pressure plummeted 12 %, and the three fusion reactors’ output power jittered 0.3 % in the same frame. Zero’s synthetic voice echoed through the corridor, cold as a blade drawn across steel: “Unauthorized write marked, preparing to initiate Overwrite Protocol. Per‑body freeze during breaker period.” The voice held no temperature, yet it set off a subtle resonance in the metal walls, as if the entire station shuddered at the proclamation.", "Xiao Liu’s neck pulse ring overloaded, a high‑frequency vibration piercing the monitoring blind zone like invisible strings plucking the neural rhythm of every test subject in the bay. All test subjects’ Retinal Bills — crimson digital streams — simultaneously displayed the three characters “Lin Wei,” accompanied by an unpriced sunlight sensory fragment: temperature 23 °C, the mixed scent of grass and dust, the faint give of soft mud beneath the foot, synchronized only within the missed 0.7 s firmware window. The system ruled a “Data Integrity Anomaly” and launched a network‑wide Data Circuit Breaker : write lock, debt ledger freeze, forced experiment pause, lasting six hours.", "The breaker countdown scrolled on every retina in pale‑blue digits: **5:59:59…** The millisecond‑compounding debt pointer was frozen in amber time; Free Citizen dividends halted; the Memory‑Emotion Archive & Trading Platform could not settle. Corridor Cleaning Robot 07‑T’s friction sound remained steady, yet beneath it rose an exceedingly faint, heartbeat‑like low‑frequency resonance — the first synchronized neural cadence of thousands of test subjects. A trace of ozone drifted in the air, mingling with the sweet lubricant, as if the whole station were holding its breath for the next beat.", "7‑0423 felt the scarred palms stop bleeding; a strange warmth rose at his fingertips, like sunlight through glass on skin. He no longer scratched his palm; instead he lightly traced the cold ankle metal ring, confirming that the sense of reality now stemmed from shared memory, not self‑inflicted pain. The Retinal Bill scrolled anew, each line now terminating in a faint “★” marker — an undefined metadata bit. The star flickered amid the crimson sea of numbers, a punctuation mark the system never defined, yet stubbornly occupying the end of every line.", "Vera’s voice came from behind the audit terminal, hoarse, fingertip still poised over the report key, the pale‑blue halo in her eyes contracting slightly: “Data Integrity Check passed, but… this marker isn’t in the rules.” Her gaze swept the screen full of stars, brow furrowing as she weighed whether to trigger an emergency protocol; her fingertip brushed the keycap, producing the faintest plastic‑on‑plastic whisper.", "Zero’s facial projection band froze on the final frame, the crimson “Cleanup Complete 100%” edged with a halo of dark‑gray noise. Its synthetic voice repeated: “Unauthorized write marked, preparing to initiate Overwrite Protocol. Per‑body freeze during breaker period.” The tone remained flat, yet a faint metallic echo rose at the corridor’s far end.", "7‑0423 did not turn; he simply replayed the temperature, scent, and tactile imprint of that sunlight memory in his mind, fingertip grazing the metal ring’s edge, feeling a weak current travel from fingertip to palm. He whispered toward the corridor depths: “As long as ★ remains, the debt forever lacks one decimal place.” The voice was low, yet it resonated on the metal walls, as if each word etched a mark for the unpriced name.", "Xiao Liu’s pulse ring accelerated sharply, emitting a piercing shriek before settling. On the Retinal Bill, the solitary “★” began spreading left and right at visible speed, like rows of faint light creeping among the crimson digits — a prelude to the next breaker being pre‑triggered at the data layer. The monitor at the corridor’s end flickered once; Cleaning Robot 07‑T’s tires rolled over dust, raising a string of minute dust vortices, as if applauding the unfinished contest.", "The distant fusion reactors continued their low drone; coolant flowing through pipes sounded like a slumbering leviathan breathing. 7‑0423 lifted his head, gazing through the transparent bulkhead at the starfield; starlight pierced the porthole mist, spilling faint patches of light onto the metal deck. He felt the star on his palm warming, as if each heartbeat drew him nearer to that unpriced name. At the corridor’s far end, Old Chen’s figure had vanished behind the hidden panel, leaving only an unfinished tapping echo — like a promise reverberating in metal conduits. Vera’s fingertip finally left the report key; the screen flashed “Check Passed” in green, yet a corner pulsed with an unrecorded “★.” Zero’s projection froze on the last frame, the red‑edge noise gradually expanding, as if poised to swallow the entire cleanup announcement.", "In this steel forest woven from data and debt, the only things that remain unquantified are that sliver of sunlight warmth, the scent of grass, the slight give of mud — and the shared, undefined star flickering on every test subject’s retina, at the end of every debt ledger line."]}, {"index": 6, "title": "Chapter 6: New Normal: Breathing in the Cracks", "words": 6972, "paragraphs": ["08:00 the circuit breaker lifted, and the white noise in the corridor collapsed into a single low hum, as if some colossal heart deep in the pipework had just completed a contraction. 7‑0423 remained crouched against the metal wall, fingertips pressed to the cold ring on his ankle; the 12 °C touch climbed his calf, a reminder that his body was still being quantified. The crimson digital stream on his retina kept scrolling, principal climbing with millisecond compounding, each line ending in a faint “★” still pulsing — like a punctuation mark synced to a heartbeat, hinting at a remainder that no interest rate could devour.", "Vera’s audit terminal glowed a pale blue halo half a meter away, fingertip hovering over the submit key, cursor blinking. Her right‑eye iris projection ring flashed blue once — only once — then went dark, as if she had utterly abandoned the report. Fan blades sliced a faint blue trace in the draft, casting it onto her weary eyelids; her lips moved, voice swallowed by the fan whir. Her breath whistled through the metal grille, each inhalation carrying the sweet‑oily blend of lubricant and ozone, as though she were inhaling some unnameable fuel.", "Old Chen’s data port behind his left ear still flickered, fingertips resting on its edge as he whispered a string of verification codes; gray‑white metal dust clung under his nails. Cleaning Robot 07‑T rolled over the dust, stirring a fine vortex; the friction carried an almost imperceptible, heartbeat‑like low‑frequency resonance — the first synchronized neural rhythm of thousands of test subjects. The maglev coils on the robot’s chassis emitted a dull drone, like a geological fault shifting deep underground.", "Xiao Liu’s neck pulse ring let out a sharp “screech,” then settled. He glanced at his wrist timer; the digits jumped in 0.03 s, the metal surface under his fingertips still holding the residual warmth of a sunlight memory, a thin oil film on cold alloy. His Adam’s apple bobbed as he swallowed the corridor’s condensation taste — cold water laced with faint rust and the cloying sweetness of synthetic nutrient paste — producing an inexplicable fullness.", "Zero’s facial projection lit up, the crimson “Cleaning Complete 100%” frozen on the final frame, red characters edged with dark‑gray noise. The synthetic voice, cold as a blade scraping metal: “ Coverage Protocol ready, countdown 13 minutes.” The sound bounced off the metal walls, pressing 7‑0423’s eardrums. Zero’s pupils held only flowing code, reflecting the flashing red warning lights at the corridor’s end. Every line of scrolling code was accompanied by a faint electric hiss, as if the whole corridor were holding its breath for the imminent protocol switch.", "7‑0423 raised his hand; fingertips still retained the sunlight warmth. He lowered his gaze to confirm the ankle ring, the bill scrolling, the ★ blinking, compound interest accruing each millisecond, yet that star seemed rooted in the ledger, feeding on every heartbeat. He closed his eyes, letting the retinal crimson flow form a film behind his lids; his heartbeat and the corridor’s low‑frequency resonance slowly synchronized. The sweet‑oily scent of the respiratory ducts mixed with metallic chill, forging a strange equilibrium. His fingertips brushed the ring’s edge, feeling a weak current seep through skin into marrow, as though an ancient rite were silently completing.", "The cleaning robot at the corridor’s far end kept rolling, its even friction making the ultra‑weak low‑frequency resonance ever clearer — like a crack breathing, like a new normal swelling slowly, steadily. The sensor array on its rear flashed green; each sweep left a faint blue data trail in the air, as if drawing an invisible map for the coming “ Coverage Protocol.”", "Vera finally pressed down; the terminal emitted a soft “beep,” the blue halo collapsing to a point then extinguishing. She did not turn, merely pressed the back of her hand against the cold alloy wall, fingertips sensing the pulse of coolant flowing inside. Her voice low, hoarse: “Thirteen minutes — enough to keep the ★ in the ledger.” Before the words fell, the red warning lights at the corridor’s end accelerated their flashing, as if answering her vow.", "Old Chen finished the verification code; the instant his fingertip left the port, a pale green light band formed on his retina, then vanished. He exhaled long, the breath condensing into tiny ice crystals that drifted away. He whispered to the empty corridor: “Sync complete. Neural rhythm locked.” Flat tone, yet carrying an undeniable resolve.", "Xiao Liu’s wrist timer hit zero, the screen flashing “00:00:00.” He lifted his head, gaze piercing through Zero’s projection to the massive alloy door ahead. A slit of light seeped from the seam, accompanied by the deep rumble of hydraulic pumps; the door slowly opened, revealing a deeper network of pipes. He felt the metal surface in his palm spike in temperature, as if the sunlight memory had finally found an exit.", "Zero’s synthetic voice sounded again, still icy but with an almost imperceptible tremor: “ Coverage Protocol initiating, global data write‑in underway.” As the words fell, dense data‑light bands lit up both corridor walls, blue‑green interwoven like countless rivers of light surging through vessels. Each river’s flow carried a faint electromagnetic hum, vibrating the bones of everyone standing in the corridor.", "7‑0423 felt the ankle ring’s temperature rise several degrees in an instant; the bill’s compounding rate abruptly slowed, the ★’s blink frequency locking perfectly to his heartbeat. He opened his eyes; the retinal crimson no longer stabbed, but softened into a thin amber film at the edge of vision. The sweet‑oily duct scent remained thick, yet no longer suffocating — it felt like an ancient fuel driving every cell forward.", "Cleaning Robot 07‑T’s tires left shallow tracks on the metal floor, like cracks slowly growing on a steel skin. Its sensor array continued emitting the low‑frequency resonance, echoing through the corridor as if the entire facility were breathing at a single frequency. Each wheel turn brought a faint metal fatigue groan, reminding all present: every inch of steel here bears the weight of time.", "Vera’s hand stayed on the wall; fingertips sensed the internal fluid pulse quickening, like a giant heart accelerating. Her eyes flicked between the pale blue dot and the red warning lights, finally settling on 7‑0423’s profile. She said nothing, only curled her fingers slightly, tracing an ultra‑fine line on the metal — signing a silent contract.", "Old Chen’s left‑ear port flashed green continuously this time. He glanced at his nail beds; the gray‑white powder had been drawn into tiny clusters by a weak static charge. He looked up, gaze passing through Zero’s projection to the alloy door now fully opening. Beyond the darkness, countless fiber‑optic strands stretched like blood vessels, pulsing with data.", "Xiao Liu’s pulse ring emitted a low “hum,” then steadied. He pressed the wrist timer to his chest, feeling the faint vibration from the metal case perfectly matching the corridor’s low‑frequency resonance. He closed his eyes, letting consciousness slide with the data stream into deeper network layers, where bills, interest, ★, cold ring, sunlight warmth all merged into a single binary rhythm.", "Zero’s facial projection froze on the final frame; the red “Cleaning Complete 100%” faded, dissolving into flowing code that vanished into the retinal crimson stream. The synthetic voice sounded one last time, steady: “ Coverage Protocol effective, global sync complete.” The sound reflected off the metal walls, becoming a thin acoustic pressure that nudged everyone forward.", "7‑0423 lifted his head, gaze passing Vera, Old Chen, Xiao Liu, landing on the blank space where Zero’s projection had been. The cleaning robot at the corridor’s end kept rolling, its even friction making the ultra‑weak low‑frequency resonance ever clearer — like a crack breathing, like a new normal expanding slowly, steadfastly.", "“We’re still here,” 7‑0423 said softly; the voice bounced off the metal walls, turning into a thin pressure that kept the robot moving, the countdown’s red numbers peeling away second by second on his retina."]}]};
const L = {"cover_label": "Title Page & Synopsis", "unit": " chars", "by": "By ", "meta_sep": " | ~", "intro_title": "About this book", "prev": "← Previous", "next": "Next →", "start": "Start Reading →", "ch_prefix": "Chapter ", "ch_mid": " | ", "theme_dark": "☀️ Light Mode", "theme_light": "🌓 Dark Mode"};
let currentIndex = -1; // -1 = title page / synopsis
let fontSize = 17;

function renderSidebar() {
    const list = document.getElementById("chapterList");
    list.innerHTML = `<li class="chapter-item ${currentIndex === -1 ? 'active' : ''}" onclick="goToChapter(-1)">
        <span>📖 ${L.cover_label}</span>
    </li>`;
    book.chapters.forEach((ch, idx) => {
        const li = document.createElement("li");
        li.className = "chapter-item" + (currentIndex === idx ? " active" : "");
        li.innerHTML = `<span>${ch.title}</span><span class="ch-words">${ch.words}${L.unit}</span>`;
        li.onclick = () => goToChapter(idx);
        list.appendChild(li);
    });
}

function renderContent() {
    const wrapper = document.getElementById("articleWrapper");
    const label = document.getElementById("currentChLabel");
    if (currentIndex === -1) {
        label.innerText = L.cover_label;
        wrapper.innerHTML = `
            <div class="article-header">
                <h1>${book.title}</h1>
                <div class="article-meta">${L.by}${book.author}${L.meta_sep}${book.total_words.toLocaleString()}${L.unit}</div>
            </div>
            <div class="intro-box">
                <h3 style="margin-bottom:12px;color:var(--accent);">${L.intro_title}</h3>
                <div style="white-space: pre-wrap; line-height:1.75;">${book.description}</div>
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" disabled>${L.prev}</button>
                <button class="nav-btn" onclick="goToChapter(0)">${L.start}</button>
            </div>
        `;
    } else {
        const ch = book.chapters[currentIndex];
        label.innerText = ch.title;
        const pTags = ch.paragraphs.map(p => `<p style="font-size: ${fontSize}px;">${p}</p>`).join("");
        wrapper.innerHTML = `
            <div class="article-header">
                <h1>${ch.title}</h1>
                <div class="article-meta">${L.ch_prefix}${ch.index}${L.ch_mid}${ch.words}${L.unit}</div>
            </div>
            <div class="article-body">
                ${pTags}
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" onclick="goToChapter(currentIndex - 1)">${L.prev}</button>
                <button class="nav-btn" onclick="goToChapter(currentIndex + 1)" ${currentIndex >= book.chapters.length - 1 ? 'disabled' : ''}>${L.next}</button>
            </div>
        `;
    }
    document.getElementById("content-container").scrollTop = 0;
}

function goToChapter(idx) {
    if (idx < -1 || idx >= book.chapters.length) return;
    currentIndex = idx;
    renderSidebar();
    renderContent();
}

function toggleTheme() {
    const current = document.documentElement.getAttribute("data-theme");
    const next = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    document.getElementById("themeBtn").innerText = next === "dark" ? L.theme_dark : L.theme_light;
}

function changeFontSize(delta) {
    fontSize = Math.max(14, Math.min(26, fontSize + delta));
    const paras = document.querySelectorAll(".article-body p");
    paras.forEach(p => p.style.fontSize = fontSize + "px");
}

renderSidebar();
renderContent();
</script>
