const book = {"title": "圈养纪元 (English Edition)", "author": "FutureTxt AI Writer", "description": "In a world where labor has been entirely outsourced to machines and algorithms, humanity has fractured into three castes: the creditor‑elite who price every breath, the nominally free who scrape by on credit, and the “subjects” — numbered, chipped, and bred for endless pharmacological, neural, and behavioral trials.  Debt accrues in real‑time, compounding per second, guaranteeing that no obligation can ever be cleared.  Subject 7‑0423 endures routine neural re‑mapping until a stray memory surfaces: a sister’s laughter, sunlight that carries no price tag, a name erased from every ledger.  The very existence of a past contradicts the doctrine that subjects have no history, and now each mandatory scan, each nutrient paste ration, each projected debt statement becomes a covert search for the system’s physical fissures.  Hunted by the architecture that created him, 7‑0423 must decide whether to exploit the cracks or be consumed by the interest that never sleeps.", "total_words": 42872, "chapters": [{"index": 1, "title": "Chapter 1: Debt Tower Dawn", "words": 7307, "paragraphs": ["The faint sweet oily scent of the respiratory lubricant seeped through the hull’s micro‑tremors, mingling with the even friction of Corridor Cleaning Robot 07‑T rolling down the hallway and drilling into the eardrums. The cold touch of the ankle metal ring clung to the skin like a thin chain of ice; every heartbeat reminded Subject 7‑0423 of his ownership. The retinal blood‑red debt stream was already crisp at 0.8 meters—principal 1.2 × 10⁵ CR compounding per millisecond , interest flowing like breath, never repayable.", "The faint sweet oily scent of the respiratory lubricant seeped through the hull’s micro‑tremors, mingling with the even friction of Corridor Cleaning Robot 07‑T rolling down the hallway and drilling into the eardrums. The cold touch of the ankle metal ring clung to the skin like a thin chain of ice; every heartbeat reminded Subject 7‑0423 of his ownership. The retinal blood‑red debt stream was already crisp at 0.8 meters—principal 1.2 × 10⁵ CR compounding per millisecond , interest flowing like breath, never repayable.", "Bitterness lingered at the root of the tongue after forced medication; the metallic texture of the breakfast nutrient paste clicked between teeth like chewing an unsigned contract. Laboratory white noise and the low hum of centrifuges seeped from the vents, wrapping the lower levels of the Debt Tower in a stale rust smell; each inhalation felt like swallowing rusted iron filings.", "Subject 7‑0423 opened his eyes. Three parallel scars on the palm of his left hand glowed dull red in the dim light; blood seeped from the edges of his nails, trembling. He was accustomed to scoring his palm with his nails to confirm reality—pain the only coordinate not quantified by the ledger. Fingertips brushed the cold alloy wall, leaving a faint indentation, a silent protest against the closed loop.", "“Bill Wake” low‑frequency vibration traveled against the sternum, completing the daily 06:00 physiological alarm together with the faint sweet oil scent. Heart rate locked at 14 beats per minute; any fluctuation was ruled a violation. The Global Physiological Monitoring Network had already uploaded cortisol and neural potentials to the Central Clearing Core (CCC). The vibration resonated in the chest cavity, forcing breath to synchronize with the system; even the laryngeal cartilage trembled.", "Routine neural reconfiguration experiment initiated. The nanocarbon‑tube electrode array pierced the nerves within two milliseconds , like ice needles slicing through consciousness. Data streams flickered on the retina; an unauthorized fragment suddenly intruded: sunlight spilling onto grass, his sister Lin Wei’s laughter like unpriced amber—warm and incalculable. The cortex spasmed instantly; palm scars bled harder, blood beads slipping through fingers, coalescing into dark‑red dots on the metal floor with a faint “tap,” swallowed by the corridor’s low‑frequency hum.", "An anomalous line appeared on the retinal bill—", "**Memory Integrity Check: FAIL**", "Countdown 0.7 seconds; the System Upgrade Window about to open. The air thickened with a cloying mix of disinfectant and machine oil; each breath felt like swallowing liquid lead. At the corridor’s end the cleaning robot halted, its red light casting a thin beam across Subject 7‑0423’s clenched jaw. He did not move; he merely let his fingertips trace the wound on his palm again and again, feeling pain anchor his consciousness in the present, preventing his memories from being erased.", "In the distance, prisoner 9‑317 coughed low, mingled with the hiss of pipe venting, as if the entire Debt Tower held its breath. The cough carried a rusty iron tang, lungs seeming abraded by metal dust. Subject 7‑0423’s pupils contracted slightly; FAIL still blinked, as though something crawled up from the depths of the pipes, bearing cold logic and silent judgment.", "He closed his eyes, trying to grasp the sunlight and laughter, only touching cold electrodes and scrolling red numbers. The System Upgrade Window tightened like an invisible net, awaiting the next pulse to erase the neural signals flagged as “violation.”", "Countdown reached zero; the hull’s micro‑tremors intensified, the faint sweet oil scent growing stronger. Subject 7‑0423 clenched his fist, nails digging into his palm again; the sound of blood drops hitting the floor rang unusually clear in the silence—the only beat he could hear that belonged to him.", "Blood hit the floor; the cleaning robot sprang to life, its tracks emitting a sharp “zzzt,” red light sweeping the walls and stretching shadows. The manipulator sprayed a fine mist; the acrid blend of disinfectant and machine oil stung the nostrils like rusted iron filings. He did not dodge, letting the mist envelop his fingertips; tiny droplets hissed on the wound, as if countless ants were gnawing at nerve endings.", "“Abnormal neural fluctuation detected, Subject 7‑0423, initiating forced synchronization.” The voice seeped from the directional speakers in the hull, low and temperatureless, each word accompanied by a faint current trembling against sternum, temple, tooth roots. Heart rate remained locked at 14; cortisol curve spiked; a red warning bar flickered on the retina, as if trying to split his vision.", "He clenched his molars, a muffled growl in his throat; nails dug into his palm again, blood seeping through fingers, dripping onto cold alloy with a crisp “tap.” Pain nailed his consciousness in place, stopping sunlight and laughter from being devoured by the data stream. The retinal number stream accelerated; **Memory Integrity Check: FAIL** still glared, followed by a new tag—", "**Synchronization Progress: 12%**", "At the other end of the corridor, 9‑317 coughed again, mixed with pipe vent hiss, like a rusted bellows gasping desperately. He huddled in shadow, left arm wrapped in a worn conduit, its tip flashing faint green; his murky yet sharp eyes curved into a mocking arc: “The system wants another ‘upgrade’? Do they really think we’re hard drives they can format at will?”", "Subject 7‑0423 did not turn; his fingertips slowly traced circles in the blood on his palm, each revolution like oiling an ancient timing gear. The faint sweet oil scent thickened; hull micro‑tremors crawled up his spine to the back of his skull; teeth clicked faintly.", "Countdown hit zero; red lights snapped out, the corridor plunged into absolute darkness, leaving only the low‑frequency pulses from the directional speakers beating like a heart against metal plates. Subject 7‑0423 kept his eyes closed, fingertips still circling his palm; the sound of blood drops hitting the floor rang sharply in the silence—his sole, personal beat.", "Low‑frequency pulses made the metal plates tingle; blood beads in his palm cooled into tiny ice pearls, each drop exploding with a “tap” in the quiet, echoing amid the cleaning robot’s track noise. The robot did not stop; after the red light died it continued along its preset path, nozzles spraying disinfectant mist that condensed into a pale white veil; rust and bitter almond odors pierced the nostrils, sliding down the trachea into the lobes, each breath like swallowing metal shavings.", "“Synchronization Progress: 27%” flickered on the retina; the red warning bar cleaved the view like a crack. Heart rate still locked at 14; cortisol curve climbed to a peak; temples throbbed as if trying to split the skull. He did not open his eyes; fingertips kept circling the wound, staving off memory consumption.", "9‑317 coughed again, voice rasping through the low‑frequency pulses: “Another ‘upgrade’? Do they really think we’re hard drives that can be formatted anytime?”", "Subject 7‑0423’s fingertips paused in the blood circle, nails digging into flesh again, fresh red seeping and dropping onto alloy with a “tap.” Pain nailed consciousness; retinal number stream accelerated; FAIL persisted, followed by—", "**Synchronization Progress: 41%**", "Low‑frequency pulses abruptly quickened; hull micro‑tremors became violent shakes; teeth clicked. Cleaning robot tracks again emitted a sharp “zzzt”; red light flared anew, shadows stretched again. The manipulator sprayed a denser fine mist; scent stung like rusted iron filings. He did not dodge, letting mist wrap his fingertips; tiny droplets hissed on the wound, like ants gnawing nerves.", "“Abnormal neural fluctuation detected, Subject 7‑0423, initiating forced synchronization.” The voice seeped again from the hull, low and temperatureless, each word accompanied by current tremors against sternum, temple, tooth roots. Heart rate still locked at 14; cortisol curve showed a peak; red alert bar flickered, threatening to split vision."]}, {"index": 2, "title": "Chapter 2: The Friction of Fragment Exchange", "words": 7010, "paragraphs": ["The Corridor Cleaning Robot 07‑T’s tracks rolled across the alloy floor at the far end of the hallway, emitting a steady low‑frequency grind, like a taut steel wire being plucked repeatedly in the silence. Every fifteen meters a misting nozzle released a faintly sweet mist of lubricant oil, mingling the stale scent of machine oil and disinfectant that slipped into the nostrils, coating the throat with a thin film of oil that slid down the airway into the lungs, leaving a faint metallic tang. The metal ring around the ankle clung to the skin, its constant 12 °C chill traveling with each heartbeat to the fingertips, reminding Subject 7‑0423 of his ownership. A blood‑red stream of debt numbers scrolled across the retina at 0.8 m, the principal 1.2 × 10⁵ CR swelling with millisecond compound interest, the crimson fluid devouring the last reserves of stamina. The tongue still bore the bitter aftertaste of the forced medication; the metallic texture of the breakfast nutrient paste made a faint “crunch” between the teeth, as if chewing an unnameable contract. The distant hum of centrifuges intertwined with the laboratory’s white noise, forming a thin gray membrane that vibrated against the eardrums; even the air seemed to carry a faint vibrational frequency, turning each breath into a count against some invisible metronome.", "Old Chen pushed his maintenance cart; its wheels groaned on the same track with a duller “clack” than the cleaning robot, metal bearings sighing in the cold alloy gaps. The data port behind his left ear flickered weakly; he tapped the handle twice with his fingertips—the agreed “window open” signal for 7‑0423—applying just enough pressure for the port to sense the minute capacitance change without triggering an alarm. The upgrade window opens only 0.7 seconds every 30 days , the sole interval permitting unauthorized writes; Old Chen had seeded this gap in the cleaning robot’s firmware, masking the extra command behind the rule “execute preset checklist only,” so the firmware log would show only a routine “environment scan complete.” He glanced at the flashing green light on the hidden panel beneath the cart, his fingertip brushing the cold edge, feeling a faint current crawl up his hand, then rolled the cart forward, leaving a series of shallow impressions on the track.", "7‑0423 walked along the wall; the ankle ring tightened minutely with each step, the metal clasp leaving faint pressure marks on his skin, each contraction a reminder that his body no longer belonged to him. Three parallel scars on his left palm glowed dull red in the dim light; beads of blood seeped from the nail edges, trembling in the pre‑spasm of his nerves, sliding through his fingers with a cool whisper. The retinal debt stream rolled across his pupil, the interest increment visibly ballooning each second, the crimson fluid threatening to rupture the retinal membrane. He dared not glance at Regulator Vera’s projection ring; the micro‑ring implanted in her right iris glowed blue in the gloom, auditing data integrity in real time —any read/write latency exceeding 2 milliseconds would trigger a “Data Integrity Check” and lock the subject for 24 hours. Wall lamps cast long, thin shadows along the corridor, like countless invisible hands measuring his every step; the shadow edges trembled on the metal floor, as if ready to close at any moment.", "Xiao Liu (Subject 7‑0419) leaned against the corner railing; the pulse ring on his neck flashed with his heart rate, its weak blue light refracting into shattered prisms on the metal surface, dancing across the wall like a fragmented code. His language centers had atrophied; he could only tap rhythms with his ankle ring: two short, one long, pause, three short—the syntax of “Memory Fragment Exchange” agreed upon in the monitoring blind spot, each beat mapping to an encrypted memory index, the taps echoing in the hallway amid the cleaning robot’s low growl. Old Chen pressed the confirmation key on the hidden panel beneath the cart; the screen flashed green text: **“Firmware window 0.7 s ready”**, the characters stark against the dim backlight, like a key sliding into a rusted lock, the tumblers emitting a faint “click.”", "0.7 seconds passed like a single heartbeat. The nano‑carbon nanotube electrode array inside 7‑0423’s skull completed the write; the unpriced laughter of his sister Lin Wei, bathed in sunlight, was encapsulated as a pointer and written into the edge block of the test‑subject public cache. At the instant of writing, the palm scars wept blood again; droplets traced his fingers, coalescing into dark red spots on the metal floor, emitting an almost inaudible “drip” amplified by the corridor’s reverberation into a ritualistic percussion, as if each drop sealed a contract. The retina flashed red: **“Unauthorized write attempt – pending review.”** Vera’s projection ring blazed blue; her fingertip typed “Mark 7‑0423 as high‑risk subject” on the virtual keyboard, and the screen popped up: **“Approval requires Auditor ‘Zero’ signature, countdown 48 hours.”** The numbers flickered in the air like an hourglass suspended overhead, grains falling one by one into the abyss.", "Cleaning Robot 07‑T hesitated, its tracks emitting a deeper, more ominous grind; the reluctant meshing of metal on metal reverberated through the narrow corridor, as if the very air had been drawn taut. Old Chen glanced at the robot’s log; a new entry appeared: **“Environmental interference – physical obstruction,”** slated for automatic upload to the Central Clearing Core, its timestamp precise to microseconds, blinking cold blue. He muttered to 7‑0423, “Machines don’t talk; people have to.” His tone was flat, yet the echo gave it weight, as if each word added to the impending judgment, the sound refracting off the metal walls with a subtle tremor.", "7‑0423 did not turn; he only drove his nails deeper into his palm, the sound of blood droplets striking the silence exceptionally clear—the only rhythm he could hear that belonged to him, each drop striking a rusted iron plate. The automatic door at the corridor’s end slid open, cold air laced with the sweet oil scent rushing in; the retinal blood‑red debt stream kept scrolling, interest devouring every second without mercy. He knew the next 0.7‑second window would arrive in 30 days, and before then Vera’s review, Zero’s signature, and the ever‑possible “Data Circuit Breaker” protocol all ticked down in the countdown. A distant cough from another test subject rose again, mixed with a low laugh; the laugh stretched by the ductwork into a metallic warble: “Don’t think about running; once the upgrade window closes, even breathing gets billed by the beat.” The voice was raspy, permanently hoarse from years of inhaling machine oil and disinfectant; each word struck like a hammer on rusted iron, lingering long in the hallway.", "7‑0423’s pupils contracted; a new prompt floated on his retina: **“Memory correction program initiation countdown 3.2 seconds”** (the forced rewrite automatically launched when the system detects memory integrity FAIL). A whiff of burnt insulation varnish rode the cold air into his lungs, like a rusted file dragging back and forth in his trachea; each inhalation brought a faint sting. The intracranial nano‑array released a weak current the moment the countdown lit, crawling along the cranial sutures, delivering a numb, tingling pain as if countless tiny ants gnawed at his meninges. He clenched his teeth, a low muffled groan escaping his throat; blood droplets fell again, striking the cold floor, their sound swallowed the instant the countdown hit zero, leaving only a faint reverberation trembling on the metal walls.", "“Signature verified.” Vera’s voice rang from the projection ring, cold and sharp as a blade across glass. “Auditor ‘Zero’ confirmed; window extended to 72 hours.” The red countdown vanished, replaced by a line of pale blue **“Temporary authorization – pending regulatory review,”** the characters glowing faintly in the air like a fragile pass. Old Chen eased the cart backward; the axle’s “clack” faded toward the corridor’s end, leaving only the cleaning robot’s low growl and the intermittent coughs of distant test subjects—an ominous cadence continuously hammering against 7‑0423’s heart."]}, {"index": 3, "title": "Chapter 3: Midpoint · Cognitive Reversal: Sunlight Was Never Priced", "words": 6982, "paragraphs": ["The centrifuge cut into high‑frequency mode precisely at **14:00**, its low hum trembling against the eardrums like a taut steel wire; the atomizing nozzles simultaneously sprayed a faint sweet‑oil mist, mingling the stale scent of machine oil and disinfectant that dissolved in the nasal cavity, coating the deep throat like a thin film of oil. The 12 °C cold chain of the ankle metal ring tightened with each heartbeat, and the Retinal Blood‑Red Debt Stream rolled over in millisecond compound interest, the red light staining the pupils into two seething molten pools.", "Zero's command traveled via fiber‑optic pulse through the orbital station “Apollo‑9”, arriving at the implanted Neural Monitoring and Read/Write Interface (NMI) within 2 ms and triggering the “High‑Intensity Neural Reorganization” protocol . Subject 7‑0423 felt the intracranial electrode array heat up instantly, his neural potential forced up to +320 µV, the cortisol curve spiking sharply on the monitoring panel. He had to locate the memory node flagged as “anomalous” within a read/write latency window not exceeding 2 ms, while driving his heart rate, respiration, and cortisol into the “compliance” band—any deviation would be judged a violation, instantly triggering a Debt Reset and an escalation of experiment intensity.", "The second 0.7 s upgrade window pre‑embedded by Old Chen in the cleaning robot’s firmware arrived on schedule. The indicator light on the hidden panel flashed once and then went out. Subject 7‑0423 seized this slit perceivable only to machines, projecting his consciousness into the deep storage array. Data flowed like liquid metal into his retina; the Retinal Blood‑Red Debt Stream was momentarily overwritten by a single complete frame: his sister Lin Wei running in sunlight, her skirt lifting a warm breeze, no sweet‑oil scent in the Respiratory Lubrication System, no billing projection on the retina—only golden specks dancing on her lashes. The name “Lin Wei” from the memory returned no record in the Central Clearing Core (CCC) archives; the system instantly flagged it as a “data anomaly” and launched the highest‑level purge program, a 12 h countdown (starting at 14:00, ending at 02:00 the next morning).", "The purge alarm vibrated the entire experiment module with low‑frequency pulses; the centrifuge’s RPM plummeted, white noise pierced by a sharp electric whine. Subject 7‑0423’s nails tore into his palm again, dark red beads sliding down three parallel scars—pain becoming the sole controllable anchor. He sensed his neural bundles being peeled away layer by layer by an invisible hand; memory fragments slid like shards of glass in his consciousness, each carrying an unpriced temperature. The retinal blood‑red debt stream began to flicker, shifting from deep crimson to dark violet, the countdown digits dancing before his eyes as if the entire Debt Tower were holding its breath.", "From the corridor’s far end came Old Chen’s hoarse whisper, mingled with the metallic meshing of the cleaning robot’s tracks: “Machines don’t speak; people must.” The sound slipped through the pipe’s oil film, boring into the eardrum with the tremor of a rusted iron plate struck by a heavy hammer. He clenched his teeth, a muffled grunt escaping his throat as blood droplets struck the cold floor, the sound swallowed the instant the countdown hit zero. The Global Physiological Monitoring Network pushed an “Emergency Purge Protocol Initiated” to all test subjects; the retinal debt stream instantly turned a deep‑red flash, the countdown ticking on—the next 0.7 s window becoming the sole hope.", "Light refracted cold, hard stripes across the metal walls; dust motes drifted slowly in the beams. Subject 7‑0423 felt the implanted heat‑sink at the back of his neck vibrate faintly, temperature climbing from the icy touch at his fingertips to a scalding heat; sweat traced his cheekbones, mingling with the blood on his palm into a dark‑red streak. He forced his breathing to sixteen cycles per minute; the amplitude of his thoracic excursions was captured in real time by the monitoring panel—any overshoot would be flagged as “emotional fluctuation”, prompting a higher‑intensity electric stimulus. Old Chen’s silhouette swayed in the track noise, a worn multi‑tool wrench in hand, fingertips scraping metal with a faint “clink”, as if performing a final calibration for the imminent window.", "The countdown digits pulsed on the retina in millisecond increments, each flash like a hammer blow to the heart. Deep in his consciousness, Subject 7‑0423 magnified that sunlight frame again and again, trying to pry a sliver of uncoded warmth from the edge of the light specks—something that was neither data nor ledger nor any quantifiable metric, merely the warm breeze that rose when his sister’s skirt billowed, a reminder that the world once held things beyond pricing. The system’s purge program acted like an invisible scalpel, peeling away his neural circuits layer by layer; each cut accompanied by a piercing high‑frequency whine, as if reminding him: here, memory is debt, even sunlight accrues interest by the second.", "Old Chen’s voice threaded through the conduit once more, this time with a barely perceptible tremor: “Don’t let them take that light.” The wrench tip pressed against the hidden panel’s edge; the metal‑on‑metal friction amplified in the silence, like an ancient oath. Subject 7‑0423 felt the blood at his fingertips grow faintly warm; pain was no longer merely an anchor but fuel for resistance. He focused his consciousness on the impending 0.7 s window, a hunter locking onto prey’s breath, awaiting that instant’s cleft—the only gap that could let sunlight survive beyond the ledger.", "The overhead lamp tubes buzzed, the air laced with ozone and the metallic tang of coolant; each breath felt like inhaling a handful of fine iron filings. Old Chen’s wrench tip was already seated in the panel’s lock slot, knuckles blanched, tendons drawn taut as a thin wire; the track noise ceased, only the cleaning robot’s internal hydraulic pump exhaling low, like a beast holding its breath in darkness. Subject 7‑0423’s retinal digits still burned in millisecond steps, red light staining his pupils into two seething molten pools; the final three digits of the countdown trembled on the edge of the 0.7 s window.", "He heard Old Chen draw a sharp, brief breath, then a command whispered to the limit: “Hold your breath; don’t let the monitor catch any fluctuation.” The voice carried the tremor of a rusted iron plate struck by a hammer, and an unspoken plea. Subject 7‑0423 did not turn; he merely smeared the blood on his fingertips across the cold metal wall, using that thin film of warmth to keep his palm’s tactile sense alert. The heat‑sink at his neck shuddered violently, heat surging up his spine; sweat and blood met on his cheekbones, forming a dark‑red trace that ran down his chin, dropping onto the corridor dust and stirring an almost imperceptible vortex.", "The countdown’s last digit jumped from 3 to 2, then to 1; red light exploded on the retina into a blurred flare. In that 0.7 s cleft, Old Chen wrenched the wrench hard; the panel emitted a dull “clack” as the hidden maintenance hatch slid open, revealing a narrow black slit. Cold wind laced with the acrid scent of lubricant rushed in; Subject 7‑0423 sensed an uncoded coolness penetrate his nostrils—the temperature once left by sunlight, now seeping into his nerve endings in a way that could not be quantified.", "“Go in.” Old Chen’s voice no longer trembled; it became a rusted key turning in the lock of his long‑numbed will. Subject 7‑0423 did not hesitate; he bent his knees, shoulder slamming against the hatch’s edge, metal ribs tearing his uniform—pain like sparks igniting dry tinder, instantly lighting the sole fuel of rebellion within him. The moment the countdown hit zero, the Global Physiological Monitoring Network’s red glare snapped off; the corridor fell back into dead silence, leaving only the two ragged breaths and the fading echo of tracks, weaving in the dark an unpriced vow—at the far end of the hidden passage, the server core’s indicator lit up in the 0.7 s window; if the write failed, the global purge would lock irreversibly after 12 h."]}, {"index": 4, "title": "Chapter 4: Darkest Hour: The Purge Countdown", "words": 7399, "paragraphs": ["A sudden burst of ozone ripped through the ventilation ducts, mingling with the acrid scent of laser‑cut alloy melting, and rode the corridor’s slight negative pressure straight into the nostrils; the metal ring around the ankle still clamped the flesh at 12 °C, each heartbeat driving the chill like fine ice chains toward the fingertips. Emergency lights on the bulkhead strobed a sickly white, slicing Old Chen’s silhouette behind the concealed panel into a series of broken shadows; the light patches jumped across the metal wall like a swarm of out‑of‑focus fireflies struggling in darkness.", "Subject 7‑0423 crouched at the junction of the habitation pod and the corridor, three parallel scars on his palm oozing dark red, a shallow groove already scored into the metal wall by his fingernails, metal shavings lodged like fine sand beneath the nail beds; every breath carried the metallic tang of rust. He harnessed the pain peaks to force his heart‑rate, cortisol, and neural potential into the “compliance” band—any deviation would be flagged as a violation, instantly triggering a Debt Reset and an escalation of experiment intensity. The Global Physiological Monitoring Network streamed his every breath, every micro‑tremor in real time; red‑green indicator lights flickered at the edge of his retina, like countless microscopic judges delivering silent verdicts, the points dancing in his vision as if dissecting his consciousness frame by frame.", "Old Chen’s left‑ear data port pulsed a faint glow, its oxidation layer catching a dull amber under the emergency lights, like a copper badge corroded by time. He tapped the panel in a low voice: “The window’s still open—don’t let the monitors catch a fluctuation.” The words trembled like a rusted iron plate struck by a heavy hammer, echoing in the metal ducts with a barely perceptible rasp. 7‑0423 didn’t turn; he merely smeared the blood on his fingertips across the cold bulkhead, using that thin layer of warmth to keep his palm’s tactile sense sharp. The heat‑sink fins at his nape vibrated violently, a surge of heat climbing his spine; sweat and blood met at the cheekbones, forming dark‑red traces that fell from his chin, stirring an almost imperceptible vortex of dust that glittered like a miniature nebula in the dim light.", "The final countdown digit ticked from 3 to 2 to 1; crimson light exploded across his retina into blurred spots fringed with a pale violet halo. The System Upgrade Window lasted only 0.7 s—the sole interval permitting unauthorized data writes. 7‑0423 seized this machine‑perceivable fissure and thrust his consciousness into the deep storage array. Data flowed like liquid metal into his vision; the retinal blood‑red debt stream was instantly overwritten by a single complete frame: his sister Lin Wei running in sunlight, her skirt lifting a warm breeze, no sweet oil scent in the respiratory lubrication system, no billing projection on the retina—only golden motes dancing on her lashes, sunlight turning her hair tips amber. The name “Lin Wei” returned no entry in the Central Clearing Core (CCC) archives, only a blank record silently mocking from the database, like a shredded contract page drifting in the wind.", "In that 0.7 s gap Old Chen wrenched the wrench; the panel gave a dull “clack” and a narrow black slit of a hidden maintenance passage slid open. A cold gust laced with lubricant oil hit his face; 7‑0423 felt an uncoded coolness infiltrate his nasal passages—the temperature once left by sunlight, now seeping into his nerve endings in an unquantifiable way, as if a slender fiber were laying new pathways inside him.", "“Go.” Old Chen’s voice no longer trembled; it sounded like a rusted key turning in a long‑numb lock cylinder. 7‑0423 didn’t hesitate—knees bent, shoulder slammed against the passage edge, metal ribs tearing his uniform, pain flaring like sparks into dry tinder, instantly igniting the sole fuel of rebellion within him. The moment the countdown hit zero, the Global Monitoring red lights snapped out, the corridor plunged back into dead silence, leaving only the two ragged breaths and the fading rumble of tracks, weaving an unpriced oath that echoed in every weld of the pipe.", "The passage walls were sheathed in a thin film of condensation; fingertips brushing it produced a soft “pop,” droplets bursting into microscopic mist that instantly crystallized into fine ice on the pads. 7‑0423’s knee struck a protruding pipe brace, bone on metal delivering a dull thud; the shock raced up the femur to the brain, yet it sharpened his awareness of every muscle contraction, as if each impact rewrote the ownership of his body. Old Chen led, his backpack toolkit swaying—wrench, fiber‑optic splicer, worn insulating tape clattering in the tight space, a fragmented metallic elegy reverberating off the walls.", "“Don’t rush, there’s a pressure valve ahead,” Old Chen glanced back, his faceplate’s reflective strip flashing a thin blue line in the weak emergency glow. “Turn it, the pressure will push us into the next maintenance shaft.” His tone was steady, yet each syllable carried an unmistakable command.", "7‑0423 nodded, a rasping acknowledgment scraping his dry throat. Fingertips found the icy threads; the ridges of his prints etched shallow marks on the metal, a faint vibration traveling up the nerves to his forearm. He forced the valve open; a long‑suppressed hiss erupted, high‑pressure gas jetting out, shrouding the passage in white fog and dropping the temperature to near‑zero. Cold needles pierced skin, pores snapped shut, breathing grew labored, lungs whistling in the frost—but he didn’t stop, boots slipping on the thin frost with a faint “squeak,” each step wresting an inch of freedom forward.", "Ahead, the maintenance shaft hatch was sealed by a heavy alloy grille, its welds blooming dark‑red rust like old wounds weeping in darkness. Old Chen drew the laser cutter; a violet‑blue beam traced a thin line through the gloom, its hiss like nocturnal insects gnawing wood; the cutter’s ozone scent instantly saturated the cramped space, tightening throats. Molten metal dripped from the grille’s edge, striking the floor with a crisp “ding” before the airflow scattered them into tiny glowing specks flickering in the mist.", "“Hurry, the window’s down to 0.3 s.” Old Chen’s words were chopped by the gust, yet each syllable hammered against the eardrum like a strike on metal.", "7‑0423 surged into the shaft, his body compressed like a spring in the narrow vertical well; limbs scraped a screeching chorus against the walls, leaving shallow white marks on elbows and knees—as if every squeeze recorded the price of escape. Wall sensors pulsed a faint green, logging each passage; the green formed a faint halo at the edge of his retina, like a ghostly fingerprint confirming identity in the night. Each spinal impact emitted a soft “click,” reminding him this flesh still belonged to him, every tremor confirming the reality of existence.", "The shaft’s bottom hatch slid open at the last instant, revealing a dim blue glow and rows of silent server racks. Fans droned low, mixing heat with ozone; warmth condensed into a thin sheen of sweat on his palms, fingertips tingling with a faint current upon touching metal. 7‑0423 hit the deck, knee striking the metal floor again, pain arcing through him like electricity; his gaze locked on the console ahead, indicator lights blinking at a near‑heartbeat rhythm, red and green alternating as if timing the final decision.", "The holo‑screen flashed “Purge Complete 99%” in blood‑red characters; the countdown digits flickered wildly between 0.7 s and 0.6 s, edges ghosting from the refresh rate like an ECG trembling at the limit. Old Chen’s fingers flew, keystrokes faster than a pulse; each press accompanied a faint electrical whisper, mechanical switches clicking crisply under his tips, leaving brief light trails on the keys.", "“Upload complete,” Old Chen barked, breath ragged, a barely perceptible curve lifting the corner of his mouth, a flash of unspoken relief in his eyes. “Data packet written to core redundancy; monitors can’t roll back.”", "7‑0423 felt the retinal crimson debt stream freeze; the Millisecond Compound Interest Debt Ledger halted its climb, the interest needle locked in amber time. He inhaled a lungful of ozone‑cold air, his chest expanding for the first time in ages, as though a gas named “freedom” were slowly filling the alveoli, carrying a faint metallic sweetness that spread through his throat.", "On the distant monitoring wall, Regulator 9‑A “Vera”’s right‑eye iris projection ring flashed blue—she pressed the delayed‑report key. The blue wink died instantly, like a dead star marking this unrecorded gap, leaving a silent blind spot in the endless data torrent."]}, {"index": 5, "title": "Chapter 5: Broadcast Storm: The Unpriced Name", "words": 6742, "paragraphs": ["Subject 7-0423 crouched before the server array, three parallel scars on his palm oozing dark red, his fingernails having gouged a shallow groove in the metal bulkhead. The heat‑sink fins at the back of his neck trembled violently; a surge of heat crawled up his spine, sweat and blood mingling on his cheekbones into a single dark‑red trace that fell into the corridor dust, stirring an almost imperceptible vortex of particles. The air was thick with the sweet‑oil scent of the respiratory lubricant, blended with the low hum of the distant fusion reactors—a gray vocal cord pressed against the eardrum; the hiss of coolant flowing through pipes sounded like some colossal beast breathing slowly in the dark.", "He used the pain peak to force his heart rate, cortisol, and neural potential into the “compliance” band; any deviation would be flagged as a violation and instantly trigger a Debt Reset and an escalation of experiment intensity . The Global Physiological Monitoring Network streamed his every breath, every micro‑tremor in real time; the data flow was adjudicated millisecond by millisecond in the Central Clearing Core (CCC), a crimson judgment cursor flashing across the screen as if pricing each heartbeat.", "Old Chen’s figure flickered behind a concealed panel, the worn data port behind his left ear pulsing faintly, the metal housing’s edges etched with fine rust lines from years of service. He whispered into the panel, “The window’s still open—don’t let the monitors catch the fluctuation.” His voice carried the tremor of a rusted iron plate struck by a heavy hammer, each word echoing like Morse code reverberating through metal conduits. Subject 7-0423 did not turn; he merely smeared the blood on his fingertips across the cold bulkhead, using that thin layer of warmth to keep his tactile sense sharp; his fingertip brushed a slightly raised screw head, the hard cold confirming he still teetered on the edge of reality.", "In the same millisecond, Regulator 9‑A \"Vera\"’s right‑eye iris projection ring glowed a ghostly blue; the audit terminal flashed “Data Integrity Check – Failed.” Her fingertip hovered over the report key, breathing rapid, fingertip blanching, nails leaving shallow impressions on the keycap edge; she finally chose to delay the report, buying the broadcast a sliver of life. The red warning on the screen pulsed like a heartbeat, each flash contracting her pupils a fraction.", "Auditor \"Zero\"’s facial projection band displayed the blood‑red text “Cleansing Complete 99%” which suddenly jittered; the compute core exhibited a 0.4 s fluctuation—coolant pressure dropped 12 %, three fusion reactors’ output power jittered 0.3 % in the same frame. Zero’s synthetic voice reverberated through the corridor, cold as a blade scraping metal: “Unauthorized write marked; preparing to initiate Overwrite Protocol. Individual purge required; estimated 14 h.” The voice held no temperature, yet it set off a subtle resonance in the metal walls, as if the entire station shuddered at the proclamation.", "Subject 7-0419 \"Xiao Liu\"’s neck pulse ring overloaded, high‑frequency vibration piercing the monitoring blind spot, like an invisible string plucking the neural rhythm of every test subject aboard. All subjects’ Retinal Blood‑Red Debt Streams simultaneously displayed the three characters “Lin Wei,” accompanied by an unpriced sensory fragment of sunlight: temperature 23 °C, the mingled scent of grass and dust, the slight give of soft earth beneath the soles—synchronised within 0.7 s. The system classified this as a “Data Integrity Anomaly” and triggered a network‑wide “Data Circuit Breaker ”: write locks engaged, debt ledgers frozen, experiments forcibly paused for 6 h.", "The breaker countdown rolled in faint blue digits on every retina: **5:59:59…** The compound‑interest pointer of debt was suspended in temporal amber; Free Citizen dividends halted; the Memory/Emotion Archive and Trading Platform could not settle. The Corridor Cleaning Robot 07‑T’s friction sound remained even, yet beneath it a barely perceptible low‑frequency resonance akin to a heartbeat emerged—the first synchronized neural cadence of thousands of test subjects. A trace of ozone drifted in the air, mingling with the sweet lubricant, as if the whole station held its breath awaiting the next beat.", "Subject 7-0423 felt the bleeding at his palm scars cease; a strange warmth rose at his fingertips, like sunlight through glass on skin. He no longer gouged his palm with his nails; instead he lightly traced the cold touch of the Ankle Metal Ring, confirming that the sense of reality now stemmed from the shared memory, not self‑inflicted injury. The Retinal Blood‑Red Debt Stream resumed scrolling; each line of numbers now bore a faint “★” at its end—an undefined metadata bit the system had never defined. That star flickered in the sea of crimson digits, a punctuation mark not permitted to exist, yet stubbornly occupying the tail of every line.", "Vera’s voice came from behind the audit terminal, hoarse, fingertip still poised over the report key, the ghostly blue halo in her eyes narrowing slightly: “Data Integrity Check passed, but… this marker isn’t in the rules.” Her gaze swept the screen full of stars, brows furrowing as she weighed whether to launch an emergency protocol; her fingertip brushed the keycap, emitting the faintest plastic‑on‑plastic friction.", "On Zero’s projection band, the blood‑red “Cleansing Complete 100%” froze on the final frame, the red characters’ edges frayed with a halo of dark‑gray noise. Its synthetic voice echoed again: “Unauthorized write marked; preparing to initiate Overwrite Protocol. Individual purge required; estimated 14 h.” The tone remained flat, yet a faint metallic reverberation rose at the corridor’s far end.", "Subject 7-0423 did not turn; he merely replayed in his mind the temperature, scent, and tactile feel of that sunlight memory, his fingertip grazing the metal ring’s edge, sensing a weak current travel from fingertip to palm. He spoke low toward the corridor depths: “As long as ★ remains, the debt will forever be one decimal point less.” The words were quiet, yet they set off a subtle resonance on the metal walls, as if each syllable etched a mark for the unpriced name.", "Xiao Liu’s pulse ring accelerated sharply, emitting a piercing whine before settling back to calm. On the Retinal Blood‑Red Debt Stream, the solitary “★” began to spread laterally at a visible rate, like rows of micro‑light creeping through the crimson numbers—foreshadowing that the next breaker would be detonated preemptively at the data layer. A monitoring light at the corridor’s end flickered once; Corridor Cleaning Robot 07‑T’s tires rolled over dust, lifting a string of tiny dust vortices, as if applauding the unfinished contest.", "The distant fusion reactors continued their low moan; coolant flowing through pipes sounded like a slumbering leviathan breathing. Subject 7-0423 lifted his head, gazing through the transparent bulkhead at the starfield; starlight pierced the porthole mist, scattering faint specks across the metal deck. He felt the star on his palm warming faintly, as if each heartbeat drew him nearer to that unpriced name. At the corridor’s far end, Old Chen’s silhouette had vanished behind the hidden panel, leaving only an unfinished series of taps echoing like a promise in the metal conduits. Vera’s fingertip finally left the report key; the screen’s “Check Passed” green light illuminated, yet a lone unrecorded “★” blinked in the corner. Zero’s projection froze on the final frame, the dark‑gray noise at the red text’s edges expanding, as if poised to swallow the entire cleansing declaration.", "In this steel forest woven from data and debt, the only thing unquantified remains that sliver of sunlight’s warmth, the scent of grass, the soft give of earth—and the shared, undefined star flickering on every test subject’s retina, at the end of every debt ledger."]}, {"index": 6, "title": "Chapter 6: New Normal: Breathing in the Cracks", "words": 7432, "paragraphs": ["The moment the circuit breaker lifted, the white noise in the corridor collapsed into a single low hum, as if some colossal heart deep in the ducts had just completed a contraction. Subject 7‑0423 remained crouched against the metal wall, fingertips pressed to the cold ring on his ankle; the 12 °C touch crawled up his calf, reminding him that his body was still being quantified. The retinal blood‑red debt stream kept scrolling, principal climbing with millisecond compound interest, and the faint “★” at the end of each line still pulsed, like a heartbeat‑synchronised punctuation marking a remainder that no interest rate could devour.", "Regulator 9‑A \"Vera\"’s audit terminal glowed a pale blue half a meter away, her fingertip hovering over the submit key, the cursor blinking. Her right iris projection ring flashed blue once—only once—then went dark, as if she had abandoned the report entirely. Fan blades sliced faint blue traces in the draft, reflected on her weary eyelids; her lips moved, voice swallowed by the fan whirr. Her breath whistled through the metal grille, each inhalation carrying the sweet‑oily scent of lubricant mixed with ozone, as though she were inhaling some unnameable fuel.", "Maintenance Worker \"Old Chen\"’s data port behind his left ear still flickered; his fingertips rested on its edge, whispering a string of checksum codes, gray‑white metal dust lodged under his nails. Cleaning Robot 07‑T rolled over the dust, raising minute vortices; the friction sound carried an extremely faint, heartbeat‑like low‑frequency resonance—the first synchronized neural rhythm of thousands of test subjects. The robot’s magnetic levitation coils emitted a dull hum, like a deep geological fault shifting slowly.", "Subject 7‑0419 \"Xiao Liu\"’s neck pulse ring let out a sharp “screech,” then fell silent. He glanced at his wrist timer; the digits jumped in 0.03 s, the metal surface under his fingertips still retaining the residual warmth of a sunlight memory, a thin oil film on cold alloy. His Adam’s apple bobbed as he swallowed the condensed‑water taste permeating the corridor, a flavor laced with faint rust and the cloying sweetness of synthetic nutrient paste, leaving him oddly sated.", "Auditor \"Zero\"’s facial projection lit up, the blood‑red “Cleaning Complete 100%” frozen on the final frame, red characters edged with dark‑gray noise. The synthetic voice, cold as a blade scraping metal: “ Coverage Protocol ready, countdown 3 minutes.” The sound wave reflected off the metal walls, pressing Subject 7‑0423’s eardrums. Zero’s pupils held only flowing code, reflecting the flashing red warning lights at the corridor’s far end. Every line of scrolling code was accompanied by a faint electrical hiss, as if the entire corridor were holding its breath for the imminent protocol switch.", "Subject 7‑0423 raised his hand; fingertips still held the sunlight’s after‑warmth. He lowered his gaze to confirm the ankle ring, the ledger scrolling, the ★ blinking, compound interest accruing each second, yet that star seemed rooted in the ledger, feeding on every heartbeat. He closed his eyes, letting the retinal red flow form a film behind his lids; his heartbeat and the corridor’s low‑frequency resonance slowly synced, the sweet‑oily scent of the respiratory lubrication system blending with metallic chill into a strange equilibrium. His fingertips brushed the ring’s edge, feeling a weak current seep through skin into marrow, as though an ancient ritual were completing in silence.", "The cleaning robot at the corridor’s end kept rolling, its even friction sound now revealing the faint low‑frequency resonance more clearly, like a crack breathing, like a new normal slowly, steadfastly expanding. The sensor array behind the robot blinked green; each sweep left a faint blue data trail in the air, as if drawing an invisible map for the coming “ Coverage Protocol.”", "Regulator 9‑A \"Vera\" finally pressed her fingertip; the terminal emitted a soft “beep,” the blue ring collapsing to a point then extinguishing. She did not turn back, merely pressed the back of her hand against the cold alloy wall, fingertips sensing the pulse of coolant flowing within. Her voice was low, hoarse: “Three minutes—enough to keep the ★ in the ledger.” Before the words fell, the red warning lights at the far end accelerated their flashing, as if answering her vow.", "Maintenance Worker \"Old Chen\" finished the checksum; the instant his fingertip left the port, a pale green light band formed on his retina, then vanished. He exhaled, the breath condensing into tiny ice crystals that drifted away. He whispered to the empty corridor: “Sync complete, neural rhythm locked.” Flat tone, yet carrying an undeniable resolve.", "Subject 7‑0419 \"Xiao Liu\"’s wrist timer hit zero, the screen flashing “00:00:00.” He lifted his head, gaze piercing through Zero’s projection to the massive alloy door ahead. A sliver of light seeped from the seam, accompanied by the low roar of hydraulic pumps; the door slowly opened, revealing a deeper network of pipes. He felt the metal surface in his palm surge in temperature, as if the sunlight memory had finally found an exit.", "Auditor \"Zero\"’s synthetic voice sounded again, still icy but with an almost imperceptible tremor: “ Coverage Protocol initiated, global data write‑in in progress.” As the words fell, dense ribbons of data light ignited along both corridor walls, blue‑green interweaving like countless rivers of light surging through veins. Each river’s flow carried a faint electromagnetic hum, vibrating the bones of everyone standing in the corridor.", "Subject 7‑0423 felt the ankle ring’s temperature rise several degrees in an instant; the ledger’s compound‑interest acceleration abruptly slowed, the ★’s blink frequency matching his heartbeat perfectly. He opened his eyes; the retinal red stream no longer stabbed, but softened into a thin amber film covering the periphery of vision. The sweet‑oily scent of the respiratory lubrication system remained thick, yet no longer suffocating—more like an ancient fuel driving every cell forward.", "Cleaning Robot 07‑T’s tires left shallow tracks on the metal floor, like cracks slowly growing on a steel skin. Its sensor array continued emitting the low‑frequency resonance, the sound reverberating through the corridor as if the entire facility were breathing at a single frequency. Each tire rotation was accompanied by a faint metal‑fatigue creak, reminding all present that every inch of steel here bears the weight of time.", "Regulator 9‑A \"Vera\" kept her hand on the wall; fingertips sensed the internal fluid pulse quickening, like a massive heart accelerating. Her eyes flickered between the pale blue dots and the red warning lights, finally settling on Subject 7‑0423’s profile. She said nothing, only curled her fingers slightly, tracing an ultra‑fine line on the metal surface, as if signing a silent contract.", "Maintenance Worker \"Old Chen\"’s left‑ear port blinked green continuously now. He glanced at his nail beds; the gray‑white dust had been drawn by weak static into tiny clusters. He raised his head, gaze passing through Zero’s projection to the alloy door now fully open. Beyond the darkness, countless fiber‑optic strands stretched like blood vessels, pulsing with data.", "Subject 7‑0419 \"Xiao Liu\"’s pulse ring emitted a low “hum,” then steadied. He pressed the wrist timer against his chest, feeling the faint vibration transmitted through the metal casing, perfectly matching the corridor’s low‑frequency resonance. He closed his eyes, letting his consciousness slide with the data stream into deeper network layers, where ledger, interest, ★, cold ring, sunlight warmth all collapsed into a single binary rhythm.", "Auditor \"Zero\"’s facial projection froze on the final frame; the red “Cleaning Complete 100%” faded, dissolving into flowing code that vanished into the retinal red stream. The synthetic voice spoke one last time, steady: “ Coverage Protocol effective, global synchronization complete.” The sound wave reflected off the metal walls, becoming a thin acoustic pressure that nudged everyone in the corridor forward.", "Subject 7‑0423 lifted his head, gaze passing Regulator 9‑A \"Vera\", Maintenance Worker \"Old Chen\", Subject 7‑0419 \"Xiao Liu\", and settling on the blank space where Zero’s projection had vanished. The cleaning robot at the corridor’s end kept rolling, its even friction sound now carrying the ever‑clearer low‑frequency resonance, like a crack breathing, like a new normal slowly, steadfastly expanding.", "“We’re still here,” Subject 7‑0423 said softly, the voice reflecting off the metal walls as a thin acoustic pressure that pushed the robot onward, the countdown’s red numbers peeling away second by second on his retina."]}]};
const L = {"cover_label": "Title Page & Synopsis", "unit": " chars", "by": "By ", "meta_sep": " | ~", "intro_title": "About this book", "prev": "← Previous", "next": "Next →", "start": "Start Reading →", "ch_prefix": "Chapter ", "ch_mid": " | ", "theme_dark": "☀️ Light Mode", "theme_light": "🌓 Dark Mode"};
let currentIndex = -1; // -1 = title page / synopsis
let fontSize = 17;

function renderSidebar() {
    const list = document.getElementById("chapterList");
    list.innerHTML = `<li class="chapter-item ${currentIndex === -1 ? 'active' : ''}" onclick="goToChapter(-1)">
        <span>📖 ${L.cover_label}</span>
    </li>`;
    book.chapters.forEach((ch, idx) => {
        const li = document.createElement("li");
        li.className = "chapter-item" + (currentIndex === idx ? " active" : "");
        li.innerHTML = `<span>${ch.title}</span><span class="ch-words">${ch.words}${L.unit}</span>`;
        li.onclick = () => goToChapter(idx);
        list.appendChild(li);
    });
}

function renderContent() {
    const wrapper = document.getElementById("articleWrapper");
    const label = document.getElementById("currentChLabel");
    if (currentIndex === -1) {
        label.innerText = L.cover_label;
        wrapper.innerHTML = `
            <div class="article-header">
                <h1>${book.title}</h1>
                <div class="article-meta">${L.by}${book.author}${L.meta_sep}${book.total_words.toLocaleString()}${L.unit}</div>
            </div>
            <div class="intro-box">
                <h3 style="margin-bottom:12px;color:var(--accent);">${L.intro_title}</h3>
                <div style="white-space: pre-wrap; line-height:1.75;">${book.description}</div>
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" disabled>${L.prev}</button>
                <button class="nav-btn" onclick="goToChapter(0)">${L.start}</button>
            </div>
        `;
    } else {
        const ch = book.chapters[currentIndex];
        label.innerText = ch.title;
        const pTags = ch.paragraphs.map(p => `<p style="font-size: ${fontSize}px;">${p}</p>`).join("");
        wrapper.innerHTML = `
            <div class="article-header">
                <h1>${ch.title}</h1>
                <div class="article-meta">${L.ch_prefix}${ch.index}${L.ch_mid}${ch.words}${L.unit}</div>
            </div>
            <div class="article-body">
                ${pTags}
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" onclick="goToChapter(currentIndex - 1)">${L.prev}</button>
                <button class="nav-btn" onclick="goToChapter(currentIndex + 1)" ${currentIndex >= book.chapters.length - 1 ? 'disabled' : ''}>${L.next}</button>
            </div>
        `;
    }
    document.getElementById("content-container").scrollTop = 0;
}

function goToChapter(idx) {
    if (idx < -1 || idx >= book.chapters.length) return;
    currentIndex = idx;
    renderSidebar();
    renderContent();
}

function toggleTheme() {
    const current = document.documentElement.getAttribute("data-theme");
    const next = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    document.getElementById("themeBtn").innerText = next === "dark" ? L.theme_dark : L.theme_light;
}

function changeFontSize(delta) {
    fontSize = Math.max(14, Math.min(26, fontSize + delta));
    const paras = document.querySelectorAll(".article-body p");
    paras.forEach(p => p.style.fontSize = fontSize + "px");
}

renderSidebar();
renderContent();
</script>
