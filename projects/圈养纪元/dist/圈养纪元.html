const book = {"title": "圈养纪元", "author": "FutureTxt AI Writer", "description": "劳动已被机械与算法彻底替代，人类社会分化为奴隶主、自由民与被圈养的实验体。奴隶主以“信用借贷货币”将生存必需品、医疗植入、甚至呼吸空气计价，利息按秒复利，债务永不可偿。实验体从出生即被编号、植入监测芯片，承担药物代谢、神经映射、行为诱导等全谱系实验。主角 7‑0423 在一次常规神经重组实验中，意外读取到一段不属于任何档案的童年记忆——那里有妹妹的笑声、未被标价的阳光、以及一个被系统抹除的名字。记忆的存在本身违背了“实验体无过往”的铁律，主角被迫在每一次例行检测、每一餐营养膏、每一次债务账单投影中，寻找这套秩序的物理缝隙。", "total_words": 14198, "chapters": [{"index": 1, "title": "第1章唤醒的淡甜油味", "words": 2206, "paragraphs": ["呼吸管道润滑剂的淡甜油味在舱壁微震中渗出，混着走廊清洁机器人滚动的均匀摩擦声钻进耳膜。脚踝金属环贴肤的低温触感像一条细冰链，每一次心跳都提醒着编号 7‑0423 的归属。视网膜上血红的债务账单数字流已在 0.8 米处清晰可辨，本金 1.2 × 10⁵ CR 以毫秒为单位复利滚动，利息像呼吸一样源源不断，永远还不清。", "强制服药后舌根残留的苦涩仍在口腔回荡，早餐营养膏的金属质感在牙齿间发出细微“咔嚓”，像在咀嚼一份未签字的合同。实验室白噪音与离心机低鸣从通风口渗入，裹住整个债塔底层，夹杂陈旧铁锈味，每一次吸气都像吞咽生锈铁屑。", "7‑0423 睁眼，左手掌心三道平行疤痕在微光下泛暗红，指甲边缘渗血微颤。他习惯用指甲划破掌心确认真实，疼痛是唯一不被账本量化的坐标。指尖触到冰冷合金壁，留下细微凹痕，像对封闭循环的无声抗议。", "“账单唤醒”低频振动贴着胸骨传来，配合淡甜油味完成每日 06:00 生理闹钟。心率被锁死 14 次/分，任何波动即判违规，全域生理监控已把皮质醇、神经电位上传中央清算核心。振动在胸腔回荡，迫使呼吸与系统同步，连喉头软骨都在微颤。", "例行神经重组实验启动，纳米碳管电极阵列两毫秒内刺入神经，像冰针划过意识。数据流在视网膜闪烁，突然闯入非授权片段：阳光洒草地，妹妹林未的笑声像未被标价的琥珀，温暖且无法计算。大脑皮层瞬间痉挛，掌心疤痕渗血加剧，血珠顺指缝滑落，在金属地板凝成暗红点，发出极轻“啪嗒”，被走廊低频嗡鸣吞没。", "视网膜账单多出一行异常标记——", "**记忆完整性校验：FAIL**", "系统预留的 0.7 秒固件窗口早已错过，只能等待下一周期。空气弥漫消毒剂与机油混合腥甜，每一次呼吸像吞液态铅。走廊尽头清洁机器人停下，红灯投出细长光带，映照 7‑0423 紧绷下颌。他未动，只让指尖在掌心伤口反复摩挲，感受疼痛将意识钉在当下，防止记忆被抹平。", "远处囚徒 9‑317 低沉咳嗽夹杂管道泄压嘶嘶，仿佛整座债塔屏息。咳嗽里带生锈铁腥，肺叶似被金属粉尘磨损。7‑0423 瞳孔微缩，**FAIL** 仍在闪烁，仿佛有东西从管道深处爬上，带着冰冷逻辑与无声判决。", "他闭眼，试图抓住阳光与笑声，只触到冰冷电极与滚动红数字。系统升级窗口像无形网悄然收紧，等待下一次脉冲将偏离标记为“违规”的神经信号一并抹除。", "舱壁微震加剧，淡甜油味愈浓。7‑0423 握紧拳，指甲再陷掌心，血珠滴落声在寂静中格外清晰——那是他唯一能听见的、属于自己的节拍。", "血珠落地，清洁机器人骤启，履带碾出尖锐“滋滋”，红光扫过墙面将影子拉长。机械臂喷出细雾，消毒剂与机油气味刺鼻如生锈铁屑塞入鼻腔。他未躲，任雾气裹住指尖，微细液滴在伤口嘶嘶作响，像无数蚂蚁啃噬神经末梢。", "“检测到异常神经波动，编号 7‑0423，启动强制同步。” 声音从舱壁定向扬声器渗出，低沉无温度，每字伴随微弱电流震颤贴着胸骨、颞骨、牙根。心率仍锁 14 次，皮质醇曲线已现尖峰，红色警告条在视网膜闪烁，仿佛要劈开视野。", "他咬紧后槽牙，喉头闷响，指甲再陷掌心，血顺指缝渗出，滴在冰冷合金上“啪嗒”清脆。疼痛像钉子钉住意识，阻止阳光与笑声被数据流吞噬。视网膜数字流加速，**记忆完整性校验：FAIL** 依旧刺眼，后跟新标记——", "**同步进度：12%**", "走廊另一端，9‑317 咳嗽再炸，夹杂管道泄压嘶嘶，像生锈风箱绝望呼吸。他蜷缩阴影，左臂缠磨损导管，末端绿光微闪，浑浊却锐利的眼神牵动嘲弄弧度：“系统又要‘升级’？真当我们是可随意格式化的硬盘？”", "7‑0423 未回头，指尖在掌心血圈缓慢画圈，每圈像给古老计时齿轮上油。淡甜油味愈浓，舱壁微震顺脊椎爬上后脑，牙齿咬合发出细微咔哒。", "倒计时归零，红光骤熄，走廊陷绝对黑暗，只剩定向扬声器低频脉冲像心跳敲击金属板。7‑0423 闭眼，指尖仍在掌心画圈，血珠滴落声在寂静中格外清晰——唯一属于他的节拍。", "低频脉冲震得金属板微麻，血珠在掌心冷凝成细冰珠，每一次滴落在寂静里炸出“啪嗒”，回荡在清洁机器人履带声中。机器人未停，红光熄灭后仍沿预设轨迹滑行，喷头喷出消毒雾凝成淡白雾帘，铁锈与苦杏仁气味钻入鼻腔，顺气管滑至肺叶，每呼吸都像吞金属屑。", "“同步进度：27%” 在视网膜闪烁，红色警告条如裂痕劈开视野。心率仍锁 14 次，皮质醇曲线爬成尖峰，太阳穴血管跳动欲撑裂颅骨。他未睁眼，指尖继续在伤口画圈，阻止记忆被吞噬。", "9‑317 咳嗽再炸，声音沙哑穿透低频脉冲：“系统还要‘升级’？真当我们是随时可格式化的硬盘？”", "7‑0423 指尖在血圈顿了顿，指甲再陷肉，鲜红渗出滴在合金上“啪嗒”。疼痛钉住意识，视网膜数字流加速，**FAIL** 依旧，后跟——", "**同步进度：41%**", "低频脉冲骤加快，舱壁微震变剧烈震颤，牙齿咬合发出咔哒。清洁机器人履带再碾“滋滋”，红光重亮，影子再被拉长。机械臂喷更浓细雾，气味刺鼻如生锈铁屑。他未躲，任雾气裹指尖，微滴在伤口嘶嘶，像蚂蚁啃噬神经。", "“检测到异常神经波动，编号 7‑0423，启动强制同步。” 声音再从舱壁渗出，低沉无温度，每字伴电流震颤贴胸骨、颞骨、牙根。心率仍锁 14 次，皮质醇曲线现尖峰，红警条闪烁欲劈视野。", "**记忆完整性校验：FAIL** 仍在视网膜上灼烧，心脏猛地失拍，呼吸在喉头卡住，视野瞬间破碎成无数锯齿光斑，像被强光撕裂的底片。每一次心跳都在胸腔里砸出沉闷的闷响，血液在指尖凝成冰珠，滴落声在绝对寂静里显得刺耳而孤独——那是系统无法抹去的、属于他的最后节拍。"]}, {"index": 2, "title": "第2章碎片互换的摩擦声", "words": 2425, "paragraphs": ["走廊尽头的自动清洁机器人 07‑T 履带在合金地面上滚过，发出均匀的低频摩擦声，像一根绷紧的钢丝在寂静里被反复拨动。雾化喷头每隔十五米喷出一缕淡甜的润滑油雾，混着机油与消毒水的陈腐气息钻进鼻腔，在喉头留下一层薄薄的油膜，顺着呼吸道滑向肺叶，带来一丝微酸的金属味。脚踝的金属环贴着皮肤，恒定的 12 °C 冷意随心跳传至指尖，提醒着编号 7‑0423 的归属。视网膜上血红的债务数字流在 0.8 米 处滚动，本金 1.2 × 10⁵ CR 以毫秒复利膨胀，红色的流体般吞噬着最后的体力储备。舌根仍残留着强制服药后的苦涩，早餐营养膏的金属质感在齿间发出细微的“咔嚓”声，仿佛在咀嚼一份不可名状的合同。远处离心机的低鸣与实验室白噪音交织，像一层灰色薄膜贴着耳膜震动，连空气都带着微弱的振动频率，令每一次呼吸都似在对着某种无形的节拍计数。", "老陈推着维护手推车，车轮在同一条轨道上发出比清洁机器人更沉闷的“咯吱”声，金属轴承在寒冷的合金缝隙里发出细碎的金属疲劳音。他左耳后的数据接口微弱闪烁，指尖在车把上轻敲两下——这是与 7‑0423 约定的“窗口开启”信号，敲击的力度恰好能让接口感应到微弱的电容变化而不触发报警。升级窗口每 30 天仅开放 0.7 秒，唯一允许未授权写入的时段；老陈在清洁机器人固件里预埋了这个缝隙，靠“仅执行预设清单”的规则掩盖额外指令，固件日志里只会留下一行普通的“环境扫描完成”。他低头瞥了一眼车底隐藏面板上闪烁的绿灯，指尖在冰冷的面板边缘摩挲，感受到微弱的电流顺着指尖爬上手背，随即推车继续前行，车轮在轨道上留下一串浅浅的压痕。", "7‑0423 沿墙行进，脚踝环随步频微微收紧，金属扣件在皮肤上留下淡淡压痕，每一次收缩都像在提醒他：身体不再属于自己。左手掌心三道平行疤痕在微光下泛着暗红，指甲边缘渗出的血珠在神经痉挛前兆中微颤，血珠滑过指缝时带起一丝凉意。视网膜账单的血红数字流在他瞳孔中央滚动，利息增量每秒肉眼可见地膨胀，红色的流体仿佛要冲破视网膜的薄膜。他不敢抬头看监管员薇拉的投影环，那右眼虹膜植入的微型环在暗光下泛蓝，正实时审核数据完整性，任何超过 2 毫秒 的读写延迟都会触发“数据完整性校验”并锁定该体 24 小时。走廊两侧壁灯投出细长影子，像无数无形的手在丈量他的每一步，影子的边缘在金属地板上微微颤动，仿佛随时会合拢。", "小六（7‑0419）靠在拐角护栏上，颈部脉冲环随心率频闪，微弱蓝光在金属表面折射出破碎棱镜，光斑在墙面上跳跃，像一段被切碎的密码。他的语言中枢已萎缩，只能用脚踝环敲击节奏：两短一长、停顿、再三短——这是监控盲区约定的“碎片互换”语法，每拍对应一段加密记忆索引，敲击声在走廊里回荡，夹杂着清洁机器人履带的低吼。老陈在手推车底部隐藏面板按下确认键，屏幕跳出绿字：**“固件窗口 0.7 秒 已就绪”**，字符在暗淡背景光里显得刺眼，像钥匙刚插入生锈锁孔，金属锁芯发出一声细微的“咔哒”。", "0.7 秒过去如一次心跳。纳米碳管电极阵列在 7‑0423 颅内完成写入，妹妹林未那段未被标价的阳光笑声被封装成指针，写入实验体公共缓存边缘区块。写入瞬间，掌心疤痕再次渗血，血珠顺指缝滑落，在金属地板上凝成暗红点，发出极轻“滴”声，被走廊回声放大成仪式般的敲击，仿佛每一滴都在为某种契约盖章。视网膜闪过红字：**“未授权写入尝试 – 待复核”**。薇拉的投影环蓝光骤亮，指尖在虚拟键盘敲下“标记 7‑0423 为高风险体”，屏幕弹出：**“审批需审计官‘零’签名，倒计时 48 小时”**，数字在空气中闪烁，像悬在头顶的沙漏，沙粒一颗颗落入深渊。", "清洁机器人 07‑T 微微停顿，履带发出一声比平常更低沉的摩擦音，金属与金属咬合的迟疑在狭长走廊回荡，带着不祥共鸣，仿佛整条走廊的空气都被这声响拉紧。老陈瞥一眼机器人日志，屏幕多出一条 **“环境干扰 – 物理阻挡”** 记录，将被自动上报中央清算核心，日志的时间戳精确到微秒，闪烁着冷冰冰的蓝光。他低声对 7‑0423 说：“机器不说话，人得说话。”语气平淡，却在回声里显得沉重，仿佛每字都在为即将到来的审判加码，声音在金属壁面上折射出细微的颤动。", "7‑0423 没回头，只让指甲再陷入掌心，血珠滴落声在寂静中格外清晰——那是他唯一能听见的、属于自己的节拍，每一滴都像在敲击一块生锈的铁板。走廊尽头自动门滑开，冷气裹挟着淡甜油味扑面而来，视网膜账单的血红数字流依旧滚动，利息毫不留情地吞噬每一秒。他知道，下一个 0.7 秒 窗口将在 30 天后到来，而在这之前，薇拉的复核、零的签名、以及随时可能触发的“数据熔断”协议都在倒计时中等待。远处另一名实验体的咳嗽声再次响起，夹杂一声低沉的笑，笑声被管道回声拉长，变成金属质感的颤音：“别想着跑，升级窗口一关，连呼吸都得按频率算账。”声音沙哑，带着长年吸入机油与消毒剂留下的永久哑音，每字像敲击生锈铁板，在走廊里久久不散。", "7‑0423 瞳孔微缩，视网膜浮现新提示：**“记忆修正程序启动倒计时 3.2 秒”**（系统检测到记忆完整性 FAIL 时自动启动的强制重写程序）。冷气里夹杂一丝烧焦绝缘漆味，顺鼻腔钻进肺叶，像生锈锉刀在气管来回拉扯，每一次吸气都伴随细微的刺痛。颅内纳米阵列在倒计时亮起瞬间释放微弱电流，沿颅骨缝隙爬行，带来酥麻刺痛，仿佛无数细小蚂蚁在脑膜啃噬。他咬紧牙关，喉头发出低沉闷哼，血珠再次滴落，砸在冰冷地板上，声响在倒计时归零那一刻被吞没，只留下一串微弱的回响在金属墙面上震颤。", "薇拉的指尖悬在“延迟上报”键上方，投影环的蓝光在她瞳孔里折射出两道细长的光刃。走廊尽头的红灯突然亮起，尖锐的警报切开履带的低吼，外部巡检无人机的螺旋桨声已贴近金属墙面。她没有按下确认，而是缓缓收回手，屏幕上的“临时授权 – 待监管复核”依旧微弱闪烁，像一张随时会被撕碎的通行证。老陈推着手推车缓缓后退，轮轴咯吱声在走廊尽头渐行渐远，只留下清洁机器人履带的低吼和远处实验体断续的咳嗽，像某种不祥节拍，持续敲打着 7‑0423 的心脏。"]}, {"index": 3, "title": "第3章中点·认知反转：阳光从未被定价", "words": 2595, "paragraphs": ["离心机在 **14:00** 精准切入高频模式，低鸣像一根被拉紧的钢丝贴着耳膜震颤；雾化喷头同步喷出一股淡甜油雾，混着机油与消毒水的陈腐气息在鼻腔里化开，像一层薄油膜粘在喉咙深处。脚踝金属环的 12 °C 冰链随着每一次心跳收紧，视网膜前的血红数字流以毫秒复利滚动，红光把瞳孔染成两汪沸腾的熔池。金属地板在离心力下微微隆起，每一次转动都让膝盖骨与钛合金支架发出细碎的“咔嗒”声，震动顺着脊椎爬向后脑，像一只无形的手在敲打颅骨内壁。空气中悬浮的微尘在强光束里被甩成螺旋，折射出冷冽的蓝白光晕，仿佛整个舱段都被剥离了温度，只剩下数据的纯粹重量。", "零的指令以光纤脉冲穿过轨道站“阿波罗‑9”，在 2 ms 内抵达植入式神经接口，触发“高强度神经重组”协议。7‑0423 感到颅内电极阵列瞬间升温，神经电位被强行拉高至 +320 µV，皮质醇曲线在监控面板上尖锐上扬。他必须在读写延迟不超过 2 ms 的窗口里，定位那段被系统标记为“异常”的记忆节点，同时把心率、呼吸、皮质醇压入“顺从”区间——任何偏离都会被判定为违规，立即触发债务重置与实验强度升级。指尖贴在冷却液管道上，感受着液氮流经的微振，试图用触觉锚住飞速流逝的毫秒；呼吸被迫压缩成机械化的节拍，每一次吸气都像在吞咽一口液态铁，呼气则带走一丝未被记账的灼热。", "老陈预埋的 0.7 s 固件缝隙早已错过，只能等待下一周期；他利用这唯一的机会，在意识深处把那帧阳光画面反复放大，试图从光斑边缘抠出一点未被编码的温度——那不是数据，不是账单，也不是任何可量化的指标，只是妹妹林未裙摆扬起时带过的暖风，曾让他相信世界上还有不被定价的东西。系统的清洗程序像一把无形的手术刀，层层剥离他的神经回路，每一次切割都伴随刺耳的高频啸叫，仿佛在提醒：在这里，记忆也是负债，连阳光都要按秒计息。他闭上眼，让视网膜上的红字在黑暗中燃烧，试图在每一帧残像里捕捉那一抹金黄的边缘，哪怕只有一微秒的未加密余温。", "清洗警报以低频脉冲震动整个实验舱，离心机转速骤降，白噪音里夹杂着尖锐的电流啸叫。7‑0423 的指甲再次划破掌心，暗红血珠顺着三道平行疤痕滑落，疼痛成为唯一可控的锚点。视网膜账单的血红数字流开始闪烁，由深红转为暗紫，倒计时的数字在眼前跳动，仿佛整个债塔都在屏息等待。监控面板同步弹出“清洗进度 18%、剩余 9 小时 48 分”，红色进度条在金属墙面上投出冷硬的条纹。墙面上的冷凝水珠顺着条纹滑落，发出细微的“滴——滴”声，每一声都像在为倒计时敲响丧钟。", "走廊尽头传来老陈沙哑的低语，混着清洁机器人履带的金属齿轮咬合声：“机器不说话，人得说话。”声音穿过管道的油膜，钻进耳膜，带着生锈铁板被重锤敲击的颤栗。他咬紧牙关，喉头发出一声闷哼，血珠砸在冰冷地板上，声响在倒计时继续滴答的那一刻被吞没。全域生理监控向所有实验体推送“紧急清洗协议启动”，视网膜账单数字流瞬间变为深红闪烁，倒计时继续滴答。老陈的影子在履带声中晃动，手里握着一把磨损的多功能扳手，指尖在金属表面划过，发出细微的“铮”响，仿佛在为即将到来的缝隙做最后的校准。他一边调整扳手角度，一边低声念着一串只有自己听得懂的代码，指尖在油污里留下暗灰的痕迹。", "灯光在金属墙面上折射出冷硬的条纹，空气中浮动的粉尘在光柱里缓缓旋转。7‑0423 感到颈后植入的散热片微微振动，温度从指尖传来的冰凉迅速爬升至灼热，汗珠顺着颧骨滑落，与掌心的血混合成一道暗红的痕迹。他强迫自己将呼吸调整至每分钟十六次，胸腔起伏的幅度被监控面板实时捕捉，任何超标都会被标记为“情绪波动”，随之而来的将是更高强度的电刺激。老陈的影子在履带声中晃动，手里握着一把磨损的多功能扳手，指尖在金属表面划过，发出细微的“铮”响，仿佛在为即将到来的缝隙做最后的校准。扳手的齿口磨损得只剩下一道浅槽，每一次转动都伴随金属疲劳的低吟，像是在诉说这台机器曾经历过多少次偷渡。", "倒计时的数字在视网膜上以毫秒为单位跳动，每一次闪烁都像心脏被重锤敲击。老陈的声音再次穿过管道，这次带着一丝不易察觉的颤抖：“别让它们把那段光拿走。”扳手尖端抵在隐藏面板边缘，金属与金属的摩擦声在寂静中被放大，像某种古老的誓言。7‑0423 感到指尖的血液微微发烫，疼痛不再只是锚点，而是反抗的燃料。他把掌心贴在冰冷的舱壁上，感受金属的微震顺着掌纹爬上手臂，试图把那股未被定价的温度锁进骨髓。", "灯管在头顶嗡嗡作响，空气里夹杂着臭氧与冷却液的金属腥味，每一次呼吸都像吸入一把细碎的铁屑。老陈的扳手尖端已经卡进面板锁槽，指节泛白，肌腱绷紧成一根细弦；履带声停了，只有清洁机器人内部的液压泵在低沉地吐气，像巨兽在黑暗中屏息。7‑0423 的视网膜数字还在以毫秒为单位燃烧，红光把瞳孔染成两汪沸腾的熔池。他听见远处管道里水流冲刷的闷响，混着微弱的电磁嗡鸣，仿佛整个空间站都在为这 0.7 s 屏住呼吸。", "他听见老陈喉头发出一声短促的吸气，随即是一句压低到极限的命令：“按住呼吸，别让监控抓到波动。”声音里夹着生锈铁板被重锤敲击的颤栗，也夹着不敢说出口的乞求。7‑0423 没有回头，只是把指尖的血渍抹在冰冷的金属壁上，利用那层薄薄的温度让掌心的触觉保持清醒。颈后散热片剧烈震颤，热流顺着脊椎攀升，汗珠与血珠在颧骨交汇，化作一道暗红的痕迹顺着下巴滴落，砸在走廊的灰尘里，激起一阵微不可查的尘埃漩涡。每一滴落地的声音都被放大，像是在倒计时的静默里敲响一记鼓点。", "在仅存的 0.7 s 固件缝隙里，老陈猛地扭动扳手，面板发出一声沉闷的“咔嗒”，隐藏的维修通道滑开一条狭窄的黑缝。冷风裹着润滑油的腥气扑面而来，7‑0423 感觉到一股未被编码的凉意钻进鼻腔，那是阳光曾经留下的温度，正以一种不可量化的方式渗入他的神经末梢。通道内壁布满细微的铆钉痕迹，指尖划过时能感觉到每一道凹槽的冷硬，仿佛在触摸某种被遗忘的誓言。", "“进去。”老陈的声音不再颤抖，变成了一把生锈的钥匙，插进他早已麻木的意志锁芯。7‑0423 没有犹豫，膝盖一弯，肩膀撞开通道边缘，金属棱角划破制服，疼痛像火星溅入干柴，瞬间点燃了他体内唯一的反抗燃料。倒计时归零的那一刻，全域监控的红光骤熄，走廊重新陷入死寂，只剩下两人急促的呼吸与履带远去的回响，在黑暗里交织成一段未被标价的誓言——隐藏通道尽头，服务器核心的指示灯在 0.7 s 窗口亮起，若写入失败，全域清洗将在 12 h 后不可逆锁定。"]}, {"index": 4, "title": "第4章至暗时刻：清洗倒计时", "words": 2235, "paragraphs": ["通风管道里突然炸开一股臭氧味，夹杂着激光切割器熔化合金时的焦糊气，顺着走廊的微负压直冲鼻腔；脚踝的金属环依旧以 12 °C 的低温咬住皮肉，每一次心跳都把冷意像细冰链一样推向指尖。墙面上的应急灯闪烁出惨白的频闪，把老陈藏在隐藏面板后的轮廓切成一段段断续的影子，光斑在金属壁上跳跃，像一群失焦的萤火虫在阴影里挣扎。", "7‑0423 蹲在居住舱与走廊交界，掌心三道平行疤痕渗出暗红，指甲已在金属壁上划出一道浅沟，金属屑像细沙般嵌入指甲缝，每一次呼吸都带着铁锈的金属味。他利用疼痛峰值把心率、皮质醇、神经电位压入“顺从”区间，任何偏离都会被判定为违规，立即触发债务重置与实验强度升级。全域生理监控网络实时上传着他的每一次呼吸、每一次微颤，红绿指示灯在视网膜边缘闪烁，像无数微型裁判在无声宣判。", "老陈的左耳后数据接口闪烁微光，氧化层在应急灯下泛着暗黄，像一块被岁月腐蚀的铜牌。他低声敲击面板：“窗口还在，别让监控抓到波动。”声音像生锈铁板被重锤敲击的颤栗，在金属管道里回荡，夹杂着一丝不易察觉的沙哑。7‑0423 没回头，只把指尖血渍抹在冰冷金属壁上，借那层薄温度保持掌心触觉清醒。颈后散热片剧烈震颤，热流顺脊椎爬升，汗珠与血珠在颧骨交汇，化作暗红痕迹顺下巴滴落，激起微不可查的尘埃漩涡，在微光里闪烁如微型星云。", "在仅 0.7 秒的固件升级窗口里，他将妹妹林未奔跑的记忆写入核心冗余区。", "就在这瞬间，老陈猛地扭动扳手，面板发出沉闷“咔嗒”，隐藏维修通道滑开一条狭窄黑缝。冷风裹着润滑油腥气扑面而来，7‑0423 感到一股未被编码的凉意钻进鼻腔，那是阳光曾经留下的温度，正以不可量化的方式渗入神经末梢，像一根细细的光纤在他体内铺设新的回路。", "“进去。”老陈声音不再颤抖，像把生锈钥匙插进早已麻木的意志锁芯。7‑0423 不犹豫，膝盖一弯，肩膀撞开通道边缘，金属棱角划破制服，疼痛像火星溅入干柴，瞬间点燃体内唯一反抗燃料。倒计时归零那一刻，全域监控红光骤熄，走廊重陷死寂，只剩两人急促呼吸与履带远去回响，在黑暗里交织成一段未被标价的誓言，回荡在管道的每一个焊缝里。", "通道内壁覆盖薄薄凝露，手指触碰发出细微“啪嗒”，水珠在指腹炸开成微小的冷雾，瞬间在指尖凝成细细的冰晶。7‑0423 膝盖磕在凸起管道支架，骨与金属碰撞发出沉闷闷响，疼痛沿股骨直冲大脑，却让他更清晰感知每寸肌肉收缩，仿佛每一次撞击都在重写身体的所有权。老陈走在前，背包工具包晃动，扳手、光纤熔接器、磨损绝缘胶带在狭窄空间碰撞，奏出断续金属碰撞乐章，金属声在管道里来回折射，像一首无词的挽歌。", "“别急，前面有个压力阀，”老陈回头，面罩反光片在微弱应急灯下闪烁，边缘划出一道细细的蓝光，“拧开它，气压能把我们推到下一层维修井。”他的语气平稳，却在每个音节里藏着不容置疑的命令感。", "7‑0423 点头，喉咙沙哑应答，声带在干燥空气中摩擦出沙砾般的质感。指尖摸到冰冷螺纹，指腹纹路在金属上刻下浅痕，指尖传来的微振动顺着神经爬上手臂。用力一拧，阀门长久嘶鸣，高压气体喷薄而出，卷起白雾，瞬间将通道温度拉至接近零度。冷气像无数细针刺入皮肤，毛孔瞬间闭合，呼吸更困难，肺叶在冰冷中发出细微的哨音，但他未停，脚步在雾气中踉跄前行，靴底在薄霜上发出“吱呀”微响，每一步都在向前索取一寸自由。", "前方维修井口被厚重合金栅栏封死，焊点泛起暗红锈斑，像陈旧伤口在黑暗中渗血。老陈抽出激光切割器，蓝紫光束在黑暗中划出细长轨迹，嘶嘶声像夜间昆虫啃木，切割头散发的臭氧味瞬间充斥狭窄空间，刺鼻得让人喉头发紧。高温熔化栅栏边缘，金属熔滴落地发出清脆“叮”，随即被气流吹散，化作细小的亮点在雾气中闪烁。", "“快，时间所剩无几。”老陈声音被气流切成碎片，却穿透耳膜，每一个字都像敲在金属上的锤击。", "7‑0423 冲进井口，身体在狭窄竖井像被压缩弹簧，四肢摩擦出刺耳音，金属壁上的凹槽在他肘部、膝盖留下一道道浅白印记，仿佛每一次挤压都在刻录逃亡的代价。井壁传感器闪烁微弱绿光，记录每一次通过，绿光在视网膜边缘形成一圈微弱光环，像幽灵的指纹在暗夜里确认身份。脊椎每次撞击发出细微“咔哒”，提醒他这具身体仍属于自己，每一次震颤都在确认存在的实感。", "井底舱门最后一刻滑开，露出幽蓝灯光与排排静默服务器机柜。风扇低沉旋转，散发热气与臭氧混合气味，热气在掌心凝结成薄汗，指尖触到金属表面时传来微弱的电流感。7‑0423 落地瞬间膝盖再撞金属地板，疼痛如电流窜过全身，目光死死盯住前方控制台，指示灯以一种近乎心跳的频率闪烁，红绿交替像在为最后的抉择计时。", "全息屏幕闪烁“清洗进度 61%，剩余 4 小时 12 分”血红字样，数字在屏幕边缘微微抖动，像心电图在极限边缘颤动。老陈手指飞舞，敲击节奏比心跳还快，每次按键伴随微弱电流声，机械轴在指尖下发出清脆“咔哒”，指尖的微光在键面上留下短暂的轨迹。", "“上传完成，”老陈低喝，呼吸急促，嘴角扬起一抹不易察觉的弧度，眼中闪过一丝未曾言说的释然，“数据包已写入核心冗余区，监控无法回滚。”", "7‑0423 感觉视网膜红色数字流突然静止，债务账单复利停止攀升，利率指针像被冻结在时间琥珀里。他深吸一口混合臭氧与冷气，胸腔第一次许久感到微微膨胀，仿佛某种名为“自由”的气体正缓慢填充肺叶，带着淡淡的金属甜味在喉头蔓延。", "远处监控大屏上，薇拉的右眼虹膜投影环蓝光一闪——她按下了延迟上报键。蓝光随即熄灭，像一颗熄灭的星标记着这段未被记录的缝隙，在无尽的数据洪流中留下一处无声的盲区。"]}, {"index": 5, "title": "第5章广播风暴：未标价的名字", "words": 2188, "paragraphs": ["7‑0423 蹲在服务器阵列前，掌心三道平行疤痕渗出暗红，指甲已在金属壁上划出一道浅沟。颈后散热片剧烈震颤，热流顺着脊椎爬升，汗珠与血珠在颧骨交汇，化作一道暗红痕迹滴落在走廊灰尘里，激起微不可查的尘埃漩涡。空气中弥漫着润滑剂的淡甜油味，夹杂着远处聚变反应堆低沉的嗡鸣，像一条灰色声带贴着耳膜震动；冷却液在管道里流动的嘶嘶声则像某种巨兽在黑暗中缓慢吞吐。", "他利用疼痛峰值把心率、皮质醇、神经电位压入“顺从”区间，任何偏离都会被判定为违规，立即触发债务重置与实验强度升级。全域生理监控网络实时上传着他的每一次呼吸、每一次微颤，数据流在中央清算核心被毫秒级裁决，红色的判定光标在屏幕上一闪而过，仿佛在为每一次心跳标价。", "老陈的身影在隐藏面板后若隐若现，左耳后磨损的数据接口闪烁微光，金属外壳边缘已被岁月磨出细细的锈纹。他低声对着面板敲击：“窗口还在，别让监控抓到波动。”声音夹杂着生锈铁板被重锤敲击的颤栗，每一个字都像是在金属管道里回荡的摩斯密码。7‑0423 没有回头，只是把指尖的血渍抹在冰冷金属壁上，利用那层薄薄的温度让掌心触觉保持清醒；指腹触到壁面微微凸起的螺丝帽，冷硬的触感让他确认自己仍在现实的边缘。", "同一毫秒，监管员薇拉的右眼虹膜投影环泛起幽蓝，审核终端上“数据完整性校验”闪烁“失败”。她的指尖悬在上报键上，呼吸急促，指尖微白，指甲在键帽边缘留下浅浅的压痕；最终选择延迟上报，给广播留出一线生机。屏幕上的红色警告像心跳一样跳动，每一次闪烁都让她的瞳孔微微收缩。", "审计官“零”面部投影带上的血红字样“清洗完成 100%，熔断启动”突然抖动，算力核心出现 0.4 s 波动——冷却液压力骤降 12 %，三座聚变反应堆输出功率同帧抖动 0.3 %。零的合成音在走廊回荡，冷硬如刮过金属板的刀锋：“非授权写入已标记，准备启动覆盖协议。熔断期内逐体冻结。”声音没有温度，却在金属墙面激起细微的共振，仿佛整座站都在为这句宣告颤抖。", "小六颈部的脉冲环骤然过载，高频震动穿透监控盲区，像无形琴弦拨动全舱实验体的神经节律。所有实验体视网膜账单血红数字流同时出现“林未”三字，伴随一段未被定价的阳光感官片段：温度 23 °C、青草与尘土混合的气味、脚底踩到松软泥土的微陷感，仅在早已错过的 0.7 秒固件窗口内完成同步。系统判定为“数据完整性异常”，启动全网“数据熔断”，写入锁定、债务账单冻结、实验强制暂停，持续 6 h。", "熔断倒计时在每个视网膜上以淡蓝数字滚动：**5:59:59…** 债务复利的指针被冻结在时间琥珀里，自由民红利中断，记忆交易平台无法结算。走廊清洁机器人 07‑T 的摩擦声依旧均匀，却在背景里多出一层极微弱的、类似心跳的低频共振——那是成千上万实验体首次同步的神经节奏。空气中浮动着一丝臭氧味，混合着润滑剂的甜腻，仿佛整座站都在屏息等待下一次跳动。", "7‑0423 感到掌心疤痕处不再渗血，指尖传来一股陌生的发热，像阳光透过玻璃落在皮肤上。他不再用指甲划破掌心，而是轻抚脚踝金属环的低温触感，确认真实感来自共享记忆而非自残。视网膜账单重新滚动，每行数字末尾都多出一个微弱的“★”标记——系统未曾定义的元数据位。那颗星号在血红数字海里闪烁，像一个不被允许存在的标点，却固执地占据了每一行末尾。", "薇拉的声音从审核终端后传来，带着沙哑，指尖仍悬在上报键上，眼底的幽蓝光环微微收敛：“数据完整性校验通过，但……这颗标记不在规则里。”她的目光扫过满屏星号，眉头微蹙，似在权衡是否启动紧急协议；指尖在键帽上轻轻摩挲，发出极轻的塑料摩擦声。", "零的面部投影带上，血红的“清洗完成 100%”已在最后一帧卡住，红字边缘泛起一圈暗灰噪点。它的合成音再次回荡：“非授权写入已标记，准备启动覆盖协议。熔断期内逐体冻结。”声音依旧平坦，却在走廊尽头激起一阵微弱的金属回响。", "7‑0423 没有回头，只是把那段阳光记忆的温度、气味、触觉在脑海里再重放一遍，指尖轻抚金属环边缘，感受到一股微弱电流顺着指腹流向掌心。他对着走廊深处低声说：“只要 ★ 还在，债务就永远少一位小数点。”声音低沉，却在金属墙面上引起细微共鸣，仿佛每一个字都在为未被定价的名字刻下印记。", "小六的脉冲环骤然加速，发出一声尖锐啸叫，随即归于平静。视网膜账单上，原本孤立的“★”开始以肉眼可见的频率向左右扩散，像一行行微光在血红数字间蔓延，预示着下一次熔断将在数据层面被提前引爆。走廊尽头的监控灯光闪烁一下，清洁机器人 07‑T 的轮胎碾过灰尘，扬起一串细微尘埃漩涡，仿佛在为这场未完的博弈鼓掌。", "远处的聚变反应堆依旧低鸣，冷却液在管道里流动的声音像一条沉睡巨兽在呼吸。7‑0423 抬起头，透过透明舱壁看向星空，星光穿过舷窗薄雾洒在金属地板上，形成一片片微弱光斑。他感到掌心的星号在微微发热，仿佛每一次心跳都在向那个未被定价的名字靠近。走廊尽头，老陈的身影已消失在隐藏面板后，只留下一串未完成的敲击声，像某种承诺在金属管道里回荡。薇拉的指尖终于离开上报键，屏幕上的“校验通过”绿光亮起，却在角落闪烁着一个未被记录的“★”。零的投影带在最后一帧定格，红字边缘的噪点逐渐扩大，仿佛要吞噬整个清洗完成的宣告。", "在这片被数据与债务编织的钢铁森林里，唯一未被量化的，只有那一抹阳光的温度、青草的气味、泥土的微陷——以及每一个实验体视网膜上、债务账单末尾、共同闪烁的、未被定义的星号。"]}, {"index": 6, "title": "第6章新常态：裂缝里的呼吸", "words": 2549, "paragraphs": ["08:00 熔断刚解除，走廊里的白噪音骤然塌陷成一线低鸣，像某种巨大心脏在管道深处完成一次收缩。7‑0423 仍蹲在金属壁前，指腹贴着脚踝的冷环，12 °C 的触感顺着小腿爬升，提醒他身体仍在被量化。视网膜上血红的账单依旧滚动，本金以毫秒复利攀升，每行末尾那颗微弱的 “★” 仍在跳动，像心跳同步的标点，提示着某种不可被利率吞噬的余量。", "薇拉的审核终端在半米外亮着幽蓝光环，指尖悬在上报键上，光标一跳一跳。她右眼虹膜投影环蓝光一闪——仅一次——随即熄灭，仿佛彻底放弃了上报。风扇叶片在微风中划出淡蓝光痕，映照在她疲惫的眼睑上，嘴唇微动，声音被风扇声吞没。她的呼吸在金属格栅间发出细微哨音，每一次吸气都带着润滑油与臭氧混合的甜腻味道，像是在吸食某种不可名状的燃料。", "老陈左耳后的数据接口仍在微光闪烁，指尖贴在边缘低声念出一串校验码，指甲缝里嵌着灰白金属粉末。清洁机器人 07‑T 轮胎碾过灰尘，扬起细微尘埃漩涡，摩擦声里夹杂着极微弱、类似心跳的低频共振——那是成千上万实验体首次同步的神经节奏。机器人底盘的磁悬浮线圈发出一声沉闷的嗡鸣，像是地下深处的地质断层在缓慢位移。", "小六颈部的脉冲环发出一声尖锐 “啸”，随即归于平静。他低头瞥一眼手腕计时器，数字在 0.03 s 内完成跳变，指尖触到的金属表面仍残留着阳光记忆的余温，像一层薄油膜贴在冰冷合金上。他的喉结上下滚动，吞咽着走廊里弥漫的冷凝水味，那味道夹杂着淡淡的铁锈与某种合成营养液的甜腻，令他感到一阵莫名的饱胀。", "零的面部投影亮起，血红的 “清洗完成 100%” 卡在最后一帧，红字边缘泛着暗灰噪点。合成音冷硬如刮金属板的刀锋：“ 覆盖协议就绪，倒计时 13 分钟。”声波在金属壁面反射，压得 7‑0423 耳膜微紧。零瞳孔里只有流动的代码流，倒映着走廊尽头闪烁的红色警示灯。每一行代码的滚动都伴随着微弱的电流嘶鸣，仿佛整个走廊都在为即将到来的协议切换而屏息。", "7‑0423 抬起手，指尖仍存阳光余温。他低头确认脚踝冷环，账单滚动、★ 闪烁、复利秒级累积，但那颗星标仿佛在账本里生了根，吸着每一次心跳。闭上眼，让视网膜红流在眼睑成膜，心跳与走廊低频共振慢慢同步，呼吸管道的甜腻油味混合金属冷意，构成奇异平衡。他的指尖在冷环边缘轻轻摩挲，感受到微弱的电流顺着皮肤渗入骨髓，像是某种古老的仪式在无声完成。", "走廊尽头的清洁机器人继续滚动，均匀摩擦声里，那极微弱的低频共振愈发清晰，像裂缝在呼吸，像某种新常态正在缓慢、坚定地膨胀。机器人后方的传感器阵列闪烁着绿光，每一次扫过都在空气中留下一串淡蓝的数据尾迹，仿佛在为即将到来的 “ 覆盖协议” 绘制 const L = {"cover_label": "扉页与作品简介", "unit": "字", "by": "作者：", "meta_sep": " | 全书约 ", "intro_title": "作品概念与梗概", "prev": "← 上一章", "next": "下一章 →", "start": "开始阅读第一章 →", "ch_prefix": "第 ", "ch_mid": " 章 | ", "theme_dark": "☀️ 亮色模式", "theme_light": "🌓 暗色模式"};
let currentIndex = -1; // -1 = title page / synopsis
let fontSize = 17;

function renderSidebar() {
    const list = document.getElementById("chapterList");
    list.innerHTML = `<li class="chapter-item ${currentIndex === -1 ? 'active' : ''}" onclick="goToChapter(-1)">
        <span>📖 ${L.cover_label}</span>
    </li>`;
    book.chapters.forEach((ch, idx) => {
        const li = document.createElement("li");
        li.className = "chapter-item" + (currentIndex === idx ? " active" : "");
        li.innerHTML = `<span>${ch.title}</span><span class="ch-words">${ch.words}${L.unit}</span>`;
        li.onclick = () => goToChapter(idx);
        list.appendChild(li);
    });
}

function renderContent() {
    const wrapper = document.getElementById("articleWrapper");
    const label = document.getElementById("currentChLabel");
    if (currentIndex === -1) {
        label.innerText = L.cover_label;
        wrapper.innerHTML = `
            <div class="article-header">
                <h1>${book.title}</h1>
                <div class="article-meta">${L.by}${book.author}${L.meta_sep}${book.total_words.toLocaleString()}${L.unit}</div>
            </div>
            <div class="intro-box">
                <h3 style="margin-bottom:12px;color:var(--accent);">${L.intro_title}</h3>
                <div style="white-space: pre-wrap; line-height:1.75;">${book.description}</div>
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" disabled>${L.prev}</button>
                <button class="nav-btn" onclick="goToChapter(0)">${L.start}</button>
            </div>
        `;
    } else {
        const ch = book.chapters[currentIndex];
        label.innerText = ch.title;
        const pTags = ch.paragraphs.map(p => `<p style="font-size: ${fontSize}px;">${p}</p>`).join("");
        wrapper.innerHTML = `
            <div class="article-header">
                <h1>${ch.title}</h1>
                <div class="article-meta">${L.ch_prefix}${ch.index}${L.ch_mid}${ch.words}${L.unit}</div>
            </div>
            <div class="article-body">
                ${pTags}
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" onclick="goToChapter(currentIndex - 1)">${L.prev}</button>
                <button class="nav-btn" onclick="goToChapter(currentIndex + 1)" ${currentIndex >= book.chapters.length - 1 ? 'disabled' : ''}>${L.next}</button>
            </div>
        `;
    }
    document.getElementById("content-container").scrollTop = 0;
}

function goToChapter(idx) {
    if (idx < -1 || idx >= book.chapters.length) return;
    currentIndex = idx;
    renderSidebar();
    renderContent();
}

function toggleTheme() {
    const current = document.documentElement.getAttribute("data-theme");
    const next = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    document.getElementById("themeBtn").innerText = next === "dark" ? L.theme_dark : L.theme_light;
}

function changeFontSize(delta) {
    fontSize = Math.max(14, Math.min(26, fontSize + delta));
    const paras = document.querySelectorAll(".article-body p");
    paras.forEach(p => p.style.fontSize = fontSize + "px");
}

renderSidebar();
renderContent();
</script>
</body>
</html>
