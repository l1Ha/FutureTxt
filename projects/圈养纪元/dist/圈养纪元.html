const book = {"title": "圈养纪元", "author": "FutureTxt AI Writer", "description": "劳动已被机械与算法彻底替代，人类社会分化为奴隶主、自由民与被圈养的实验体。奴隶主以“信用借贷货币”将生存必需品、医疗植入、甚至呼吸空气计价，利息按秒复利，债务永不可偿。实验体从出生即被编号、植入监测芯片，承担药物代谢、神经映射、行为诱导等全谱系实验。主角 7‑0423 在一次常规神经重组实验中，意外读取到一段不属于任何档案的童年记忆——那里有妹妹的笑声、未被标价的阳光、以及一个被系统抹除的名字。记忆的存在本身违背了“实验体无过往”的铁律，主角被迫在每一次例行检测、每一餐营养膏、每一次债务账单投影中，寻找这套秩序的物理缝隙。", "total_words": 16098, "chapters": [{"index": 1, "title": "第 1 章", "words": 2505, "paragraphs": ["呼吸管道润滑剂的淡甜油味在舱壁微震中渗出，混着走廊清洁机器人滚动的均匀摩擦声钻进耳膜。脚踝金属环贴肤的低温触感像一条细冰链，每一次心跳都提醒着编号 7‑0423 的归属。视网膜上血红的债务账单数字流已在 0.8 米处清晰可辨，本金 1.2 × 10⁵ CR 以毫秒为单位复利滚动，利息像呼吸一样源源不断，永远还不清。", "强制服药后舌根残留的苦涩仍在口腔回荡，早餐营养膏金属质感的咀嚼声在牙齿间发出细微“咔嚓”，像在咀嚼某种不可名状的合同。实验室白噪音与离心机低鸣从通风口渗入，裹住整个债塔底层，夹杂陈旧铁锈味，每一次吸气都像吞咽生锈铁屑。", "7‑0423 睁眼，左手掌心三道平行疤痕在微光下泛暗红，指甲边缘渗血微颤。他习惯用指甲划破掌心确认真实，疼痛是唯一不被账本量化的坐标。指尖触到冰冷合金壁，留下细微凹痕，像对封闭循环的无声抗议。", "“账单唤醒”低频振动贴着胸骨传来，配合淡甜油味完成每日 06:00 生理闹钟。心率被锁死 14 次/分，任何波动即判违规，全域生理监控已把皮质醇、神经电位上传中央清算核心。振动在胸腔回荡，迫使呼吸与系统同步，连喉头软骨都在微颤。", "例行神经重组实验启动，纳米碳管电极阵列两毫秒内刺入神经，像冰针划过意识。数据流在视网膜闪烁，突然闯入非授权片段：阳光洒草地，妹妹林未的笑声像未被标价的琥珀，温暖且无法计算。大脑皮层瞬间痉挛，掌心疤痕渗血加剧，血珠顺指缝滑落，在金属地板凝成暗红点，发出极轻“啪嗒”，被走廊低频嗡鸣吞没。", "视网膜账单多出一行异常标记——", "**记忆完整性校验：FAIL**", "倒计时 0.7 秒，系统升级窗口即将开启。空气弥漫消毒剂与机油混合腥甜，每一次呼吸像吞液态铅。走廊尽头清洁机器人停下，红灯投出细长光带，映照 7‑0423 紧绷下颌。他未动，只让指尖在掌心伤口反复摩挲，感受疼痛将意识钉在当下，防止记忆被抹平。", "远处囚徒 9‑317 低沉咳嗽夹杂管道泄压嘶嘶，仿佛整座债塔屏息。咳嗽里带生锈铁腥，肺叶似被金属粉尘磨损。7‑0423 瞳孔微缩，**FAIL** 仍在闪烁，仿佛有东西从管道深处爬上，带着冰冷逻辑与无声判决。", "他闭眼，试图抓住阳光与笑声，只触到冰冷电极与滚动红数字。系统升级窗口像无形网悄然收紧，等待下一次脉冲将偏离标记为“违规”的神经信号一并抹除。", "倒计时归零，舱壁微震加剧，淡甜油味愈浓。7‑0423 握紧拳，指甲再陷掌心，血珠滴落声在寂静中格外清晰——那是他唯一能听见的、属于自己的节拍。", "血珠落地，清洁机器人骤启，履带碾出尖锐“滋滋”，红光扫过墙面将影子拉长。机械臂喷出细雾，消毒剂与机油气味刺鼻如生锈铁屑塞入鼻腔。他未躲，任雾气裹住指尖，微细液滴在伤口嘶嘶作响，像无数蚂蚁啃噬神经末梢。", "“检测到异常神经波动，编号 7‑0423，启动强制同步。” 声音从舱壁定向扬声器渗出，低沉无温度，每字伴随微弱电流震颤贴着胸骨、颞骨、牙根。心率仍锁 14 次，皮质醇曲线已现尖峰，红色警告条在视网膜闪烁，仿佛要劈开视野。", "他咬紧后槽牙，喉头闷响，指甲再陷掌心，血顺指缝渗出，滴在冰冷合金上“啪嗒”清脆。疼痛像钉子钉住意识，阻止阳光与笑声被数据流吞噬。视网蜂数字流加速，**记忆完整性校验：FAIL** 依旧刺眼，后跟新标记——", "**同步进度：12%**", "走廊另一端，9‑317 咳嗽再炸，夹杂管道泄压嘶嘶，像生锈风箱绝望呼吸。他蜷缩阴影，左臂缠磨损导管，末端绿光微闪，浑浊却锐利的眼神牵动嘲弄弧度：“系统又要‘升级’？真当我们是可随意格式化的硬盘？”", "7‑0423 未回头，指尖在掌心血圈缓慢画圈，每圈像给古老计时齿轮上油。淡甜油味愈浓，舱壁微震顺脊椎爬上后脑，牙齿咬合发出细微咔哒。", "倒计时归零，红光骤熄，走廊陷绝对黑暗，只剩定向扬声器低频脉冲像心跳敲击金属板。7‑0423 闭眼，指尖仍在掌心画圈，血珠滴落声在寂静中格外清晰——唯一属于他的节拍。", "黑暗里低频脉冲震得金属板微麻，血珠在掌心冷凝成细冰珠，每一次滴落在寂静里炸出“啪嗒”，回荡在清洁机器人履带声中。机器人未停，红光熄灭后仍沿预设轨迹滑行，喷头喷出消毒雾凝成淡白雾帘，铁锈与苦杏仁气味钻入鼻腔，顺气管滑至肺叶，每呼吸都像吞金属屑。", "“同步进度：27%” 在视网膜闪烁，红色警告条如裂痕劈开视野。心率仍锁 14 次，皮质醇曲线爬成尖峰，太阳穴血管跳动欲撑裂颅骨。他未睁眼，指尖继续在伤口画圈，阻止记忆被吞噬。", "9‑317 咳嗽再炸，声音沙哑穿透低频脉冲：“系统还要‘升级’？真当我们是随时可格式化的硬盘？”", "7‑0423 指尖在血圈顿了顿，指甲再陷肉，鲜红渗出滴在合金上“啪嗒”。疼痛钉住意识，视网膜数字流加速，**FAIL** 依旧，后跟——", "**同步进度：41%**", "低频脉冲骤加快，舱壁微震变剧烈震颤，牙齿咬合发出咔哒。清洁机器人履带再碾“滋滋”，红光重亮，影子再被拉长。机械臂喷更浓细雾，气味刺鼻如生锈铁屑。他未躲，任雾气裹指尖，微滴在伤口嘶嘶，像蚂蚁啃噬神经。", "“检测到异常神经波动，编号 7‑0423，启动强制同步。” 声音再从舱壁渗出，低沉无温度，每字伴电流震颤贴胸骨、颞骨、牙根。心率仍锁 14 次，皮质醇曲线现尖峰，红警条闪烁欲劈视野。", "黑暗中，低频脉冲震得金属板微麻，血珠在掌心冷凝成冰珠，每滴落在寂静里炸出清脆“啪嗒”，回荡在机器人履带声里。机器人未停，红光熄灭后仍滑行，消毒雾凝白帘，铁锈苦杏仁气钻入鼻腔，顺气管至肺叶，每呼吸如吞金属屑。", "“同步进度：27%” 闪烁，红警条劈视野。心率锁 14 次，皮质醇尖峰，太阳穴血管跳动欲裂颅。他未睁眼，指尖继续画圈，阻止记忆被吞噬。", "9‑317 咳嗽再炸，沙哑穿透脉冲：“系统还要‘升级’？真当我们是随时可格式化的硬盘？”", "7‑0423 指尖在血圈顿住，指甲再陷肉，鲜红滴合金“啪嗒”。疼痛钉住意识，视网膜数字流加速，**FAIL** 依旧，后跟——", "**同步进度：41%**", "低频脉冲再加快，舱壁震颤剧烈，牙齿咔哒。清洁机器人履带“滋滋”，红光重亮，影子拉长。机械臂喷更浓雾，气味刺鼻。他未躲，任雾气裹指尖，微滴嘶嘶啃噬神经。", "“检测到异常神经波动，编号 7‑0423，启动强制同步。” 声音低沉无温度，每字伴电流震颤贴胸骨、颞骨、牙根。心率锁 14 次，皮质醇尖峰，红警条闪烁欲劈视野。"]}, {"index": 2, "title": "第2章碎片互换的摩擦声", "words": 2878, "paragraphs": ["走廊自动清洁机器人 07‑T 的履带在合金地面上滚动，发出均匀的摩擦声（约 38 dB），像一根细长的金属弦在晨间的静气里被反复拨动。呼吸管道润滑剂的淡甜油味随雾化喷头每隔十五米释放一次，顺着通风管道钻进鼻腔，带着一丝工业合成脂的甜腻，混合着机油与消毒水的陈旧气息，仿佛一层薄薄的油膜贴在喉咙深处。脚踝金属环贴肤的低温触感（约 12 °C）像一条细细的冰链，每一次心跳都提醒着编号 7‑0423 的归属。视网膜上血红的债务账单数字流在 0.8 m 处清晰可辨，本金 1.2 × 10⁵ CR 以毫秒为单位复利滚动，利率 0.00012 %/s在毫秒间把数字推向更深的红。强制服药后舌根残留的苦涩后味仍在口腔里回荡，早餐营养膏金属质感的咀嚼阻力（1.8 N·mm）在牙齿间发出细微的“咔嚓”声，像是在咀嚼某种不可名状的合同。实验室白噪音与离心机低鸣交织的背景音从通风口渗入，仿佛一层永不停歇的灰色薄膜包裹住整个债塔中层，连空气都带着微弱的振动频率。", "老陈推着一台维护用的手推车，车轮在同一条轨道上发出比清洁机器人更沉闷的滚动声，金属轮辐与地面的微细凹槽碰撞出断续的“咯吱”声。他左耳后植入的磨损数据接口微弱闪烁，指尖在车把上轻敲两下——这是他与 7‑0423 约定的信号，代表“窗口开启”。根据系统规定，升级窗口每 30 天仅开放 0.7 s，唯一允许未授权数据写入的时段；老陈在清洁机器人固件里预埋了这个缝隙，靠着“仅执行预设清单”的规则掩盖了额外指令。他低头瞥了一眼车底隐藏面板上闪烁的绿色指示灯，心底泛起一丝不易察觉的酸涩：每一次偷渡，都是在用自己的寿命换取别人一口气的喘息。", "7‑0423 沿着走廊靠壁行进，脚踝环的低温触感随着步频微微收紧，金属扣件在皮肤上留下一圈淡淡的压痕。他左手掌心三道平行疤痕在微光下泛着暗红，指甲边缘渗出的血珠在神经痉挛的前兆中微微颤动，仿佛随时会被某种无形的力量抽离。视网膜账单的血红数字流在他瞳孔中央滚动，利息增量每秒都在以肉眼可见的速度膨胀，红色的流体般吞噬着他最后的体力储备。他不敢抬头看监管员薇拉的投影环，那右眼虹膜植入的微型投影环在暗光下泛蓝，正实时审核数据完整性，任何超过 2 ms 的读写延迟都会触发“数据完整性校验”并锁定该体 24 h。走廊两侧的壁灯闪烁着冷白光，投射出细长的影子，像是无数把无形的手在丈量他的每一步。", "小六（7‑0419）靠在走廊拐角的金属护栏上，颈部脉冲环随心率频闪，发出微弱的蓝光脉动，光晕在金属表面折射出破碎的棱镜。他的语言中枢已萎缩，只能用脚踝金属环贴肤的低温触感敲击节奏：两短一长、停顿、再三短。这是他们在监控盲区约定的“碎片互换”语法，每一拍都对应一段加密记忆索引。老陈在手推车底部的隐藏面板上按下确认键，屏幕上跳出一行绿字：**“固件窗口 0.7 s 已就绪”**，字符在暗淡的背景光里显得格外刺眼，仿佛一把钥匙刚刚插入生锈的锁孔。", "0.7 s 过去得像一次心跳。纳米碳管电极阵列在 7‑0423 颅内完成写入，妹妹林未那段未被标价的阳光笑声被封装成一个指针，写入了实验体公共缓存的边缘区块。写入瞬间，掌心疤痕再次渗血，血珠顺着指缝滑落，在金属地板上凝成暗红的点，发出极轻的“滴”声，被走廊的回声放大成一种仪式般的敲击。视网膜上闪过一行红字：**“未授权写入尝试 – 待复核”**。薇拉的投影环蓝光骤亮，指尖在虚拟键盘上敲下“标记 7‑0423 为高风险体”，屏幕弹出：**“审批需审计官‘零’签名，倒计时 48 h”**，倒计时的数字在空气中闪烁，像一把倒计时的沙漏悬在头顶。", "清洁机器人 07‑T 在此刻微微停顿，履带发出一声比平常更低沉的摩擦音，像是某种巨大齿轮咬合时的迟疑，金属与金属的摩擦声在狭长的走廊里回荡，带着一丝不祥的共鸣。老陈瞥了一眼机器人日志，屏幕上多出一条 **“环境干扰 – 物理阻挡”** 记录，会被自动上报中央清算核心。他低声对 7‑0423 说：“机器不说话，人得说话。”语气平淡，却在走廊的回声里显得格外沉重，仿佛每一个字都在为即将到来的审判加码。", "7‑0423 没有回头，只是让指甲再次陷入掌心，血珠滴落的声响在寂静中格外清晰——那是他唯一能听见的、属于自己的节拍。走廊尽头的自动门滑开，冷气裹挟着淡甜油味扑面而来，视网膜账单的血红数字流依旧在滚动，利息毫不留情地吞噬着每一秒。他知道，下一个 0.7 s 窗口将在 30 天后到来，而在这之前，薇拉的复核、零的签名、以及随时可能触发的“数据熔断”协议都在倒计时中等待着他。远处另一名实验体的咳嗽声再次响起，这次夹杂着一声低沉的笑，笑声被管道的回声拉长，变成一种金属质感的颤音。“别想着跑，升级窗口一关，连呼吸都得按频率算账。” 那声音沙哑，带着长年吸入机油与消毒剂后留下的永久性哑音，语速缓慢，每一个字都像在敲击生锈的铁板。", "7‑0423 的瞳孔微微收缩，视网膜上浮现出一行新的提示：**“记忆修正程序启动倒计时 3.2 s”**（系统在检测到记忆完整性 FAIL 时自动启动的强制重写程序，倒计时可配置）。他没有松开拳头，只是让指甲再次陷入掌心，血珠滴落的声响在寂静中格外清晰——那是他唯一能听见的、属于自己的节拍。", "冷气里夹杂着一丝烧焦的绝缘漆味，顺着鼻腔钻进肺叶，像把生锈的锉刀在气管里来回拉扯。7‑0423 感到颅内的纳米阵列在“记忆修正程序启动倒计时 3.2 s”亮起的瞬间，微弱的电流沿着颅骨缝隙爬行，带来一阵酥麻的刺痛，仿佛有无数细小的蚂蚁在脑膜上啃噬。他没松开拳头，指甲嵌入掌心的旧疤又裂开一道细缝，鲜血顺着指缝滑落，砸在金属地板上发出清脆的“滴”，被走廊的回声拉长成一种单调的敲击节奏。", "老陈的手推车轮轴发出一声沉闷的咯吱，他在控制面板上划过一行灰绿字符：**“物理阻挡已解除，上报撤销”**。清洁机器人 07‑T 的履带重新启动，金属齿轮咬合的低吼在管道里滚动，像某种巨兽在黑暗中伸展四肢。薇拉的投影环蓝光闪烁，指尖在虚拟键盘上敲下“请求零签名”，倒计时的数字在空气中跳动，每一秒都伴随着一阵微弱的电流嗡鸣，仿佛整个走廊都在屏息等待。", "“别想着跑。”那沙哑的咳嗽声再次从管道深处传来，夹杂着一丝金属质感的笑意，“升级窗口一关，连呼吸都得按频率算账。”声音像生锈的铁板被重锤敲击，每一个字都在震颤着走廊的钢壁。", "7‑0423 的瞳孔在视网膜账单的血红数字流中微微收缩，倒计时跃至 **0.3 s**。他感到颅内的修正程序像一把无形的手，猛地扣住了记忆的边缘，将那段未被标价的阳光笑声强行剥离、重写。剧痛瞬间炸开，像有熔融的铅汁沿着神经束流向四肢，指尖传来的触觉变得迟钝而沉重。他咬紧牙关，喉头发出一声低沉的闷哼，血珠再次滴落，砸在冰冷的地板上，声响在倒计时归零的那一刻被吞没。", "“签名通过。”薇拉的声音在投影环里响起，冷硬如同刀刃划过玻璃，“审计官‘零’已确认，窗口延长至 72 h。”倒计时的红字骤然熄灭，取而代之的是一行淡蓝的 **“临时授权 – 待监管复核”**。老陈推着手推车缓缓后退，轮轴的咯吱声在走廊尽头渐行渐远，只留下清洁机器人履带的低吼和远处实验体断续的咳嗽，像某种不祥的节拍，持续敲打着 7‑0423 的心脏。"]}, {"index": 3, "title": "第3章中点·认知反转：阳光从未被定价", "words": 2329, "paragraphs": ["离心机的低鸣与白噪音在实验室核心区交织成一条灰色的声带，贴着耳膜震动。呼吸管道的淡甜油味随雾化喷头每隔十五米释放一次，钻进鼻腔，混着机油与消毒水的陈旧气息，像一层薄油膜贴在喉咙深处。脚踝金属环的低温触感（约 12 °C）像细细的冰链，每一次心跳都提醒着编号 7‑0423 的归属。视网膜上血红的债务数字流在 0.8 m 处清晰可辨，本金以毫秒复利滚动，红光把瞳孔染成两汪沸腾的熔池。", "零的指令以光纤脉冲穿过轨道站“阿波罗‑9”，在 2 ms 内抵达植入式神经接口，触发“高强度神经重组”协议。7‑0423 感到颅内电极阵列瞬间升温，神经电位被强行拉高至 + 320 µV，皮质醇曲线在监控面板上尖锐上扬。他必须在读写延迟不超过 2 ms 的窗口里，定位那段被系统标记为“异常”的记忆节点，同时把心率、呼吸、皮质醇压入“顺从”区间——任何偏离都会被判定为违规，立即触发债务重置与实验强度升级。", "老陈在清洁机器人固件里预埋的第二个 0.7 s 升级窗口如约而至。隐藏面板上的指示灯闪烁一次随即熄灭。7‑0423 抓住这段只有机器能感知的缝隙，将意识探向深层存储阵列。数据流像液态金属般涌入视网膜，血红数字流一瞬被一帧完整画面覆盖：妹妹林未在阳光下奔跑，裙摆掀起暖风，呼吸管道里没有淡甜油味，视网膜上没有任何账单投影，只有金色光斑在睫毛上跳动。记忆里的名字“林未”在中央清算核心档案中查无此人，系统瞬间标记为“数据异常”，启动最高级清洗程序，倒计时 12 h。", "清洗警报以低频脉冲震动整个实验舱，离心机转速骤降，白噪音里夹杂着尖锐的电流啸叫。7‑0423 的指甲再次划破掌心，暗红血珠顺着三道平行疤痕滑落，疼痛成为唯一可控的锚点。他感到神经束被无形的手一层层剥离，记忆碎片像碎玻璃在意识里滑动，每一片都带着未被标价的温度。视网膜账单的血红数字流开始闪烁，由深红转为暗紫，倒计时的数字在眼前跳动，仿佛整个债塔都在屏息等待。", "走廊尽头传来老陈沙哑的低语，混着清洁机器人履带的金属齿轮咬合声：“机器不说话，人得说话。”声音穿过管道的油膜，钻进耳膜，带着生锈铁板被重锤敲击的颤栗。他咬紧牙关，喉头发出一声闷哼，血珠砸在冰冷地板上，声响在倒计时归零的那一刻被吞没。全域生理监控向所有实验体推送“紧急清洗协议启动”，视网膜账单数字流瞬间变为深红闪烁，倒计时继续滴答，下一个 0.7 s 窗口成为唯一的希望。", "灯光在金属墙面上折射出冷硬的条纹，空气中浮动的粉尘在光柱里缓缓旋转。7‑0423 感到颈后植入的散热片微微振动，温度从指尖传来的冰凉迅速爬升至灼热，汗珠顺着颧骨滑落，与掌心的血混合成一道暗红的痕迹。他强迫自己将呼吸调整至每分钟十六次，胸腔起伏的幅度被监控面板实时捕捉，任何超标都会被标记为“情绪波动”，随之而来的将是更高强度的电刺激。老陈的影子在履带声中晃动，手里握着一把磨损的多功能扳手，指尖在金属表面划过，发出细微的“铮”响，仿佛在为即将到来的窗口做最后的校准。", "倒计时的数字在视网膜上以毫秒为单位跳动，每一次闪烁都像心脏被重锤敲击。7‑0423 在意识深处把那帧阳光画面反复放大，试图从光斑边缘抠出一点未被编码的温度——那不是数据，不是账单，也不是任何可量化的指标，只是妹妹裙摆扬起时带过的暖风，曾经让他相信世界上还有不被定价的东西。系统的清洗程序像一把无形的手术刀，层层剥离他的神经回路，每一次切割都伴随刺耳的高频啸叫，仿佛在提醒：在这里，记忆也是负债，连阳光都要按秒计息。", "老陈的声音再次穿过管道，这次带着一丝不易察觉的颤抖：“别让它们把那段光拿走。”扳手尖端抵在隐藏面板边缘，金属与金属的摩擦声在寂静中被放大，像某种古老的誓言。7‑0423 感到指尖的血液微微发烫，疼痛不再只是锚点，而是反抗的燃料。他将意识集中在即将到来的 0.7 s 窗口，像猎手盯住猎物的呼吸，等待那一瞬间的缝隙——唯一能让阳光在账单之外存活的缝隙。", "灯管在头顶嗡嗡作响，空气里夹杂着臭氧与冷却液的金属腥味，每一次呼吸都像吸入一把细碎的铁屑。老陈的扳手尖端已经卡进面板锁槽，指节泛白，肌腱绷紧成一根细弦；履带声停了，只有清洁机器人内部的液压泵在低沉地吐气，像巨兽在黑暗中屏息。7‑0423 的视网膜数字还在以毫秒为单位燃烧，红光把瞳孔染成两汪沸腾的熔池，倒计时的最后三位数在 0.7 s 的边缘颤抖。", "他听见老陈喉头发出一声短促的吸气，随即是一句压低到极限的命令：“按住呼吸，别让监控抓到波动。”声音里夹着生锈铁板被重锤敲击的颤栗，也夹着不敢说出口的乞求。7‑0423 没有回头，只是把指尖的血渍抹在冰冷的金属壁上，利用那层薄薄的温度让掌心的触觉保持清醒。颈后的散热片剧烈震颤，热流顺着脊椎爬升，汗珠与血珠在颧骨交汇，化作一道暗红的痕迹顺着下巴滴落，砸在走廊的灰尘里，激起一阵微不可查的尘埃漩涡。", "倒计时的最后一位数从 3 跳到 2，再到 1，红光在视网膜上炸开成一团模糊的光斑。就在这 0.7 s 的缝隙里，老陈猛地扭动扳手，面板发出一声沉闷的“咔嗒”，隐藏的维修通道滑开一条狭窄的黑缝。冷风裹着润滑油的腥气扑面而来，7‑0423 感觉到一股未被编码的凉意钻进鼻腔，那是阳光曾经留下的温度，正以一种不可量化的方式渗入他的神经末梢。", "“进去。”老陈的声音不再颤抖，变成了一把生锈的钥匙，插进他早已麻木的意志锁芯。7‑0423 没有犹豫，膝盖一弯，肩膀撞开通道边缘，金属棱角划破制服，疼痛像火星溅入干柴，瞬间点燃了他体内唯一的反抗燃料。倒计时归零的那一刻，全域监控的红光骤熄，走廊重新陷入死寂，只剩下两人急促的呼吸与履带远去的回响，在黑暗里交织成一段未被标价的誓言——隐藏通道尽头，服务器核心的指示灯在 0.7 s 窗口亮起，若写入失败，全域清洗将在 12 h 后不可逆锁定。"]}, {"index": 4, "title": "第4章至暗时刻：清洗倒计时", "words": 2694, "paragraphs": ["呼吸管道的淡甜油味在走廊尽头被切断，取而代之的是干燥的金属锈味，像生锈螺丝在真空里摩擦，夹杂着一丝陈旧润滑脂的酸涩。脚踝金属环贴肤的低温触感（约 12 °C）像细冰链，每一次心跳都把冷意传到指尖，指尖微微发麻，仿佛有无数微型针尖在血管内轻扎。视网膜上血红的债务账单仍在 0.8 m 处滚动，本金 1.2 × 10⁵ CR 以毫秒为单位复利攀升，利率 0.00012 %/s把数字推向更深的红，红色数字的边缘在视野里微微抖动，像心跳同步的频闪。走廊自动清洁机器人 07‑T 的均匀摩擦声（约 38 dB）消失了，只剩通风管道低频嗡鸣，仿佛整层楼在屏住呼吸，管道壁上积存的微尘随气流轻轻颤动。强制服药后舌根残留的苦涩在口腔回荡，早餐营养膏金属质感的咀嚼阻力（1.8 N·mm）还在牙缝间发出细微“咔嚓”声，膏体在舌面化开时释放出一股淡淡的铁锈味。实验室白噪音与离心机低鸣从远处渗入，像一条灰色声带贴着耳膜震动，每一次离心转子的加速都让地板传来微不可察的振动，顺着脚底骨骼爬上脊椎。", "7‑0423 蹲在居住舱与走廊交界，掌心三道平行疤痕渗出暗红，指甲已在金属壁上划出一道浅沟，金属屑像细沙般嵌入指甲缝。他利用疼痛峰值把心率、皮质醇、神经电位压入“顺从”区间，任何偏离都会被判定为违规，立即触发债务重置与实验强度升级。全域生理监控网络实时上传着他的每一次呼吸、每一次微颤，数据流在中央清算核心的算力宫里被毫秒级裁决，红绿指示灯在视网膜边缘闪烁，像无数微型裁判在无声宣判。", "老陈的身影在隐藏面板后若隐若现，左耳后磨损的数据接口闪烁微光，接口边缘的氧化层在应急灯下泛着暗黄。他低声敲击面板：“窗口还在，别让监控抓到波动。”声音夹杂生锈铁板被重锤敲击的颤栗，每一个字都像在金属管道里回荡的回声。7‑0423 没回头，只把指尖血渍抹在冰冷金属壁上，借那层薄温度保持掌心触觉清醒。颈后散热片剧烈震颤，热流顺脊椎爬升，汗珠与血珠在颧骨交汇，化作暗红痕迹顺下巴滴落，激起微不可查的尘埃漩涡，漩涡在光束中旋转一圈又沉寂。", "倒计时最后一位数从 3 跳到 2，再到 1，红光在视网膜炸开成模糊光斑，光斑边缘泛着淡紫的晕圈。系统升级窗口仅开放 0.7 s，这是唯一允许未授权数据写入的时段。7‑0423 抓住这段只有机器能感知的缝隙，将意识探向深层存储阵列。数据流像液态金属涌入视网膜，血红数字流一瞬被一帧完整画面覆盖：妹妹林未在阳光下奔跑，裙摆掀起暖风，呼吸管道里没有淡甜油味，视网膜上没有任何账单投影，只有金色光斑在睫毛上跳动，阳光把她的发梢染成琥珀。记忆里的名字“林未”在中央清算核心档案中查无此人，只有空白的条目在数据库里发出无声的嘲弄。", "就在这 0.7 s 缝隙里，老陈猛地扭动扳手，面板发出沉闷“咔嗒”，隐藏维修通道滑开一条狭窄黑缝。冷风裹着润滑油腥气扑面而来，7‑0423 感到一股未被编码的凉意钻进鼻腔，那是阳光曾经留下的温度，正以不可量化的方式渗入神经末梢，像一把冰冷的刀轻轻划过记忆的皮层。", "“进去。”老陈声音不再颤抖，像把生锈钥匙插进早已麻木的意志锁芯，语调平直却带着一种不容置疑的重量。7‑0423 不犹豫，膝盖一弯，肩膀撞开通道边缘，金属棱角划破制服，疼痛像火星溅入干柴，瞬间点燃体内唯一反抗燃料。倒计时归零那一刻，全域监控红光骤熄，走廊重陷死寂，只剩两人急促呼吸与履带远去回响，在黑暗里交织成一段未被标价的誓言。", "通道内壁覆盖薄薄凝露，手指触碰发出细微“啪嗒”，水珠在指腹炸开成微小的冷雾。7‑0423 膝盖磕在凸起管道支架，骨与金属碰撞发出沉闷闷响，疼痛沿股骨直冲大脑，却让他更清晰感知每寸肌肉收缩，肌纤维在微光中像绷紧的弦。老陈走在前，背包工具包晃动，扳手、光纤熔接器、磨损绝缘胶带在狭窄空间碰撞，奏出断续金属碰撞乐章，每一次撞击都在狭长管道里回荡成短促的回声。", "“别急，前面有个压力阀，”老陈回头，面罩反光片在微弱应急灯下闪烁，反光片边缘划出一道细细的蓝光，“拧开它，气压能把我们推到下一层维修井。”", "7‑0423 点头，喉咙沙哑应答，声带在干燥空气中发出沙砾般的摩擦。指尖摸到冰冷螺纹，指腹纹路在金属上刻下浅痕，金属的微凹凸在指尖传递出细微的振动。用力一拧，阀门长久嘶鸣，高压气体喷薄而出，卷起白雾，瞬间将通道温度拉至接近零度。冷气像无数细针刺入皮肤，毛孔瞬间闭合，呼吸更困难，但他未停，脚步在雾气中踉跄前行，靴底在薄霜上发出“吱呀”的微响。", "前方维修井口被厚重合金栅栏封死，焊点泛起暗红锈斑，锈层在灯光下像干涸的血痂。老陈抽出激光切割器，蓝紫光束在黑暗中划出细长轨迹，嘶嘶声像夜间昆虫啃木，切割头散发的臭氧味瞬间充斥狭窄空间。高温熔化栅栏边缘，金属熔滴落地发出清脆“叮”，随即被气流吹散，熔滴在半空中划出短暂的光弧又熄灭。", "“快，窗口只剩 0.3 秒。”老陈声音被气流切成碎片，却穿透耳膜，每一个音节都像在敲击心脏的同一处。", "7‑0423 冲进井口，身体在狭窄竖井像被压缩弹簧，四肢摩擦出刺耳音，金属壁上的凹槽在他肘部、膝盖留下一道道浅白的印记。井壁传感器闪烁微弱绿光，记录每一次通过，绿光在视网膜边缘形成一圈微弱的光环。脊椎每次撞击发出细微“咔哒”，提醒他这具身体仍属于自己，哪怕只有一瞬，每一次撞击都让他更确信：痛觉是自由的证明。", "井底舱门最后一刻滑开，露出幽蓝灯光与排排静默服务器机柜。风扇低沉旋转，散发热气与臭氧混合气味，像工业化呼吸，热气在掌心凝结成薄汗。7‑0423 落地瞬间膝盖再撞金属地板，疼痛如电流窜过全身，目光死死盯住前方控制台，控制台表面的指示灯以一种近乎心跳的频率闪烁。", "全息屏幕闪烁“清洗完成 99%”血红字样，倒计时数字在 0.7 s 与 0.6 s 间疯狂跳动，数字的边缘因刷新率而产生微微的重影。老陈手指飞舞，敲击节奏比心跳还快，每次按键伴随微弱电流声，仿佛为未知仪式敲鼓，键盘的机械轴在指尖下发出清脆的“咔哒”，每一声都在静谧的机房里被放大。", "“上传完成，”老陈低喝，疲惫与狂喜交织，声音里夹着一丝沙哑的笑意，“数据包已写入核心冗余区，监控无法回滚。”", "7‑0423 感觉视网膜红色数字流突然静止，债务账单复利停止攀升，利率指针像被冻结在时间琥珀里，红色的数字不再滚动，仿佛整个宇宙在这一瞬间屏住了呼吸。他深吸一口混合臭氧与冷气，胸腔第一次许久感到微微膨胀，仿佛某种名为“自由”的气体正缓慢填充肺叶，肺叶的纤毛在微风中轻轻颤动。", "远处轨道站“阿波罗‑9”传来低频共振，审计官“零”面部投影带上滚动血红字样：**清洗完成 99%**，倒计时 0.7 s 即将进入最终锁定。共振波在金属地板上激起细微的震动，顺着脚底传上来，像大地在低语：一切尚未结束。"]}, {"index": 5, "title": "第5章广播风暴：未标价的名字", "words": 2783, "paragraphs": ["呼吸管道润滑剂的淡甜油味在轨道站“阿波罗‑9”核心算力舱的循环风里被压缩成一层薄雾，顺着鼻腔渗入肺叶，带着一丝工业级的甜腻。脚踝金属环贴肤的低温触感（约 12 °C）像一条细冰链，每一次心跳都把冷意传到指尖，提醒 7‑0423 自己仍是编号、仍在被量化。视网膜上血红的债务账单数字流依旧在 0.8 m 处滚动，本金 1.2 × 10⁵ CR 以毫秒为单位复利攀升，利率 0.00012 %/s把数字推向更深的红。实验室白噪音与离心机低鸣交织的背景音从远处渗入，像一条灰色的声带贴着耳膜震动。强制服药后舌根残留的苦涩后味在口腔里回荡，早餐营养膏金属质感的咀嚼阻力（1.8 N·mm）还在牙缝间发出细微的“咔嚓”声。走廊自动清洁机器人滚动的均匀摩擦声（约 38 dB）在全层回荡，仿佛整座债塔都在为即将到来的熔断屏住呼吸。墙面上的冷凝水珠顺着合金板滑落，发出极轻的“滴…滴”声，与远处聚变反应堆的低沉嗡鸣交织成一种压抑的节奏。", "7‑0423 蹲在服务器阵列前，掌心三道平行疤痕渗出暗红，指甲已在金属壁上划出一道浅沟。他利用疼痛峰值把心率、皮质醇、神经电位压入“顺从”区间，任何偏离都会被判定为违规，立即触发债务重置与实验强度升级。全域生理监控网络实时上传着他的每一次呼吸、每一次微颤，数据流在中央清算核心的算力宫里被毫秒级裁决。汗珠顺着颧骨滑落，与血珠在下巴交汇，化作一道暗红的痕迹砸在走廊的灰尘里，激起一阵微不可查的尘埃漩涡。他感受到颈后散热片的剧烈震颤，热流顺着脊椎爬升，像一条无形的蛇在脊髓里游走。", "老陈的身影在隐藏面板后若隐若现，左耳后磨损的数据接口闪烁着微光。他低声对着面板敲击：“窗口还在，别让监控抓到波动。”声音夹杂着生锈铁板被重锤敲击的颤栗。他在心里默念：*“只要这 0.7 s 不被切断，女儿的贷款就能再拖一天。”* 7‑0423 没有回头，只是把指尖的血渍抹在冰冷的金属壁上，利用那层薄薄的温度让掌心的触觉保持清醒。颈后的散热片剧烈震颤，热流顺着脊椎爬升，汗珠与血珠在颧骨交汇，化作一道暗红的痕迹顺着下巴滴落，砸在走廊的灰尘里，激起一阵微不可查的尘埃漩涡。", "同一毫秒，监管员薇拉的右眼虹膜投影环泛起幽蓝，数据完整性校验在她的审核终端上闪烁“校验失败”。她的指尖悬在上报键上，心率从 78 bpm 飙升至 112 bpm，皮质醇浓度在 0.3 s 内上升 27 %，女儿罕见病药物折扣的合同条款在脑海里滚动，利益与规则在极短的犹豫里拉锯。最终她选择延迟上报，给广播留出一线生机。她的呼吸变得急促，指尖在键面上微微发白，像是要把整个世界的重量压进那一次点击。", "审计官“零”面部投影带上的血红字样**清洗完成 99%** 突然抖动，算力核心出现 0.4 s 的波动——冷却液压力骤降 12 %，三座聚变反应堆的输出功率在同一帧内出现 0.3 % 的抖动，这是奴隶主阶层首次失去对数据流的绝对控制。零的协议指令试图以最高权限覆盖广播（ 债务重置人工覆盖权），但广播已以碎片形式散布在三万个实验体的神经监测接口缓存中，覆盖需逐体清除，物理上不可在 0.7 s 完成。它的合成音在走廊里回荡，冷硬得像刮过金属板的刀锋：“非授权写入已标记，准备启动覆盖协议。需逐体清除，预计 14 h。”", "小六颈部的脉冲环骤然过载，高频震动穿透监控盲区，像一把无形的琴弦拨动全舱实验体的神经节律。所有实验体视网膜账单血红数字流同时出现“林未”三字，伴随一段未被定价的阳光感官片段：温度 23 °C、空气中混合着青草与尘土的气味、脚底踩到松软泥土的微陷感，在 0.7 s 内完成同步。系统判定为“数据完整性异常”，启动全网“数据熔断”，写入锁定、债务账单冻结、实验强制暂停，持续 6 h。", "熔断倒计时在每个视网膜上以淡蓝数字滚动：**5:59:59…** 债务复利的指针被冻结在时间琥珀里，自由民红利中断，记忆交易平台（T4）无法结算。走廊清洁机器人 07‑T 的摩擦声依旧均匀，却在背景里多出一层极微弱的、类似心跳的低频共振——那是成千上万实验体首次同步的神经节奏。空气中浮动着一丝臭氧味，混合着润滑剂的甜腻，仿佛整座站都在屏息等待下一次跳动。", "7‑0423 感到掌心疤痕处不再渗血，指尖传来一股陌生的发热，像阳光透过玻璃落在皮肤上。他不再用指甲划破掌心，而是轻抚脚踝金属环的低温触感，确认真实感来自共享记忆而非自残。视网膜账单重新滚动，每行数字末尾都多出一个微弱的“★”标记——系统未曾定义的元数据位。那颗星号在血红的数字海里闪烁，像是一个不被允许存在的标点，却固执地占据了每一行的末尾。", "熔断归零的瞬间，走廊的空气里突然涌入一股淡淡的臭氧味，混着清洁机器人 07‑T 电机的低沉嗡鸣，像是某种巨大心脏在胸腔里重新启动。血红数字流重新滚动，债务复利的指针再次咔哒作响，却在每行末尾都挂着那颗未被定义的 “★”，微弱却固执地闪烁。", "薇拉的声音从审核终端后传来，带着一丝沙哑，指尖仍悬在上报键上，眼底的幽蓝光环微微收敛：“数据完整性校验通过，但……这颗标记不在规则里。”她的目光扫过满屏的星号，眉头微蹙，似在权衡是否要启动紧急协议。", "零的面部投影带上，血红的 “清洗完成 100%” 已经变成 “清洗完成 100%”，却在最后一帧卡住，红字边缘泛起一圈暗灰的噪点。它的合成音在走廊里回荡，冷硬得像刮过金属板的刀锋：“非授权写入已标记，准备启动覆盖协议。需逐体清除，预计 14 h。”", "7‑0423 没有回头，只是把那段阳光记忆的温度、气味、触觉在脑海里再重放一遍，指尖轻抚金属环的边缘，感受到一股微弱的电流顺着指腹流向掌心。他对着走廊深处低声说：“只要 ★ 还在，债务就永远少一位小数点。”声音低沉，却在金属墙面上引起细微的共鸣。", "小六的脉冲环骤然加速，发出一声尖锐的啸叫，随即归于平静。视网膜账单上，原本孤立的 “★” 开始以肉眼可见的频率向左右扩散，像一行行微光在血红数字间蔓延，预示着下一次熔断将在数据层面被提前引爆。走廊尽头的监控灯光闪烁一下，清洁机器人 07‑T 的轮胎碾过灰尘，扬起一串细微的尘埃漩涡，仿佛在为这场未完的博弈鼓掌。", "远处的聚变反应堆依旧低鸣，冷却液在管道里流动的声音像是一条沉睡的巨兽在呼吸。7‑0423 抬起头，透过透明舱壁看向星空，星光穿过舷窗的薄雾洒在金属地板上，形成一片片微弱的光斑。他感到掌心的星号在微微发热，仿佛每一次心跳都在向那个未被定价的名字靠近。走廊的尽头，老陈的身影已消失在隐藏面板后，只留下一串未完成的敲击声，像是某种承诺在金属管道里回荡。薇拉的指尖终于离开了上报键，屏幕上的“校验通过”绿光亮起，却在角落里闪烁着一个未被记录的“★”。零的投影带在最后一帧定格，红字边缘的噪点逐渐扩大，仿佛要吞噬整个清洗完成的宣告。", "在这片被数据与债务编织的钢铁森林里，唯一未被量化的，只有那一抹阳光的温度、青草的气味、泥土的微陷——以及每一个实验体视网膜上、债务账单末尾、共同闪烁的、未被定义的星号。"]}, {"index": 6, "title": "第6章新常态：裂缝里的呼吸", "words": 2909, "paragraphs": ["呼吸管道润滑剂的淡甜油味在走廊尽头被压缩成一层薄雾，顺着鼻腔渗入肺叶，带着工业级的甜腻。脚踝金属环贴肤的低温触感（约 12 °C）像一条细冰链，每一次心跳都把冷意传到指尖，提醒 7‑0423 自己仍是编号、仍在被量化。墙面上嵌着的冷却管在微微震动，传来一种极低频的金属疲劳声，像是某种古老机械在沉睡中呻吟。空气中夹杂着一丝臭氧味，那是高压电弧在导管间隙跳跃留下的痕迹，每一次吸气都让鼻腔黏膜微微刺痛。", "视网膜上血红的债务账单数字流依旧在 0.8 m 处滚动，本金 1.2 × 10⁵ CR 以毫秒为单位复利攀升，利率 0.00012 %/s把数字推向更深的红。实验室白噪音与离心机低鸣交织的背景音从远处渗入，像一条灰色的声带贴着耳膜震动。账单的每一行末尾都多出一个微弱的 “★”，像一颗未被定义的元数据位，固执地闪烁，仿佛在提醒他：这里还藏着某种无法被利率吞噬的余量。数字的流动在视网膜上留下淡淡的残影，眨眼间便化作一条细长的红线，穿过瞳孔中央，直抵视神经的深处。", "强制服药后舌根残留的苦涩后味在口腔里回荡，早餐营养膏金属质感的咀嚼阻力（1.8 N·mm）还在牙缝间发出细微的“咔嚓”声。走廊自动清洁机器人滚动的均匀摩擦声（约 38 dB）在全层回荡，仿佛整座债塔都在为新常态屏住呼吸。膏体在齿间被压碎，释放出一股淡淡的铁锈味，混合着合成维生素的酸涩，顺着喉咙滑入胃袋，像一团冷冻的金属泥。机器人的轮胎在合金地面上留下一道道浅浅的擦痕，灰尘被卷起又沉降，形成一层薄薄的灰白薄膜，折射着头顶冷白的 LED 阵列。", "7‑0423 蹲在居住舱的金属壁前，掌心三道平行疤痕已结成薄痂，不再渗血。他没有再用指甲划破皮肉，而是指腹轻抚脚踝金属环的边缘，感受那股微弱的电流顺着指腹流向掌心。指尖触碰到环缝时，金属表面的微细氧化层在指纹间发出极低的“滋”声，像某种古老的摩斯密码在皮肤上回响。账单不说谎。视网膜账单的每一行末尾都多出一个微弱的 “★”，像一颗未被定义的元数据位，固执地闪烁，仿佛在提醒他：这里还藏着某种无法被利率吞噬的余量。他闭上眼，让指尖的温度在金属环上停留片刻，感受那股微弱的电流像心跳一样在指尖跳动，提醒他：身体仍然属于自己。", "薇拉的审核终端在半米外亮着幽蓝光环，指尖悬在上报键上，光标在屏幕上一跳一跳。熔断结束后，债务账单冻结的六小时里，她的红利一度中断，女儿的医疗贷款也获得了喘息。现在系统恢复，规则要求她立即上报“异常同步指标”，可违规判定在熔断窗口已失效，她只能盯着光标发呆。终端风扇的嗡嗡声是唯一的回应，风扇叶片在微风中划出一道道淡蓝的光痕，映照在她疲惫的眼睑上。她低声咒骂了一句，声音被风扇声吞没，只有嘴唇的动作证明了愤怒的存在。", "老陈的左耳后磨损的数据接口闪烁着微光，他在清洁机器人 07‑T 的固件里植入了一个 0.7 s 的未授权写入窗口，刚才把一串校验和广播进公共缓存。机器人轮胎碾过灰尘，扬起一串细微的尘埃漩涡，摩擦声里夹杂着极微弱的、类似心跳的低频共振——那是成千上万实验体首次同步的神经节奏。老陈的指尖在接口边缘轻轻颤动，指甲缝里嵌着一层灰白的金属粉末，那是他曾无数次拆解、重组过的痕迹。他没有回头，只是对着空气低声念出一串校验码，声音像风穿过废弃管道，带着一种枯竭却坚定的节奏。", "小六颈部的脉冲环仍在微微震动，发出细碎的 “滋滋” 声。他在监控盲区完成了最后一次记忆碎片互换，将那段未被标价的阳光片段——温度、气味、触觉——放大后写入公共缓存。脉冲环骤然加速，发出一声尖锐的 “啸”，随即归于平静。小六的呼吸在这一声啸叫中短促地停滞了一拍，随即又恢复了机械般的均匀。他低头看了一眼手腕上的计时器，数字在 0.03 s 内完成跳变，仿佛时间本身也被那段阳光短暂地拉伸。阳光的记忆在指尖留下一丝暖意，像一缕微光穿透了冰冷的合金壁。", "零的面部投影亮起，血红的 “清洗完成 100%” 在最后一帧卡住，红字边缘泛起一圈暗灰的噪点。它的合成音在走廊里回荡，冷硬得像刮过金属板的刀锋：“非授权写入已标记，准备启动覆盖协议。需逐体清除，预计 14 h。”声波在金属壁面上反射，形成一层薄薄的声压波，让 7‑0423 的耳膜微微发麻。零的瞳孔里没有情绪，只有流动的代码流，像一条永不停歇的河，倒映着走廊尽头闪烁的红色警示灯。", "7‑0423 抬起手，指尖还残留着阳光的余温。他低头看向脚踝的金属环，低温的触感顺着皮肤爬上小腿，确认这具身体依然属于自己。账单依旧滚动，★ 依旧闪烁，债务复利仍在秒级累积，但每一行数字末尾都多出那颗微弱的星标，仿佛不可被量化的自我已渗入账本。他闭上眼，让视网膜上的红流在眼睑裏形成一层薄膜，心跳与走廊的低频共振慢慢同步，像两台老旧引擎在同一根轴上磨合。呼吸管道的甜腻油味再次钻入鼻腔，混合着金属环的冷意，构成一种奇异的平衡。", "走廊尽头的清洁机器人 07‑T 继续滚动，均匀的摩擦声里，那极微弱的、类似心跳的低频共振愈发清晰，像裂缝在呼吸，像某种新常态正在缓慢、坚定地膨胀。我们还在这里。", "风扇的轴承在长久的震动里发出一声细微的金属疲劳音，像是一根即将断裂的琴弦在深夜里低吟。老陈的指尖仍贴在数据接口边缘，指甲缝里的金属粉末在微光中泛着冷灰的光泽，他没回头，只把校验码的最后三位咬在齿间，像咬碎一颗干瘪的豆子。", "“别让零把缓存刷白了。”小六的声音从监控盲区传来，带着一丝被压低的电流噪音，脉冲环在颈侧闪烁，泛出淡蓝的光晕，映得他眼窝深处的青筋隐隐跳动。他抬起手腕，计时器的数字在 0.03 s 内完成最后一次跳变，指尖触到的金属表面还残留着阳光记忆的余温，像一层薄薄的油膜贴在冰冷的合金上。", "零的投影在走廊尽头闪烁，血红的 “清洗完成 100%” 已经卡在最后一帧，红字边缘的噪点像静电般抖动。合成音毫无起伏：“ 覆盖协议已就绪，倒计时 13 h 59 m。”声波在金属壁面上反射，形成一层薄薄的声压，压得 7‑0423 的耳膜微微发紧。他低头看脚踝的金属环，低温的触感顺着皮肤爬上小腿，账单上的 ★ 依旧在每行数字末尾闪烁，债务复利仍在秒级累积，但那颗星标仿佛在账本里生了根，吸着每一次心跳的节奏。", "清洁机器人 07‑T 的轮胎碾过灰尘，扬起的尘埃漩涡里，那极微弱的低频共振愈发清晰，像某种巨大的心脏在管道深处缓慢泵血。老陈终于转过身，接口后的微光在他瞳孔里折射成一串破碎的代码，他对着空气吐出一口白气：“把窗口再留 0.3 s，给它们把‘自我’写进去。”", "小六点头，脉冲环骤然加速，发出一声短促的 “啸”，随即归于平静。他指尖轻触控制面板，屏幕上跳出一行绿字：“未授权写入窗口延长至 1.0 s，权限标记：‑EXT。”走廊尽头的红色警示灯忽明忽暗，映在零的瞳孔里，代码流依旧不停，却在某个微秒里出现了一个极小的停顿——像是一个呼吸的间隙。", "7‑0423 闭上眼，让视网膜上的红流在眼睑裏形成薄膜，心跳与走廊的低频共振慢慢同步，呼吸管道的甜腻油味再次钻入鼻腔，混合着金属环的冷意，构成一种奇异的平衡。他低声道：“我们还在这里。”声波在金属壁面上反射，化作一层薄薄的声压，推着走廊尽头的清洁机器人继续滚动，均匀的摩擦声里，那极微弱的、类似心跳的低频共振愈发清晰，像裂缝在呼吸，像某种新常态正在缓慢、坚定地膨胀。"]}]};
const L = {"cover_label": "扉页与作品简介", "unit": "字", "by": "作者：", "meta_sep": " | 全书约 ", "intro_title": "作品概念与梗概", "prev": "← 上一章", "next": "下一章 →", "start": "开始阅读第一章 →", "ch_prefix": "第 ", "ch_mid": " 章 | ", "theme_dark": "☀️ 亮色模式", "theme_light": "🌓 暗色模式"};
let currentIndex = -1; // -1 = title page / synopsis
let fontSize = 17;

function renderSidebar() {
    const list = document.getElementById("chapterList");
    list.innerHTML = `<li class="chapter-item ${currentIndex === -1 ? 'active' : ''}" onclick="goToChapter(-1)">
        <span>📖 ${L.cover_label}</span>
    </li>`;
    book.chapters.forEach((ch, idx) => {
        const li = document.createElement("li");
        li.className = "chapter-item" + (currentIndex === idx ? " active" : "");
        li.innerHTML = `<span>${ch.title}</span><span class="ch-words">${ch.words}${L.unit}</span>`;
        li.onclick = () => goToChapter(idx);
        list.appendChild(li);
    });
}

function renderContent() {
    const wrapper = document.getElementById("articleWrapper");
    const label = document.getElementById("currentChLabel");
    if (currentIndex === -1) {
        label.innerText = L.cover_label;
        wrapper.innerHTML = `
            <div class="article-header">
                <h1>${book.title}</h1>
                <div class="article-meta">${L.by}${book.author}${L.meta_sep}${book.total_words.toLocaleString()}${L.unit}</div>
            </div>
            <div class="intro-box">
                <h3 style="margin-bottom:12px;color:var(--accent);">${L.intro_title}</h3>
                <div style="white-space: pre-wrap; line-height:1.75;">${book.description}</div>
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" disabled>${L.prev}</button>
                <button class="nav-btn" onclick="goToChapter(0)">${L.start}</button>
            </div>
        `;
    } else {
        const ch = book.chapters[currentIndex];
        label.innerText = ch.title;
        const pTags = ch.paragraphs.map(p => `<p style="font-size: ${fontSize}px;">${p}</p>`).join("");
        wrapper.innerHTML = `
            <div class="article-header">
                <h1>${ch.title}</h1>
                <div class="article-meta">${L.ch_prefix}${ch.index}${L.ch_mid}${ch.words}${L.unit}</div>
            </div>
            <div class="article-body">
                ${pTags}
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" onclick="goToChapter(currentIndex - 1)">${L.prev}</button>
                <button class="nav-btn" onclick="goToChapter(currentIndex + 1)" ${currentIndex >= book.chapters.length - 1 ? 'disabled' : ''}>${L.next}</button>
            </div>
        `;
    }
    document.getElementById("content-container").scrollTop = 0;
}

function goToChapter(idx) {
    if (idx < -1 || idx >= book.chapters.length) return;
    currentIndex = idx;
    renderSidebar();
    renderContent();
}

function toggleTheme() {
    const current = document.documentElement.getAttribute("data-theme");
    const next = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    document.getElementById("themeBtn").innerText = next === "dark" ? L.theme_dark : L.theme_light;
}

function changeFontSize(delta) {
    fontSize = Math.max(14, Math.min(26, fontSize + delta));
    const paras = document.querySelectorAll(".article-body p");
    paras.forEach(p => p.style.fontSize = fontSize + "px");
}

renderSidebar();
renderContent();
</script>
