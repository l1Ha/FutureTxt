ignature blocks below, one with her name.", "\"October 2024, I was monitoring at the Conservation Center. That batch of cranes refused to leave the west flats. We ran a displacement, used electrified hoses. That night one hit the grid. My signature.\"", "Xu Dehai looked down at the paper. His fingertip brushed the edge, rough fibers pricking.", "He remembered another bird. Twenty years ago, fresh on these flats, a kid from the next village poached with nets and stones. When Xu Dehai arrived, the crane lay in a ditch, neck limp.", "\"Incident happened, discipline on my name. A year later, discipline revoked under 'process revision,' archives left with one line.\"", "\"What happened to the crane.\"", "\"Died.\" Wei Xiaoqing said. \"Neck snapped on impact. When I reached it, it was still convulsing.\"", "Xu Dehai didn't speak. He knew how to lift a flock off the flats, and he knew what happened after they landed.", "A stiff paper corner pressed against his chest inside his cotton jacket. Five years ago, the Technical Consultant letter of intent photocopy, corners worn fuzzy. Advance 120,000, he took it, returned half, the other half never mentioned.", "\"I'm telling you this for two things.\" Wei Xiaoqing folded the paper back. \"One, I won't sign the Removal Order. Two, on formal release day I won't carry it for you. You have another way, come to me, I'll give you data; you don't, follow process, the signature I put on process, I'll explain.\"", "\"Why tell me.\"", "\"Because you'll make the mistake I made.\" She said. \"You'll think you can carry it.\"", "Noon, Zhou Bai briefing him by the Paomu edge.", "\"Eighteen groups all online, three-segment handoff clean.\" Zhou Bai tapped the box at his waist. \"Low-frequency penetration verified, high-frequency directional calibrated. Master switch here, counter-clockwise.\"", "\"Why do the birds listen.\"", "\"Simulated Alarm Call. The call birds make only when sensing danger, sharp, short, one after another. They dare not go that way, won't come this way, squeezed between two sound walls, formation pulls itself into an arc.\"", "\"Redline locked at fifteen minutes,\" Xu Dehai said. \"Afraid the machine breaks?\"", "\"Machine doesn't fear heat, bird ears can't take it.\" Zhou Bai said. \"Past 130 dB, eardrums bleed, next day they can't gain altitude. Redline locks the bird, not the machine.\"", "\"Within fifteen minutes?\"", "\"Within is scare. Scared enough they veer. Scared too much they strike.\"", "\"Who controls.\"", "\"Master control here.\" Zhou Bai tapped the waist box. \"Contingency we draft, field dispatch authority with Release Commander—that's you. We calculate, you execute.\"", "\"I can shut it off.\"", "\"Can. Master breaker in the control box, one knife switch, counter-clockwise.\"", "\"The Light Array?\"", "\"Light Array not ours.\" Zhou Bai said. \"Belongs to Cityscape Platform, we only handle flight. Two hundred forty units, each a dense lamp row, 170,000 points. Airborne 4:50 a.m., at 6:10 that sky-light they take shape, any later invisible. Normally dark, simulation screen shows trajectory plots. Outline is dead, inside must grow something on its own.\"", "\"Doesn't grow?\"", "\"Doesn't grow, it's just a picture.\" Zhou Bai said.", "Qi Hai waited on the viewing platform on the scenic belt.", "No railings yet, only a row of temporary cones. Wind combed white lines across the sea.", "\"Master Xu, sit.\"", "Xu Dehai didn't sit.", "\"Three hundred twenty channels, ninety-second window.\" Qi Hai said. \"This morning twenty or thirty media outlets asked about this segment. Next four days, forty-seven more.\"", "\"Then what.\"", "\"Then footage goes into the dossier. Next round investment rating memorandum has a column, Urban Operational Predictability. That column isn't for people, it's for the scoring algorithm. Not in the scored items, in the remarks.\"", "\"Remarks count too.\"", "\"Remarks count.\" Qi Hai said. \"This year Nanyu fights for three hundred million in levee matching funds, and a foreign-funded hospital surgical center. The readers flip to this column, they look for 'unpredictable'—those four characters.\"", "\"What's that got to do with birds.\"", "\"Nothing to do with birds, everything to do with the picture.\" Qi Hai said. \"Picture has two hundred-plus birds forming a Kunpeng, three hundred twenty channels broadcasting ninety seconds. They won't remember Unit 03, they'll remember 'Nanyu can sort two hundred-plus birds into that shape.' That sentence rides up the chain with the levee.\"", "\"Reverse?\"", "\"Reverse, they remember 'Nanyu can't even line up a flock.' Then they ask: is the levee handled the same way.\"", "Xu Dehai watched the sea.", "\"Director Qi,\" he said. \"Signed, Unit 03 hits the light stand, neck snaps. Left wing can't lift, right side folds first. Folded, it stays on the flats, next year that stretch gets walled off.\"", "\"Unsigned, whole city watches a scattered flock. You pick one, see if you sleep tonight.\"", "\"I want neither.\" Qi Hai said. \"I want ninety-six.\"", "\"Ninety-six isn't a bird.\"", "\"You want me to sign.\"", "\"I want you to sign the best one.\" Qi Hai said.", "He rotated the pen half a turn, no second turn.", "\"The best one takes a sheet of paper. Paper at your hand this afternoon.\"", "October 22, pre-dawn, second Rehearsal.", "Not Xu Dehai who came.", "Cui Shouzhuo wore a dark blue jacket, new badge on chest: Release Consultant. Sixty-three, Xu Dehai called him senior fellow disciple; young, they'd walked side by side on these same flats.", "He brought a new protocol: Light Array rises first, sketches outline; Sonic Array pushes flock segment by segment into outline per model sequence; final micro-adjust for lock.", "Match Rate thirty-four percent.", "\"Thirty-four.\"", "\"Thirty-four.\" Cui Shouzhuo set down his thermos. Right index finger, second joint, trembled involuntarily, lid clacked against rim, crisp. He showed nothing, just gripped the cup tighter. \"Not one injured.\"", "\"Picture doesn't form.\"", "\"Picture doesn't form.\" The old man admitted. \"Birds fine.\"", "\"Back in our day—\"", "\"Back in our day what equipment?\" Cui Shouzhuo cut in fast. \"One boat, one net, one flag. Someone bangs the hull, birds rise. We released thirty years, got three full formations.\"", "\"Three times.\"", "\"Three times.\"", "\"The 30th has only once.\"", "Cui Shouzhuo lifted the cup again. His right index second joint trembling slightly, visible to himself.", "\"Your hand shakes.\" Xu Dehai said.", "Old man gripped the cup harder. \"Started two years ago.\"", "\"Two years ago the livestream incident wasn't hand shake.\" Xu Dehai continued. \"Report said equipment failure. Insiders all say you pulled three all-nighters that week, third day hands shook too bad to catch the flag.\"", "Cui Shouzhuo removed glasses, wiped with his hem.", "\"Xu Dehai, I'm not fighting you on this.\" He said. \"You want to guard your craft, I won't stop you. But you admit, your way matches three times a year, people break. My way hits thirty-four, but it hits thirty-four every day, people still standing.\"", "\"People standing, picture fails.\"", "\"Picture fails, birds alive.\" Old man said. \"You hand it over, I sign.\"", "Evening, command center delivered a kraft envelope, cover printed four characters: Release Command, Internal.", "One sheet inside.", "《Removal Guidance Sequence Execution Order (No. 03)》", "Per Flock Behavior Model prediction, Unit 03 crane causes Match Rate loss in guidance sequence. Recommend removal from guidance sequence prior to formal release. Execution method: Directional Speaker solo displacement, duration not exceeding four minutes. Post-execution flock convergence projected to rise to ninety-six percent.", "Approval column: Release Commander.", "Below, a line of small print: If not executed, proceed per original protocol, model predicts Match Rate seventy-nine percent.", "\"Refuse to sign, does it work.\" Xu Dehai asked Qi Hai.", "\"Works.\" Qi Hai said. \"Seventy-nine is also a number. Ninety seconds in, seventy-nine means roughly one-fifth of the picture scattered. You and I can't say what those ninety seconds become.\"", "\"You want me to sign.\"", "Qi Hai didn't answer. He laid the pen across the kraft envelope, pushed it to the edge. Pen stopped, didn't fall.", "\"Execution Order expires midnight tonight.\" Qi Hai said. \"Past midnight, system auto-runs original protocol. I'm not keeping anyone.\"", "Xu Dehai folded the order, four folds, shoved it into his cotton jacket.", "Leaving, he glanced up at the wall clock. 22:40.", "Until 6:10 a.m. on the 30th, seven days and seven and a half hours remained."]}, {"index": 3, "title": "Chapter 3: Rehearsal", "words": 10804, "paragraphs": ["At dawn on October 24, the third rehearsal.", "Xu Dehai listened to the model.", "The model's window was 5:40, ten minutes earlier than his own judgment. He stood on the tidal flat, the tide just receded to his ankles, two hundred–odd cranes crowded in the shallows beyond. He waited three minutes, didn't move.", "\"5:40.\" Zhou Bai's voice in the earpiece. \"Wind force three, water level just right.\"", "\"I'll wait.\"", "\"Master Xu, wait any longer and you'll miss the tidal mouth.\"", "\"I'll wait.\"", "He waited until 5:42, then raised the flag. First form, rise. One long whistle blast, fall.", "When the crane flock lifted, the sky hadn't fully brightened. They were chaotic at first, then layered upward, tier by tier. The array's third segment kicked in, the alarm call pressing in from the east. The model had nailed the wind: a northeasterly cutting across the flock's right flank, shoving them precisely toward the desired position.", "Xu Dehai watched the formation grow. Wings spreading, tail closing, like a net.", "One, two, three—he lost count.", "Then he saw an extra bird on the left.", "Unit 03 was there. Left rear, one wing higher than the other, its whole body listing right. The formation dragged left behind it, worsening by the second, like a rope bent under pressure.", "Match rate forty-three percent.", "\"Unit 03 is in the sequence,\" Zhou Bai said in the earpiece.", "\"It's in.\"", "\"The model's recommendation hasn't changed. Remove it from the guiding sequence. Remove it, forty-three climbs above eighty.\"", "\"I know.\"", "\"So do it.\"", "\"Not doing it.\"", "In the morning playback, that glowing kunpeng banked with a crooked wing. Qi Hai had it enlarged, projected onto the wall.", "\"Forty-three.\" He said. \"Look at this wing.\"", "Xu Dehai stood at the very back. He knew this wasn't the model's fault: the model hadn't lied. Unit 03 flew slow, couldn't keep up, kept drifting left—every metric was a negative.", "Without Unit 03, the formation was true.", "On the morning of October 25, he took his father to the community hospital.", "Follow-up: pulmonary function, quarterly, last time's appointment never came through. Xu Dehai went at six a.m. to register. The window asked if he had priority grounds; he said no. The window handed him a slip printed with a number.", "142.", "\"One hundred forty-two.\" Xu Dehai said. \"Afternoon and it'll still be over a hundred.\"", "\"Senior priority window is on the second floor.\" The window said.", "\"He doesn't do stairs.\"", "\"Then you wait.\"", "He found his father a chair at the far end of the second-floor corridor. His father sat, folding a handkerchief into a square and pressing it to his mouth; when he pulled it away, a few more black specks had appeared.", "\"Over a hundred.\" Xu Changgeng said.", "\"Mm.\"", "\"You're thinking about that bird.\"", "\"Mm.\"", "\"About signing that form—you talked to the Cityscape people?\"", "\"No.\"", "\"Why not.\"", "\"Talking equals signing.\"", "Xu Changgeng coughed twice, tucked the handkerchief into his pocket.", "\"Dehai, let me ask you one thing. If you don't sign, come the thirtieth you're on the flat and the birds don't match, the image is just an image. Your forty years amount to nothing.\"", "\"I never did anything else.\"", "\"I know you never did anything else.\" The old man said. \"That's why you're more afraid.\"", "Leaving the hospital, Xu Dehai went to the Cityscape Platform's service hall. He queued at the window, twenty people ahead.", "\"Can registration jump the queue by Viewscore?\"", "\"Registration doesn't look at score.\" The window said. \"If you're urgent, there's an expedited channel. Expedited requires tier B or above.\"", "\"What affects it?\"", "\"Nothing does.\"", "He stood there, didn't move.", "\"I'm sixty-one.\"", "\"Then you can't expedite.\" The window said. \"Next.\"", "Later in the corridor he ran into Qi Hai.", "\"The internal regs do have that clause.\" Qi Hai said. \"Tier B and above can apply for expedited. If your father signs that form tomorrow, his number jumps to top three by three p.m.\"", "\"That's a transaction.\"", "\"That's the rules.\" Qi Hai said. \"You don't sign, no one jumps, no one needs to. You wait, your turn comes when it comes.\"", "\"You're hoping I sign.\"", "\"I'm hoping everything runs by process.\" Qi Hai said. \"You signing is process, you not signing is process. The difference is whether the result looks good.\"", "At dawn on October 26, the fourth rehearsal. Window failed.", "The model still gave 5:50, ten minutes before the tidal mouth. This time Xu Dehai didn't wait; he followed the model.", "4:50, clear the flat. 5:40, raise flag, rise.", "5:50, a string of firecrackers went off at the flat's eastern end.", "Groundbreaking ceremony for the viewing promenade, six hundred meters off at the hoarding line, a dozen people clapping. The sound carried far across the flat.", "The crane flock blew.", "They sprang from the water, scattered north, cleared the toss-wood, fled toward the inner river. By the time they returned, the window was gone.", "Xu Dehai stood in the mud, flag still raised. He lowered it slowly.", "\"Groundbreaking wasn't on the checklist,\" Zhou Bai said in the earpiece.", "\"Any people on the checklist?\"", "\"Only equipment, tides, wind speed, water level.\"", "Wei Xiaoqing arrived in the morning. She glanced at the flat, then at the hoarding where incense still smoked.", "\"It didn't miscalculate.\" She said. \"It didn't calculate you.\"", "\"It can't calculate people.\" Xu Dehai said.", "\"It can't calculate people, but it won't skip a calculation just because it can't.\" Wei Xiaoqing said. \"Master Xu, equipment is dead, people are alive. You try to fit the dead to the living, the part that doesn't fit—it treats as zero.\"", "\"Zero is zero.\"", "\"Zero is zero.\" Wei Xiaoqing flipping her logbook. \"No 'human interference' item on the checklist. In the parameter table, the human interference coefficient defaults to zero. Zero isn't 'didn't happen,' it's 'excluded from calculation.'\"", "Evening of October 27, Xu Yi came home.", "She slammed a folder onto the table—inside, the Summit volunteer service certificate, a pale blue seal under the title. She wore that gray-blue vest, the 027 on the back worn white.", "\"Next month the scenic area converts to formal staff.\" She said. \"This adds points.\"", "\"Good.\"", "\"I stood three nights at that intersection on Seaside Avenue, a hundred smiles an hour.\" She hung her jacket behind the door. \"They have quotas, smiles per minute, written on little cards.\"", "\"Stop standing.\"", "\"I'm standing.\" Xu Yi said. \"I have to get into the scenic area. You don't understand.\"", "Xu Dehai was chopping scallions. He set the knife down.", "\"That image of yours.\" Xu Yi said.", "\"What.\"", "\"Your image—who've you shown it.\"", "\"Three hundred twenty channels.\"", "\"Channels are people?\"", "\"They are.\"", "\"Then who've you shown it.\"", "\"People who watch.\"", "Xu Yi sat, elbows on the table.", "\"Domestic and foreign?\"", "\"Both.\"", "\"Do they know the bird is called Unit 03?\"", "Xu Dehai didn't speak.", "\"They see 'Nanyu can array two hundred birds into a kunpeng,' right.\" Xu Yi said. \"That line goes up with the seawall proposal, doesn't it. Dad, I stand at the intersection smiling all day, smile till my jaw aches. They take this to negotiate the seawall.\"", "\"Stop standing.\"", "\"I'm standing.\" She met his eyes. \"I'm standing tomorrow too.\"", "The range hood roared in the kitchen. Xu Dehai finished the scallions, lined them segment by segment on the cutting board.", "\"Those two hundred birds,\" Xu Yi said. \"Do they know what shape they're flying into tomorrow?\"", "He didn't answer.", "\"When I stand at the intersection smiling, no one tells me what shape to smile into either. They give a quota, smiles per minute, written on the card.\"", "Xu Yi stood, hugging the folder.", "\"You do your birds.\" She said. \"I'll do my quota.\"", "At dawn on October 28, the fifth rehearsal.", "This one hit seventy-four. Missing a wingtip.", "\"Seventy-four.\" Qi Hai froze playback on that frame. \"This frame goes in the promo reel. Darken, add a line of English, make it page one of the city card.\"", "On screen, that glowing bird's wing filled with light, right wingtip missing a small notch, the gap leaving a void on the sea surface.", "\"Looks good.\" Cui Shouzhuo said. He stood in the back row, hands in jacket pockets.", "Xu Dehai didn't speak.", "\"Seventy-four beats zero.\" Qi Hai said. \"Master Xu, the model gave two numbers: seventy-nine and ninety-six. You're still five off seventy-nine.\"", "\"I know.\"", "\"How's the consideration going.\"", "Xu Dehai slipped a hand into his padded jacket, fingers finding that paper folded in quarters. The paper had softened against body heat.", "\"Unit 03 didn't come up today.\" Wei Xiaoqing beside him said. \"It stood on the eastern flat all morning, didn't move a step. Old flight feathers from molt haven't fully dropped, it won't fly.\"", "\"It doesn't fly every year at this time.\"", "\"Every year at this time someone worries for it.\" Wei Xiaoqing said.", "After the debrief, Xu Dehai stayed alone on the flat. Sun came out, mud began to dry, cracking into fine lines. He walked east, found Unit 03 standing there, one leg tucked, neck sunk into shoulders.", "Its left wing couldn't lift high, right wing lifted higher; standing long, the body listed right.", "\"You know too.\" Xu Dehai crouched. \"You know tomorrow's different.\"", "Unit 03 didn't move.", "At dawn on October 29, the final rehearsal.", "The model's window: 5:38. Zhou Bai said tide level eight centimeters lower than yesterday, flock would lift late, estimated seventy-eight.", "Xu Dehai stood at the shallows' edge waiting, didn't move until 5:40.", "First form, rise. One long whistle blast, fall.", "When the crane flock lifted, Unit 03 wasn't in it.", "It was on the eastern flat, hadn't moved all night, molt unfinished. Zhou Bai said the model had predicted: molt-delay retention probability twelve percent, this batch always had a few that missed the window—Unit 03 happened to be one.", "The flock drew its own arc. Wings spreading, tail closing, like a net.", "One, two, three—he lost count.", "Match rate eighty-one percent.", "Playback was in the morning. On the command center wall, a glowing kunpeng hung over a gray-white sea, wings filled with light—that white the flock flashed in backlight.", "\"Eighty-one.\" Qi Hai said. \"Three cities have better data.\"", "Xu Dehai stood at the very back. He watched that bird, wings filled with light, lower right corner missing a small notch.", "\"What about Unit 03?\" He asked Zhou Bai.", "\"Lifted four minutes late.\" Zhou Bai said. \"It settled on the lower flat, didn't enter frame.\"", "\"It wasn't driven off.\"", "\"It was late on its own.\" Zhou Bai said. \"That's what the model calculated.\"", "That afternoon, Xu Dehai watched the playback three times. He saw his flag-raising posture, saw the flock close, saw the true formation. True.", "When Unit 03 was in, the formation always drifted left a little, crooked a little, slow a little. His father spent a lifetime trying to straighten that drift, never succeeded. The model used four minutes to remove Unit 03 from the sequence, and the formation trued.", "Trued, and correct.", "Before adjourning, Qi Hai held him back.", "\"Master Xu, tomorrow's the live day.\" He said. \"Today eighty-one, tomorrow run this, sign or not sign that form, the gap is fifteen points. Fifteen points, three hundred twenty channels, ninety seconds.\"", "\"Fifteen points short, one less bird.\"", "\"Fifteen points short, one more void in the frame.\" Qi Hai said. \"You do the math.\"", "The execution order was still in his padded jacket. Through the fabric, four folded corners dug into his ribs.", "Evening of the 29th, his father pushed the window open.", "Sea wind billowed the curtain onto the table. Xu Dehai went to close it, hand pausing on the frame.", "\"Wake me tomorrow morning.\" Xu Changgeng said.", "\"Sleep.\"", "\"I'm not sleeping.\" The old man said. \"I'm watching the sea.\"", "Xu Yi called after nine. Tomorrow she'd volunteer at the venue, assigned to the east corridor of the main hall. Her voice was light on the phone, said the volunteers there had uniform vests, prettier than the intersection ones.", "\"Dad,\" she said. \"You're one paper away.\"", "\"What paper.\"", "\"The signing paper.\" Xu Yi said. \"Sign it and it's done. You don't sign, image fails, you still owe 120,000, image still fails.\"", "\"You understand this.\"", "\"I don't.\" She said. \"I only know when I don't sign, no one gives me expedited.\"", "Call ended.", "10:20, Wei Xiaoqing's messages came in, three.", "One: tomorrow wind shifts north to east, Sonic Array fan offset, Match Rate projected drop to seventy-four.", "Two: contingency: array output from 115 dB to 130 dB, sustained no more than four minutes, can pull Match Rate back to ninety. Cost: Unit 03 and seven behind it startled beyond safety radius, furthest may hit light rigs.", "Three: I don't sign the safety redline. Decision rests with Release Commander.", "Last message from Qi Hai, one sentence: Execution order valid until midnight tonight.", "Xu Dehai sat on the stone block in the courtyard.", "That quarter-folded paper in his padded jacket dug at his ribs. He didn't pull it out.", "Wind came from the north. He went upstairs, cracked the window. The old flag on the sill snapped, a dense rattle. A crane on the flag face, embroidery faded to gray.", "Tomorrow wind comes from the east. The flag will flip."]}, {"index": 4, "title": "Chapter 4: Formation Match", "words": 10054, "paragraphs": ["At four a.m. on the thirtieth, the Old House.", "Father was coughing. A cloth pressed against his mouth, muffling the sound — once, twice, three times. Xu Dehai stood in the doorway for a moment, did not go in.", "He took the flag from the windowsill. White cloth with red trim, one foot eight inches, the pole bamboo, stuck in a brick joint, stuck there for over a decade, the bricks in the joint loosened.", "\"Your mother embroidered it.\" Xu Changgeng said in the darkness.", "\"Mm.\"", "\"She only knew how to embroider cranes.\"", "Xu Dehai rolled the flag, tucked it under his arm.", "On the command platform, Qi Hai was waiting for him.", "Dawn had not broken, the sea was black, the distant venue's silhouette outlined in lights.", "The execution order had expired at midnight last night. He hadn't slept all night; the creases on that paper inside his padded jacket had been pressed soft. The paper had expired, the man had not.", "\"Sign or not.\" Qi Hai asked.", "Xu Dehai pulled the paper folded in quarters from his jacket, unfolded it. The signature block was empty. He folded it again, handed it back.", "\"Birds don't recognize paper.\"", "Qi Hai took it, glanced at the creases, nothing beyond the creases. He folded it in half, slipped it into an inner pocket.", "\"Master Xu,\" he said, \"I've given you several options.\"", "\"You've urged me three times.\"", "\"Did you listen once?\"", "Xu Dehai turned and walked toward the tidal flat.", "\"Old Xu.\" Qi Hai called from behind.", "He looked back.", "\"Ninety-six and seventy-nine.\" Qi Hai said, \"I gave you two numbers. Don't blame me later for giving you something else.\"", "Five forty, Baisha Spit.", "The barriers had been pulled up before dawn, blue panels running from the highway edge to the tidal flat edge, enclosing the whole of Baisha Spit. Welcome slogans and maps printed on the panels. Dogs had been led away long ago. Only him on the flats.", "Unit 03 stood on the east side.", "Still in its old position, between two wooden stakes. He hadn't removed those stakes, hadn't taken the twelve thousand, and now they stood under the lights like two stakes grown from the mud.", "At four fifty, the light array rose.", "Two hundred forty drones lifted from both sides of the Yubei Corridor, fanning out over the sea. Each carried a dense panel of cool white lights, hundreds of points connecting into lines. Wind came from the north, the array stabilized, 170,000 light points beginning to converge on a shape.", "That bird slowly grew in the eastern sky. Wings first two faint traces, then bone, then feathers, extending toward the wingtips one layer at a time. Wingspan three hundred meters, longer than the cross-sea bridge of Nanyu Bay.", "Daylight brightened bit by bit. A little brighter, and this bird would vanish — the dot-matrix relied on the difference between sky and light to show form.", "Xu Dehai stood in the mud, flag under his arm.", "Five fifty-eight, the first speaker group began working. Sound pushed up from beneath the tidal flats, low, muffled. The crane flock rose in the shallows.", "\"Master Xu.\" Zhou Bai in the earpiece, \"Array standing by. Model recommends high power, one-fifteen to one-thirty decibels, within four minutes, match rate can reach ninety.\"", "\"Who signed.\"", "\"No one. Safety redline needs Engineer Wei to sign.\"", "Two seconds of silence in the earpiece.", "\"I won't sign.\" Wei Xiaoqing said, \"High power, no sign. One-thirty decibels is the redline value, sign it and there's no way back. Three reasons. First, hard push will flush Unit 03 and the seven behind it out of the safety radius, farthest push three hundred meters, exit under those three light towers. Model gives collision probability, twelve percent. Second, four of those seven are this year's new birds, first time with full flight feathers. Third —\" she paused, \"Third, I won't sign, I have no on-site signature.\"", "\"Master Xu.\" Zhou Bai said, \"Camera window six-ten to six-eleven-thirty.\"", "Xu Dehai watched the east.", "Unit 03 rose.", "It left the water first, wings beating slow, left side not lifting high, whole body listing right. After rising it didn't head for the southern airspace, it veered north a little, bringing a flock behind — a scattered, crooked flock, one bird fallen back chasing to catch up.", "Same as every year.", "\"Master Xu.\" Qi Hai in the earpiece, voice lower than usual, \"I recommend high power. If not executed, formation dispersion probability exceeds standard in four minutes. For the summit image, please confirm.\"", "Xu Dehai did not answer.", "He stepped back two paces, the control box underfoot, iron, a knife switch on the cover, counterclockwise to cut.", "Zhou Bai three meters beside him.", "\"No backup if cut.\" Zhou Bai said.", "\"I know.\"", "Xu Dehai reached out, gripped the knife switch handle, turned counterclockwise.", "Click.", "Eighteen speaker groups fell abruptly silent. The wall squeezing the birds in the middle was gone.", "The crane flock no longer pressed by anything. They scattered in the eastern sky, formation breaking into segments, then one segment held itself together — Unit 03 leading a dozen north, the rest hesitating, circling half a turn in place.", "That glowing Kunpeng still in the sky. Wings spread, nothing inside the wings.", "A small screen on the control box side, the director's signal return.", "A tiny speaker emitted: \"All positions, Nanyu side, standing by.\"", "Screen showed sea first. Daylight just enough, sea gray-white. Then that bird.", "A glowing one, huge, wings spread across the sea, from eastern sky all the way to western sky. Xu Dehai had seen this shape, in the city's promo reels, on the airport hall's looping screens.", "Then the flock entered.", "Not as he remembered. They didn't queue, didn't fill gaps, inserted diagonally from the right, chaotic, several nearly falling out, one banking sharply and returning.", "They flew past the front of that glowing bird.", "One flew very slow, trailing the formation, one wing high one wing low.", "Ninety seconds.", "The glowing outline on screen remained, wings empty, that small cluster of white dots passing through the void.", "\"Next item.\" Director said.", "Xu Dehai stood in the mud, did not move.", "Cold wind funneled into his cuffs. Mud sucked at his soles, pull once, a wet sound.", "Later he checked his watch once. Six forty-two. The light array's points still burning, would burn until daylight fully overwhelmed them. That bird's shape fading bit by bit on the daytime sea, wings gone first, then body, finally tail.", "Unit 03 and the rest gone north.", "A Cityscape Platform vehicle stopped at the barrier entrance. Driver honked once, didn't get out. Xu Dehai walked out of the mud, shoes stuck, a wet sound pulling free. Zhou Bai collected his log board, followed behind.", "Seven ten, they reached the command center.", "On the platform, two people in reflective vests entering light array coordinates into tablets; another group went to Baisha Spit to dismantle barriers. No one came to ask him.", "Second floor corridor window open. Cui Shouzhuo stood at the window, the \"Release Consultant\" badge on his chest catching morning light. He just stood there, didn't come down.", "\"Master Xu.\" Zhou Bai walked over, log board in hand, \"Array shut down by you?\"", "\"Me.\"", "\"Have to write it in the log.\" Zhou Bai wrote on the board, \"Reason.\"", "\"No reason.\"", "\"Then write commander's judgment.\"", "\"Write it.\"", "Nine a.m., command center meeting.", "\"Match rate zero.\" Zhou Bai said, \"No cranes entered outline in footage. Light array normal, dot-matrix error within 1.2 meters. Array ceased operation at six-ten-zero-four.\"", "Qi Hai sat at the head of the long table. A paper before him.", "\"Master Xu,\" he said, \"Per contract, seventh failed match. First, your collaboration qualification revoked, effective immediately you may not enter any Baisha Spit work zone. Second, compensation 120,000 — training, equipment occupancy, and channel fees, due by November 10. Third, the Crane Herding intangible heritage registration, not filed this year.\"", "\"Mm.\"", "\"One more.\" Qi Hai said, \"Your Viewscore, forty-three.\"", "Xu Dehai said nothing.", "\"At nine twenty, the venue received two complaints. One said the bird in the image didn't form, one said lower left of frame had illegal structure, affecting city appearance.\" Qi Hai said, \"Second one means those two stakes at your house and that shed roof.\"", "\"I didn't tear them down.\"", "\"I know.\" Qi Hai said, \"Agreement says don't tear down, can't protect the score.\"", "He pushed the paper across.", "\"But Master Xu,\" Qi Hai said, \"What I can give you now is another job.\"", "Xu Dehai looked at the paper.", "\"The city museum building a permanent exhibit, called Nanyu's Crafts. Missing a Crane Herding section. They're doing oral history, need audio, need video, need your flag, your whistle, those two old logs of yours.\" Qi Hai said, \"Light work, three days a week. Long-term contract, social insurance. Manuscript fee I'll apply for you.\"", "\"Stay.\" Qi Hai said, \"Stay in our cabinet.\"", "Xu Dehai did not reach out.", "\"Master Xu?\"", "\"My daughter starts work tomorrow.\" He said.", "He walked out of the command center at ten. Sun was out, nothing on the sea.", "November 10, community hospital.", "Fath const L = {"cover_label": "Title Page & Synopsis", "unit": " chars", "by": "By ", "meta_sep": " | ~", "intro_title": "About this book", "prev": "← Previous", "next": "Next →", "start": "Start Reading →", "ch_prefix": "Chapter ", "ch_mid": " | ", "theme_dark": "☀️ Light Mode", "theme_light": "🌓 Dark Mode"};
let currentIndex = -1; // -1 = title page / synopsis
let fontSize = 17;

function renderSidebar() {
    const list = document.getElementById("chapterList");
    list.innerHTML = `<li class="chapter-item ${currentIndex === -1 ? 'active' : ''}" onclick="goToChapter(-1)">
        <span>📖 ${L.cover_label}</span>
    </li>`;
    book.chapters.forEach((ch, idx) => {
        const li = document.createElement("li");
        li.className = "chapter-item" + (currentIndex === idx ? " active" : "");
        li.innerHTML = `<span>${ch.title}</span><span class="ch-words">${ch.words}${L.unit}</span>`;
        li.onclick = () => goToChapter(idx);
        list.appendChild(li);
    });
}

function renderContent() {
    const wrapper = document.getElementById("articleWrapper");
    const label = document.getElementById("currentChLabel");
    if (currentIndex === -1) {
        label.innerText = L.cover_label;
        wrapper.innerHTML = `
            <div class="article-header">
                <h1>${book.title}</h1>
                <div class="article-meta">${L.by}${book.author}${L.meta_sep}${book.total_words.toLocaleString()}${L.unit}</div>
            </div>
            <div class="intro-box">
                <h3 style="margin-bottom:12px;color:var(--accent);">${L.intro_title}</h3>
                <div style="white-space: pre-wrap; line-height:1.75;">${book.description}</div>
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" disabled>${L.prev}</button>
                <button class="nav-btn" onclick="goToChapter(0)">${L.start}</button>
            </div>
        `;
    } else {
        const ch = book.chapters[currentIndex];
        label.innerText = ch.title;
        const pTags = ch.paragraphs.map(p => `<p style="font-size: ${fontSize}px;">${p}</p>`).join("");
        wrapper.innerHTML = `
            <div class="article-header">
                <h1>${ch.title}</h1>
                <div class="article-meta">${L.ch_prefix}${ch.index}${L.ch_mid}${ch.words}${L.unit}</div>
            </div>
            <div class="article-body">
                ${pTags}
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" onclick="goToChapter(currentIndex - 1)">${L.prev}</button>
                <button class="nav-btn" onclick="goToChapter(currentIndex + 1)" ${currentIndex >= book.chapters.length - 1 ? 'disabled' : ''}>${L.next}</button>
            </div>
        `;
    }
    document.getElementById("content-container").scrollTop = 0;
}

function goToChapter(idx) {
    if (idx < -1 || idx >= book.chapters.length) return;
    currentIndex = idx;
    renderSidebar();
    renderContent();
}

function toggleTheme() {
    const current = document.documentElement.getAttribute("data-theme");
    const next = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    document.getElementById("themeBtn").innerText = next === "dark" ? L.theme_dark : L.theme_light;
}

function changeFontSize(delta) {
    fontSize = Math.max(14, Math.min(26, fontSize + delta));
    const paras = document.querySelectorAll(".article-body p");
    paras.forEach(p => p.style.fontSize = fontSize + "px");
}

renderSidebar();
renderContent();
</script>
