const book = {"title": "拾膜 (English Edition)", "author": "FutureTxt AI Writer", "description": "When the Spring Thunder awakens the soil of Lunan Gazhuang, seventy-one-year-old Lao Ge unearths not just residual film, but nineteen years of evidence—nineteen glass jars on his windowsill, each sealing a season of white waste. His son, Ge Shengli, calculates input-output ratios, buying thinner \"engineering film\" to cover more acreage. Village supplier Lao Zhao weighs personal favors against fines, slipping banned film to regulars out back. Grandson Xiaojun, a packaging worker in Linyi, calculates factory deductions and travel costs. The new county technician calculates quotas and career prospects. Four generations tally accounts around this gossamer-thin plastic: profit, patronage, penalties, paychecks, performance metrics. Only Lao Ge, illiterate, knows a different arithmetic. He reads the white fog embedded in his fingernails, the debt that flies on the wind—forever uncollected, forever unpayable. A stark chronicle of intergenerational reckoning, where the \"white revolution\" that fed a village becomes the shackles on its land, and survival calculates its own ecological bankruptcy.", "total_words": 14625, "chapters": [{"index": 1, "title": "拾膜 (English Edition)", "words": 14625, "paragraphs": ["After the Awakening of Insects solar term passed, Lao Ge went into the fields to collect film.", "The wheat hadn't greened yet; the earth lay empty. Last autumn's mulch had flipped onto the soil surface, torn into scraps by wind, some pinned under clods with only a white edge showing. He bent, pinched that white edge between thumb and forefinger, pulled—bringing a chunk of soil with it—shook it twice against his knee, the soil fell away, the film remained. He folded the film into a tight roll, stuffed it into his jacket pocket.", "When the pocket was full, he went home, dumped the film onto the windowsill, picked out the muddiest pieces, scrubbed them with a toothbrush. Cleaned, dried, bottled in glass jars. Peach preserve jars, washed out and saved, one jar per year's harvest.", "Nineteen jars stood on the windowsill. The twentieth was empty, mouth up, waiting.", "The habit began in 2008. That year, he laid mulch for peanuts for the first time. After harvest, plowing, a white trail followed the plowshare—he thought it was plastic twine, tugged it, found film. That year he only gathered a handful, tossed it into the stove and burned it. The stench was foul; he remembered it for years.", "Later he learned film couldn't be burned, couldn't be buried. Wind blew, rain washed, it migrated deeper into the soil.", "Knowing didn't make it easy. In 2009, peanut emergence was patchy, gaps everywhere. He blamed the seed, replanted a batch, still gaps. The village's old agricultural technician crouched in the field, dug two spadefuls, made him look: a white layer ran horizontally through the soil—last year's film. Lao Ge didn't believe it, said film that thin would've degraded long ago. The technician said, it doesn't degrade, buried fifty years it won't degrade. He brought that spadeful home, dumped it on the doorstep flagstone, rubbed it between his hands, rubbed all night, rubbed out a handful of film.", "From that year on, he collected film.", "The town had a collection point, a sign reading \"Residual Film Recycling, Green Home.\" Lao Ge went twice in a year.", "First time, he carried half a sack. The collector, Old Zhou, tossed the sack on the scale, glanced, said too much soil, tare deduction. After deduction, one jin two liang, one yuan fifty. Old Zhou said, Grandpa, this little bit isn't worth your round trip. Lao Ge shouldered the sack back, said then I won't sell. Old Zhou wrote in his ledger anyway: collected forty jin. He wrote it right in front of him.", "Second time, Lao Ge didn't enter, just stood at the door watching. A layer of dust coated the scale.", "After that, he stopped throwing it away.", "Lao Ge farmed eight mu—five east of the village, three south. His knees started aching the year before last; crouching required a handhold, standing required a pause. Last winter, two households in the village transferred their land, eight hundred yuan per mu per year, to a large-scale grain grower. Someone asked him; he calculated, said neither yes nor no.", "\"Can you still handle farming?\" his wife asked.", "\"I can handle it.\"", "She didn't ask again. She knew when he said he could handle it, he was talking about something else.", "In March, on market day, Shengli went to the farm supply store for film.", "Shengli was his son, forty-six, drove a used light truck—hauling bricks for house builds, hauling grain at harvest, everyone called him. Buying film was his annual job, done efficiently.", "Old Zhao's store sat at the village entrance, three storefronts—fertilizer, seed, pesticide, sprayers—a folding table at the door with an electronic scale. Film stacked in the back, bundles upright, wrapped in printed plastic sheeting bearing four characters: Engineering Film.", "\"How many microns?\" Old Zhao asked.", "\"Same as always.\" Shengli said.", "\"Same as always.\" Old Zhao stood, walked to the back room.", "Lao Ge followed. He rarely went out, but today he came, didn't say what he was buying, just stood in the doorway staring at that wall. A sheet of paper was pasted there, white with black characters: *Commitment Letter for Agricultural Film Business*, Old Zhao's signature at the bottom, and below the signature a line of handwritten small print:", "This store does not sell agricultural mulch film, only engineering film.", "\"Back room stuff, how much per ton?\" Lao Ge asked.", "\"Eight thousand eight.\" Old Zhao emerged from the back room, a bundle on his shoulder, \"Same price as the thick stuff, sold by weight.\"", "\"Thin and thick same price.\" Lao Ge said, \"Then this bundle of thin stuff covers two more mu.\"", "\"Right.\" Old Zhao set the bundle down, \"Grandpa, you keep better accounts than me.\"", "\"Then why don't you sell the thick stuff?\"", "\"Nobody wants the thick.\" Old Zhao said, \"Same ton, thick covers one and a half mu, thin covers two and a half. You choose.\"", "Lao Ge said nothing. He stared at the bundle. Packaging bore four large characters: Engineering Film. Below, small print: Purpose: Construction, Concrete Curing.", "\"This isn't for fields.\"", "\"All printed like this.\" Old Zhao said, \"Print 'mulch film', inspections happen; print this, no inspections. Grandpa, a truckload comes from Linyi, hundreds of li, printed before it leaves.\"", "\"How much.\"", "\"Four hundred eighty per bundle.\"", "\"Thick stuff?\"", "\"Thick is six hundred twenty. Difference of one forty.\" Old Zhao said, \"Difference comes from your pocket.\"", "\"Quality certificate?\" Lao Ge asked.", "Old Zhao fished a paper from the drawer, pressed under the scale, pulled it out and handed it over. Red stamp printed on it, product name read \"Polyethylene Blown Agricultural Ground Cover Film\", thickness column blank.", "\"Why's it blank?\"", "\"Filled ones have all been inspected.\" Old Zhao took the paper back, \"Grandpa, you want a certificate, I've got certificates. You want thin, I've got thin. What do you actually want.\"", "Lao Ge looked at his son. Shengli was staring at his phone, the village WeChat group—someone saying land rent rose, someone saying water fees rose. He didn't look up, said: \"Dad, everyone buys thin.\"", "\"Buy thin, next year I'm still collecting.\"", "\"Collect then.\" Shengli said, \"You're idle anyway.\"", "Lao Ge fell silent. He fished a small roll of film from his pocket, collected that morning, still damp with mud. He unrolled it, shook it onto the table beside the electronic scale, a neat square, a corner lifting in the breeze.", "\"Feel it.\" He said.", "Shengli didn't touch. Old Zhao glanced once, didn't glance again.", "\"From last autumn.\" Lao Ge said, \"This thin, shattered by autumn.\"", "\"Dad,\" Shengli pocketed .", "Xiao Jun was Shengli's son, twenty, worked in Linyi at a warehouse. Returned that afternoon wearing a vest, broader shoulders, thinner. Grandmother made flatbreads, he ate four straight, then lay on the bamboo cot unmoving.", "\"City food not good?\" Lao Ge asked.", "\"Food's fine.\" Xiao Jun said, \"Just standing, twelve hours a day.\"", "\"Standing for what.\"", "\"Packing.\" Xiao Jun said, \"Orders come in, we pick, box, label.\"", "\"Packing what.\"", "\"Film.\" Xiao Jun said, \"Roll after roll, mostly. Two big markets in Linyi, specialize in this.\"", "\"Where to.\"", "\"Everywhere.\" Xiao Jun said, \"South, north, addresses on orders. Grandpa, we just label.\"", "\"How many a day.\"", "\"Over a thousand.\"", "Lao Ge didn't ask further. He took the nineteenth jar from the windowsill, set it before Xiao Jun. Film inside crushed into fragments, rolled tight, yellowed, a layer of soil at the bottom—swept in that year.", "\"Last year's.\" He said.", "Xiao Jun picked it up. Held it to his eye, turned it, saw a strip of transparent tape on the glass, written with a year: 2025.", "\"All collected by you?\"", "\"One jar a year.\" Lao Ge said, \"Started the year you turned eight.\"", "Xiao Jun didn't speak. Set the jar back, gently. After a while he asked: \"Grandpa, why collect this?\"", "\"One less piece in the soil is one less piece.\" Lao Ge said.", "After the dog days began, the county sent people.", "A technician from the agricultural station, surnamed Ding, mid-twenties, black messenger bag holding soil core samplers and sample bags. First to the village committee, then to fields—took soil samples from several peanut and garlic plots, then visited a few farm supply stores in town.", "At Old Zhao's store that day, door open, ledger spread on the table. Little Ding asked if they sold mulch film. Old Zhao said, sell engineering film, not mulch film. Little Ding asked, any thin stuff. Old Zhao said, no.", "Little Ding had no evidence. He flipped two bundles' packaging—indeed printed Engineering Film, purpose: Concrete Curing. He photographed, left.", "Two days later, he returned. Straight to the field, crouched at film edge, sliced a scrap with a paper cutter, bagged it, labeled: *Farmer's Own Use, Sample 1*. Three households sampled, fourth no answer.", "Little Ding was county-born, family farmed, father ran greenhouses. Agricultural school grad, second year at the station, first independent sampling. Veterans told him two things: sample soil from under roots; ask which season the film came from.", "Thickness not visible in field, must send to city for testing. Little Ding's bag held a progress sheet, eight household samples, due month-end. He knew even if all eight tested positive, the source lay in factories hundreds of li away, separated by a layer of paper.", "He still walked household to household.", "Lao Ge saw him at his field edge, shouted across two ridges: \"What you're sampling, which plot?\"", "\"Your east plot.\"", "\"East plot, film's thin.\" Lao Ge said.", "Little Ding looked up, pushed his straw hat back.", "\"How do you know.\"", "\"Collected nineteen years.\" Lao Ge said.", "That afternoon, Little Ding followed Lao Ge home. Washed hands at the courtyard water vat, entered, saw the windowsill.", "Nineteen jars in a row, one empty jar at the far east.", "Village had no shortage of gossip.", "Shengli returned that night, face dark. Stood in the courtyard a moment, entered saying: \"Dad, don't tell that man our film's thin.\"", "\"Why.\"", "\"You say it, he'll investigate Old Zhao.\" Shengli said, \"Investigate Old Zhao, whole village talks about us. Old Zhao sells to everyone, you speak up, you single him out.\"", "\"Then investigate.\"", "\"Dad.\" Shengli slapped his truck keys on the table, \"Farmed all your life, still don't understand? Everyone uses thin. You point at one, tomorrow three more. You point at Old Zhao, next year where do we get fertilizer? Where do we get credit?\"", "The inner door opened. Lao Ge's wife came out, poured Shengli a bowl of water, poured Lao Ge a bowl, set them between the two men, said nothing, returned inside.", "Lao Ge lifted his bowl, drank a sip.", "\"I'm not pointing at Old Zhao.\" He said.", "Shengli sat, like exhaling.", "\"I'm pointing at myself.\" Lao Ge said.", "That night, Old Zhao came.", "Didn't enter, sat on a stool in the courtyard, a bag of peach cookies in his lap, never set it down. Lao Ge moved a stool opposite. A small lamp between them, moths on the bulb.", "\"That technician,\" Old Zhao said, \"came to my store. Photographed, flipped packaging, half a day, found nothing.\"", "\"Mm.\"", "\"He ask you anything.\"", "\"Asked about film.\"", "Old Zhao stared at the cookie bag, red lettering whitened by his grip.", "\"Grandpa,\" he said, \"you know why I sell this. My son's in county high school, two thousand four a month. Wife's health poor, medicine never stops. Thick won't sell, thin I won't sell, others sell. I don't sell, next year I close, go haul sacks in Linyi. My age, can't out-haul them.\"", "\"I know.\" Lao Ge said.", "\"Then why still speak.\"", "\"Speak.\" Lao Ge said, \"I don't speak against you.\"", "Old Zhao looked up.", "\"I speak against myself.\" Lao Ge said, \"Goods you sell, you sourced. Goods I lay, I laid with my hands. I lay it, I collect it.\"", "Old Zhao studied him long. Stood, set the cookies on the stool, said: \"Grandpa, you keep the bag.\" Walked into night, motorcycle headlight flashed at the alley mouth, died.", "Next morning, Little Ding returned, sampling form in hand.", "Sat on the door sill, form on his knees, read each line to Lao Ge: sampling unit, sample name, sampling location, sampler, farmer signature. At the last line, he paused.", "\"Grandpa,\" he said, \"one more thing, awkward. Your jars—what year each is, must be clear, otherwise no comparison.\"", "\"All written.\" Lao Ge said.", "He moved the jars from windowsill one by one to the stone table in the courtyard. Morning kaging changed, four large characters became three small: Curing Film. Price tag new, read: *Meets National Standard, Inspection Welcome*.", "Shengli didn't buy film. This year he planted less, only two mu of garlic mulched. Said, see next year.", "Xiao Jun returned to Linyi. Morning he left, rose early, stood in the courtyard awhile, glanced at the windowsill. Nothing there, only nineteen imprints. Pulled out his phone, photographed the imprints, didn't speak, left.", "Days later, a call from the station, for Lao Ge. Call came to village committee, accountant ran to the field shouting. Little Ding on the phone said samples sent to city, results would be shared. Also said, Grandpa, those nineteen jars, our station chief saw, never seen such a thing.", "Lao Ge stood on the phone a moment, asked: \"Jars still alright.\"", "\"Fine, in the archive cabinet.\" Little Ding said, \"Soaking in soil, not a grain spilled.\"", "Twelfth month, a snow fell. After melt, Lao Ge went to the fields.", "Garlic shoots showing, film pressed low. He stood at the field edge a moment, saw a white scrap turned up on the eastern ridge. Walked over, crouched, pinched the white edge between thumb and forefinger, pulled, shook twice, folded into a small roll, pocketed.", "Home, he washed the roll, dried it on the windowsill. North wind came, film lifted, fell, lifted again.", "He placed the roll into the tin his wife had inverted on the windowsill, screwed the lid, found a marker, wrote a year on the glass: 2026.", "On the windowsill, nineteen circular imprints in a row, the empty eastern position, a jar standing."]}]};
const L = {"cover_label": "Title Page & Synopsis", "unit": " chars", "by": "By ", "meta_sep": " | ~", "intro_title": "About this book", "prev": "← Previous", "next": "Next →", "start": "Start Reading →", "ch_prefix": "Chapter ", "ch_mid": " | ", "theme_dark": "☀️ Light Mode", "theme_light": "🌓 Dark Mode"};
let currentIndex = -1; // -1 = title page / synopsis
let fontSize = 17;

function renderSidebar() {
    const list = document.getElementById("chapterList");
    list.innerHTML = `<li class="chapter-item ${currentIndex === -1 ? 'active' : ''}" onclick="goToChapter(-1)">
        <span>📖 ${L.cover_label}</span>

    });
}

function renderContent() {

                <button class="nav-btn" onclick="goToChapter(0)">${L.start}</button>

function goToChapter(idx) {

    currentIndex = idx;
    renderSidebar();
    renderContent();
}

function toggleTheme() {
    const current = document.documentElement.getAttribute("data-theme");
    const next = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    document.getElementById("themeBtn").innerText = next === "dark" ? L.theme_dark : L.theme_light;
}

function changeFontSize(delta) {
    fontSize = Math.max(14, Math.min(26, fontSize + delta));
    const paras = document.querySelectorAll(".article-body p");
    paras.forEach(p => p.style.fontSize = fontSize + "px");
}
