rth — his son Zhou Yuan's room. The wall still held rows of pencil marks recording height, and the doorframe too, from age three to eighteen.", "The woman asked: \"Uncle, what year was the building built?\"", "\"2016.\"", "\"And the renovation?\"", "\"2017.\"", "The young couple glanced at the wall, then at the pencil marks on the doorframe, said nothing.", "The woman went to the kitchen, pulled open a cabinet door, looked, closed it. On the balcony sat a pot of jasmine, tended by Liu Yulan; the leaves still showed some green. The woman asked: \"Is this flower staying?\"", "\"Stays,\" Old Zhou said. \"If you don't mind.\"", "The man gestured in the living room, positioning a sofa, then looked back at Old Zhou, a little embarrassed.", "After the viewing, the man spoke to Old Zhao in the stairwell. Old Zhao came up, wearing a smile that didn't quite reach his eyes.", "\"Uncle, they're offering 390.\"", "\"How much?\"", "\"390.\"", "Old Zhou stood on the balcony. Below lay the compound's concrete road; across from it a mom-and-pop shop where the owner's wife was sorting vegetables at the doorway. When he bought this flat, the down payment borrowed 110,000 from three relatives, took three years to repay. Those three years, he smoked three-yuan cigarettes every day. This flat was the only big thing he had ever done in his life.", "\"I'm not selling,\" he said.", "\"Uncle, I understand.\" Old Zhao said. \"But let me tell you straight: your layout has over 140 other listings right now. You wouldn't sell at 560, wouldn't sell at 480, now they offer 390.\"", "\"I bought at 360.\"", "\"You bought at 360, but you can't sell.\" Old Zhao pulled the door shut, voice lower. \"Uncle, I've been saying this for three years. Wait longer, and 390 will be gone too.\"", "That evening, Old Zhou told his wife.", "Liu Yulan was washing dishes in the kitchen, water running. She didn't turn around.", "\"Not selling,\" she said.", "\"Not selling, what about Zhou Yuan?\"", "\"They're young, renting is fine.\"", "\"Xiao Ya's mother brought it up.\" Old Zhou said. \"Not asking for the flat, asking for the down payment.\"", "Liu Yulan turned off the tap. She dried her hands, came out, sat at the dining table, and laid it out for him:", "\"This flat of ours, 720 in '16 — where did it come from? You got laid off, I worked at the supermarket, 2,800 a month. This flat is what we bought with our lives. You sell at 390 now, that's the first ten years wasted, the next ten years wasted. Old Zhou, we're not speculators. If the price drops we just live in it; living in it, it's still three bedrooms and two living rooms.\"", "\"Live in it, and our son is gone.\"", "\"Our son is in Jiangzhou.\"", "\"Who takes care of us when we're old.\"", "Liu Yulan looked at him, for a while, then said: \"You used to say when you were young, we'd retire back in the village. Then what happened.\"", "Old Zhou didn't answer. He turned on the TV; the news talked housing prices: first-tier rising, second- and third-tier falling. He listened halfway, set the remote down.", "Zhou Yuan came back Saturday.", "Walked in calling Mom, then Dad, threw his bag on the sofa, dropped into a chair, legs stretched out. He did renovation supervision in Jiangzhou, came back three or four times a year, and when he did he just ate the family's noodles.", "After dinner, Old Zhou told him.", "\"390,\" he said. \"I'm thinking of selling, to help with your down payment.\"", "Zhou Yuan froze.", "\"Sell for how much?\"", "\"390.\"", "\"Bought for how much.\"", "\"720.\"", "No one spoke at the table for a moment. Liu Yulan was in the inner room folding clothes, slowly.", "\"Dad,\" Zhou Yuan said, \"don't sell.\"", "\"Don't sell, how short are you on the down payment?\"", "\"Twenty-some thousand. I'll save two more years.\"", "\"Will Xiao Ya's mother give you two years?\"", "Zhou Yuan lowered his head. His bag held the receipt for the three gold pieces, bought last month; his phone held a location map of a Jiangzhou development, a red circle drawn on the middle ring. He clenched both, said nothing.", "\"Dad,\" he said, \"I'm not coming back.\"", "\"The flat's right here.\"", "\"What would I come back for.\" Zhou Yuan looked up. \"Delivery, factory, or wait till forty-five for internal retirement? Dad, factories hiring in the county now pay 3,500 a month. I come back, Xiao Ya comes back, we make 7,000 together, kid goes to school, what do I feed them with.\"", "\"You make 12,000 in Jiangzhou, rent 3,800, how much left.\"", "\"More than in the county.\"", "\"How much more.\"", "\"Two thousand.\"", "\"Two thousand more, what about when you're forty.\"", "Zhou Yuan didn't answer. He stood, went to the balcony for a bit. Came back saying: \"Dad, Xiao Ya and I talked, we'll register the marriage first, the flat can wait. Her mother's side, I'll go talk.\"", "\"Can you talk them round?\"", "\"Even if I can't, I have to.\"", "Old Zhou looked at his son. Twenty-nine this year, hair thicker than Old Zhou's at that age, skin on his hands thinner, nails trimmed clean. Old Zhou suddenly remembered: the day this kid left for university at eighteen, he also stood by this table, said \"Dad, I'm off.\" Back then Old Zhou waved, said \"Go.\" This time he didn't want to wave.", "The prospective mother-in-law came Wednesday.", "Met in Jiangzhou, a home-style restaurant on the fourth floor of a big mall. Old Zhou and Liu Yulan took the high-speed train early, an hour and a half. They arrived early, read the menu twice, decided on dishes. The mother-in-law arrived later, wearing a camel coat, permed hair, apologized first, said the hospital had an emergency.", "She sat, praised Xiao Ya first, then the kids' hardships, finally brought the matter to the table.", "\"Old Zhou, I'll speak plainly, don't mind my directness.\" She said. \"We're not asking for the flat, we're asking for an attitude. In Jiangzhou, renting works, but the kid needs school, school registration needs a flat. I'm not asking you hey're not the only ones coming back.\"", "\"Believe it.\" Old Zhou said.", "\"Your flat, we're not overpaying.\"", "\"I'm selling at a loss.\"", "The father froze, then nodded: \"True enough.\"", "Old Zhao laid out documents one by one: property deed, deed tax receipt, maintenance fund receipt, copy of original purchase contract. Old Zhou opened the deed, glanced at the registration date — March 2016. Closed it, pushed it back.", "Old Zhou picked up the pen. Old Zhao pushed the ink pad over. His hand hovered over the paper; the pen was a gel pen, barrel printed with the agency's ad, slippery in his grip.", "He thought a moment, thought of those pencil marks on the doorframe.", "Then he signed.", "Three characters, Zhou Jianguo, slower than usual. Finished, pressed thumbprint, red ink on his thumb, wiped twice before clean.", "Liu Yulan didn't come. She was home packing. Old Zhou returned, found her on the balcony, stuffing dried quilts into bags.", "\"Signed?\"", "\"Signed.\"", "She \"mm\"-ed, flattened the bag, pressed air out with her knee, tied it tight. Done, she stood on the balcony, looked at the opposite building, said: \"380.\"", "\"380.\"", "\"Fine.\" She said. \"Go then, go.\"", "Moving day was overcast.", "Twenty-three cardboard boxes, sixteen woven bags, plus an old wooden toolbox — eight-pound hammer, wrenches, screwdrivers, saved from his fertilizer factory years. Movers came two men, scuffed a gray streak up the stairwell.", "Buyer arrived afternoon, carrying a bucket of latex paint, two brushes. The woman entered first, walked a circle, said: \"Uncle, we're repainting the walls.\"", "Liu Yulan was dragging the last bag to the door. She heard, stopped, looked at the pencil marks on the doorframe, said: \"That… could you not paint?\"", "The woman followed her gaze, hesitated. The man behind said: \"Auntie, not intentional. Just the kid will write on walls later, I'm worried.\"", "\"Paint it.\" Old Zhou said.", "He fished out the keys from his pocket, const L = {"cover_label": "Title Page & Synopsis", "unit": " chars", "by": "By ", "meta_sep": " | ~", "intro_title": "About this book", "prev": "← Previous", "next": "Next →", "start": "Start Reading →", "ch_prefix": "Chapter ", "ch_mid": " | ", "theme_dark": "☀️ Light Mode", "theme_light": "🌓 Dark Mode"};
let currentIndex = -1; // -1 = title page / synopsis
let fontSize = 17;

function renderSidebar() {
    const list = document.getElementById("chapterList");
    list.innerHTML = `<li class="chapter-item ${currentIndex === -1 ? 'active' : ''}" onclick="goToChapter(-1)">
        <span>📖 ${L.cover_label}</span>
    </li>`;
    book.chapters.forEach((ch, idx) => {
        const li = document.createElement("li");
        li.className = "chapter-item" + (currentIndex === idx ? " active" : "");
        li.innerHTML = `<span>${ch.title}</span><span class="ch-words">${ch.words}${L.unit}</span>`;
        li.onclick = () => goToChapter(idx);
        list.appendChild(li);
    });
}

function renderContent() {
    const wrapper = document.getElementById("articleWrapper");
    const label = document.getElementById("currentChLabel");
    if (currentIndex === -1) {
        label.innerText = L.cover_label;
        wrapper.innerHTML = `
            <div class="article-header">
                <h1>${book.title}</h1>
                <div class="article-meta">${L.by}${book.author}${L.meta_sep}${book.total_words.toLocaleString()}${L.unit}</div>
            </div>
            <div class="intro-box">
                <h3 style="margin-bottom:12px;color:var(--accent);">${L.intro_title}</h3>
                <div style="white-space: pre-wrap; line-height:1.75;">${book.description}</div>
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" disabled>${L.prev}</button>
                <button class="nav-btn" onclick="goToChapter(0)">${L.start}</button>
            </div>
        `;
    } else {
        const ch = book.chapters[currentIndex];
        label.innerText = ch.title;
        const pTags = ch.paragraphs.map(p => `<p style="font-size: ${fontSize}px;">${p}</p>`).join("");
        wrapper.innerHTML = `
            <div class="article-header">
                <h1>${ch.title}</h1>
                <div class="article-meta">${L.ch_prefix}${ch.index}${L.ch_mid}${ch.words}${L.unit}</div>
            </div>
            <div class="article-body">
                ${pTags}
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" onclick="goToChapter(currentIndex - 1)">${L.prev}</button>
                <button class="nav-btn" onclick="goToChapter(currentIndex + 1)" ${currentIndex >= book.chapters.length - 1 ? 'disabled' : ''}>${L.next}</button>
            </div>
        `;
    }
    document.getElementById("content-container").scrollTop = 0;
}

function goToChapter(idx) {
    if (idx < -1 || idx >= book.chapters.length) return;
    currentIndex = idx;
    renderSidebar();
    renderContent();
}

function toggleTheme() {
    const current = document.documentElement.getAttribute("data-theme");
    const next = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    document.getElementById("themeBtn").innerText = next === "dark" ? L.theme_dark : L.theme_light;
}

function changeFontSize(delta) {
    fontSize = Math.max(14, Math.min(26, fontSize + delta));
    const paras = document.querySelectorAll(".article-body p");
    paras.forEach(p => p.style.fontSize = fontSize + "px");
}

renderSidebar();
renderContent();
</script>
