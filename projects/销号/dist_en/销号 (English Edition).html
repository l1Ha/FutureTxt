egistered Effective Immediately.** Code revoked, ambulances couldn't locate, couriers couldn't deliver, household registry showed no such person. He touched the rough bark, fingertips sinking into fissures, nail beds packed with black mud. Spiders hid in bark cracks, startled scattering, spindly legs tracing near-invisible *shasha* on the rough surface.", "Livestream continued. Lens auto-tracked, frame center always his back, or profile, or close-up of hoe flying. Lower-right three columns frozen: Remaining On-Camera Time 716:23:11, Credit Score 75, Nostalgia Voucher Balance 958,432.00 (Frozen). The three characters \"Frozen\" alternated gray-white, like breathing.", "Barrage someone typed: \"Is streamer protesting?\" \"Don't overthink, peasants are like that.\" \"Vouchers frozen but still streaming? Platform generous.\"", "Seventh hour, right knee swollen like a large steamed bun, trouser leg cutting into flesh, fabric edges pressing two purple-red marks. Each step, cane tip spot *men* on the slab, like striking his own heart. Cough turned to dry heaves, stomach acid burning throat, sour water scalding esophageal mucosa. He dared not stop; stop meant credit drop, drop below eighty meant permanent voucher freeze—painkillers, rice, kerosene all unbuyable. After administrative code revocation, county hospital registration showed \"No Such Resident,\" ambulance navigation couldn't find Yunling Village. Only this livestream's Nostalgia Vouchers stayed hot—as long as he performed. Sweat soaked his collar, clung cold to his spine; wind blew like a layer of ice.", "\"Streamer drink water.\" \"Backend send streamer a case of painkillers.\" \"This is real countryside, not those fake influencer villages.\"", "Twelfth hour, Chen Xiaoyu called again, voice hoarse, nasal: \"Grandpa, I set your account backend to 'Self-Visible Only.' Director Zhao's in a meeting, says Yunling Village deregistration 98% complete, last household must cooperate. I… I wrote the three cypresses' coordinates in my personal memo, didn't report to system.\"", "Phone receiver carried her sniffle, wet. \"Okay.\" He answered, hoe *ji* severing a tree root, thumb-thick, blade impact sending dull vibration up the handle straight to his shoulder. \"Not reported, good.\"", "\"Grandpa don't scare me, why're your hands shaking?\" She lowered voice, background someone playing *The Internationale* ringtone. \"Backend shows your heart rate 112, blood oxygen 89. Smartwatch data synced up.\"", "Watch strap chafed wrist itchy, blue veins rising and sinking under skin. \"Old, useless.\" He tossed the hoe, slumped on the terrace ridge, cane *men* falling into mud, copper tip sinking three centimeters into soft earth. Phone screen faced sky; livestream frame all gray-white clouds and three cypress silhouettes. Clouds low as if pressing onto treetops, edges curling and rolling, a vast gray net. Lower-right Credit Score ticking: 74, 73, 72.", "Barrage quieted a moment, then went wild.", "\"Streamer collapsed?\" \"Call ambulance!\" \"Where's Yunling Village? Navigation finds nothing.\" \"@PlatformCS @CountyGov Save him!\"", "\"Ambulance can't enter.\" He spoke to the lens, voice light as wind through needles, vocal cords barely vibrating, pure airflow through glottis. \"Code revoked, navigation has no this place.\"", "He remembered his wife. She left this same season, rice just soaked. She picked two plump grains, wrapped in coarse cloth, said: Keep them, plant next year. Next spring, that one mu was zoned into carbon sink forest planning. The jar was her pickled radish jar, rim chipped, she wired it tight, said still usable; later held her ashes, buried under the three cypresses. He put the two rice grains in too—not buried, kept.", "Cypresses were three. She'd said, grave-plant cypress, wind strong they still stand.", "Screen scrolled a row of red text, font enlarged to occupy third of screen, background flushed red: **System Detects Host Long-Term Static, Suspected Device Anomaly. 300-Second Countdown Then Auto-Judge Breach, Initiate Drone Surface Clearance Operation System Work Order.**", "That giant mosquito behind the ridge sounded again, closer. Drone inspection red light cut fine lines in the mist, sweeping cypresses, mound, terraces, the enamel jar at his feet. Red light grazed retinal afterimage, a ruler measuring his bones. Countdown center-screen huge: 04:59, 04:58, 04:57… Each jump flashed the screen border red, mapping his face light-dark.", "Chen Xiaoyu weeping in the phone, fragmented, voice compression-encoded with metallic brittleness: \"Grandpa… I applied emergency medical vouchers… but needs manual review… Director Zhao signature needs process… process takes 24 hours…\"", "\"Not urgent.\" He reached out, fingertip touching cold screen glass, hovering over the gray \"End Livestream\" button for three seconds. Fingerprint left an oil smear on the glass, refracting red light. The only action today not in contract workflow. No script, no KPI, no algorithm prediction. Wind paused an instant, cypress needles stilled, drone propeller whine sharper, like a fine slit carved on his eardrum.", "Fingertip pressed.", "Screen instant black. Lower-right three columns zeroed: Remaining On-Camera Time 00:00:00, Credit Score --, Nostalgia Voucher Balance --. Black screen reflected his face—deep eye sockets, stubble prickly, mouth corners cracked with blood scabs.", "Livestream barrage froze on the last line: **\"Nostalgia's nice.\"** That barrage centered, white text gray background, like a piece of unburnt joss paper.", "Backend log auto-generated a red line, scrolling in unseen server logs: **Breach: Active Termination of Collection. Initiate Drone Surface Clearance Operation System Work Order. Countdown 00:00:00.**", "Chen Laoshuan threw the phone. *Pa* into wet mud, mud droplets spattering his cloth shoes. Stood on the cane. The rusted spring in his knee snapped straight, pain blacking his vision, peripheral vision tunneling—but no cough, no groan. Sweat trailed from temples, dove into collar, ice-cold. One step, one pause toward the cypress roots. The copper-coin spot on the hawthorn cane tip *men, men, men* three dull thuds on fallen leaves. Each vibration in his chest cavity, like tolling something.", "The hoe leaned by the tree. Blade up, mud dried to gray-white crust, rolled edge still holding half a severed root. He bent to pick it up, lumbar *ka* crisp crack, blade aimed at the bulging soil at the cypress roots—where the enamel jar lay, where his wife's ashes scattered. Wild grass grew on the mound, broad leaves, serrated edges sharp.", "He raised the hoe. Not at the lens, not at the sky, not at the county town below where a red light flashed on a drone. Drone hovered twenty meters up, red-green nav lights blinking, downwash pressing cypress needles flat against trunks, lidar hum drilling into ear canals.", "Blade fell.", "\"*Men.*\"", "Mud turned, revealing the enamel jar's faded blue-green rim, rusted iron wire still twisted on the lid. Wire long brittle, snap on bending, rust seeped into fine enamel glaze cracks like winding rivers on a map.", "He dropped the hoe, crouched, kneecap hitting stone, *si* sucking breath, trembling hand grabbing the lid. Fingernail shattered on the wire, blood beads welling, mixing with mud into the jar mouth. Blood bloomed dark red at the jar rim.", "No rice grains inside.", "Only two sprouted seedlings, pale yellow, frailly pushing through damp soil, stubbornly alive in absolute darkness. Tips slightly curved, like two question marks, like two hunchbacked elders, in utter darkness completing the most ancient, most obstinate stretch.", "He gently replaced the lid, rewound the rusted wire two turns. After the livestream's red light died, the slope quiet enough to hear dew dropping from needles. Morning mist thinned; half a roofline of the county town showed below.", "Clearance notice wrote process: cut trees first, push stele after, finally turn soil, plant carbo const L = {"cover_label": "Title Page & Synopsis", "unit": " chars", "by": "By ", "meta_sep": " | ~", "intro_title": "About this book", "prev": "← Previous", "next": "Next →", "start": "Start Reading →", "ch_prefix": "Chapter ", "ch_mid": " | ", "theme_dark": "☀️ Light Mode", "theme_light": "🌓 Dark Mode"};
let currentIndex = -1; // -1 = title page / synopsis
let fontSize = 17;

function renderSidebar() {
    const list = document.getElementById("chapterList");
    list.innerHTML = `<li class="chapter-item ${currentIndex === -1 ? 'active' : ''}" onclick="goToChapter(-1)">
        <span>📖 ${L.cover_label}</span>
    </li>`;
    book.chapters.forEach((ch, idx) => {
        const li = document.createElement("li");
        li.className = "chapter-item" + (currentIndex === idx ? " active" : "");
        li.innerHTML = `<span>${ch.title}</span><span class="ch-words">${ch.words}${L.unit}</span>`;
        li.onclick = () => goToChapter(idx);
        list.appendChild(li);
    });
}

function renderContent() {
    const wrapper = document.getElementById("articleWrapper");
    const label = document.getElementById("currentChLabel");
    if (currentIndex === -1) {
        label.innerText = L.cover_label;
        wrapper.innerHTML = `
            <div class="article-header">
                <h1>${book.title}</h1>
                <div class="article-meta">${L.by}${book.author}${L.meta_sep}${book.total_words.toLocaleString()}${L.unit}</div>
            </div>
            <div class="intro-box">
                <h3 style="margin-bottom:12px;color:var(--accent);">${L.intro_title}</h3>
                <div style="white-space: pre-wrap; line-height:1.75;">${book.description}</div>
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" disabled>${L.prev}</button>
                <button class="nav-btn" onclick="goToChapter(0)">${L.start}</button>
            </div>
        `;
    } else {
        const ch = book.chapters[currentIndex];
        label.innerText = ch.title;
        const pTags = ch.paragraphs.map(p => `<p style="font-size: ${fontSize}px;">${p}</p>`).join("");
        wrapper.innerHTML = `
            <div class="article-header">
                <h1>${ch.title}</h1>
                <div class="article-meta">${L.ch_prefix}${ch.index}${L.ch_mid}${ch.words}${L.unit}</div>
            </div>
            <div class="article-body">
                ${pTags}
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" onclick="goToChapter(currentIndex - 1)">${L.prev}</button>
                <button class="nav-btn" onclick="goToChapter(currentIndex + 1)" ${currentIndex >= book.chapters.length - 1 ? 'disabled' : ''}>${L.next}</button>
            </div>
        `;
    }
    document.getElementById("content-container").scrollTop = 0;
}

function goToChapter(idx) {
    if (idx < -1 || idx >= book.chapters.length) return;
    currentIndex = idx;
    renderSidebar();
    renderContent();
}

function toggleTheme() {
    const current = document.documentElement.getAttribute("data-theme");
    const next = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    document.getElementById("themeBtn").innerText = next === "dark" ? L.theme_dark : L.theme_light;
}

function changeFontSize(delta) {
    fontSize = Math.max(14, Math.min(26, fontSize + delta));
    const paras = document.querySelectorAll(".article-body p");
    paras.forEach(p => p.style.fontSize = fontSize + "px");
}

renderSidebar();
renderContent();
</script>
