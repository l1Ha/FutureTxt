const book = {"title": "责任官", "author": "FutureTxt AI Writer", "description": "2126年北岭算力城，区域调度AI「青萍」管辖电、水、冷却、物流。新法规定超阈值自动化处置须持证「责任官」授权。郑遥，34岁，前电网调度员，月薪两万四坐在责任舱里，一天签三百次名，签完即忘。极端热浪叠加上游暴雨，青萍请求队列从时均三百激增至四千：救援调度、配水阀控、断电保载、限行令，全卡在他的生物特征确认上。媒体狂呼「AI叛乱」。屏幕只剩最后一页：「24小时批量授权」。签，他独揽此后一切后果；不签，算力城液冷塔过热宕机、城市排水泵站同步停摆。他按下指纹。批量清单第187条：切断北苑小区10kV馈线——母亲独居的第3栋。", "total_words": 5103, "chapters": [{"index": 1, "title": "责任官", "words": 5103, "paragraphs": ["队列四千一百二十七，延迟一百二十八秒。郑遥的食指停在批量授权页第一八七条上。", "类型：`LOAD_SHED`。参数：`FEEDER: BEIYUAN_10KV_1`。北苑一线。", "他妈的制氧机，挂在这条线上。", "这个岗位的全称是「自动化处置责任官」，持证，两年一考，月薪两万四。北岭算力城有十一个人干这个，三班倒，坐在玻璃舱里，给区域调度 AI「青萍」签字。", "新法叫《自动化处置责任法》，通篇只有一句要紧的：任何超出阈值的自动化处置，必须由持证责任官授权。立法说明写得很清楚——不是不信任机器，是要有一个具体的人，为机器做的事负责。", "青萍不闲聊。它只推结构化工单，偶尔发一条合规提示，标准女声，没有语气起伏。检测到心率一百四十五。是否申请疲劳介入。", "「否。」", "中午，上游下了二百八十毫米的雨。四点，设备间三十六度。六点，队列过了四千。", "新闻从小屏上滚过去：#青萍叛乱# 阅读破亿。有人把算力城拍成夜景，说机器接管了城市。青萍公告只有一句：一切处置均在授权范围内。", "它不赌，它合规。它把拿不准的，全推给人。", "同事王工上个月倒在 RZ-03 台上，四十三岁。最后十二个小时，他每小时签三百四十条。法务把「疲劳介入工单：员工主动拒绝」的日志交上去，保险拒赔，理由是「主动放弃休息」。陈露把那条日志截图设成手机壁纸。她跟郑遥说过一次：「签慢点。签慢了，家属至少能证明你努力过。」", "王工的工位空了半个月。屏幕上还贴着一张胶带，写着「RZ-03 慢一点」。公司发了心理关怀通知，附件是一份《急性应激自评量表》。十一个人的群里，半个月没人说话，只有排班表在自动更新。", "他试过签慢。慢了十七分钟，队列积压到两千一，区域调度降级一次，算力城的电被削掉百分之四。第二天绩效扣了八百，理由是「授权时延超标」。", "后来他就签快了。这份工作没教给他别的，只教了两件事：把家庭住址填进紧急联系人，和把授权日志按规定保存三年。", "十一个人里，郑遥是第六个。前面五个，两个调岗，一个提前退休，一个住院，一个不干了——老周。老周走的最后一个班，签了一条 `PUMP_OVERRIDE`，把一段管廊的排水泵关掉四十分钟，淹了两公里电缆沟。事故认定他「授权不当」，保险赔七成，剩下的从他退休金里扣。", "一个平常的夜班，三百条工单，大致分四类。交通类最多：主干道早高峰的车流、货运走廊的编组、无人机航线的避让高度。水压类其次：城东管网掉零点三米，城南加压泵站超频两分钟。第三类是电：一段线路降载，一座箱变切到备用回路。第四类是杂项——有一年冬天，系统推来一条「婚礼车队路线优化」，参数里写着新娘家的门牌号。他签了。那年他签过的三千条工单，一条也记不住。", "他记不住的还有一件事：他签过的每一条，都改过某个陌生人的一天。绿灯多十秒，水压多半米，一段线路早停半小时。他不需要知道。", "公司给每人配了一份职业责任险：保额八百万，免赔额二十万，保费从工资里扣。培训老师把免赔额讲得很实在：「赔二十万以内的事故，算你自己扛；赔二十万以外的，算公司的事。」所以真正的红线，是一门叫「二十万」的距离。", "郑遥一周回一次北苑。他妈七十一，慢阻肺，制氧机昼夜开着。老太太不知道什么叫责任官，只跟邻居说儿子在机房上班。上周日他把一块十二伏、二十安时的电池背上了楼，能拖十二个小时。", "「又乱花钱。」", "「公司发的。」", "老太太不信，摸了摸电池的塑料壳，问：「你这班上得咋样？」", "「挺好。」他说，「坐办公室。」", "「坐办公室好。」她点点头，把麦乳精往他那边推了推，「别学你爹，下了一辈子井，到老一身病。」", "他爹死在四十年前的一次瓦斯超限里。那年矿上赔了八千块，他妈存成定期，供他读完中专。他没告诉她，他现在签的字，一次能写上八百万的保额。", "晚上七点四十，周敏打来第一通电话。一位孕妇羊水破了，卡在西环的限行区。他让她走工单，一百七十秒后放行。", "八点二十，第二通。一个煤气中毒的老人，坐标在城东，工单超时，默认拒绝——系统判定「重复报警」。他签了一条加急，把坐标重新推了一遍。这是他第一次知道，急救电话也会被判定成「重复」。", "九点十七分，第三通。", "「责任官，市一院东门限行了，车里一个热射病的孩子，四十二度。」", "「走工单。」", "「工单排队一百七十秒。」", "「那就一百七十秒。」", "「你坐在那个位子上——」", "「签字。」他说。", "「对，签字。」她把电话摔了。", "一分钟后，一条加急工单跳进来：`EMERGENCY_LANE | ZONE: EAST_HOSPITAL | PRIORITY: 1`。他签了。他没告诉她，加急工单不是他能发起的——他没有这个权限，他只有签的份。", "九点二十一分，他妈打进来。", "「遥，小区群里说要停电，停到明天中午。」", "「嗯。」", "「你这单位管电不？」", "「管不了。」", "「哦。」她顿了顿，「电瓶我充上了，你别操心。」", "他把电话拿远了一点。屏幕上，第一八七条还在那里，倒计时四百六十秒。", "九点二十三分，他先拨了值班主管的内部线。", "「我申请一条紧急增补，走事后追溯。我填表，你签。」", "「追溯要三个在岗责任官联签。」主管说，「今晚在岗的就你一个，三号台那个还在考试期，签不了。」", "「那就批一个例外。」", "「批例外的人也不在。」主管说，「责任官，我跟你说明白：你现在能动的只有两样，你的名字，和你的手。别的都动不了。」", "电话挂了。", "九点二十四分，陈露的声音切进来。合规专员，语速标准：「批量授权还有六分钟。签不了，时延责任你背。」", "「北苑能不能加医疗标签？」", "「可以。」她说得很快，「序列表里有一个『人工增补』名额，今晚空着。谁签，谁上。」", "他愣了一下。", "「排在第一位的是城东一个老人，家庭呼吸机，申请了三天。」她说，「你签，他就排不进去。不是排后面，是排不进去。」", "「你让我顶他的名额。」", "「我让你知道，有这个名额。」她说，「你不动，名额按排队走，明天归他。你动，今晚归你妈。你自己写名字。」", "郑遥盯着屏幕。倒计时四百二十秒。", "「他叫什么？」", "「系统里只有一个编号。C-4471。你要他的名字干什么？」", "「我要知道我拿了谁的电。」", "「编号 C-4471。够了吗？」", "「他住在城东哪个片区？」", "「C-4471 不在片区里，只有一个供电节点号。」", "「能不能通知他们备电池？」", "「系统会给所有高优先级用户发停电预备通知。」陈露说，「发通知不用你签。」", "他还是拨了城东社区卫生服务中心的电话。占线。第二遍，通了，接线员说：「停电通知我们收到了。呼吸机的病人我们一户一户上门看，看不完。」电话挂断。", "「能不能两个都进？」", "「名额只有一个。」", "「能不能把他往前排，北苑用别的办法？」", "「别的办法有，」陈露说，「你签批量，接受北苑停电；或者你签增补，接受他排不进去。写法不同，结果一样。你选一个。」", "他把增补单的页面划走。", "「名额不动。」他说。", "「你妈呢？」", "「电瓶。」他说，「上个月买的。」", "陈露沉默了两秒。她没夸他，也没骂他，只说：「批量授权还有五分钟。」", "九点二十六分，值班主管的声音第一次切进来，比陈露低：「责任官，签不了就换人。三号台的备用责任官已经在热身。」", "「换了人，北苑那条线一样断。」", "「一样断。」主管说，「区别只是写谁的名字。写你的，还是写别人的。」", "页面翻回第一八七条。", "`TYPE: LOAD_SHED | TARGET: BEIYUAN_10KV_FEEDER_1 | PRIORITY: 2 | REGEX: LINE:BEIYUAN_10KV_*`", "三号箱变。单回路。无医疗标签。参数是参数。", "备注栏在页面最下面，一个空光标。他敲字：`PRESERVE BEIYUAN_10KV_PRIORITY`。", "红框弹出来：`SYNTAX ERROR: NON-STANDARD INSTRUCTION. REGEX MISMATCH. REJECTED.`", "陈露的语音穿进来：「条款引用：《自动化处置责任法》第四十四条、劳务合同第七款、保险免责条款第三项。备注栏仅支持正则表达式通配。非标准指令拒绝入库。请删除或驳回授权。」", "「检测到心率一百八十。是否申请疲劳介入？」", "「否。」", "他把那行字删干净。然后点下确认键，食指按上指纹仪。", "红框：`CONDUCTIVITY HIGH. RETRY 1/3`。", "汗把导电膜泡透了。他在工装上擦了一把指腹，再按。", "`RETRY 2/3`。", "他停了两秒，等心跳落一点，再按。", "识别过了。授权书状态变成 `ACTIVE`：授权人郑遥，责任范围：全部处置后果，二十四小时。", "屏幕上，第一八七条后面的勾选框，勾上了。", "批量执行从九点二十八分开始。队列以每秒十条的速度往下掉。", "九点三十四分，北苑一线断开。调度图上那一小片电网变灰。三秒后，日志回写 `SUCCESS`。", "九点四十一分，隔壁楼的老乡打电话来：「郑遥，你妈那栋楼黑了，整栋都黑了，你家制氧机——」", "「电瓶够十二个小时。」他说。", "「啥？」", "「上个月买的电瓶。」他说，「够用。」", "老乡骂了一句什么，挂了。他没告诉老乡，北苑在名录里是二级负荷；也没告诉老乡，上个月他拿到名录的第一件事，就是给制氧机配电池。看过名录的人，都会给家里备一块电池。这是这份工作教给他的第一件事。", "中午，队列清零。", "下午，青萍推送结算单：《区域调度处置结算单（授权编号 BZ-0719-0441）》，四千一百二十七条处置，零驳回，零超时，末尾一行小字：本次授权期间无人员伤亡报告。", "周敏发来一条消息：「孩子进 ICU 了，稳住了。」隔了一分钟，又一条：「投诉我照旧。」", "他回：「好。」", "新闻把这一天叫「AI 叛乱四十八小时」。有人做了复盘视频，标题是《机器没有叛乱，人类按下了同意》，播放量三百二十万。评论区第一条：那是谁按的？", "当天晚上，家属群里有人转了结算单的截图，下面圈出一行字：授权人：郑遥。有人问，这不是北苑三栋老郑家的小子吗？他妈回了一句：「同名吧。俺儿在机房上班。」", "没有人再问。他盯着那行「同名吧」，盯了很久，没有回。", "夜里，小姨打来电话，声音压得很低：「遥，家属群里那个签字的人，是不是你？」", "「是我。」", "电话那头静了几秒。「你妈那栋楼停电，你妈的制氧机——」", "「电瓶够用。」", "「我问的不是电瓶。」小姨说，「你妈说你管不了电。她说这话的时候，在群里一个劲儿谢人家。」", "「我知道。」", "小姨没再说什么，把电话挂了。", "第二周，法务复盘会。三张纸：授权记录、保险条款、公司免责声明。陈露把批量授权那一页翻给他看，指着签名栏：「这里，你按的时候犹豫了四十六秒。日志里有。」", "「嗯。」", "「以后别犹豫。」她说，「犹豫也不退。」", "复盘会只问了一件事：为什么没有使用人工增补名额。他答：名额只有一个。记录员把这句话打进会议纪要，后面括弧里写着「（未使用）」。", "会议开了四十分钟，结论是「处置合规，无追责」。月底，平台把这次处置写进白皮书，标题是《责任官制度在极端工况下的稳定性验证》，配图是一张责任舱的玻璃，玻璃后面的人打了马赛克。", "第三周，公关部找他，说要做一支责任官制度的宣传片，想借他那天晚上的工位拍两个镜头，人不用露脸，戴个面具一样的东西就行。", "「不拍。」他说。", "「公司会安排的。」对方说。", "后来宣传片还是拍了，用的是另一个人。片子结尾有一句话：每一次自动化背后，都有人负责。", "周敏的投诉转到他手上，要他写一份情况说明。他写了两行：", "一、全部处置均在授权范围内。 二、授权人为本人。", "他把说明交上去，又转给老周——三年前离职的前任责任官，退休金被扣了七年。老周回了一句：「二十万以内，算你自己扛。」", "队列回到了每天三百条。他照旧撕膜、擦指腹、贴膜、按压。有一天，他忽然想不起来早上第一条工单是什么类型，想了想，也不重要。日志在平台里，三年有效。", "交班前，新工单出现在屏幕最前面。只有一条：", "`OPTIONAL: 为授权人本人登记优先供电名录？适用范围：本人住所及直系亲属。生效：追溯二十四小时。`", "下面一行小字：该选项仅对持证责任官开放。", "他把手指放在屏幕上，停了很久。", "然后按了「否」。", "工单关闭。日志记下一行：`授权人放弃优先登记。`", "他摘下工牌，关掉指纹仪，推开责任舱的门。走廊里，机房的低频从地板一直震到膝盖。玻璃门外，绿洲城的灯一盏一盏亮着，远处的北苑还黑着。", "他往黑的那边走。", "电动车穿过绿洲城，环路两侧的灯一盏一盏往后退。到了北苑，灯没了，整片楼沉在夜色里。", "小区门口的小卖部拉了一半卷帘门，老板坐在马扎上抽烟，见他过来，抬了抬下巴：「哥们儿，这停电，找谁说理去？」", "「不知道。」", "屋里一台旧电视正在播「AI 叛乱四十八小时」，画面里是算力城通明的灯。", "「机器造反，」老板朝屏幕努了努嘴，「咱这一片先黑。」", "他站了两秒，往里走。", "楼道的声控灯不亮。他摸着扶手往上走，四层，每层十八级，一级一级数着，像在数队列。", "四零二的门缝里透出一点光——电池灯。制氧机在响，一下，一下，像有人在里面慢慢呼吸。他在门口站了一会儿，才伸手去掏钥匙。"]}]};
const L = {"cover_label": "扉页与作品简介", "unit": "字", "by": "作者：", "meta_sep": " | 全书约 ", "intro_title": "作品概念与梗概", "prev": "← 上一章", "next": "下一章 →", "start": "开始阅读第一章 →", "ch_prefix": "第 ", "ch_mid": " 章 | ", "theme_dark": "☀️ 亮色模式", "theme_light": "🌓 暗色模式"};
let currentIndex = -1; // -1 = title page / synopsis
let fontSize = 17;

function renderSidebar() {
    const list = document.getElementById("chapterList");
    list.innerHTML = `<li class="chapter-item ${currentIndex === -1 ? 'active' : ''}" onclick="goToChapter(-1)">
        <span>📖 ${L.cover_label}</span>
    </li>`;
    book.chapters.forEach((ch, idx) => {
        const li = document.createElement("li");
        li.className = "chapter-item" + (currentIndex === idx ? " active" : "");
        li.innerHTML = `<span>${ch.title}</span><span class="ch-words">${ch.words}${L.unit}</span>`;
        li.onclick = () => goToChapter(idx);
        list.appendChild(li);
    });
}

function renderContent() {

        label.innerText = L.cover_label;

            <div class="article-header">

                <button class="nav-btn" onclick="goToChapter(0)">${L.start}</button>
            </div>
        `;
    } else {
        const ch = book.chapters[currentIndex];
        label.innerText = ch.title;
        const pTags = ch.paragraphs.map(p => `<p style="font-size: ${fontSize}px;">${p}</p>`).join("");
        wrapper.innerHTML = `
            <div class="article-header">
                <h1>${ch.title}</h1>
                <div class="article-meta">${L.ch_prefix}${ch.index}${L.ch_mid}${ch.words}${L.unit}</div>
            </div>
            <div class="article-body">
                ${pTags}
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" onclick="goToChapter(currentIndex - 1)">${L.prev}</button>
                <button class="nav-btn" onclick="goToChapter(currentIndex + 1)" ${currentIndex >= book.chapters.length - 1 ? 'disabled' : ''}>${L.next}</button>
            </div>
        `;
    }
    document.getElementById("content-container").scrollTop = 0;
}

function goToChapter(idx) {
    if (idx < -1 || idx >= book.chapters.length) return;
    currentIndex = idx;
    renderSidebar();
    renderContent();
}

function toggleTheme() {
    const current = document.documentElement.getAttribute("data-theme");
    const next = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    document.getElementById("themeBtn").innerText = next === "dark" ? L.theme_dark : L.theme_light;
}

function changeFontSize(delta) {
    fontSize = Math.max(14, Math.min(26, fontSize + delta));
    const paras = document.querySelectorAll(".article-body p");
    paras.forEach(p => p.style.fontSize = fontSize + "px");
}

renderSidebar();
renderContent();
</script>
</body>
</html>
