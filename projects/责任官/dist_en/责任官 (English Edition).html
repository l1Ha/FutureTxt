nsibility Officer was, only told neighbors her son worked in a machine room. Last Sunday he'd carried a twelve-volt, twenty-amp-hour battery up the stairs, good for twelve hours.", "\"Wasting money again.\"", "\"Company issued.\"", "She didn't believe him, touched the battery's plastic shell, asked: \"How's that shift of yours?\"", "\"Fine.\" He said. \"Office work.\"", "\"Office work is good.\" She nodded, pushed the malted milk powder toward him. \"Don't be like your father, went down the mine all his life, ended up sick all over.\"", "His father died forty years ago in a gas over-limit incident. That year the mine paid out eight thousand, his mother put it in a fixed deposit, put him through vocational school. He never told her that his signature now could write eight million in coverage.", "Seven forty PM, Sun Min called the first time. A pregnant woman's water broke, stuck in the West Ring restricted zone. He told her to file a work order. One hundred seventy seconds later, clearance granted.", "Eight twenty, second call. An elderly coal gas poisoning victim, coordinates in the east city, work order timed out, default reject—system ruled \"duplicate alarm.\" He signed an expedited, pushed the coordinates through again. First time he'd learned: ambulance calls could also be ruled \"duplicate.\"", "Nine seventeen, third call.", "\"Responsibility Officer, City First Hospital east gate restricted, car has a heatstroke child, forty-two degrees.\"", "\"File a work order.\"", "\"Work order queue one hundred seventy seconds.\"", "\"Then one hundred seventy seconds.\"", "\"You sit in that seat—\"", "\"Sign.\" He said.", "\"Right, sign.\" She hung up on him.", "One minute later, an expedited work order jumped in: Type 3. He signed it. He didn't tell her expedited orders weren't his to initiate—he had no such authority, he only had the signing part.", "Nine twenty-one, his mother called.", "\"Yao, the community group says power outage, out until noon tomorrow.\"", "\"Mm.\  "\"System sends outage prep notices to all high-priority users.\" Chen Lu said. \"Sending notices doesn't need your signature.\"", "He still dialed the East City Community Health Service Center. Busy. Second try, connected, operator said: \"We got the outage notice. Ventilator patients we're visiting door to door, can't finish.\" Call dropped.", "\"Can both get in?\"", "\"Only one slot.\"", "\"Can you push him up front, Beiyuan use another method?\"", "\"Other methods exist,\" Chen Lu said. \"You sign batch, accept Beiyuan outage; or you sign supplement, accept him not getting in. Different wording, same result. You pick one.\"", "He swiped the supplement page away.", "\"Slot stays.\" He said.", "\"Your mother?\"", "\"Battery.\" He said. \"Bought last month.\"", "Chen Lu fell silent two seconds. She didn't praise him, didn't scold him, only said: \"Batch authorization five minutes left.\"", "Nine twenty-six, duty supervisor's voice cut in for the first time, lower than Chen Lu's: \"Responsibility Officer, can't sign then swap. Station Three's backup Responsibility Officer already warming up.\"", "\"Swapped, Beiyuan line still cuts.\"", "\"Still cuts.\" Supervisor said. \"Difference is just whose name is written. Yours, or someone else's.\"", "Page flipped back to one-eight-seven.", "Type 4.", "Transformer No.3. Single circuit. No medical tag. Parameters are parameters.", "Remarks field at page bottom, an empty cursor. He typed: Type 5.", "Red box popped up: Type 6.", "Chen Lu's voice came through: \"Clause reference: *Automation Disposal Responsibility Act* Article 44, Labor Contract Clause 7, Insurance Exclusion Clause 3. Remarks field only supports regex wildcards. Non-Standard Instruction rejected. Please delete or reject authorization.\"", "\"Heart rate detected at one hundred eighty. Apply for fatigue intervention?\"", "\"Negative.\"", "He deleted the line clean. Then hit confirm, index finger pressed on fingerprint reader.", "Red box: Type 7.", "Sweat soaked the conductive film. He wiped his fingertip on his coveralls, pressed again.", "Type 8.", "He paused two seconds, waited for heart rate to drop a little, pressed again.", "Recognition passed. Authorization status changed to: Type 9. Authorizer: Zheng Yao. Liability scope: all disposal consequences, twenty-four hours.", "On screen, the checkbox after entry one-eight-seven ticked itself.", "Batch execution started at nine twenty-eight. Queue dropped at ten per second.", "Nine thirty-four, Beiyuan Line One disconnected. On the dispatch map that small grid went gray. Three seconds later, log wrote back: Type 10.", "Nine forty-one, the neighbor from next building called: \"Zheng Yao, your mom's building went dark, whole building, her oxygen concentrator—\"", "\"Battery's good for twelve hours.\" He said.", "\"What?\"", "\"Battery bought last month.\" He said. \"Enough.\"", "Neighbor cursed something, hung up. He didn't tell the neighbor Beiyuan was Level 2 Interruptible Load in the registry; didn't tell the neighbor the first thing he'd done after getting the registry last month was buy a battery for the oxygen concentrator. Anyone who'd read the registry would keep a battery at home. First thing this job taught him.", "Noon, queue cleared to zero.", "Afternoon, Qingping pushed settlement sheet: *Regional Scheduling Disposal Settlement Sheet (Authorization ID BZ-0719-0441)*, four thousand one hundred twenty-seven disposals, zero rejections, zero timeouts, final line in small print: No casualties reported during this authorization period.", "Sun Min sent a message: \"Kid's in ICU, stable.\" One minute later: \"Complaint stands.\"", "He replied: \"Fine.\"", "News called the day \"AI Rebellion Forty-Eight Hours.\" Someone made a recap video titled *The Machine Didn't Rebel, Humans Pressed Agree*, three point two million views. Top comment: Who pressed it?", "That night, family group someone posted settlement sheet screenshot, circled one line: Authorizer: Zheng Yao. Someone asked, isn't that Old Zheng's kid from Building Three, Beiyuan? His mother replied: \"Same name probably. My son works in a machine room.\"", "No one asked again. He stared at that \"same name probably,\" stared a long time, didn't reply.", "Night, aunt called, voice hushed: \"Yao, that signer in the family group, is it you?\"", "\"It's me.\"", "Phone went quiet a few seconds. \"Your mom's building lost power, your mom's oxygen concentrator—\"", "\"Battery's enough.\"", "\"That's not what I'm asking.\" Aunt said. \"Your mom said you can't control power. When she said that in the group, she kept thanking people nonstop.\"", "\"I know.\"", "Aunt said nothing more, hung up.", "Second week, legal review meeting. Three pages: authorization records, insurance clauses, company disclaimer. Chen Lu turned to the batch authorization page, pointed at signature block: \"Here, you hesitated forty-six seconds when pressing. Log shows it.\"", "\"Mm.\"", "\"Don't hesitate next time.\" She said. \"Hesitation doesn't undo it.\"", "Review meeting only asked one thing: why didn't you use the manual supplement slot. He answered: Only one slot. Recorder typed it into minutes, parentheses after: \"(Not used).\"", "Meeting ran forty minutes, conclusion: \"Disposal compliant, no liability.\" Month end, platform wrote this disposal into white paper, title: *Stability Verification of Responsibility Officer System Under Extreme Conditions*, illustration: a responsibility pod's glass, person behind glass mosaicked.", "Third week, PR found him, wanted to shoot a Responsibility Officer system promo, borrow his workstation that night for two shots, face not needed, wear a mask-like thing.", "\"Not shooting.\" He said.", "\"Company will arrange.\" Other side said.", "Promo got shot anyway, used another person. Ending line: Behind every automation, someone answers.", "Sun Min's complaint routed to him, needed a situation statement. He wrote two lines:", "One, all disposals within authorized scope. le, then reached for his keys."]}]};
const L = {"cover_label": "Title Page & Synopsis", "unit": " chars", "by": "By ", "meta_sep": " | ~", "intro_title": "About this book", "prev": "← Previous", "next": "Next →", "start": "Start Reading →", "ch_prefix": "Chapter ", "ch_mid": " | ", "theme_dark": "☀️ Light Mode", "theme_light": "🌓 Dark Mode"};
let currentIndex = -1; // -1 = title page / synopsis
let fontSize = 17;

function renderSidebar() {
    const list = document.getElementById("chapterList");
    list.innerHTML = `<li class="chapter-item ${currentIndex === -1 ? 'active' : ''}" onclick="goToChapter(-1)">
        <span>📖 ${L.cover_label}</span>
    </li>`;
    book.chapters.forEach((ch, idx) => {
        const li = document.createElement("li");
        li.className = "chapter-item" + (currentIndex === idx ? " active" : "");
        li.innerHTML = `<span>${ch.title}</span><span class="ch-words">${ch.words}${L.unit}</span>`;
        li.onclick = () => goToChapter(idx);
        list.appendChild(li);
    });
}

function renderContent() {
    const wrapper = document.getElementById("articleWrapper");
    const label = document.getElementById("currentChLabel");
    if (currentIndex === -1) {
        label.innerText = L.cover_label;
        wrapper.innerHTML = `
            <div class="article-header">
                <h1>${book.title}</h1>
                <div class="article-meta">${L.by}${book.author}${L.meta_sep}${book.total_words.toLocaleString()}${L.unit}</div>

            </div>
            <div class="nav-buttons">
                <button class="nav-btn" disabled>${L.prev}</button>
                <button class="nav-btn" onclick="goToChapter(0)">${L.start}</button>
            </div>
        `;
    } else {
        const ch = book.chapters[currentIndex];
        label.innerText = ch.title;
        const pTags = ch.paragraphs.map(p => `<p style="font-size: ${fontSize}px;">${p}</p>`).join("");
        wrapper.innerHTML = `
            <div class="article-header">
                <h1>${ch.title}</h1>
                <div class="article-meta">${L.ch_prefix}${ch.index}${L.ch_mid}${ch.words}${L.unit}</div>
            </div>
            <div class="article-body">
                ${pTags}
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" onclick="goToChapter(currentIndex - 1)">${L.prev}</button>

            </div>
        `;
    }
    document.getElementById("content-container").scrollTop = 0;
}

function goToChapter(idx) {
    if (idx < -1 || idx >= book.chapters.length) return;
    currentIndex = idx;
    renderSidebar();
    renderContent();
}

function toggleTheme() {
    const current = document.documentElement.getAttribute("data-theme");
    const next = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    document.getElementById("themeBtn").innerText = next === "dark" ? L.theme_dark : L.theme_light;
}

function changeFontSize(delta) {
    fontSize = Math.max(14, Math.min(26, fontSize + delta));
    const paras = document.querySelectorAll(".article-body p");
    paras.forEach(p => p.style.fontSize = fontSize + "px");
}

renderSidebar();
renderContent();
</script>
