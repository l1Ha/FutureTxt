d the corner. Day three, barriers were pulled up to Lao Fan's rolling shutter.", "The queue held delivery riders, basket-carrying elders, young workers in coveralls. Barriers a meter wide, people pressed shoulder to shoulder, scrolling phones. By eleven-thirty the tail was out of sight.", "Lao Fan's doorway sat at the queue's waist.", "\"Boss Fan,\" Lao Wai the queue proxy set his stool against the doorframe, \"lend me a wall.\"", "\"Been lending it three months.\"", "\"Location's money too.\" Lao Wai waved his number tag. \"Fourteen ahead. Whoever wants it pays fifteen.\"", "Lao Fan watched the barriers. His sign had hung thirty-one years, red paint peeled in three layers, the latest touch-up done last year by his daughter. Through the barriers, heads poked to read his chalkboard: beef noodles twelve, plain noodles eight, add egg two.", "They looked, then shrank back into line.", "Open Rice's broth was standard broth—fragrant, but flatly so. Through the wall Lao Fan heard their rhythm: three boils, one scoop base, bowl out, six bowls a minute. His side managed two a minute, the second still waiting for him to skim the old broth.", "His wife lay at home on medical retirement, meds eleven hundred a month, last month risen to thirteen hundred. Meds used to be his; since spring, Xiaoyu paid.", "Some didn't queue.", "A delivery rider, every day at one-thirty, walked in shouting \"plain noodles add egg,\" ate, scanned, left. He'd calculated: the free line took forty minutes, his lunch break fifty. Forty minutes bought for ten yuan—he couldn't afford it.", "\"Boss Fan,\" the kid said, \"don't stop making these noodles. The day you stop, I've got nowhere to eat.\"", "\"Won't stop.\" Lao Fan said.", "He froze at his own words.", "He'd run the numbers for three months.", "One bowl cost four-twenty, sold at twelve. Lunch used eighty bowls a day, rent three-eighty daily, gas water electric separate. Used to be lunch rush, dinner rush, barely kept one table afloat. Since Open Rice, lunch dropped from eighty to thirty, last month nineteen, this month—today—seven.", "Qin's boss lady came by afternoon for vinegar. Said she'd lost thirty percent. Yonghe across the diagonal said twenty-five percent, added \"ride another month, see.\" The luosifen shop at the street end untouched—people ate spice, not his clear broth.", "\"What gives them the right.\" Qin's boss lady said. \"They do charity, we pay rent.\"", "No one had an answer.", "That night, a few shops met in the luosifen shop's back room. Qin's pushed a joint complaint, materials stacked, signatures and thumbprints. Yonghe said wait for the district investigation, don't put yourself on the line. Luosifen owner wouldn't sign—his shop unaffected, signing would invite trouble.", "A new chain, \"Noodle Manager,\" had opened across the street, glass doors gleaming, still renovating. Their manager came too, stood listening, then said: \"Everyone, joining Virtue Flow isn't hard. HQ's in talks. Free slots are scarce. Who gets in survives.\"", "Qin's boss lady cursed on the spot. After, no one spoke.", "Street office came once, surname Wu, briefcase tucked, stood by Lao Fan's stove twenty minutes. Said charity wasn't illegal, couldn't shut them down for a queue. Said district was verifying, multiple departments watching. Said Boss Fan, your report's logged, evidence can be submitted.", "\"What counts as evidence?\"", "\"Revenue comparison.\" Old Wu said. \"Best with causal explanation.\"", "Lao Fan printed three months' flow, pressed under the register glass. Page one: last October. Page two: this October. Two sheets together, like two people.", "Second visit, Wu brought the Registry.", "Registry spelled it out: free meals only for elderly, subsistence recipients, outdoor laborers. List generated by platform algorithm per zone, updated quarterly. Wu said this was \"precision\"—getting goodwill to those truly in need.", "\"Truly in need,\" Lao Fan said, \"means people who can't afford my twelve-yuan bowl?\"", "\"Means people on the list.\" Wu corrected. \"Boss Fan, straight talk. You want a ruling, two roads: sue Market Supervision for unfair competition, or sue direct. Lawyer I asked—split opinions. Half say you can't win, half say you can't afford the fight.\"", "\"Then what do I do.\"", "\"Wait for district conclusion.\" Wu set his tea cup down. \"Until then, no one makes you stop.\"", "Xiaoyu came home at nine-thirty.", "She'd been on shift at Open Rice, wearing platform uniform, right chest a \"Virtue Flow\" badge, beside it small print: *Every bowl counts.* She entered as Lao Fan skimmed oil from the old broth pot, aluminum rim crusted with a black ring—his father's pot, passed down, bottom never changed, broth never broken.", "\"Dad,\" Xiaoyu said, \"Zhou Manager wants me to tell you something.\"", "\"Say it.\"", "\"The street's getting a Virtue Node. Platform picks one shop on this street, plaques it, takes the free orders. Subsidy paid in Virtue Points. Points offset rent, taxes, buy traffic slots. Zhou Manager said she thought of you first.\"", "Lao Fan didn't look up, ladle paused on the broth surface.", "\"What do you think.\"", "\"I want you to sign.\" Xiaoyu said. \"Dad, look at this street. Everyone's getting pulled into this system. Early entry, good slot, high quota. Late, the chains move in, you can't even queue.\"", "\"You remember when we sold eighty bowls at lunch?\"", "\"Remember.\" Xiaoyu set her bag on the stool. \"I remember when I was seven, you ran a fever in the shop, Aunt Li next door sent two meals in one day. Dad, we've eaten free too.\"", "\"That was Aunt Li. Not a platform.\"", "\"Platform's run by people too.\"", "\"People run it,\" Lao Fan said, \"machines count the books.\"", "Xiaoyu stared, eyes reddening. \"Mom's meds thirteen hundred last month, I transferred it. Know what I make at Open Rice in a month? Double what I'd make here. I'm not here to fight.\"", "\"Then what are you here for.\"", "\"To keep you alive.\" She said.", "The inner door curtain stirred. Lao Fan's wife braced on the frame, didn't come out, didn't speak, just looked at them both, then withdrew.", "Xiaoyu set the tablet on the register. \"Contract first. Zhou Manager comes tomorrow.\" At the door she paused. \"Dad, this street isn't just us hurting. But this street—you're the only one with thirty-one years.\"", "Door closed, wind chime rang. Lao Fan watched the pot. Oil flowers floated on the broth, turning slow under the light.", "Next noon, Zhou Ke came.", "Early thirties, dark gray coat. Entered, scanned the room, set bag on table, hands folded on contract.", "\"Uncle Fan,\" she called him uncle, \"ugly truth first: you don't sign, we respect it. But this street gets one node slot. Seven days public notice. After seven days, either you—or the chain across the street.\"", "\"What if I sign.\"", "\"Subsidy per bowl. Two hundred bowls daily, three-eight per bowl, paid in Virtue Points, monthly settlement. Points offset property fees, platform settlement fees, buy traffic slots.\" She pushed the tablet over. \"Your lunch position returns to the year before last.\"", "\"Back to the year before last,\" Lao Fan said, \"means back to eighty bowls, or back to the queue?\"", "Zhou Ke smiled, polite. \"Back to the queue. Uncle Fan, the node *is* the queue.\"", "Lao Fan turned to page three. Free quota, data authorization, brand exposure, settlement cycle, clause by clause. Data authorization detailed: visitor profiles, paths, dwell time, for Virtue Flow assessment; assessment results belong to platform. Page five, Virtue Point exchange: one hundred points for eighty-three yuan, monthly, non-withdrawable, only offset property fees and platform settlement fees. Page six, exit clause: unilateral exit, already-offset portions recovered at original value plus penalty.", "\"Two hundred bowls, I can't make them alone.\"", "\"Two people assigned.\" Zhou Ke said. \"Platform's. We pay wages, our people.\"", "\"What about me.\"", "\"You just mind the pot.\" She paused, added. \"And the sign.\"", "Lao Fan turned to page seven, stopped.", "**\"Supply broth must use platform-certified Central Kitchen products, to complete traceability and liability separation. Unlisted self-made ingredients prohibited for supply use.\"**", "\"What about the old broth.\"", "\"Not in the directory.\" Zhou Ke said.", "\"This is my father's broth.\"", "\"It is.\" She said. \"I understand. But Uncle Fan, one free bowl goes wrong, who signs? We can't, you can't. Directory items, someone answers; off-directory, no one. Not my rule.\"", "\"I won't swap.\"", "\"You don't have to.\" Zhou Ke said. \"Keep it for family, not for supply. Swap the pot, keep the stove, broth untouched, just sits there. We only need the supply pot running clean base.\"", "\"I have three questions.\"", "\"Ask.\"", "\"Can Virtue Points pay rent direct.\"", "\"Can't direct.\" Zhou Ke said. \"Can offset property fees. This street's property, managed by our platform's commercial management company.\"", "\"Can the sign stay untouched.\"", "\"Sign stays.\" She pointed to the signage mockup. \"But this plaque goes up, price screen installs, data port opens.\"", "\"The old broth,\" Lao Fan looked at her, \"can it just serve my own walk-ins.\"", "\"Can't.\" Zhou Ke said. \"One stove, one pot, liability inseparable.\"", "Three doors, closed one by one. Lao Fan tapped two fingers on the table, didn't ask a fourth.", "She set the pen on the contract, cap toward Lao Fan.", "\"Seven days.\" She said. \"You consider.\"", "Five days, Lao Fan did much, and seemed to do nothing.", "He found Lao Wai the proxy, slipped two hundred, asked him to shift the line ten meters toward the street end at noon, clear his door. Lao Wai took it, next day same spot.", "\"Where you stand—who arranges it?\" Lao Fan asked.", "Lao Wai glanced left and right, voice low. \"Boss Fan, you think I choose? Platform maps the flow, I stand where algorithm dispatches. Your doorway's crowded, I come here.\"", "\"Then I pay you to move, why won't you?\"", "\"Move, lose points.\" Lao Wai said. \"Points gone, number's gone. This number cost me three thousand deposit.\"", "Open Rice started posting \"Precision Supply\"—free only for seventy-plus and outdoor laborers. Queue halved. Lao Fan's lunch returned to thirty bowls. Day five, Open Rice's barriers stretched back—district said list to expand gradually.", "The chain manager across the street found him too.", "\"Uncle Fan,\" manager said. \"Heard you won't join the node. I'll make an offer. That broth recipe of yours—sell to us. One-time, two hundred thousand, NDA signed.\"", "\"Your Central Kitchen needs old broth?\"", "\"Need it or not doesn't matter.\" Manager said. \"What matters: this street has no second pot.\"", "Lao Fan watched him. \"Out.\"", "Day five afternoon, he saw Old Zhao in the queue.", "Old Zhao, seventy, steamed mantou three generations, pension twenty-eight hundred. Used to come daily for Lao Fan's beef noodles, add egg, no spice. Today Old Zhao stood inside the barrier, capped, head lowered when he saw him.", "Lao Fan walked over. Neither spoke.", "\"Boss Fan,\" Old Zhao spoke first, voice small. \"I'm not greedy for that bowl.\"", "\"I know.\"", "\"Your broth, I remember.\"", "\"Remember's enough.\" Lao Fan said. \"Queue up. Don't bake in the sun.\"", "He returned, boiled the seven leftover noon bowls, rinsed each in cold water, dumped in the trash.", "Done, he went to Open Rice once.", "Not to eat. Just to see inside. Clean, white walls, one big pot, four stations, wall screen jumping numbers: *Today Served: 1,204*. Below, small print: *Every bowl counts.* Doorway high, a camera aimed at entering faces.", "Xiaoyu brought him a bowl.", "\"Not eating.\"", "\"Dad, taste.\"", "He pushed it back, fished twelve yuan from his pocket, pressed under the bowl. A young worker in coveralls beside them glanced, said nothing. Xiaoyu took the twelve, shoved it back in his hand. \"House doesn't take money.\"", "\"Rules are dead.\"", "\"Rules are the platform's.\" She said. \"You leave money, I file an incident report.\"", "Lao Fan pocketed the twelve. Stood by the pot a while, watched the standard pot crank six bowls a minute, watched the queue unbroken, watched every face at the door. They all glanced at that screen before entering, like confirming something.", "Leaving, Zhou Ke entered, saw him, nodded. \"Uncle Fan, inspecting the shop?\"", "\"Inspecting the queue.\"", "Day six morning, Qin's shut.", "Shutter down, A4 sheet taped: *Temporarily Closed.* Lao Fan called the boss lady, rang long before pickup, range hood noise behind her.", "\"Not doing it.\" She said. \"Two months rent left, can't transfer. Noodle Manager across hiring, I'm going back of house, fifty-eight hundred a month, social insurance paid.\"", "\"Business was fine.\"", "\"Boss Fan,\" she said. \"This street doesn't recognize craft anymore. It recognizes slots.\"", "Hung up. Behind Qin's shutter, her twelve-year wok hung on its hook, bottom black too.", "Day six night, Xiaoyu returned, found Lao Fan washing the pot.", "Aluminum scrubbed bright, bottom crust scraped off. Stove held a glass jar, full of broth, sealed, taped. New pot was new—white iron, bright as a mirror.", "\"Dad?\"", "\"Zhou Manager comes tomorrow,\" Lao Fan said. \"Signing.\"", "Xiaoyu froze.", "\"She wants me to write a condition.\" Lao Fan said. \"I didn't. Contract has no place for it. Written, useless.\"", "He lifted the jar, set it on the highest shelf, against the wall, mouth inward. Stepped back two paces, watched a moment.", "\"This jar's for you to drink.\" He said.", "Xiaoyu didn't answer, turned to the back kitchen, tore open the new base ingredient boxes. Packs ripped, a uniform aroma rose—clean, standard, no hand detectable.", "Inner room light still on. His wife stitching an apron, the one he'd wear tomorrow, platform-issued, dark green.", "\"Signed?\"", "\"Signed.\"", "She didn't ask conditions, didn't ask const L = {"cover_label": "Title Page & Synopsis", "unit": " chars", "by": "By ", "meta_sep": " | ~", "intro_title": "About this book", "prev": "← Previous", "next": "Next →", "start": "Start Reading →", "ch_prefix": "Chapter ", "ch_mid": " | ", "theme_dark": "☀️ Light Mode", "theme_light": "🌓 Dark Mode"};
let currentIndex = -1; // -1 = title page / synopsis
let fontSize = 17;

function renderSidebar() {
    const list = document.getElementById("chapterList");
    list.innerHTML = `<li class="chapter-item ${currentIndex === -1 ? 'active' : ''}" onclick="goToChapter(-1)">
        <span>📖 ${L.cover_label}</span>
    </li>`;
    book.chapters.forEach((ch, idx) => {
        const li = document.createElement("li");
        li.className = "chapter-item" + (currentIndex === idx ? " active" : "");
        li.innerHTML = `<span>${ch.title}</span><span class="ch-words">${ch.words}${L.unit}</span>`;
        li.onclick = () => goToChapter(idx);
        list.appendChild(li);
    });
}

function renderContent() {
    const wrapper = document.getElementById("articleWrapper");
    const label = document.getElementById("currentChLabel");
    if (currentIndex === -1) {
        label.innerText = L.cover_label;
        wrapper.innerHTML = `
            <div class="article-header">
                <h1>${book.title}</h1>
                <div class="article-meta">${L.by}${book.author}${L.meta_sep}${book.total_words.toLocaleString()}${L.unit}</div>
            </div>
            <div class="intro-box">
                <h3 style="margin-bottom:12px;color:var(--accent);">${L.intro_title}</h3>
                <div style="white-space: pre-wrap; line-height:1.75;">${book.description}</div>
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" disabled>${L.prev}</button>
                <button class="nav-btn" onclick="goToChapter(0)">${L.start}</button>
            </div>
        `;
    } else {
        const ch = book.chapters[currentIndex];
        label.innerText = ch.title;
        const pTags = ch.paragraphs.map(p => `<p style="font-size: ${fontSize}px;">${p}</p>`).join("");
        wrapper.innerHTML = `
            <div class="article-header">
                <h1>${ch.title}</h1>
                <div class="article-meta">${L.ch_prefix}${ch.index}${L.ch_mid}${ch.words}${L.unit}</div>
            </div>
            <div class="article-body">
                ${pTags}
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" onclick="goToChapter(currentIndex - 1)">${L.prev}</button>
                <button class="nav-btn" onclick="goToChapter(currentIndex + 1)" ${currentIndex >= book.chapters.length - 1 ? 'disabled' : ''}>${L.next}</button>
            </div>
        `;
    }
    document.getElementById("content-container").scrollTop = 0;
}

function goToChapter(idx) {
    if (idx < -1 || idx >= book.chapters.length) return;
    currentIndex = idx;
    renderSidebar();
    renderContent();
}

function toggleTheme() {
    const current = document.documentElement.getAttribute("data-theme");
    const next = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    document.getElementById("themeBtn").innerText = next === "dark" ? L.theme_dark : L.theme_light;
}

function changeFontSize(delta) {
    fontSize = Math.max(14, Math.min(26, fontSize + delta));
    const paras = document.querySelectorAll(".article-body p");
    paras.forEach(p => p.style.fontSize = fontSize + "px");
}

renderSidebar();
renderContent();
</script>
