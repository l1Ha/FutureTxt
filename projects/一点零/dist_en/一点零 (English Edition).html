self up, wrote for two minutes, then sank again.", "She walked over, pulled the notebook out to look. Copied characters, neat rows, but the indentations were fresh — a classmate's handwriting. She flipped back a few pages. The earlier pages were a mess, lines running into each other, like they'd been rained on.", "\"Whose did you copy?\"", "\"Wang Hao's.\"", "\"Can't you see it yourself?\"", "Xiao Zhou didn't speak. He capped his pen, uncapped it, capped it, uncapped it.", "\"How long?\"", "\"Last year.\"", "Xiulan stood there, still clutching the screening form. She remembered this past spring, him walking into a door frame once, her scolding him for being careless; remembered him taking books out to the balcony all summer, her saying the light was better there; remembered last month when he knocked over his water cup twice, her saying why was he always spacing out.", "\"Why didn't you say anything?\"", "Xiao Zhou's head stayed low, voice tiny: \"Grandma's medicine costs so much.\"", "Xiulan wore glasses herself. Twenty-five years. At fifteen, at the town middle school, she couldn't see the blackboard. She told her family. Her mother took her into town for a pair. On the way back, her mother said one sentence:", "\"Once you put glasses on, you never take them off. The prescription only gets deeper.\"", "She'd remembered that sentence to this day. Later her prescription went from one-fifty to four hundred. She always felt her mother hadn't finished that sentence — couldn't take them off was true, deeper was true, but if she'd gotten them earlier, seen clearly sooner, maybe it wouldn't have come to this.", "She didn't want Xiao Zhou walking her old road. But she was also afraid of glasses.", "That night, she called Jianguo on the phone. Jianguo was on the highway, only called back from a service area, truck air brakes hissing in the background.", "\"How much?\"", "\"Right eye zero point four. School says re-check.\"", "\"Get glasses then.\"", "\"Just get glasses?\" she asked. \"At that prescription, I hear once you put them on it's for life.\"", "\"What else can you do?\"", "\"Let me see if there's another way.\"", "\"Don't go spending money recklessly.\" Jianguo said. \"This month's car payment, Mom's medicine.\"", "\"I know.\"", "She hung up and stood on the balcony for a while. Downstairs was the night market, barbecue gluten smoke drifting up. She turned off the balcony light, stood in the dark, thinking about the money in her card: mortgage twenty-three hundred, mother-in-law's meds eight hundred, car loan thirty-one hundred, Xiao Zhou's textbooks one-seventy. Her salary had hit yesterday, forty-two hundred.", "The re-check was at City First Hospital, ophthalmology on the third floor. A row of kids in the corridor, all wearing trial frames.", "Dilation drops went in. Xiao Zhou's eyes ached, light hurt, eyes closed against her shoulder. Forty minutes wait, number called.", "Doctor Chen, forties, hair pulled back tight, spoke fast. She held Xiao Zhou's prescription, scanning column by column.", "\"Right eye one twenty-five, left eye one seventy-five, astigmatism fifty.\" She set the form down. \"True myopia.\"", "\"Can it be reversed?\"", "\"Can't be reversed.\" Doctor Chen said. \"Axial length increased, doesn't shrink back. If we can control it, that's already good.\"", "Xiulan's fingers tightened on her bag strap.", "\"Then what?\"", "\"Three roads.\" Doctor Chen lifted her pen, wrote on paper. \"One, single-vision lenses, three hundred or so, see the board without strain, prescription keeps climbing anyway. Two, defocus lenses, eight to twelve thousand a year, slows it a little. Three, ortho-k, fifteen thousand up, maintenance hassle, risks involved. You pick based on your family's situation.\"", "\"Which one can cure it?\"", "\"None of them cure it.\" Doctor Chen said. \"Myopia is a slope going forward. We can only brake, not reverse. Anyone who says it can be reversed is just after that money.\"", "Xiulan left the exam stairs night market packing up, sweeping sounds thudding. She thought of these two months, eight-thirty every night, Xiao Zhou lying beside her, telling her about Wang Hao, about Li Yinuo, about the dog. Not once had she mentioned two hours outdoors.", "\"Not continuing.\"", "\"Your call.\"", "That night past ten, Teacher Xiao Lin sent a voice message. Background dead quiet, the kind with stairwell echo.", "\"Sister, I'll tell you the truth.\" Her voice dropped. \"I'm not a doctor. I'm just sales. Our team needs thirty formulas this month, I've done twenty-one. Your twenty-two hundred, I get two-twenty commission. If the kid's degree really drops, I'll kowtow to you.\"", "The message paused. She added: \"You want a refund, I can't help. Refund authority's with the manager. You can curse me all you want.\"", "Xiulan listened, flipped her phone over, screen down.", "The report came that night. Phone push: *Eye patch claims to reverse myopia, clinic involved has no ophthalmology credentials.*", "Xiulan opened it. Colder the more she read. Product: household care item. Clinic registered as TCM department, no ophthalmology. Social media accounts banned and replaced, same script. Refund requires three hundred \"herbal material cost\" deduction first, then a guarantee letter — guarantee no further pursuit, no public exposure.", "She pulled the box from the bottom of the cabinet. Two pouches half left. Instructions third line, the one she'd creased that day, still there.", "She messaged Teacher Xiao Lin: I want a refund.", "An hour later: *Sister, refund's fine, by the rules. Remaining minus three hundred material cost, refund nineteen-sixty. Also you write a paper, guarantee after refund you won't talk online, won't pursue further.*", "\"Why should I write a guarantee letter.\"", "\"Just because you want a refund.\"", "Xiulan stared at the screen. Nineteen-sixty, three-quarters of a defocus lens. Guarantee letter, three characters, she knew them too. She put the phone down
