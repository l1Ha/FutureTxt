<script>
const book = {"title": "个案", "author": "FutureTxt AI Writer", "description": "国家药品真实世界证据评价中心（N-RWE）启动「存量药物证据体检」。三氧化二砷（ATO）因三十年前III期临床缺知情同意、缺对照组、数据为手写台账，拟定D级证据，七日公示后退出医保。同期，华昱制药「砷靶向脂质体注射液」（ATL-01）以单臂II期数据走绿色通道上市，疗程28万。评价员沈序在档案室翻出1994年血液病专家林远留下的随访箱：三十七个名字，红圈标注「完全缓解」，后跟几十年生存年限。六岁复发患儿陈诺在病房等结论；华昱医学总监陆行之摆着合规的真实世界研究设计图；导师顾明轩说「拿老人的命换新药的规则，你会被写进教科书」；林远九十五岁躺在养老院只认台账；陈父在中心门口举牌「三块钱救不了命吗」；幸存者代表、九十二岁的赵德昌坐在轮椅上等沈序出来。七天倒计时，沈序要在《证据分级结论书》签字页落笔。", "total_words": 5131, "chapters": [{"index": 1, "title": "个案", "words": 5131, "paragraphs": ["三十七个人还活着。系统说，这叫个案。", "沈序第一次看见这个词，是在评审系统的备注栏里。三十七个名字，附在两页扫描件后头，系统打了一行灰字：**非随机、非盲法、无对照组，个案报告，证据权重不计。**", "扫描件来自一摞手写台账。台账的主人叫韩松年，九十五岁，住城西的养老院。三十多年前，他在县医院用三氧化二砷——就是砒霜——治早幼粒细胞白血病。", "台账用的是蓝黑墨水，第一页写着日期：一九九三年三月。第一条记录的名字是屠有德，四十一岁。后面跟着一行小字：药房不发，说这是毒药；签字画押，取三克。", "这个方案后来进了教科书，进了国际指南，五年生存率九成以上，救过的人按十万计。药很便宜，一个疗程两千八。", "现在，这个方案要被调出医保目录。", "理由有四条，一条比一条硬：当年没有知情同意，没有对照组，疗效的终点定义不统一，随访不完整。评审报告给了它一个 D 级，D 级的处置是：公示三十天，调出目录。", "七天以后，开评审会。沈序是这份报告的复核人之一。他的工作，叫「证据体检」。", "沈序三十四岁，在这家中心干第七年。中心的全名叫「国家药品真实世界证据评价中心」，任务是给老药做体检：过了专利期的、便宜的、还在用的药，用今天的标准重新称一遍。", "这道程序是他导师郑守业那一代人挣来的。二十年前，一批老药数据造假，出了事，从那以后，凡是进目录的药，都得把证据摆出来。", "沈序熟这套规矩。证据分四级：A 级要随机双盲，B 级要队列对照，C 级是观察性研究，D 级基本不算证据。真实世界证据是后来开的口子，权重封顶两成。", "韩松年的台账上，有三十七个红圈。红圈是他自己画的，画在名字后头。沈序把台账看了一下午，看出红圈的意思：活过五年。再往下看，红圈后面还有字：十年，二十年，三十年。", "台账的最后两页，是空白的。", "下午四点，门诊楼底下有人喊口号。沈序从窗户往下看：四五个家属举着牌子，站在中心门口，牌子上写着一行字——**「三块钱的药，也是药。」**", "领头的是个三十出头的男人，黑瘦，穿一件外卖服，牌子举得最高。保安过去劝，他不走，他说他女儿六岁，上个月确诊，医生开了方案，方案里有一支药，名字很长，他没记住。他记住的是价：第一疗程两万八。", "如果那条老方案还在目录里，同样的病，第一疗程两千八。", "沈序下楼买水，从他们身边过。男人叫住他：「同志，你是这里上班的？」", "「嗯。」", "「我问你个事。」他把牌子靠在腿上，从兜里摸出一张皱巴巴的方案单，「这上头两个价，差一百倍。大夫说都行。都行是什么意思？」", "沈序看着那张单子。第一行是老方案，两千八；第二行是安瑞定，二十八万。", "「意思是，两个都能治病。」他说。", "「那为啥差一百倍？」", "「一个过了专利期，一个没有。」", "男人看着他，像是没听懂，又像是听懂了。他把单子折起来，塞回兜里。", "「同志，我不懂专利。」他说，「我就想问，你们七天后开完会，我闺女还能不能用两千八的。」", "沈序没有回答。他不敢回答。", "第二天，听证预备会，公司来了人。", "来人叫方黎，安瑞生物的医学总监，四十岁出头，讲话不快，材料齐。她带来的新药叫安瑞定，活性成分做了一处分子改良，说是把三氧化二砷的老毛病——心脏毒性压下去了，可以门诊用，不用住院。", "价格：一个疗程二十八万。走的是创新药绿色通道，已经拿到附条件批准。", "「我不反对韩老。」方黎说，「我反对的是把一份三十年前的病历，当成今天的决策依据。」", "她打开投影，列了四条。", "第一，幸存者偏差。她说：「台账上的三十七个人，是活下来的那三十七个。同一个病房里，死掉的人不会在台账上画圈。我们不知道当年的总入组是多少，也不知道分母。」", "第二，心脏毒性。她说：「三氧化二砷会拉长 QT 间期，有猝死风险。你们拿去给六岁的孩子用，是因为它便宜，不是因为它安全。」", "第三，知情同意。她说：「当年的病人和家属，没有签过任何东西。今天用他们的数据做决策，是第二次不告知。」", "第四，终点。她说：「红圈是韩老自己画的。一个没有统一定义、没有独立评估、没有原始影像的终点，不能叫终点。」", "会议室很静。有人点头。", "沈序翻着本子，翻到一页，停住。他问了一个问题：「方医生，你们做分子改良，改的是哪一处？」", "「配体。」方黎说，「让它更容易进入细胞。」", "「所以你们知道，它为什么有效。」沈序说。", "「我们当然知道。」", "「可三十年前，韩老不知道。」沈序说，「他没有对照组，没有终点定义，连砒霜是不是那个有效的成分，他都不敢肯定。他就这么试。三十七个人活到今天。方医生，你现在手里所有的东西，都是从他那摞台账里长出来的。」", "方黎看着他，停了两秒。", "「沈老师，」她说，「长出来，不等于不能被超过。」", "散会以后，郑守业把沈序叫到办公室。", "老郑五十八岁，快退了，桌上摆着一张全家福和一个用了十年的不锈钢缸子。他给沈序倒了水。", "「你今天在会上那个问题，问得漂亮。」他说，「漂亮没有用。你知道规矩为什么是规矩吗，因为二十年前有人拿老药数据改过结论，出了人命。从那以后，D 级就是 D 级，不动的。」", "「这不一样。」", "「哪不一样？」", "沈序把台账复印件推过去：「这三十七个人，我们上门核过。活着的，我们见着人了。他们的病历、复发记录、心脏彩超，我们都收得到。这叫失访吗？这叫随访三十年。」", "郑守业翻了两页，合上。", "「你要干什么，我猜得到。」他说，「真实世界证据的权重封顶两成，你要拿一个回顾性的老队列，去给一个 D 级药翻案。翻成了，以后所有的老药都能这么翻；翻砸了，你担责。你今年评副高，材料我看了，就差这一篇代表作——这个报告，本来是你的代表作。」", "「你知道那个两成的上限是怎么来的吗。」老郑把缸子放下。", "「怕造假。」", "「不是怕。是出过。」他说，「二十年前，有个降糖的老药，靠一批回顾病历进了目录。两年后复查，那批病历里有三十七份是补的——不是编的，是补的，把死人的记录补成了活人。那两年，那药死了十一个人。从那以后，回顾性数据封顶两成，谁也别想动。」", "「这次不一样。」沈序说，「这次的台账，死人也记。」", "「台账是一个人写的。」", "「他九十五了。」沈序说，「他还能图什么。」", "「如果我按程序签呢。」", "「按程序签，你干净，药出目录。」老郑喝了一口水，「孩子的事，你我都心疼。可程序不是为了让人心疼才写的。」", "沈序站起来。走到门口，老郑在后头说了一句：", "「你要是签，签你自己的名字。别签中心的。」", "沈序回头：「有区别吗。」", "「有。」老郑说，「签中心的，是制度错了。签你自己的，是你错了。」", "养老院在城西，三楼靠窗那间。", "韩松年九十五岁，耳朵还行，眼睛不行了，看人要看轮廓。沈序把台账复印件放在他腿上，他摸了两下，说：「这不是全部。」", "「还有多少。」", "「还有一本。」老人说，「那本你别拿走，你就在这儿看。」", "护工从床头柜底下拖出一只木箱。箱子里是第二本台账，纸更黄，边角有霉。沈序翻开第一页，手停住了。", "第一本台账里，五十二个名字。", "名字后面，三十七个红圈。十五个黑圈。", "黑圈后头，有的写着一个日期，有的写着一个字：亡。", "「他们说我这个方案，没有分母。」老人把眼镜往上推了推，「分母在那儿。死的，我也记。谁吃了几次，哪次吐了，哪次发烧，都记。我不记，我对不起他们。」", "「报告上写，当年没有知情同意。」", "「有。」老人说，「嘴说的。药里有毒，可能死，可能好，活不活看命。愿意的，自己报名。第一个报名的，叫屠有德，他说他兄弟先死，他要试。」", "沈序翻到第四页。屠有德，红圈，后面写着：三十年。", "「韩老，」他问，「你怎么知道哪个量是药，哪个量是毒？」", "「称。」老人说，「多一点，人受不了；少一点，病受不了。我一两一两地加，加到病退，就停。」", "「药和毒，隔着一杆秤。」他说，「秤在人手里。」", "「还有一件事。」老人说，「第一年，我们死了九个。药停了三个月。是家属来找我，说韩大夫，你别停。」", "「为什么。」", "老人拿手指头点了点那张纸：「因为停了，他们连盼头都没有。」", "听证会开在第七天上午。", "方黎带了三个人，坐左边。沈序坐右边，桌上摆着两本台账，一本复印件，一本原件。中间是评审组，七个人，魏主任坐主位。旁听席上坐着家属，周强在第一排，牌子折起来，放在腿边。", "屠有德是被轮椅推进来的。九十二岁，穿一件藏青中山装，扣子扣到最上面。他要过话筒，手不抖。", "「我是第四个。」他说，「我兄弟是第三个，黑圈。他死的时候三十一岁，我签的字，接着治。谁逼我了？没人。韩大夫把丑话都说在前头，他说，这药是毒，吃不死也可能吃坏。我说，那也吃。」", "他停了停，看着方黎。", "「你说我们这三十七个人不算数，因为我们活得下来，是运气。」他说，「行。那死了的十五个，你们要不要？也在本子上。他们的命，算不算数？」", "方黎没有立刻回答。会议室里的空调声忽然显得很大。", "沈序翻开第二本台账，翻到黑圈那一页，推到桌子中间。", "「补充一点事实。」他说，「评审报告写『分母不明』。分母在这本上。五十二人入组，十五人死亡，三十七人长期生存。生存者的心脏彩超，我们一个月内上门做完了，三十六份收齐，一份失访。两份出现 QT 间期延长，都在安全值以内，没有猝死。」", "「你们二十八万一疗程的药，」屠有德又问方黎，「我孙子一年挣七万。你让我孙子卖几年命？」", "「所以我们的药也进目录，也在谈。」方黎说。她把一份材料推过去，「谈判价，十九万八。另外，安瑞定的心脏数据，我全部给你们，做长期监测。沈老师要登记，我出人。」", "她把文件合上，声音低了一点。", "「我做过十年血液科。」她说，「三氧化二砷的 QT 毒性，我亲眼见过。一个八岁的孩子，第二次化疗，心跳停了四十分钟，没拉回来。我就是从那以后改行做分子的。」", "「我在药企，你们可以骂我。」她说，「但你们要是把这支老药留下，请把心脏监测那一页也留下。别让下一个孩子，死在便宜上。」", "旁听席上有人举手。是个五十多岁的女人，站起来的时候手扶着椅背。", "「我哥在第三页。」她说，「黑圈，三十一岁。我不怪韩大夫，那时候没药，是拿命试的。我就想说一句：你们算权重、评级，能不能把我哥也算一个数。他不是分母，他是我哥。」", "会议室里安静了。记录员把这句话敲进纪要，一个字没改。", "魏主任把眼镜摘下来擦。", "「沈序，」他问，「你的意见呢。」", "沈序把报告翻到最后一页。那是他自己写的补充意见，三行字：", "一、建议将韩松年队列认定为「历史队列长期结局」，证据等级由 D 上调至 C，作为真实世界证据的补充，权重不设两成上限。 二、条件：五年内建成前瞻性登记，独立终点评估，心脏毒性监测，每年复核一次。 三、本人对上述意见署名负责。", "「我建议通过。」他说。", "「你按程序签，是干净签。」魏主任说，「你这么签，是把你的名字押上去。你在评副高。」", "「我知道。」", "魏主任看了他两秒，把笔盖上：「全体表决。」", "七只手，七只都举了。老郑举得最慢，也举得最高。", "会散了，人往外走。老郑走在最后，拍了拍他的肩膀：「你副高，今年过不了了。复核意见我看了，给你记一条：先行署名，程序违规。」", "「师傅——」", "「记吧。」老郑说，「我干了一辈子程序，今天陪你违一次规。我下个月退休，欢送会你替我张罗。」", "当天下午，系统更新了。沈序点开那份报告，备注栏里那行灰字没了，换成一行新字：", "**新增类别：历史队列长期结局（条件性）。**", "他盯着那行字看了一会儿，点了保存。", "公示第三十天，目录更新。", "三氧化二砷联合方案：保留，标注「附条件，登记复核」。安瑞定：纳入，谈判价十九万八。", "副高的复核结果，腊月下来：暂缓。理由两条，第一条「先行署名」，第二条「程序不规范」。", "老郑的欢送会开在食堂，两桌人，一个蛋糕，一束花。老郑端着缸子挨桌敬水，走到沈序这桌。", "「明年再评。」他说，「评不上，我请你喝酒。」", "「师傅，」沈序问，「你那天为什么举手？」", "「我举得比你晚。」老郑说，「三十年前，有个药，我按程序签了字，把便宜的那支签出去了。后来那支药停产，我后悔到现在。」", "儿童医院的方案单上，两种药都在。医生跟周强说：你们商量。周强说：用便宜的。医生说，好。", "护士把两种药的单子又核对了一遍，跟周强说：「这个老药，推得慢，得看着心电监护。孩子要是不舒服，马上说。」", "「有危险？」", "「有毒的东西，都有危险。」护士说，「所以我们盯着。」", "那天下午，小雨第一次打针。透明的液体，一滴，一滴。", "「爸，这是毒药吗。」", "「是药。」", "「药怎么这么凉。」", "「凉了才不疼。」她爸说。", "她睡着了。她爸坐在床边数滴，数到四十，数乱了，从头再数。", "沈序站在走廊尽头。他手里拎着一只文件袋，袋子里是两本台账的复印件——原件那天会后就送进了档案室。", "档案员问他编号。他说，个案，五十二。", "档案员在箱子上写了两个字：个案。又加了个括号，括号里写：含死亡十五。", "箱子推上架。沈序站在架子前，看了一会儿。架子上还有很多箱子，每个箱子上都有编号，编号后面写着年份、批次、人数。", "档案员问他要不要复印件。他说要。档案员说，复印件也得编号。", "「那就编。」他说。", "台账的最后一页是空的。韩伯说，那一页别写了，留着。", "留着，给后面的人。"]}]};

function renderSidebar() {
    const list = document.getElementById("chapterList");
    list.innerHTML = `<li class="chapter-item ${currentIndex === -1 ? 'active' : ''}" onclick="goToChapter(-1)">
        <span>📖 ${L.cover_label}</span>

    book.chapters.forEach((ch, idx) => {

        li.className = "chapter-item" + (currentIndex === idx ? " active" : "");
        li.innerHTML = `<span>${ch.title}</span><span class="ch-words">${ch.words}${L.unit}</span>`;

    });
}

    if (currentIndex === -1) {
        label.innerText = L.cover_label;
        wrapper.innerHTML = `
            <div class="article-header">

                <div class="article-meta">${L.by}${book.author}${L.meta_sep}${book.total_words.toLocaleString()}${L.unit}</div>
            </div>
            <div class="intro-box">
                <h3 style="margin-bottom:12px;color:var(--accent);">${L.intro_title}</h3>
                <div style="white-space: pre-wrap; line-height:1.75;">${book.description}</div>
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" disabled>${L.prev}</button>
                <button class="nav-btn" onclick="goToChapter(0)">${L.start}</button>
            </div>
        `;
    } else {
        const ch = book.chapters[currentIndex];
        label.innerText = ch.title;
        const pTags = ch.paragraphs.map(p => `<p style="font-size: ${fontSize}px;">${p}</p>`).join("");
        wrapper.innerHTML = `
            <div class="article-header">
                <h1>${ch.title}</h1>
                <div class="article-meta">${L.ch_prefix}${ch.index}${L.ch_mid}${ch.words}${L.unit}</div>
            </div>
            <div class="article-body">
                ${pTags}
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" onclick="goToChapter(currentIndex - 1)">${L.prev}</button>
                <button class="nav-btn" onclick="goToChapter(currentIndex + 1)" ${currentIndex >= book.chapters.length - 1 ? 'disabled' : ''}>${L.next}</button>
            </div>
        `;
    }
    document.getElementById("content-container").scrollTop = 0;
}

function goToChapter(idx) {
    if (idx < -1 || idx >= book.chapters.length) return;
    currentIndex = idx;
    renderSidebar();
    renderContent();
}

function toggleTheme() {
    const current = document.documentElement.getAttribute("data-theme");
    const next = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    document.getElementById("themeBtn").innerText = next === "dark" ? L.theme_dark : L.theme_light;
}

function changeFontSize(delta) {
    fontSize = Math.max(14, Math.min(26, fontSize + delta));
    const paras = document.querySelectorAll(".article-body p");
    paras.forEach(p => p.style.fontSize = fontSize + "px");
}

renderSidebar();
renderContent();
</script>
</body>
</html>
