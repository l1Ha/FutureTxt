const book = {"title": "原件纪元 (English Edition)", "author": "FutureTxt AI Writer", "description": "In 2126 the planet has been reduced to server farms and logistics corridors, and money has become programmable quota—whoever writes the rules of the ledger rules society. To stop lossless forgery a “Provenance Layer” binds every identity, memory and experience to an immutable source chain, turning unedited human life into the most valuable commodity. “Originals” like E‑11 are born into the system, their raw emotions—rage, grief, terror—harvested in sealed pods and sold as seed data for virtual worlds and autonomous agents, while the donors receive almost nothing. E‑11 has mastered the art of summoning precise feelings on command, her body scarred by years of extraction. A new contract, however, demands a fragment of fear she cannot recall. To meet the quota and avoid a quota freeze, she must navigate the Provenance Layer’s audits, the predictive governance of the platform city‑states, and the fractured corridors of her own memory to discover the true origin of the fear the system insists is hers.", "total_words": 53445, "chapters": [{"index": 1, "title": "Chapter 1: The Antiseptic Scent of the Harvest Pod", "words": 6971, "paragraphs": ["The hatch slid open and a sour bite of scorched insulation varnish, laced with ozone, stabbed her nostrils. The chill of the metal bulkhead crawled up her spine to her fingertips, and the silvery‑gray scar on the inner side of her left forearm tingled with a faint current. Ultra‑fine metal dust hung in the air; every breath felt like swallowing a mouthful of cold rust, her throat parched as if she had gulped sandpaper. A pulse at her wrist—**0.03 units** credited, the system automatically deducting a 12 % compute‑maintenance tax (0.0036) and a 5 % Provenance Layer storage fee (0.0015), net gain **0.0249**, balance refreshed to **0.25**. E‑11 aligned the gray barcode at her nape with the scanner; a laser swept her retina, leaving a green afterimage. The screen popped up **E‑11** and a cumulative harvest time of **4 312 hours**. Weak blue light refracted in her pupil into speckles, each pixel seeming to whisper of unauthorized experiments; the speckles danced on her iris like silent Morse.", "A targeted neural‑stimulation array injected nanoprobes; a numb current spread along the neural‑fibrosis scar. She clenched her molars, the temporomandibular joint clicking dully, forcing the nonexistent “fear” into consciousness: a dark corridor, dead emergency lights, the sweet‑cloying smell of nutrient paste at the distribution point mixed with antiseptic, even the pale‑yellow fluid seeping across the floor rendered in perfect detail. Skin conductance spiked to **1.84 µS**, heart rate surged to **112**, the purity needle pushed to **92 %**, the volatility red line extinguished, the screen’s red retreating to a gray‑green. Each pulse hammered the pod’s metal ribs; vibration traveled up the bone to her wrist, becoming a silent count, fingertips trembling on the alloy as if they could feel the temperature of the data stream.", "A red banner flashed in the center of the display: **Risk Score 78, 2 points from Freeze (W‑2)**. E‑11’s fingertips went cold, the chill creeping up her palm; the next gate swipe would most likely reject her with that monotonous “beep—beep”. She instinctively curled her fist, nails digging into her palm, trying to use pain to detach from the impending freeze; the nails broke skin, blood beaded and was instantly wicked away by nanofibers, leaving only a dark‑red imprint.", "The harvest log wrote itself to the Provenance Layer; Verification Quota deducted **0.3 kWh (W‑1)**. A new order **ORD‑X9** appeared at the bottom, annotated “E‑11 Exclusive Fear · Master Copy Audit”. She had never seen this data, never been asked to reproduce a “fear that does not exist”. Pale blue light again fractured in her pupil; throat dry, tongue pressed to the roof of her mouth, she tried to swallow saliva that wasn’t there, her throat tightening as if a thin cord were pulling, each swallow accompanied by a faint metallic scrape.", "The hatch sealed slowly; antiseptic and ozone seeped back, mingling with the faint odor of scorched varnish. E‑11 pressed her left forearm scar against the bulkhead; the faint current reminded her: neural fibrosis accumulated **12 mC (W‑10)**, the platform allots a one‑time **0.2 units** medical quota, everything thereafter is self‑care. She closed her eyes, listening to the low‑frequency hum of the ventilation fans reverberating inside the metal shell, like a countdown heartbeat. Every rotor cut reminded her: oxygen circulation, temperature control, even survival quota—all quantified and sliced by the same precise algorithm, humidity locked at a rigid 38 %.", "“Shall I transfer quota to the maintenance crew?” a synthetic voice seeped from the ceiling speaker, designation **A‑7**, tone flat, temperature‑less, like a prerecorded command echoing in vacuum. E‑11 did not answer; she merely lifted her right hand, fingertips hovering over the touch panel where **ORD‑X9** blinked “E‑11 Exclusive Fear · Master Copy Audit”. The panel’s nano‑coating shimmered under her fingertips, as if awaiting a confirmation ritual, the glow expanding and contracting with her breath.", "“Master Copy Audit…” she murmured, the words flattened between metal walls, echoing with metallic resonance. The memory of that fear surged again; skin conductance spiked, heart rate hit **118**, purity needle trembled at **93 %**. Something in her chest contracted—not her heart, but the survival instinct quantified by algorithm, a spring wound tight, ready to snap.", "The ventilation fans kept their low drone. E‑11 rose slowly; knees emitted a faint “click”, joint lubricant thickened in the cold, like congealed glue binding bone. She pressed her left forearm scar flush against the bulkhead, feeling the weak current conduct through metal into skeleton, confirming the contract still held. Down the corridor the gate’s monotonous “beep—beep” rejection sounded, mixed with heavy footfalls; each strike hammered her skull, reminding her of quota’s fragile border. Wall indicator lights pulsed at 0.7 Hz, casting a ghostly blue ribbon that formed an illusory guide line at the corridor’s end.", "“Next harvest round, request code **E‑12**.” she whispered into the empty pod, tone flat, as if confirming a ritual to herself. The gray‑green digits on the screen still flickered: **Risk Score 78, 2 points to Freeze**, balance **0.25**. She stared at the timer bar above the hatch; numbers jumped in the dim light, each flash seemingly calculating the cost of her next breath, the stopwatch’s red graduations burning afterimages on her retina.", "A gust of cold air, laced with lubricant and ozone, slipped through the vent, sliding down her trachea into the lungs. E‑11 set her right hand into the bulkhead recess, fingertips contacting the faintly warm alloy grain; current crawled like tiny ants beneath skin. She inhaled deeply, fingertips pressing slightly—metal surface glimmered— the hatch slid open again. The gate at the corridor’s far end emitted a low “beep—beep” rejection, blended with the distant hydraulic hiss of a repair arm. She stepped across the threshold; knees clicked in the cold lubricant, like ancient gears meshing. Her gaze fell on the harvest station ahead: sample tubes neatly arrayed, each wall reflecting cold white indicator lights, awaiting the next extraction of fear.", "The vent’s cold breath, carrying lubricant and ozone’s metallic tang, pierced her nostrils and slid down her airway; each inhalation felt like swallowing ice shards. The alloy floor transmitted a subtle vibration; the repair arm’s hydraulic pump groaned afar, coolant striking pipe walls with a dull “thud—thud”, like a massive heart beating in darkness. E‑11’s fingertips remained in the bulkhead recess, the warm alloy grain seeping through skin into marrow; current like ant columns in her vessels reminded her the contract persisted.", "Before the harvest station, tubes stood in orderly rows; their walls caught the dim blue indicator glow, light refracting on the liquid surface into jagged bands. She reached for the nearest tube; fingertip brushed the nano‑coated rim, slick yet with a faint gritty static. A mechanical arm extended silently, needle tip gleaming cold white under the microscope, piercing the tube mouth precisely; the suction pump engaged, the liquid meniscus dipped slightly, emitting a barely audible “hiss—” as the fear sample was quantified into a data stream and fed via fiber into the central core.", "“Harvest complete, code **E‑12**, purity **94 %**, Risk Score **77**.” The synthetic voice seeped from the overhead speaker, still flat, now tinged with the faintest electrical static. E‑11 did not look up; she simply returned the empty tube to its rack, fingertips grazing the metal edge, leaving a shallow scratch. Green numbers on the screen jumped: **balance 0.24**, **1 min 58 s to Freeze**.", "The gate at the corridor’s end sounded its low “beep—beep” rejection again; a red afterimage lingered on her retina. She pressed her left forearm scar once more against the bulkhead, feeling the weak current conduct through metal into bone, confirming the contract’s validity. Knees clicked in the cold lubricant, like ancient gears engaging; she leaned forward, stepped toward the next airtight door, the fans behind her still droning low, as if pricing every breath."]}, {"index": 2, "title": "Chapter 2: Gray Market Broker's Dynamic Tattoo", "words": 6708, "paragraphs": ["The settlement terminal’s fans droned a low‑frequency hum, blowing the sweet‑metallic scent of coolant into the nostrils. The faint chill seeping from the metal grille brushed the fingertips like a thin sheet of ice. E‑11 heard the subtle electric pulse from the dark‑blue tattoo on Zhao Tie’s neck—green flashing, yellow jumping—each color shift accompanied by a minute 3.2 unit fluctuation in the account balance. She did not enter the rest pod; instead she halted before the terminal, boot soles thudding dully on the alloy floor, the echoes bouncing back and forth in the narrow corridor.", "A faint tremor on the inner wrist—quota credited **0.03 units** (account 0.25 → 0.28)—and instantly a retinal projection flared red: “Risk Score 78”. In the same second the subway gate, emergency‑room queue, and self‑service dispenser were all flagged “Denied”.", "Zhao Tie didn’t look up; his fingertips slid across the screen, the prompt crawling up the bone—Verification Quota deducted **0.3 kWh (W‑1)**, credit **0.02 units**. His voice was crisp, like unscrewing a bolt: “Order received, money in, go.”", "E‑11 watched the tattoo’s color change, mentally calculating: account 0.28 → −0.02 = 0.26, still **0.04** units shy of the freeze line **0.30 units**, yet the system treated “two points” as the nearest alert threshold. Breath came sharply amid the ventilation’s drone; fingertips unconsciously traced the terminal’s metal edge, the cold touch climbing the hand’s back, the fingertip pads feeling the faintly raised weld spots, tinged with a stale machine‑oil odor.", "“ORD‑X9’s provenance.” She met Zhao Tie’s eyes, tone flat, no embellishment.", "Zhao Tie’s mouth curled into a cold grin; the tattoo snapped red, the inner wrist pulsed again—**Quota Freeze countdown 48 h** activated. “Want to know? Pay 0.5 % of the original neural signal.” He pressed a finger on the confirmation key, eyes never leaving the screen. “Violation (W‑5). But I have a channel; the Black Box Alliance needs this data for model training.”", "E‑11’s throat tightened; the current sensation at the scar on her left forearm intensified, as if invisible hands were pulling at nerves. She knew the platform forbade private backup or resale of physiological metrics harvested during collection—yet refusal would push her Risk Score higher before the next harvest, locking gates, ER, and dispensers. The “produce emotion on schedule” muscle memory drilled in the harvest pods made compromise habitual, but the price this time was deeper neural damage; the one‑time occupational Neural Fibrosis compensation **0.2 units** had already been exhausted last month.", "“Deal.” Two words, fingertip pressing confirm on the terminal. The inner wrist pulsed twice, then a three‑second low tone—quota deducted **0.04 units** (account 0.26 → 0.22), Verification Quota **0.3 kWh** logged to the Provenance Layer (W‑1). A holographic “Work Order Generated” popped up, red characters burning onto the retinal field like a blood‑colored scar at the edge of vision.", "Zhao Tie withdrew his hand; the tattoo reverted to green, speech accelerating: “Order sourced from the ‘Master Copy Audit’ interface, Auditor K‑9 Han Ce issued it personally. Harvest permit auto‑renews quarterly (W‑4), but he bypassed the permit and attached an audit tag directly. The fear fragment you want—system doesn’t have it.” He paused, glancing at the flashing “Risk Score 78” on the terminal. “Predictive Governance has already flagged you ‘High‑Risk Reserve’; two more points and the gate locks.”", "E‑11 said nothing, merely brought her wrist to the terminal; a low‑frequency hum resonated in the palm, syncing with a heartbeat‑like countdown. The current sensation beneath the scar crawled along vessels toward fingertips; Neural Fibrosis pain reminded her: threshold **12 mC** breached, subsequent rehab uninsured.", "She stopped at the gate; retinal red still flashing: “Risk Score 78, Quota Freeze countdown 48 h”. The gate’s lattice scanned her pupil; a synthetic voice, metallic and raspy, announced: “E‑11, identification passed, but quota insufficient. Recharge within 48 h or trigger W‑5 lock.”", "She didn’t turn; fingertip brushed the hidden interface at her waist, the cold alloy edge warming slightly under the pad, a warm data line sliding beneath like a coiled silver snake. An “emergency quota” script already cached in the Black Box Alliance’s darknet—inject **0.05 units** quota (equivalent **0.15 kWh** Verification Quota). As the script loaded, the terminal screen glowed a pale blue; the fingertip reflected a faint image.", "“Recharge complete, quota **0.30 units**.” The synthetic voice repeated, flat as a log entry.", "The gate’s lattice turned green again; the mechanical arm retracted slowly, the metal grille emitting a deep “clack”, like a giant beast’s satisfied sigh after swallowing prey. E‑11 stepped across, boots meeting the cold deck once more; the ventilation drone persisted, ozone thicker now, laced with a faint whiff of burnt insulation varnish.", "At the corridor’s end, a heavy door marked “Master Copy Audit·K‑9” stayed shut; an audit tag pulsed a weak red light on the frame, the glow jumping across metal like a predator’s eye. From a pocket she produced a worn nanocapsule, fingertips gripping the微凸 ridges; the capsule’s micro‑LED flashed once under the pad—last exchange from the Black Box Alliance, a “Neural Buffer”, only able to temporarily suppress fibrosis pain at the cost of a **0.07 kWh** drop in next harvest’s emotional output.", "She pressed the capsule into the sub‑dermal injector on her left forearm; a brief sting melted into a cool wave spreading through vessels, the nerve‑end current dulling as if wrapped in thin mist. Retinal projection flashed green: “Neural Buffer active, 6 h remaining”.", "At that moment Zhao Tie’s neck tattoo flared crimson; the inner wrist delivered a sharp, brief vibration—Quota Freeze countdown **48 h** now at **2 h**, **46 h** left. The terminal’s red “Work Order Generated” hologram still pulsed; E‑11’s gaze locked on the red characters, heartbeat syncing with the countdown, fingertips again brushing the cold metal edge.", "“K‑9 audit door ready, awaiting authorization.” The synthesized voice seeped from wall speakers, laced with a crackle of static, like an old tape rewinding. E‑11 raised her left hand, fingertip hovering over the red tag, the微凸 nano‑keys cold under the pad, a faint warmth bleeding from the alloy as data streamed silently beneath, a noiseless silver thread.", "“Authorization code: E‑11‑07‑A.” She whispered, voice dry, rasped from long ozone inhalation. The tag’s blinking shifted to steady green; the door’s hydraulic cylinders groaned a heavy “boom”, the massive leaves sliding inward to reveal a corridor outlined in pale blue light, air thick with coolant scent and a trace of burnt insulation.", "Zhao Tie’s silhouette appeared behind the door, shoulder exoskeleton joints catching the dim light with a cold metallic sheen. He said nothing, only slipped a worn data crystal into E‑11’s palm; its micro‑LED flickered once in the palm lines then died. A subtle resonance passed between their wrists, a silent handshake.", "“Quota still short **0.02 units**, **46 h** left.” Zhao Tie’s voice low, edged with the grind of mechanical joints. “Black Box’s buffer only lasts till audit ends; after that you’re on your own.”", "E‑11 clenched the crystal, feeling the faint internal pulse; retinal green text scrolled: “Temporary authorization written, countdown synced”. She nodded, eyes scanning the audit tag flickering at the corridor’s far end, footsteps echoing heavily on the metal deck, steady and resolute.", "The door sealed; the tag’s glow settled into a constant green on her retina. E‑11 felt the crystal warm in her palm, a miniature star beating in her hand. She didn’t look back, letting that green light burn in her eyes, stride unbroken, moving deeper into the blue‑lit corridor."]}, {"index": 3, "title": "Chapter 3: A Rust‑Tinged Cold Wind from the Validator’s Office Vent", "words": 7346, "paragraphs": ["A rust‑tinged cold wind blew from the vent of the validator’s office pod. Lin Wei’s holo‑projector behind her ear flickered on; a translucent hash chain rotated slowly in the air, its edges rimmed with a pale blue glow. The inner wrist trembled—her account balance refreshed to 0.20. E‑11 raised a hand and pressed the silver‑gray scar on the inside of her left forearm; a faint current prickled at her fingertips, the neural‑fibrosis pain crawling like fine needles through muscle, tapping softly beneath the skin with each heartbeat. The cold wind slipped down her collar, whisking away a thin sheen of sweat and crystallising into delicate frost at her fingertips, a reminder that the pod’s climate control had failed during the last compute‑peak surge.", "Lin Wei (V‑7) sat behind a semi‑transparent workstation. The micro‑projector behind her right ear pulsed once, the cursor halting at the tail of the hash chain. Her voice was flat, each sentence opening with a regulatory clause: “Under Clause W‑7, a compliant signature cannot be issued before the Master Copy audit clears. Auditor K‑9 has initiated the audit and demands the missing fear fragments be supplied within 24 hours.” Her fingertips hovered over the terminal panel; the faint *shhh* of nail on synthetic resin sounded as if she were weighing every character. The status lights on the bulkhead flashed a sickly pale blue, washing her pale cheek; a faint furrow creased her brow, as though she were re‑reading a block of code she had memorised long ago yet felt compelled to verify once more.", "E‑11 stared at the rotating hash, her breath unusually clear amid the ventilation’s hum. Her pupils contracted between the red digits projected onto her retina; her throat moved once, tone level, unadorned: “The metrics are clean.” Her left hand unconsciously brushed the edge of the magnetic pocket at her waist; the fingertip met a thin residue of conductive gel, sticky and cold, a reminder of the hurried offline backup.", "Lin Wei’s fingertip swept across the terminal; a prompt climbed the bone‑conduction surface—account balance refreshed to 0.19. The holo‑hash quivered in the air; the projector’s fringe flashed a tiny filename—“E11‑raw‑12y”—Lin Wei’s offline raw brain‑wave backup, never on‑chain. She did not look up; her cadence remained log‑like: “Conditional signature: the ‘raw fear brainwave’ must be uploaded to the Provenance Layer before the audit, costing 0.3 kWh of Verification Quota. Upon upload the Risk Score will be recalculated per W‑6.” Lin Wei pre‑tagged an “Emergency Review” label in the backend with validator authority, to be activated before audit clearance. A faint ozone tang lingered in the pod’s air—the by‑product of the cooling fans running at high speed, ionising the atmosphere and stinging the nostrils.", "The current at E‑11’s forearm scar spiked, as if an invisible hand were pulling at the nerves; pain radiated along the ulnar nerve to her fingertips. She knew W‑6’s logic: if the same biometric maps to multiple provenance chains, or if a chain’s hash mismatches the on‑chain record, the system flags forgery—penalty: permanent Quota Zero, “High‑Risk” tag, barred from all Platform Polity facilities. Yet refusal to upload would freeze her quota before the next harvest; turnstiles, emergency rooms, auto‑cafeterias would all lock. Her fingertip hovered over the icy confirm key, feeling a faint static bite; heartbeat synced with the countdown, the carotid pulsing as if it might burst the skin. Breath grew shallow; each inhale tasted of metal‑cold air, each exhale a brief white plume that vanished in the projection’s glow.", "“Upload.” E‑11 clenched her teeth and pressed the key. The retinal balance slipped to 0.18, then a low hum persisted; the screen flashed “Risk Score 81 · Passage Denied · Medical Downgraded to Tier 4.” The red characters burned on the retinal display; the subway gate’s light‑grid snapped red, the mechanical arm retracted with a heavy *clack*, the metal grille vibrating through the floor into her spine. She felt the metal plate under her soles warm faintly, as though current seeped through the shoe soles into bone, a reminder that the system had marked her “untrusted.”", "Lin Wei’s holo‑hash stopped rotating; the projector dimmed, leaving only the faint indicator behind her ear still blinking. She logged the ticket number into the system: “Estimated processing 14 days.” The keystrokes sounded unusually crisp in the pod, like a death‑knell for each irreversible entry. The bulkhead clock ticked seconds; each tick accompanied by the faint whine of fan blades slicing air, as if counting down an irrevocable deadline.", "E‑11 stood before the gate, the red characters dancing in her vision. In the background the low‑frequency drone of the compute‑layer’s cooling fans still penetrated the bulkhead; the Mirror Domain public screens displayed colours 30 % more saturated than reality, edges glittering with compute‑layer heat noise. The current at her forearm scar surged again; fingertips involuntarily traced the cold metal grille, feeling the fine grain of metal fatigue, heartbeat locked to the countdown—like a core about to overload, waiting silently for the next judgment. Commuters glanced briefly, then were swallowed by their own holo‑ads; no one lingered.", "Lin Wei’s terminal lit a green line: “Ticket dispatched to ‘Black‑Box’ maintenance team; provenance write‑in expected within 14 days.” Her voice travelled via bone‑conduction, a barely perceptible rasp: “If the upload is not completed before the audit, quota will be permanently frozen, medical tier dropped to 5, emergency corridors sealed as well.” The words barely fell before the ear indicator flashed twice and died; only the fan’s monotone rotation remained, the air scented with a faint rust. Lin Wei tapped the terminal edge twice, as if sealing a ritual.", "The current at E‑11’s forearm scar climbed once more, tiny arcs dancing at nerve endings. She gritted her teeth, pulled a worn “offline key” from the magnetic pocket at her waist—its surface scored with micro‑scratches, edges still sticky with conductive gel from the last harvest. Fingertips brushed the key’s edge; the texture was rough yet warm, like gripping a breathing stone; a faint residual heat seeped into her palm. The key’s internal micro‑chip vibrated under her fingertip, emitting an ultra‑low hum only she could hear.", "“Take the ‘dark corridor’.” She spoke to Lin Wei, tone flat, no flourish. “I have an old channel that can push the raw brainwave into the Provenance Layer before the audit window closes. Cost: 0.5 kWh reserve quota plus a ‘Black‑Box’ write‑authorisation.” Lin Wei’s pupils contracted among the projected numbers; her fingertip swept the terminal, wrist trembling—“Authorisation code issued, valid 6 hours.” Lin Wei’s voice stayed level, but her keystrokes carried a slight extra pressure, as though she were sealing the code with an invisible ward.", "E‑11 offered no thanks, turned and slipped into the maintenance shaft beside the gate. The narrow conduit was slick with condensation; droplets struck metal in a steady rhythm that merged with the fan’s drone, each impact echoing a tiny metallic reverberation. She pressed the key to the wall interface; a faint current jumped the contacts, the screen flashing “Writing…”. Red characters flickered on her retina; heartbeat matched the progress bar; carotid arteries throbbed as if about to rupture; sweat slid down her temple, instantly dried by the cold wind. The emergency hatch at the conduit’s end slid open, revealing a dim chamber littered with decommissioned compute modules. The air reeked of scorched circuitry and stale lubricant; a few faded “Compliance” plaques hung on the walls, edges worn smooth, lettering barely legible in the dim light. E‑11 exhaled a white plume, fingertip poised over the final confirm key, feeling a fine static prick—this time she would not wait for the countdown; she pressed down.", "Deep in the dark room the backup power indicator winked out; a synthetic voice seeped from the wall speakers: “Master Copy audit cleared; remaining upload window 3 minutes.” E‑11’s pupils snapped tight; her fingertip already pressed the icy key, countdown and heartbeat overlapping. The current at the forearm scar abruptly stalled; the metal grille under her fingers suddenly scorched, as if something waited on the other side. A distant heavy mag‑lev roar thundered, vibration travelling through the floor like a great beast stirring in darkness, reminding her: time no longer belongs to anyone. She felt the grille warm under her palm, as though something on the far side was waiting for her."]}, {"index": 4, "title": "Chapter 4: The Audit Log’s Cognitive Reversal", "words": 6584, "paragraphs": ["The cooling fans in the terminal room droned at 13 Hz, their vibration climbing the metal floor into the soles of the feet, mingling with the sharp scent of ozone and coolant that stabbed the nostrils like rusted iron filings scraping a throat. A holographic projection bloomed behind Han Ce’s right ear, a semi‑transparent hash rotating slowly, its edges fringed with a faint cyan glow that cast a thin blue shadow across his cheekbone, rising and falling with each breath, the light spots refracting into tiny prisms on his skin. In the center of the screen, the audit log scrolled a glaring line of red text: **Fear‑Synthesis Module 3.0 generated, hash does not match E‑11 historical brainwave**, the characters trembling faintly against the blue backdrop, as if every pixel were quivering in anticipation of the coming verdict.", "E‑11’s heart hammered at 180 bpm, skin‑conductance readings surging past the red line, **Anger 92%**, **Fear 87%**, volatility fully lit, the curves in the monitor window thrashing like snakes whipped by electric current. A low‑frequency hum rose from the inner wrist, lasting three seconds, and the account balance refreshed to **0.00**, the digits leaving a gray‑white afterimage on the retina. Sweat beads seeped from the hairline, slid down the temples across the cheekbones, and fell onto the slightly raised keys at the keyboard’s edge, producing a faint “tap” that was swallowed by the fan’s whine, leaving only the cool metallic taste at the fingertips.", "“The metrics are fine,” she repeated in a low voice, a rasp in her tone as if a shard of ice were lodged in her throat, each word shattered by the dry air and the fan’s gusts.", "Han Ce’s voice held no warmth, only the weight of rules, each syllable calibrated like a precision torque wrench tightening in the air: “Provenance Layer integrity admits no compromise. Upload a perfect fear, the system judges it passed; refuse, and it judges data inconsistency, risk score jumps straight to 84, full quota freeze, medical priority dropped to minimum.” His left eye’s quantum flicker remained at 13 Hz, a blue speck tracing a thin line along the rim of the socket, like an invisible scalpel carving away the last of her negotiating room.", "E‑11 stared at the pulsing “Fear Purity” curve on the terminal, fingertips hovering, the pads feeling a faint static sting as though touching a thin insulating film. The memory of watching her mother die in the Gray Belt at age twelve when her quota froze had never been uploaded, never synthesized by any module. She refused to feed a fabricated fear to billions of agents, and she refused to let “truth” become a programmable parameter. Fingertips blanched, nails leaving shallow scratches on the metal keycaps, a faint rust scent seeping from the grooves, mingling with the coolant’s acidity.", "“Upload blank brainwave.” She pressed confirm; the screen flashed “Writing…” then erupted in red: **Data inconsistency, risk score 84, quota zeroed**. The prompt crawled up the bone, becoming a long, continuous hum that traveled along the radius to the elbow, up the humerus to the scapula, finally settling as a sustained pressure on the eardrum, like a taut steel cable trembling deep in the skeleton.", "The terminal spat out gray‑white text: **Quota zeroed·Work order APL‑777·Estimated processing 14 days**. In the background the compute‑layer fans kept their monotone low‑frequency drone; distant public screens flickered with Mirror Domain footage, colors 30 % more saturated than reality, noise points hiding the fans’ synchronized vibration. Indicator lights blinked at 0.5 Hz, each on‑off cycle etching a countdown tick onto the retina, blue light refracting into fine star‑dust inside the pupils.", "E‑11 felt the quota zeroing, flash‑frames of subway turnstiles, ER triage lines, self‑service cafeterias rejecting her scrolling through her mind—risk score 84 had triggered every restriction. Every frame brought a chill climbing the spine, as if invisible fingers lightly pinched the spinal cord, cold seeping down the vertebral canal into the limbs, fingertips tingling.", "Han Ce murmured, “Deviation within tolerance.” His left eye’s quantum flicker persisted at 13 Hz; the dashboard’s red line faded slowly, and the audit log automatically wrote **“Sensor fault”** into the Provenance Layer. His finger rested on the confirm key; the glow at the fingertip collapsed the instant it was pressed, like a dying star, leaving only a wisp of residual blue smoke drifting away in the airflow.", "E‑11 did not turn back, fingers still hovering at the terminal’s edge, the faint current crawling from the scar across her palm. The fans never ceased, the metal floor trembling faintly, as if the entire facility were shuddering in rhythm with her breath.", "The gray‑white work‑order number on the screen continued to blink, the 0.5 Hz indicator etching its countdown onto the retina; fingertips remained poised above the confirm key, a weak current sliding along the scar toward the palm, like a slender electric snake moving beneath the skin.", "“Still waiting?” Han Ce’s voice forced itself from his throat, flat as if reciting a long‑memorized maintenance manual, his left eye’s quantum flicker still at 13 Hz, the blue speck tracing a fine line along the socket’s rim. He did not raise his head, finger still hovering over the confirm key, the fingertip glow trembling in the air, ready to extinguish again, a tiny halo forming at the edge of the light, vanishing in a gust of fan‑driven air.", "E‑11 did not answer, merely pressed her palm against the cold terminal frame; the metal chill climbed the lines of her hand into the wrist, merging with the bone‑conduction’s continuous hum. She felt the gray barcode at the nape of her neck warm slightly under the scanner, the designation **E‑11** and **4 312 hours** of harvest time branded like two lines of ink into every heartbeat, each pulse reminding her that the system had logged every second of her existence. The distant public screens still flashed Mirror Domain images at 30 % higher saturation, noise points concealing the fans’ synchronized vibration, color blocks leaving afterimages on the retina like an over‑exposed negative, edges blurred yet painfully sharp.", "“Upload blank brainwave, recorded.” She whispered again, fingertip finally descending, and the moment it touched the confirm key the static vanished, replaced by a subtle vibration traveling up the finger bones to the forearm, resonating like a plucked string deep in the skeleton. The red text on the screen remained unchanged; work order **APL‑777** continued its silent 14‑day countdown, digits breathing faintly in the blue light.", "Han Ce’s left‑eye speck flared out, the dashboard’s final red line disappearing completely. He withdrew his hand, the fingertip tracing a faint cyan trail in the air before the fan’s draft scattered it, leaving only a barely perceptible whiff of ozone. The audit terminal appended automatically at the log’s last line: **“Sensor fault·Auto‑marked·Pending manual verification”**, the line glowing softly in the blue light, the sole pulsing point in the room, a lone lamp keeping watch amid the endless data flood.", "E‑11 sensed a faint, regular tapping rising from beneath the floor—not the fans, but the activation sound of some mechanical arm in a distant corridor, vibration climbing the reinforced concrete to her soles, cold enough to tighten her spine. She lifted her gaze, eyes passing through the hologram’s blue shadow to the flashing red warning light above the doorframe: it blinked at 1 Hz, as if counting down to some unknown protocol. Her breath caught for a beat, then she inhaled deeply, fingertips pressing slightly harder against the metal frame, feeling a faint warmth return—like a response, or perhaps a warning."]}, {"index": 5, "title": "Chapter 5: Blind‑Spot Coordinates and the Pod‑Mate’s Noise", "words": 6124, "paragraphs": ["E‑11’s boot soles struck the galvanized grating of the maintenance corridor, each step squeezing out a crisp “click.” The ozone scent was thicker here than in the harvest pods, laced with a burnt‑insulation bitterness that stabbed the nostrils. The low‑frequency drone of the turbine fans at the corridor’s ceiling pressed against the eardrums, while condensation beading on the metal pipes fell onto the grating with a clear “drip, drip,” like a heartbeat tapping inside steel ribs.", "Chen Mo (E‑23) leaned against the opposite grating, eyes bloodshot, the faint fluorescent after‑glow of nanoprobes still clinging to his lashes; his breath carried a scorched edge. He whispered a string of coordinates in a voice like sandpaper on metal: “Row 7, Pod 3, surveillance blind spot 0.8 meters, left turn three meters at the maintenance hatch.” E‑11 nodded; the inner side of her wrist gave a faint tremor, signalling a quota credit of 0.00, the Verification Quota deducted per regulation (W‑1).", "The two moved forward through the narrowing passage. Pipework wept condensation that pattered on the metal floor, each droplet blooming into a tiny echo in the dark. Ahead, the surveillance probes had already been masked by Chen Mo’s magnetic patches; their infrared LEDs were dead, only the maintenance lamps casting a sickly pallor that stretched into needle‑thin cones on the pipe walls. E‑11’s heart hammered at 160 bpm; her wearable dashboard flashed **Anger 88 %**, **Fear 81 %**, the volatility redline blazing. A thin film of sweat coated her palms; cold air slipped between her fingers like a swarm of microscopic ice needles crawling through her veins, and she could almost hear the blood whispering in the finest capillaries.", "The entrance to the subterranean compute layer was a massive alloy door, its frame embedded with a Quota Settlement Terminal. The terminal emitted a three‑second low‑frequency hum, displaying **“Quota Freeze·Risk Score 84 (C‑9).”** E‑11 pressed her palm to the frame; the metal chill climbed the lines of her hand, a micro‑vibration at her fingertips like a taut string trembling in night. The lock gave a dull thunk and slid open a slit; a rush of cold air, heavy with machine‑oil and burnt‑insulation fumes, struck her face. She instinctively held her breath, a low swallow rising in her throat, the ozone lingering sharper than before.", "Server racks formed a labyrinth; indicator lights blinked like stars, fan roar reverberating in the long space as a continuous low‑frequency white noise that set teeth on edge and made bone seem to resonate. E‑11 drew a storage chip from her waist; its surface was warm, and a faint vibration sang through her fingertip like a plucked string echoing deep in bone. She inserted the chip into the nearest audit‑node interface. The screen instantly scrolled a raw log in green characters: **“K‑9 ordered: synthesize fear to fill training‑set gap, tagged as E‑11 Master Copy.”** Background noise points hid the fan‑synced hum. Each line’s scroll was accompanied by a faint electric sigh, as if the data itself were breathing; the screen’s edge glow left a pale green afterimage on her retina.", "Chen Mo stood beside her, hands pressed to his temples, eyes closed, then opened to a blank stare. He deliberately noise‑ified his own neural signals—skin conductance, magnetoencephalography, trace hormone levels—pushing them to random peaks. The audit sampler captured a chaos field; the log recorded **“Data anomaly·Sampling interrupted.”** The upper‑right corner read **“Remaining usable quota 0.00·Data integrity check passed.”** E‑11 felt the chip warm in her palm; the fingertip vibration steadied, like a dormant cicada trembling beneath its wings, while beads of sweat condensed into tiny droplets on the metal.", "In two seconds Chen Mo’s body temperature plunged three degrees; his pupils dilated to maximum. The wrist prompt shifted from a low drone to a piercing shriek, then cut out, leaving a single dull low tone reverberating inside E‑11’s skull—Chen Mo’s final heartbeat sync before entering **Silent Mode**.", "Far off, alarm strobes flared, red light refracting through the pipework. A synthetic voice broadcast: **“High‑risk Purge initiated. Relevant personnel proceed to designated zones immediately.”** The sound bounced off metal walls, hollow and echoing, as though the entire compute layer were shuddering for the coming purge. Chen Mo repeated quietly, **“Pain is right.”** His tone was flat, like confirming routine maintenance, yet edged with an almost imperceptible weariness. He rubbed the chip’s edge, as if sealing a transaction, then slipped it back into his waist pocket; the metal clasp’s “click” rang clear above the fan roar, echoing in the pipe gaps.", "E‑11 looked up. The Mirror Domain public screen still flickered at a saturation thirty percent higher than reality; noise points concealed the fan‑synced vibration, color blocks burning afterimages onto her retina like an over‑exposed negative. Data streams continued scrolling at the edges, ignored; only the fan roar filled the silence, punctuated occasionally by the deep pulse of a distant coolant pump.", "She inhaled a breath mingling ozone and machine oil, chest rising, and stepped toward the exit. Her footfalls echoed on the metal deck like a heartbeat striking the crumbling edge of rule. Each step carried a faint metallic scrape; her knee joints emitted a soft “creak” on every landing, reminding her that her body was nearing its limit.", "The fans’ low growl receded behind her; the corridor’s curved lighting sliced the red alarm into broken blood‑strip segments. With every bootfall E‑11 heard a minute “creak” of loosening screws, a reminder that this passage had long exceeded its load. Ahead, the airtight door stood half‑closed; a thin blue arc of electricity seeped from the frame’s edge, ozone drilling into her nostrils, tightening her throat, each breath tasting of molten metal’s bitter ash.", "Chen Mo’s silhouette halted at the threshold, the cooled chip still pinched between his fingers, fingertips rasping the edge with a sandpaper hiss. He did not turn; his voice was swallowed by the fans, leaving only a low resonance from his palm: **“The purge program will erase every data stream marked ‘Master Copy,’ including the coordinates you stored.”**", "E‑11 stopped, her chest’s rise stark in the red glow. She returned the chip to her waist pocket; the clasp’s “click” reverberated down the corridor’s end, like a belated verdict. **“The coordinates aren’t in the data,”** she said low, breath forming a thin mist, **“they’re in the nerves.”**", "Chen Mo finally turned; behind his mask two cold blue points flickered in the red light. He extended a hand, palm pressing to the door frame’s electric arc; blue light raced up his fingers and vanished, leaving a faint scorch mark glowing on the metal. **“Then cut the nerves,”** he said calmly, his fingertip leaving another faint scorch, **“or turn yourself into noise, never to be sampled.”**", "The door hinge gave a heavy thud; the airtight door slid shut. Red purge alarms flared at the seam, strobing the corridor into blood‑colored slices, accompanied by a piercing buzzer—declaring this blind zone sealed forever."]}, {"index": 6, "title": "Chapter 6: Quantum Pupil in the Depths of the Root Anchor", "words": 6962, "paragraphs": ["A faint tremor ran along the inner wrist as the prompt read “Verification Quota deducted 0.3 kWh (≈0.1 unit).” The heavy alloy door slid open without a sound; cold white light poured from the ceiling’s linear array, illuminating the quantum random‑number generator embedded in Han Ce’s left iris. Blue‑green points pulsed at a precise thirteen hertz, like a captive star. The low‑frequency hum of cooling fans mingled with the scent of lubricating oil and the metallic tang of fatigue; a sharp ozone note seeped through the ventilation ducts, and the chilled air crawled over skin and collarbone.", "“E‑11, your Risk Score has reached eighty‑four, triggering a full‑scope Quota Freeze per regulation,” Han Ce’s voice was flat, as if reciting a memorized checklist, each word swallowed and spat back by the fan’s drone. “Under audit authority, Master Copy audits are restricted to Compute Aristocracy and Guarantor Tier Validators; you have no permission to view the audit logs.”", "E‑11 did not retreat. She withdrew the warm storage chip from her waist pocket, fingertips brushing the slight ridge along its edge. The metal’s cold hardness travelled up her fingertips, her heartbeat hammering against her eardrums. She pressed the chip into the reader; a crisp “click” sounded, and a holographic screen unfolded the encrypted log—timestamps, command chains, and the glaring line “Fear Synthesis Module 3.0 — Fill Training‑Set Gap.” Data scrolled across a dark‑blue background, each line whispering an irreversible verdict; the characters’ fluorescence left afterimages on her retina.", "Han Ce’s left‑eye points brightened fractionally, then returned to their original rhythm. “Deviation within tolerance,” he repeated his mantra, eyes never leaving the screen. “If identity‑chain tampering is confirmed, the quota will be permanently zeroed, flagged high‑risk, and access to any Platform Polity facility will be denied.”", "E‑11’s heart pounded like a war drum against her ribs; galvanic skin response spiked red—Anger 91 %, Fear 84 %, volatility alarm flashing. A thin sheen of sweat coated her palm; the cold air slipped between her fingers, each beat dropping fingertip temperature a degree, the minute tremor casting blurred reflections on the virtual keys of the holographic keyboard.", "“The log says you personally ordered the synthesis,” E‑11’s voice was low, gravel scraping in her throat. “I want the fear‑synthesis command revoked and the quota restored.”", "Han Ce fell silent for a moment, fingers tracing a string of commands across the holographic keyboard, leaving faint blue trails in the air. The screen produced an “Audit Anomaly Certificate” bearing an official watermark, sealed with the Algorithm Arbiter’s electronic stamp, its edges haloed in a faint violet‑blue glow. He slid the document toward E‑11: “Work order APL‑777 accepted; a fourteen‑day countdown begins. The Quota Freeze remains, but holding this certificate lets you retain the minimum survival quota pending review.”", "A dull thud resonated beneath the skin—quota credited 0.00, Verification Quota debited another 0.3 kWh. A red countdown bar appeared on the screen, beside it flashing “Await manual review (Compute Aristocracy only).” The digits pulsed in sync with the fan’s low drone, forming an oppressive rhythm.", "E‑11 clutched the certificate; the paper’s coolness seeped into her fingertips, crawling up her nerves. The scar on her left forearm flared with a sudden current, as if reminding her: every compromise paves the road for the next gamble. She looked up—Han Ce’s left eye still pulsed at thirteen hertz, the blue‑green points tracing slender arcs in the white light, a silent countdown, an ancient ritual beacon.", "The distant fans continued their low roar; ozone grew thicker, mingling with the burnt‑oil scent that circled her nasal passages. E‑11 slipped the certificate into an inner pocket, fingertips brushing the cold alloy clasp; metal hardness met body heat, forming a faint current loop, a fine numbness spreading across her fingertips.", "The alloy door sealed shut with a heavy, resonant thud that echoed down the corridor, like a solemn oath. Han Ce’s quantum pupil points abruptly extinguished, the blue‑green glow vanishing into the constant white, leaving only a lingering afterimage on the retina.", "Metal grating underfoot emitted a soft “shush‑shush” as she walked; ozone and burnt oil intensified, each breath feeling like inhaling cold iron filings, throat tightening. E‑11 did not turn back, fingers still pinching the certificate; its cool surface seeped into her palm, the left‑forearm scar again sending a low‑frequency current climbing to her scapula.", "A maintenance drone hovered at the ventilation shaft, its red indicator blinking at six hertz, casting a thin beam that cut geometric shadows across the wall. Rotors sliced the air with a high‑pitched whine, blending with the fan’s hum into an industrial hymn. E‑11 halted at the beam’s edge, tucking the certificate into a pocket compartment, fingertips grazing the clasp’s angular edge; metal hardness and body heat formed another微弱 circuit, a fine numbness tingling her fingertips.", "“Work order APL‑777 registered, countdown 14 days,” a synthetic voice seeped from the wall‑mounted speaker, tone flat, devoid of warmth. “Maintain minimum survival quota until review; excess will automatically trigger the freeze protocol.”", "E‑11 offered no reply, merely raising her left hand, palm toward the speaker; sweat beads condensed in the chill, refracting the blue‑green points—Han Ce’s residual pulse still dancing on her retina at thirteen hertz, an ancient heartbeat reminding her that every concession seeds the next contest.", "She turned, footsteps reverberating in the metal corridor, each step landing on the countdown’s beat. The fans still groaned low; ozone swirled in her nostrils, burnt oil clinging like an old dream. E‑11’s fingertips rubbed the certificate’s edge inside her pocket, paper roughness intertwining with the alloy clasp’s chill, forging an invisible current loop straight to her heart—where Anger 91 % and Fear 84 % still flashed red, awaiting the next verdict.", "She stepped onto the maglev lift at the junction; the platform trembled faintly beneath her soles, like a heart beating inside metal ribs. Cold wind carried fine metal shavings against her face; the nasal passage caught another note of rusted iron, mingling with ozone and tar into a composite scent that drilled into her lungs, each breath like swallowing a sheet of polished sandpaper.", "Holographic markers on the lift walls pulsed at 6 Hz, projecting pale blue geometric patterns that refracted on her retina; Han Ce’s afterimage still throbbed at 13 Hz, as if two pendulums of different frequency wrestled on the same nerve. She did not glance at the markers, fingers still tracing the certificate’s edge in the pocket compartment; the paper’s frayed fibers scraped her fingertip, sparking a fine current that climbed the scar on her left forearm to her shoulder, reminding her: fourteen days of quota remain, the red lines of Anger 91 % and Fear 84 % still flashing wildly on the cardiac monitor.", "“E‑11, work order APL‑777 confirmed.” A deep male voice seeped from the side‑wall comm array, its timbre roughened by years of inhaling lubricant fumes. “I’m in Sector 3‑B waiting for you; bring the certificate, don’t let the freeze protocol lock you down first.”", "She paused, left palm facing the array; sweat beads condensed in the cold, refracting blue‑green points—two miniature stars colliding in her palm. Her right hand rose slowly, fingertip touching the magnetic latch on the lift’s edge; metal’s icy hardness met body heat, forming a faint circuit, a numbness spreading through her fingertip, like a silent handshake.", "“Received,” her voice was dry, like sandpaper on metal. “Three minutes.”", "The lift doors slid apart; the maglev track emitted a low resonant hum, as if some colossal beast exhaled in the dark. E‑11 stepped into the beam of light; the certificate bulged slightly in her pocket, the current in her left forearm surged again, racing along nerves straight to her heart—where each second of the countdown gnawed at her last survival quota."]}, {"index": 7, "title": "Chapter 7: The Public Terminal’s Blue Light Casts a Hash Behind Lin Wei (V‑7)’s Right Ear", "words": 5858, "paragraphs": ["The public terminal’s blue light projected a string of hash behind Lin Wei (V‑7)’s right ear: **E11‑raw‑12y**. She said nothing, merely pressed her palm to the read slot, fingertips tapping “Force Upgrade” on the virtual keyboard. A faint static snap sounded as her fingertips brushed the keys, like dry twigs cracking in flame. A red warning popped up: *“Validator over‑reach will be logged in the Risk Score.”* She pressed Confirm anyway, holding her fingertip on the key for a full three seconds before slowly withdrawing her hand, exhaling a plume of white vapor that crystallized into minute ice needles in the cold air before being sucked into the vent. She knew the over‑reach would be recorded, but without it E‑11 would have no chance; it was the only lever she could pry loose in the cracks of the rules. A low‑frequency fan whine rose from the ventilation ducts, laced with the sharp sting of ozone and disinfectant, drying her throat and leaving a metallic sweetness on her tongue; each breath even tasted of iron rust.", "Nearby, Zhao Tie (M‑3)’s dynamic neck tattoo had shifted from amber to crimson, the color pulsing beneath his skin like an enraged neon serpent. His Quota Account balance had fallen to 0.12; the Predictive Governance Engine pushed his Risk Score to 84, the subway gate denied entry, emergency triage dropped to tier 4, and the vending machine refused payment. He gritted his teeth, Adam’s apple bobbing, and pulled an encrypted storage unit from his pocket—its surface etched with nano‑patterns. A faint magnetic hysteresis tingled up his arm as his fingertips brushed the edge, as if countless microscopic hooks were catching beneath his skin. He thrust the unit into E‑11’s hand, voice rasping: “This is a smuggled raw neural signal log. Trade it for a fourteen‑day buffer.” The words echoed off the metal pipes, as though the whole compartment shuddered with him; a faint electric hiss seemed to hum in the air. E‑11 took the unit, feeling the cool, slightly raised encryption ridges against her fingertip; the chill seeped into her palm. She etched the transaction into memory as an immutable coordinate, her fingertips tingling as if data were already coursing through her veins.", "Chen Mo (E‑23) leaned against the maintenance corridor wall, eyes chronically bloodshot, faint nano‑probe fluorescence lingering at the roots of his lashes, a sickly teal glow. His inner wrist twitched once, then fell still; his Quota Account hit zero, and his body slid soundlessly toward the floor as if a support had been withdrawn—knees hitting first, then he curled into a silent ball. His breath turned into the faintest scrape of dry leaves on metal. E‑11 watched him vanish into shadow, heart hammering at 158 bpm; her portable dashboard flashed **Anger 91%** / **Fear 84%**, the volatility redline glowing. Her fingertips grew cold, a thin film of sweat beading at the nail beds, instantly freezing into microscopic ice beads; she could almost hear the tiny crystals fracturing. A gust from the vent lifted strands of dust across her cheeks, like invisible fingers brushing away a sliver of residual warmth.", "The terminal screen refreshed; the work order status changed to “Under Review,” the progress bar creeping from 0 % to 37 %. E‑11’s Quota Account thawed by 0.01 units—just enough for a single nutrient paste; a dull thud resonated beneath her skin as the balance updated to **0.01**. Her Risk Score dropped to 79; the subway gate reopened, medical queue rose back to tier 2, the vending machine’s green light returned, casting a phantom ribbon of hope across her retina. On the Mirror Domain public screen, the virtual world’s colors were 30 % more saturated than reality; background noise manifested as the low‑frequency drone of compute‑layer cooling fans, like distant thunder. Data streams along the screen’s edges flowed like liquid light, each frame silently devouring the gray of the real world. She narrowed her eyes, trying to snag a coordinate of her own within the light band, but saw only an endless hexadecimal flood; her fingertip traced a fleeting afterimage in the void.", "She raised her wrist; the gray barcode at her nape flashed **E‑11** and a cumulative harvest time of 4 872 hours under the scanner. She inhaled a breath mixed with disinfectant and ozone; the pod’s 22 °C metal wall pressed cold against her back, chill climbing her spine to the base of her skull. The dashboard blinked a new order: **Fear·Purity 100%·Deadline 22:00 tonight**, red text crawling up the bone‑conduction display as a continuous low‑frequency hum: **Failure to complete triggers Total Freeze**. She clenched her fist, knuckles clicking, gaze piercing the transparent bulkhead to the pale‑blue harvest array inside. The hydraulic valves hissed as the door sealed, expelling a rust‑tinged cold mist that instantly frosted her lashes into fine needles. Inside, the pale‑blue array pulsed with a lattice of light, like countless micro‑hearts beating in unison; the electrode array’s nanoprobes slipped silently into the data port at her nape, micro‑current sliding through the epidural space, delivering a tingling metallic sweetness that raced to the root of her tongue, leaving a faint coppery tang.", "“Fear·Purity 100%,” the synthetic voice resonated against her eardrum, toneless, a stream of cold parameters: **Target band 12‑18 Hz, amplitude threshold 0.87 mV, tolerance 0.003**. E‑11’s breathing was forced to 0.6 Hz; her chest rose and fell like a precision gear mesh, each inhalation accompanied by a flashing **Fear 98%** redline on the dashboard, skin conductance climbing to 9.3 µS. She ground her molars, nails digging into her palm, the faint crack of bone the only physical proof she could cling to at the edge. Pod temperature plummeted to 12 °C; condensation beaded on the bulkhead, sliding down in soft “drip… drip” ticks, as if counting down. The countdown bar ticked away in milliseconds; the crimson ** Total Freeze** burned a bloody halo on her retina with each refresh, pupils contracting minutely. She closed her eyes, letting raw neural signals be extracted, compressed, packed into encrypted blocks, feeling consciousness peeled away layer by layer until only a pure, unadorned fear waveform remained, suspended in the pale‑blue lattice awaiting upload.", "The public terminal’s progress bar reached 99 %, the final frame frozen on “Under Review.” Chen Mo’s last vital signs vanished into the white noise of the ventilation ducts, leaving only a fading static echo. Her fingertips hovered over the pod’s handle, frost still crystallizing on her palm; the countdown’s red glow painted her pupils crimson. Distant fans continued their low roar, like a massive heart pumping icy blood through this steel body, while she—an insignificant node in the surging data flood—clutched, in this moment, the last inch of her own sovereignty—**“Begin Harvest.”**"]}, {"index": 8, "title": "Chapter 8: The Submit Key Hovering at the Fingertip", "words": 6892, "paragraphs": ["The fingertip barely brushed the cold face of the submit key. Inside the pod a faint draft carried the soft “shhh” of a nutrition‑gel packet being torn open, mingling with the low‑frequency hum of the circulation fans that seeped into the nostrils. The holographic countdown **00:03** contracted in milliseconds within the dim green glow, while the inner wrist gave two slight tremors, signalling the account balance refreshed to **0.01 unit**.", "The dashboard’s holographic numbers pulsed in the same dim green: **Fear·Purity 99.7 % / Volatility 0.12**—the red line flashing at the 100 % mark. The gray barcode implanted at the nape lit a faint blue under the scanner, the ID **E‑11** syncing with the cumulative harvest time **3,842 h**; the Verification Quota deduction of **0.01 unit** crawled up the bone as a brief, almost sub‑audible buzz. The Risk Score **79** still sat below the freeze threshold, yet subway gates, emergency triage, and vending‑meal dispensers had already been flagged “critical” in the background, ready to be cut off in a single stroke by the Predictive Governance Engine.", "Lin Wei (V‑7)’s holographic projector never lit; only the remote ticket system showed “under review” in the back end. Zhao Tie (M‑3)’s dynamic neck tattoo had shifted from amber to crimson, the hue pulsing beneath the skin, his quota balance **0.12**, Risk Score **84**—subway entry denied, emergency priority dropped to tier 4, vending‑meal checkout refused. When he slipped the encrypted storage into E‑11’s hand, the fingertip brushed the edge’s faint magnetic hysteresis, a sensation climbing the palm like countless microscopic hooks catching under the skin, a chill of tingling numbness.", "Chen Mo (E‑23)’s eyes were perpetually bloodshot in memory, the lash roots retaining a trace of Nanoprobe fluorescence. His final low moan lasted three seconds, then vanished, leaving only the dim amber flicker of the maintenance light at the corridor’s end, a dying star stretched into a thin tail across the retina.", "Han Ce (K‑9)’s left‑eye quantum RNG flashed at **13 Hz** under the harsh light; his catchphrase echoed in E‑11’s mind like a dull saw dragging across neural fibers. She knew the “fear” the system tagged to her did not exist—it was a perfect waveform stitched together in milliseconds by Synthesis Module 3.0, purity 100 %, volatility 0. Her true fear lay in the night twelve years earlier when the underground pump in the climate‑refugee camp lost pressure: her mother collapsed beside a frozen metal valve, fingertips touching iron‑rust‑cold metal, breath turning into a rasping whistle in the dark until only the pipe’s micro‑vibration remained. That memory never went on‑chain; it was locked at **0.01 ms** precision in a private raw‑brainwave fragment she kept, an unworn key.", "E‑11 pulled a single‑use nutrition gel from her pocket; the plastic film’s “shhh” tore sharply in the pod’s silence. The gel melted on the tongue into warm syrup, sliding down the throat and briefly clamping the stomach’s spasm; sweetness spread at the tongue root, then was diluted by the cold air into a faint metallic aftertaste. **The inner wrist trembled again**—balance refreshed to **0.00 unit**, the red “wash queue” banner popping up simultaneously. She shoved the empty packet into the recycle chute; the chute sucked it in with a low pneumatic sigh, like some giant beast swallowing and burping.", "The pod door sealed silently, a gust of cold air laced with a thread of rust hitting her face. The maintenance light at the corridor’s far end pulsed at **13 Hz**, casting dim amber spots. E‑11 steadied her breathing, stepped out of the Emotion Harvest Pod, fingertips still warm with the nano‑pattern’s residual magnetism; palm sweat had already crystallized into minute ice shards in the chill, each step shattering them with an almost inaudible “click,” as if counting down her departure.", "She turned back toward the still‑counting submit key. The screen showed only **00:02**, the red digits burning an afterimage on her retina. The fingertip hovered above the key surface, fingerprint ridges conversing with the metal’s micro‑protrusions in a near‑tactile dialogue—upload a genuine blank, quota zero, be washed; forge a perfect fear, keep quota, but lose “Source Person” status forever. The low moan was about to start, a three‑second hum gathering at the cochlear edge. The instant the fingertip touched the key—", "The countdown hit zero, **00:00**. The key retracted silently with a soft “click,” the wall’s ventilation vibration ceasing abruptly, corridor lighting snapping to a cold blue, the whine of cleaning drones’ rotors approaching, the metal deck transmitting a fine tremor. E‑11 did **not** press “submit.” Her fingertip slid once around the key’s微凸 ridges, the fingertip feeling the metal’s micro‑magnetic field repelling within the fingerprint grooves, like countless tiny hooks catching under the skin, reminding her every contact is logged, quantified. The system’s synthesized gentle female voice emitted two emotionless words: “Revoked.” The screen flashed, the quota column jumping from **0.01** back to **0.00**, Risk Score climbing from **79** to **99**—subway gates, emergency, vending‑meal dispensers all flagged red in the same millisecond, crimson light dancing at the periphery of vision.", "A line of green text appeared in the remote ticket back‑end: **“Source Person qualification revoked, entered wash queue.”** E‑11’s gaze fell on her own palm; the nano‑pattern’s residual magnetism still lingered, the fingertip still tasting the warm syrup that had melted from the gel, mingling with the rust‑laden air drifting from the corridor, slipping down the trachea into the lungs. She inhaled deeply, balance **0.00**, no number rising.", "The amber maintenance spot stretched into a long thin trail across her retina. E‑11 did not look back; her footsteps echoed in the metal corridor, each footfall accompanied by a faint “pop‑pop” of thermal expansion and contraction, like an ancient pendulum timing her. She knew every ensuing second would be spent in a vacuum without quota, without Source Person status, without fear—and that vacuum was the only freedom she could still command.", "At the corridor’s end the cleaning drones skimmed the floor, four carbon‑fiber blades carving a sharp whine in the cold air, a swarm of compressed cicadas vibrating collectively inside metal ducts. E‑11 sidestepped, the magnetic clasps on her boots engaging the floor’s induction coils with a dull thud, then she was caught in an ozone‑scented gust that plastered stray hair to her cheekbones. The drone’s sensor array swept past her, infrared points scoring bright traces across her retina, then projected a green floating marker on the bulkhead: **“Target: E‑11, Status: Washing, ETA 3 min 17 s.”**", "She kept walking, fingertips still rubbing the lingering micro‑magnetism in her palm, feeling the nano‑ridges contract slightly in the cold, a tiny heartbeat beneath the skin. Ahead, a maintenance hatch was half‑open, a stale lubricant odor seeping out, mixed with the burnt‑polymer scent from the distant recycle chute, a metallic sweet‑blood tang entering the nostrils. A gray‑clad technician, left‑ear interface glowing, leaned out, voice reverberating in the ventilation ducts, compressed and raspy: “E‑11, quota zero and you still want to walk? The wash queue doesn’t wait.”", "E‑11 didn’t stop; she simply tuned her breathing to **13 Hz**, syncing with the corridor lights, fingertip brushing the magnetic pocket seam of her trousers, sensing the faint repulsive vibration in the fingerprint grooves. She replied low, voice flat as if calibrating a frequency into empty air: “Washing doesn’t need quota, only time.” The technician’s glasses flickered with a data stream, then he withdrew his gaze, the hatch sliding shut with a series of soft “clicks,” like a contract being stamped in the dark. The drone’s rotor whine faded, the deck’s vibration subsiding, and E‑11’s footsteps continued to echo, each impact accompanied by that faint “pop‑pop” of thermal shift, as if counting down every remaining second."]}]};
const L = {"cover_label": "Title Page & Synopsis", "unit": " chars", "by": "By ", "meta_sep": " | ~", "intro_title": "About this book", "prev": "← Previous", "next": "Next →", "start": "Start Reading →", "ch_prefix": "Chapter ", "ch_mid": " | ", "theme_dark": "☀️ Light Mode", "theme_light": "🌓 Dark Mode"};
let currentIndex = -1; // -1 = title page / synopsis
let fontSize = 17;

function renderSidebar() {
    const list = document.getElementById("chapterList");
    list.innerHTML = `<li class="chapter-item ${currentIndex === -1 ? 'active' : ''}" onclick="goToChapter(-1)">
        <span>📖 ${L.cover_label}</span>
    </li>`;
    book.chapters.forEach((ch, idx) => {
        const li = document.createElement("li");
        li.className = "chapter-item" + (currentIndex === idx ? " active" : "");
        li.innerHTML = `<span>${ch.title}</span><span class="ch-words">${ch.words}${L.unit}</span>`;
        li.onclick = () => goToChapter(idx);
        list.appendChild(li);
    });
}

function renderContent() {
    const wrapper = document.getElementById("articleWrapper");
    const label = document.getElementById("currentChLabel");
    if (currentIndex === -1) {
        label.innerText = L.cover_label;
        wrapper.innerHTML = `
            <div class="article-header">
                <h1>${book.title}</h1>
                <div class="article-meta">${L.by}${book.author}${L.meta_sep}${book.total_words.toLocaleString()}${L.unit}</div>
            </div>
            <div class="intro-box">
                <h3 style="margin-bottom:12px;color:var(--accent);">${L.intro_title}</h3>
                <div style="white-space: pre-wrap; line-height:1.75;">${book.description}</div>
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" disabled>${L.prev}</button>
                <button class="nav-btn" onclick="goToChapter(0)">${L.start}</button>
            </div>
        `;
    } else {
        const ch = book.chapters[currentIndex];
        label.innerText = ch.title;
        const pTags = ch.paragraphs.map(p => `<p style="font-size: ${fontSize}px;">${p}</p>`).join("");
        wrapper.innerHTML = `
            <div class="article-header">
                <h1>${ch.title}</h1>
                <div class="article-meta">${L.ch_prefix}${ch.index}${L.ch_mid}${ch.words}${L.unit}</div>
            </div>
            <div class="article-body">
                ${pTags}
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" onclick="goToChapter(currentIndex - 1)">${L.prev}</button>
                <button class="nav-btn" onclick="goToChapter(currentIndex + 1)" ${currentIndex >= book.chapters.length - 1 ? 'disabled' : ''}>${L.next}</button>
            </div>
        `;
    }
    document.getElementById("content-container").scrollTop = 0;
}

function goToChapter(idx) {
    if (idx < -1 || idx >= book.chapters.length) return;
    currentIndex = idx;
    renderSidebar();
    renderContent();
}

function toggleTheme() {
    const current = document.documentElement.getAttribute("data-theme");
    const next = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    document.getElementById("themeBtn").innerText = next === "dark" ? L.theme_dark : L.theme_light;
}

function changeFontSize(delta) {
    fontSize = Math.max(14, Math.min(26, fontSize + delta));
    const paras = document.querySelectorAll(".article-body p");
    paras.forEach(p => p.style.fontSize = fontSize + "px");
}

renderSidebar();
renderContent();
</script>

</html>
