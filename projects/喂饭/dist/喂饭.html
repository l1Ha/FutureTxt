const book = {"title": "喂饭", "author": "FutureTxt AI Writer", "description": "2126年，寿命延长技术让富人活过118岁，照护成为按分钟计费的“陪伴产业”。外来临时等级的周桂住进陆家，全天待命，接受“陪伴质量评分”考核；她七十八岁的母亲只能靠“远程照护包”（AI监护+每周钟点工）维持，最近一次视频已是四十七天前。陆老临终前要立遗嘱认亲周桂为女儿——平台规则规定照护工不得同时持有两份照护关系，接受认亲即刻切断与母亲的照护绑定，母亲将面临断供、评分归零、甚至被平台回收设备的后果。周桂必须在病床边、计费器滴答声中，用一勺米糊的温度决定自己与母亲的命运。", "total_words": 5538, "chapters": [{"index": 1, "title": "喂饭", "words": 5538, "paragraphs": ["周桂把第一勺米糊送进老人嘴里的时候，腕表在她腕骨上震了一下：计费开始，五点十二分，评分 4.62，距降级 0.02。", "米糊的温度靠她右腕那道旧疤试出来——三十八度，比标准低半度；她得在下一次评分刷新前，把剩下的十一勺喂完，再赶在六点前把床单换掉。", "“工单 20260714‑001，喂饭，第一餐。”合成音从腕表传来，夹着一丝金属的颤动。“评分 4.62，距降级 0.02。”", "她一天站满十六个小时，按分钟计费一元八，扣掉平台抽成 22%，到手约一千三百五十元；而老家的「远程照护包」每月扣两千一。第一年她还能两头照应，第二年她就把母亲的「每周一次钟点工」降成了「每两周一次」——账单上省下的那四小时，母亲在电话里从没提过。 周桂没回头，勺子伸向床头的老人。陆老的左耳后那枚微型节点在皮肤下微微隆起，像颗褪色的珍珠。他的嘴唇干裂，鼻饲管固定带勒出一道红痕，皮肤在灯光下泛着蜡黄的光泽。周桂把勺子送进他嘴里，动作快而轻，像在给精密仪器加注润滑油。老人喉头滚动，吞咽声被呼吸机的节奏吞没，呼吸机的活塞每一次推拉都震动着床板，传到她指尖的微颤。 上一次和母亲视频是四十七天前。那天她的评分从 4.64 掉到 4.62，平台把她的班从住家改成白班，她多出一个下午的空档。她拨过去，母亲举着手机在院子里转圈找信号，镜头里全是屋檐和天，谁都没看清谁的脸。通话时长四分十一秒，系统自动挂断，提示音冷静得像一句结账。", "“再算一分钟。”她在心里默念，腕表震动一次，扣款 ¥0.12。评分在屏幕上闪烁：4.61。", "喂完第七勺，老人闭上眼，喉间发出一声低哑的指令：“读信。”", "周桂把碗放回床头柜，缺口依然朝左。她从抽屉里抽出那叠泛黄的信纸，纸边已经脆得像干枯的树皮，翻动时发出细碎的脆响，灰尘在光柱里浮沉。第一封是三十年前写给已故妻子的，墨迹渗进纤维，字迹却仍工整，笔锋在纸面留下微微的凹陷。她清了清嗓子，声音压低到刚好能被麦克风捕捉，又不至于触发评分里的“语调异常”扣分。", "“第…三…行…‘春风不度玉门关’…”她一字一顿，指尖在纸面滑过，指腹感受到纸张的粗糙与岁月的粉尘，指尖微微发凉。", "“工单 20260714‑002，陪伴朗读，时长 12 分钟。”腕表又响了一遍，评分滑到 4.60。", "陆老的手指在被子上抓了一下，指甲刮过棉被发出细微的沙沙声，像干枯的树枝在风里摩擦。周桂知道他在等下一句，也在等那个“认亲”的时刻。平台规定：临时等级照护工不得同时持有两份照护关系。只要老人在数字遗嘱上签名，她的腕表就会弹出“身份升级·临时→正式”，而老家母亲端的远程照护包会同步弹出“照护关系解除·设备回收倒计时 48 h”。", "她偷偷瞥了一眼腕表右上角的小红点——母亲账号欠费 47 天，医疗联动已断，设备回收倒计时还在走。上周钟点工陈阿姨上门时，母亲只躺在床上，风扇“嗡嗡”响，公鸡在院子里啼叫，视频那头只留下一段没接通的语音：“桂儿，碗别烫着。”那声音里夹杂着风扇电机的电流噪音和公鸡尖锐的啼鸣，像一根细线把两地的晨昏缝合在一起。", "“读到第几行了？”陆老的声音像干枯的树枝摩擦，带着一丝沙哑的颤动。", "“第十二行。”周桂翻页，纸张发出脆响，纸角在指尖微微卷曲。", "“再读一遍。”", "她重复，语速放慢，呼吸与呼吸机同频。腕表每分钟震动一次，扣款、评分、计费、倒计时，所有数字在指尖下流动。评分 4.59。", "“工单 20260714‑003，遗嘱签署确认，请在老人最后一次呼吸前勾选‘已履行全部照护义务’。”合成音没有感情，只有固定的前缀和结尾的“滴—滴—”。", "陆老的手指颤抖着伸向平板，屏幕上浮现出一行行绿色的条款：《照护关系排他条例》第 4 款、第 5 款、第 7 款。他的指尖悬在“确认”键上方，指甲泛白，指腹的纹理在屏幕反光里清晰可辨。", "周桂的右腕疤痕在勺柄上磨出一道细细的白印。她感到掌心渗出冷汗，腕表的震动频率依旧每分钟一次，评分定格在 4.58。", "“签吧。”陆老的嘴角动了一下，像在笑，又像在咳嗽，喉头发出一声短促的气音。", "平板屏幕亮起，区块链写入完成的提示音比腕表更尖锐：“遗嘱已写入区块链，身份升级生效。”几乎同一秒，腕表弹出两行红字：", "**身份升级·临时→正式**", "**照护关系解除·设备回收倒计时 48 h**", "时间戳同步：2026‑07‑14 05:27:03。", "周桂盯着那两行字，指尖悬在“确认”键上。腕表的“滴—滴—”依然准点，评分定格在 4.58。她的呼吸声在呼吸机的节奏里变得清晰，右腕的疤痕又热了一下，像被无形的电流轻轻灼烧。", "她没有点下去。", "缺口搪瓷碗仍在床头，缺口朝左，米糊早已冷成一层薄皮，表面泛着微微的油光。周桂缓缓放下勺子，金属碰瓷发出一声轻响，像某种仪式的终止。", "她从口袋里摸出那部旧手机，屏幕划痕交错，边角磨圆，指纹油污在玻璃上留下模糊的光晕。拨号界面只有一个号码——远程照护包唯一服务热线。指尖悬在绿色拨号键上方，屏幕亮起“呼叫中”三字，背景是母亲那段语音里的风扇声和公鸡啼叫，风扇叶片切割空气的嗡嗡声与公鸡高亢的啼鸣交织成一首粗糙的二重奏。", "滴—滴—", "腕表继续计费，评分不动。屏幕上“呼叫中”闪烁，无人接听。周桂的指尖没有落下，定格在拨号键上方，像一根未拉紧的弦，绷紧在清晨的灰白光线里。", "（全文完）", "风扇叶片切割空气的嗡嗡声突然被一阵短促的忙音切断，随即传来一句机械女声：“您拨打的号码暂时无法接通，请稍后再试。”声波在狭窄的病房里折射，夹着消毒水的尖锐气味和陈年米糊的酸涩，钻进周桂的鼻腔。她指尖仍悬在绿色拨号键上方，指腹的纹理在屏幕反光里清晰可辨，腕表的震动依旧每分钟一次，评分纹丝不动地停在 4.58。", "陆老的呼吸机发出规律的嘶嘶声，像一台老旧的风箱在夜里拉扯。他的眼皮微微抬起，瞳孔在微弱的晨光里收缩，喉头滚动出一声低哑的“哼”，随后是一串断续的咳嗽，痰液在气管里翻涌，发出湿重的摩擦声。他没看平板，目光落在周桂的右腕，那道疤痕在勺柄上磨出的白印仍泛着微光。", "“别等了。”陆老的声音像干枯的树枝在风里摩擦，带着一丝不耐的沙哑，“系统不会等人，倒计时也不等人。”", "周桂的喉咙发紧，呼吸与呼吸机同频，腕表的“滴—滴—”在指尖下跳动，每一下都像在敲击她的心跳。她缓缓收回手指，屏幕熄灭，旧手机滑回口袋，边角磨圆的塑料外壳摩擦布料发出细微的沙沙声。缺口搪瓷碗里的米糊皮在晨光下泛着油光，周桂伸手揭开那层薄皮，冷气瞬间钻进指缝，指尖微微发麻。", "“签了就走不了。”她低声说，语速放慢，每一个字都像在称量分量，“设备回收倒计时四十八小时，回收车会在凌晨三点到。”", "陆老的手指在平板上颤抖，指甲泛白，指腹的纹理在屏幕反光里清晰可辨。他盯着“确认”键，指尖悬停，未落下。平板屏幕亮起，区块链写入完成的提示音比腕表更尖锐：“遗嘱已写入区块链，身份升级生效。”几乎同一秒，腕表弹出两行红字：", "**身份升级·临时→正式**", "**照护关系解除·设备回收倒计时 48 h**", "时间戳同步：2026‑07‑14 05:27:03。", "周桂盯着那两行字，指尖悬在“确认”键上。腕表的“滴—滴—”依然准点，评分定格在 4.58。她的呼吸声在呼吸机的节奏里变得清晰，右腕的疤痕又热了一下，像被无形的电流轻轻灼烧。", "她没有点下去。", "缺口搪瓷碗仍在床头，缺口朝左，米糊早已冷成一层薄皮，表面泛着微微的油光。周桂缓缓放下勺子，金属碰瓷发出一声轻响，像某种仪式的终止。", "她从口袋里摸出那部旧手机，屏幕划痕交错，边角磨圆，指纹油污在玻璃上留下模糊的光晕。拨号界面只有一个号码——远程照护包唯一服务热线。指尖悬在绿色拨号键上方，屏幕亮起“呼叫中”三字，背景是母亲那段语音里的风扇声和公鸡啼叫，风扇叶片切割空气的嗡嗡声与公鸡高亢的啼鸣交织成一首粗糙的二重奏。", "滴—滴—", "腕表继续计费，评分不动。屏幕上“呼叫中”闪烁，无人接听。周桂的指尖没有落下，定格在拨号键上方，像一根未拉紧的弦，绷紧在清晨的灰白光线里。", "忙音再次响起，紧接着是一阵短促的电子音，随即传来一句带着金属质感的男声：“周桂，照护包编号 20260714‑003，确认身份升级，请在十秒内按‘1’完成设备绑定解除。”声线冷硬，没有任何温度，仿佛从远方的服务器直穿耳膜。", "周桂的心跳漏了一拍，指尖微微收紧，指甲陷入掌心，指腹的汗珠渗出，顺着纹路滑向手腕。她听见陆老的呼吸机节奏骤然加快，嘶嘶声里夹杂着一丝急促的喘息，像是某种即将断裂的信号。", "“按‘1’。”陆老的声 const L = {"cover_label": "扉页与作品简介", "unit": "字", "by": "作者：", "meta_sep": " | 全书约 ", "intro_title": "作品概念与梗概", "prev": "← 上一章", "next": "下一章 →", "start": "开始阅读第一章 →", "ch_prefix": "第 ", "ch_mid": " 章 | ", "theme_dark": "☀️ 亮色模式", "theme_light": "🌓 暗色模式"};
let currentIndex = -1; // -1 = title page / synopsis
let fontSize = 17;

function renderSidebar() {
    const list = document.getElementById("chapterList");
    list.innerHTML = `<li class="chapter-item ${currentIndex === -1 ? 'active' : ''}" onclick="goToChapter(-1)">
        <span>📖 ${L.cover_label}</span>
    </li>`;
    book.chapters.forEach((ch, idx) => {
        const li = document.createElement("li");
        li.className = "chapter-item" + (currentIndex === idx ? " active" : "");
        li.innerHTML = `<span>${ch.title}</span><span class="ch-words">${ch.words}${L.unit}</span>`;
        li.onclick = () => goToChapter(idx);
        list.appendChild(li);
    });
}

function renderContent() {
    const wrapper = document.getElementById("articleWrapper");
    const label = document.getElementById("currentChLabel");
    if (currentIndex === -1) {
        label.innerText = L.cover_label;
        wrapper.innerHTML = `
            <div class="article-header">
                <h1>${book.title}</h1>
                <div class="article-meta">${L.by}${book.author}${L.meta_sep}${book.total_words.toLocaleString()}${L.unit}</div>
            </div>
            <div class="intro-box">
                <h3 style="margin-bottom:12px;color:var(--accent);">${L.intro_title}</h3>
                <div style="white-space: pre-wrap; line-height:1.75;">${book.description}</div>
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" disabled>${L.prev}</button>
                <button class="nav-btn" onclick="goToChapter(0)">${L.start}</button>
            </div>
        `;
    } else {
        const ch = book.chapters[currentIndex];
        label.innerText = ch.title;
        const pTags = ch.paragraphs.map(p => `<p style="font-size: ${fontSize}px;">${p}</p>`).join("");
        wrapper.innerHTML = `
            <div class="article-header">
                <h1>${ch.title}</h1>
                <div class="article-meta">${L.ch_prefix}${ch.index}${L.ch_mid}${ch.words}${L.unit}</div>
            </div>
            <div class="article-body">
                ${pTags}
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" onclick="goToChapter(currentIndex - 1)">${L.prev}</button>
                <button class="nav-btn" onclick="goToChapter(currentIndex + 1)" ${currentIndex >= book.chapters.length - 1 ? 'disabled' : ''}>${L.next}</button>
            </div>
        `;
    }
    document.getElementById("content-container").scrollTop = 0;
}

function goToChapter(idx) {
    if (idx < -1 || idx >= book.chapters.length) return;
    currentIndex = idx;
    renderSidebar();
    renderContent();
}

function toggleTheme() {
    const current = document.documentElement.getAttribute("data-theme");
    const next = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    document.getElementById("themeBtn").innerText = next === "dark" ? L.theme_dark : L.theme_light;
}

function changeFontSize(delta) {
    fontSize = Math.max(14, Math.min(26, fontSize + delta));
    const paras = document.querySelectorAll(".article-body p");
    paras.forEach(p => p.style.fontSize = fontSize + "px");
}

renderSidebar();
renderContent();
</script>
