ist Terminal’s vibration deeper into bone. The terminal’s red countdown still ticked silently; vibration shifted from ten‑second to five‑second intervals, a faint current crawling up her forearm like a fine needle threading a vein.", "The elevator doors slid open; a gust of cold air carried a hint of machine oil. She entered, pressed “1” — the metal button still warm from the previous passenger’s fingertip. Fluorescent tubes buzzed, their ends flickering a weak violet halo that deepened the shadows under her eyes. Only a cleaner in blue overalls occupied the car, clutching a black trash bag, the knot tightening white knuckles. He glanced at her, eyes pausing on the Wrist Terminal for less than a second, then resumed polishing the handrail with mechanical precision.", "“Zhou Gui, retrieval truck at three, don’t forget the charger.” Lu Lao’s voice came from behind, sandpaper on metal. She did not turn; only as the doors closed she heard his cane thudding dully on the floor, each “thud‑thud” tightening her chest.", "The elevator stopped at ground level; doors opened onto a blast of hot wind laden with dust, mixed with the acrid bite of exhaust from the elevated highway. Zhou Gui exited the lobby; infrared sensors on the automatic doors chirped, a green sweep crossing her Wrist Terminal — the screen still blazed “48 h,” rating still pinned at 4.58, as if time had been nailed to a single sheet.", "A self‑service kiosk in the lobby pulsed a dim blue interface, scrolling “Device Reclamation Confirmation,” “Data Upload in Progress,” “Credit Settlement.” She inserted the charger into the USB‑C port; a soft “click” echoed, coolness creeping up her hand along the cable. The kiosk flashed green: “Charger identified; reclamation phase two entered; proceed to designated collection point within ten minutes.”", "Ten minutes. She glanced at her wrist; vibration now every three seconds, sweat beads sliding beneath the strap. The lobby PA intoned a smooth synthetic female: “Respected const L = {"cover_label": "Title Page & Synopsis", "unit": " chars", "by": "By ", "meta_sep": " | ~", "intro_title": "About this book", "prev": "← Previous", "next": "Next →", "start": "Start Reading →", "ch_prefix": "Chapter ", "ch_mid": " | ", "theme_dark": "☀️ Light Mode", "theme_light": "🌓 Dark Mode"};
let currentIndex = -1; // -1 = title page / synopsis
let fontSize = 17;

function renderSidebar() {
    const list = document.getElementById("chapterList");
    list.innerHTML = `<li class="chapter-item ${currentIndex === -1 ? 'active' : ''}" onclick="goToChapter(-1)">
        <span>📖 ${L.cover_label}</span>
    </li>`;
    book.chapters.forEach((ch, idx) => {
        const li = document.createElement("li");
        li.className = "chapter-item" + (currentIndex === idx ? " active" : "");
        li.innerHTML = `<span>${ch.title}</span><span class="ch-words">${ch.words}${L.unit}</span>`;
        li.onclick = () => goToChapter(idx);
        list.appendChild(li);
    });
}

function renderContent() {
    const wrapper = document.getElementById("articleWrapper");
    const label = document.getElementById("currentChLabel");
    if (currentIndex === -1) {
        label.innerText = L.cover_label;
        wrapper.innerHTML = `
            <div class="article-header">
                <h1>${book.title}</h1>
                <div class="article-meta">${L.by}${book.author}${L.meta_sep}${book.total_words.toLocaleString()}${L.unit}</div>
            </div>
            <div class="intro-box">
                <h3 style="margin-bottom:12px;color:var(--accent);">${L.intro_title}</h3>
                <div style="white-space: pre-wrap; line-height:1.75;">${book.description}</div>
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" disabled>${L.prev}</button>
                <button class="nav-btn" onclick="goToChapter(0)">${L.start}</button>
            </div>
        `;
    } else {
        const ch = book.chapters[currentIndex];
        label.innerText = ch.title;
        const pTags = ch.paragraphs.map(p => `<p style="font-size: ${fontSize}px;">${p}</p>`).join("");
        wrapper.innerHTML = `
            <div class="article-header">
                <h1>${ch.title}</h1>
                <div class="article-meta">${L.ch_prefix}${ch.index}${L.ch_mid}${ch.words}${L.unit}</div>
            </div>
            <div class="article-body">
                ${pTags}
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" onclick="goToChapter(currentIndex - 1)">${L.prev}</button>
                <button class="nav-btn" onclick="goToChapter(currentIndex + 1)" ${currentIndex >= book.chapters.length - 1 ? 'disabled' : ''}>${L.next}</button>
            </div>
        `;
    }
    document.getElementById("content-container").scrollTop = 0;
}

function goToChapter(idx) {
    if (idx < -1 || idx >= book.chapters.length) return;
    currentIndex = idx;
    renderSidebar();
    renderContent();
}

function toggleTheme() {
    const current = document.documentElement.getAttribute("data-theme");
    const next = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    document.getElementById("themeBtn").innerText = next === "dark" ? L.theme_dark : L.theme_light;
}

function changeFontSize(delta) {
    fontSize = Math.max(14, Math.min(26, fontSize + delta));
    const paras = document.querySelectorAll(".article-body p");
    paras.forEach(p => p.style.fontSize = fontSize + "px");
}

renderSidebar();
renderContent();
</script>
