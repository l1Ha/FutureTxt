<script>
const book = {"title": "喂饭 (English Edition)", "author": "FutureTxt AI Writer", "description": "In 2126, life‑extension technology has pushed the wealthy past a century, turning caregiving into a minute‑by‑minute “companionship” market. Migrant worker Zhou Gui lives in the Lu household, on constant call and scored on every interaction, while her seventy‑eight‑year‑old mother survives on a remote‑care package — AI monitoring plus a weekly aide — whose last video call was forty‑seven days ago. When the dying patriarch attempts to adopt Zhou Gui as his legal daughter, platform rules force an immediate severance of her mother’s care contract: loss of subsidies, a zeroed rating, and possible reclamation of the monitoring hardware. Trapped beside the bedside, with the billing meter ticking, Zhou Gui must decide whether a spoonful of warm gruel can buy both their futures.", "total_words": 13977, "chapters": [{"index": 1, "title": "喂饭 (English Edition)", "words": 13977, "paragraphs": ["Zhou Gui slid the first spoonful of nutrient paste into the old man’s mouth; the wrist terminal on her radial bone buzzed once: billing started, 05:12, score 4.62, 0.02 from downgrade.", "She gauged the paste’s temperature with the old scar on her right wrist—thirty‑eight degrees Celsius, half a degree below standard. She had to finish the remaining eleven spoonfuls before the next score refresh and still change the sheets before 06:00.", "“Work order 20260714‑001, feeding, first meal.” The synthetic voice rose from the wrist terminal, edged with a metallic tremor. “Score 4.62, 0.02 from downgrade.”", "She worked sixteen hours a day, billed at ¥1.8 per minute; after the Platform Cut of 22 % she took home roughly ¥1,350. The Remote Care Package (RCP‑V3) back home deducted ¥2,100 a month. The first year she could juggle both; the second year she downgraded her mother’s “weekly hourly caregiver” to “bi‑weekly”—the four saved hours never appeared in her mother’s phone calls.", "Zhou Gui didn’t turn. The spoon reached the bedside. A micro physio‑monitoring node under Lu Jingxing’s left ear bulged like a faded pearl. His lips were cracked, the nasogastric tube strap left a red groove, skin waxy under the lamp. She fed him quickly and gently, as if lubricating a precision instrument. His throat moved; the swallow was swallowed by the ventilator’s rhythm, each piston push shuddering the bed frame and transmitting a micro‑tremor to her fingertips.", "The last video call with her mother was forty‑seven days ago. That day her score slipped from 4.64 to 4.62; the Platform switched her from live‑in to day shift, giving her an extra afternoon. She dialed; her mother waved the phone in the courtyard hunting signal, the lens filled with eaves and sky—neither saw the other’s face. Call duration four minutes eleven seconds; the system auto‑hung up with a calm tone like a receipt.", "“One more minute.” She whispered internally; the wrist terminal buzzed, ¥0.12 deducted. The score flickered: 4.61.", "After the seventh spoonful the old man closed his eyes and rasped, “Read the letter.”", "Zhou Gui set the bowl back on the nightstand, the chip still facing left. She pulled the yellowed stack from the drawer; paper edges brittle as dry bark, turning released fine dust that floated in the light shaft. The first letter, thirty years old, addressed to his late wife—ink soaked into fibers, script still neat, pen strokes leaving shallow depressions. She cleared her throat, voice lowered just enough for the microphone to catch it without triggering an “abnormal tone” penalty.", "“Line… three… ‘Spring wind never crosses Jade Gate Pass’…” She enunciated each character, fingertip tracing the page, feeling the paper’s roughness and the dust of decades, fingertips cooling.", "“Work order 20260714‑002, companionship reading, duration 12 minutes.” The wrist terminal chimed again; score slid to 4.60.", "Lu Jingxing’s fingers clawed the blanket, nails scraping cotton with a dry hiss, like dead branches rubbing in wind. Zhou Gui knew he waited for the next line—and for the Kinship Registration moment. Platform rule: a Temporary Grade caregiver may not hold two Care Relationships simultaneously. Once the old man signed the Digital Will, her wrist terminal would flash “Identity Upgrade·Temporary→Permanent,” while her mother’s RCP‑V3 would simultaneously pop “Care Relationship Terminated·Device Reclamation Countdown 48 h.”", "She glanced at the tiny red dot in the upper‑right of the wrist terminal—her mother’s account overdue forty‑seven days, medical link severed, the reclamation clock still ticking. Last week the hourly caregiver Chen Zhongdian visited; her mother lay in bed, fan droning, rooster crowing in the yard. The video left only an unanswered voice message: “Gui’er, don’t burn the bowl.” That voice carried the fan’s electrical hum and the rooster’s shrill call, stitching the two dawns together.", "The village had lost its primary school last year, its clinic this year. The village committee became a “Neighborhood Center,” open two days a week; the county’s mobile service van arrived, measured blood pressure, then left. Only three households remained, the youngest seventy‑one. On her last visit the village’s two streetlights were out; her mother said no need to fix them—no one goes out at night.", "She had run the numbers: bring mother to the city, rent an elevator apartment ¥4,800/month, day‑shift caregiver ¥3,500, her score would drop another 0.2 for lacking a fixed live‑in address, losing premium gigs. Keep mother in the village, RCP‑V3 ¥2,100/month, could last till year‑end. She’d calculated it for three years; the result never changed.", "The old phone lit again. The RCP‑V3 push stacked on the lock screen: Mother’s heart rate 78, meds taken 2/3, companionship time 0 min, weekly score 3.1. Bottom line in red: if seven consecutive days without a manual visit, the account enters “Unmonitored State,” device reclamation accelerated to 24 hours. She swiped it away; the screen darkened, reflecting the dark circles under her eyes.", "“Which line?” Lu Jingxing’s voice was dry branch friction, a hoarse tremor.", "“Twelfth.” Zhou Gui turned the page; paper crisped, corner curling at her fingertip.", "“Read it again.”", "She repeated, slower, breathing synced to the ventilator. The wrist terminal buzzed each minute—deduction, score, billing, countdown—all numbers flowing beneath her fingertips. Score 4.59.", "“Work order 20260714‑003, will‑sign confirmation, please check ‘All care obligations fulfilled’ before the care recipient’s final breath.” The synthetic voice was affectless, fixed prefix and trailing “beep‑beep.”", "Lu Jingxing’s finger trembled toward the tablet; green clauses scrolled: “Care Relationship Exclusivity Regulation” Articles 4, 5, 7. His fingertip hovered over “Confirm,” nail blanched, fingerprint ridges sharp in the screen glare.", "Zhou Gui’s right‑wrist scar left a fine white line on the spoon handle. Cold sweat seeped in her palm; the wrist terminal kept its one‑per‑minute pulse, score frozen at 4.58.", "“Sign it.” Lu Jingxing’s mouth twitched, half smile, half cough, a short breathy exhale.", "The chipped enamel bowl remained on the nightstand, chip left, nutrient paste already cold, a thin skin of oil on the surface. Zhou Gui set the spoon down; metal on porcelain gave a soft click, like a ritual’s end.", "That bowl came from home. Mother used it thirty years; the rim chipped, chip left, perfectly aligned with the seat she occupied as a child. First year in the city, mother slipped the bowl into her luggage, saying city bowls are too thin, burn the hand. Now it held another’s paste, temperature judged by her scar—38 °C, half a degree low. She suddenly recalled the last time mother fed her, a fever night; the same chip, mother turned it away with her thumb, fearing it would cut her lip.", "A tiny flake of enamel missing at the bowl’s base exposed black iron, like an old coin. She returned the bowl to the nightstand, chip left. The village stove was earthen; the bowl wobbled. The city nightstand was flat; the bowl made no sound.", "She fished out the old phone, screen spider‑webbed with scratches, corners rounded, fingerprint smudges a hazy halo on the glass. The dial screen held a single number—the RCP‑V3 sole service hotline. Thumb hovered over the green call button; the screen read “Calling…” against the background of her mother’s voice message: fan whir and rooster crow, fan blades slicing air in a low duet with the rooster’s piercing cry.", "The fan’s whir was abruptly cut by a short busy tone, then a mechanical female voice: “The number you dialed is temporarily unavailable. Please try again later.” The sound bounced in the cramped ward, mingling with antiseptic sharpness and the sour stale paste, drilling into Zhou Gui’s nostrils. Her thumb still hovered, fingerprint ridges clear in the screen glare; the wrist terminal kept its one‑per‑minute buzz, score unmoving at 4.58.", "Lu Jingxing’s ventilator hissed a steady rhythm, an old bellows pulling night air. His eyelids lifted slightly; pupils contracted in the dim morning light; a low “hm” rose from his throat, followed by a broken cough, phlegm rattling wetly in the airway. He didn’t look at the tablet; his gaze settled on Zhou Gui’s right wrist, the scar’s white imprint on the spoon still faintly luminous.", "“Don’t wait.” Lu Jingxing’s voice was dry branch friction, edged with impatient rasp. “The system won’t wait for anyone; the countdown doesn’t wait either.”", "Zhou Gui’s throat tightened; breath matched the ventilator; the wrist terminal’s “beep‑beep” tapped her heartbeat. She slowly withdrew her finger; the screen dimmed, the old phone slid back into her pocket, the worn plastic shell whispering against fabric. The nutrient‑paste skin on the bowl glimmered in the morning light; she lifted the thin film, cold air instantly biting her fingertips, numbness creeping.", "“If you sign, you can’t leave.” She spoke low, each word weighed. “Device reclamation countdown forty‑eight hours; the truck arrives at 03:00.”", "Lu Jingxing’s finger trembled on the tablet, nail white, fingerprint ridges sharp in the screen glare. He stared at “Confirm,” fingertip suspended, not descending.", "She pulled the old phone again, hit redial.", "Busy tone again, then a brief electronic chirp, then a metallic male voice: “Zhou Gui, Care Package ID 20260714‑003, confirm Identity Upgrade, press ‘1’ within ten seconds to complete device unbinding.” The tone was cold, temperatureless, as if transmitted straight from a distant server into the eardrum.", "Zhou Gui’s heart skipped; fingertips tightened, nails digging into palm, sweat beads tracing lines to her wrist. She heard the ventilator’s rhythm surge, a hurried gasp mixed in, like a signal about to snap.", "“Press ‘1’.” Lu Jingxing’s voice rolled in his throat, rasp edged with undeniable authority. “Don’t let the system decide for you.”", "Zhou Gui’s thumb hovered over the glass, fingerprint oil shimmering in the glow. She closed her eyes; fan, rooster, ventilator hiss, wrist terminal buzz—all merged into a low roar vibrating her eardrums. Ten‑second countdown silently elapsed on the wrist terminal; the red “48 h” burned on her retina.", "Her thumb finally fell; the screen flashed, a green “1” lit then faded. Synthetic voice: “Device unbinding confirmed, reclamation program initiated.” The wrist terminal’s pulse accelerated to every ten seconds; score still locked at 4.58.", "Lu Jingxing’s finger finally pressed “Confirm” on the tablet; a green ripple washed the screen, the blockchain write‑complete tone slicing the air again. His fingertip released, leaving a faint pressure imprint on the glass.", "Almost simultaneously the wrist terminal popped two red lines:", "**Identity Upgrade·Temporary→Permanent**", "**Care Relationship Terminated·Device Reclamation Countdown 48 h**", "Timestamp synced: 2026‑07‑14 05:27:03.", "Zhou Gui stared at the two lines, fingertip suspended over the wrist terminal. The “beep‑beep” kept its metronomic cadence; score frozen at 4.58. Her breath became audible within the ventilator’s rhythm; the scar on her right wrist warmed again, as if an invisible current lightly seared it.", "She pocketed the phone, fingers brushing the coarse fabric. She looked up; morning light slipped through the curtain gap, catching the oil sheen on the chipped enamel bowl and the veins mapping Lu Jingxing’s withered hand, blue rivers about to dry.", "“Go.” Lu Jingxing said softly, voice stripped of sorrow or joy, only wind‑dry calm. “The truck comes at three; don’t forget the charger.”", "Zhou Gui nodded, silent. She bent, retrieved the charger from the nightstand, cable coiling around her fingers, cold metal plug pricking her palm. She turned; footsteps on the ward’s gray‑white tiles gave a faint “shh‑shh,” each step stitching the wrist terminal’s pulse into her bones. The corridor’s antiseptic film clung to her nostrils, mixed with stale diaper odor and distant canteen’s sour pickle tang. Her steps echoed “shh‑shh” on the tiles, each one driving the terminal’s vibration deeper into marrow. The terminal’s red countdown still ticked silently; vibration shifted from ten‑second to five‑second intervals, a faint current crawling up her forearm like a fine needle slipping into a vein.", "The elevator doors slid open; a gust of cold air carried a whiff of machine oil. She entered, pressed “1” on the metal button—its recess still warm from the previous passenger’s fingertip. The cabin’s fluorescent tubes buzzed, ends flickering a weak violet halo, casting her face in a deeper shade. Only a blue‑clad cleaner occupied the cabin, clutching a rolled black trash bag, the knot’s tension whitening his knuckles. He glanced at her, eyes lingering on the wrist terminal less than a second, then resumed polishing the handrail with mechanical precision.", "“Zhou Gui, the truck at three, charger—don’t forget.” Lu Jingxing’s voice came from behind, rasp like sandpaper on metal. She didn’t turn; as the doors closed she heard his cane thud “thump‑thump” on the floor, each impact tightening her chest.", "The elevator stopped at the lobby; doors opened onto a blast of hot wind laden with dust, tinged with the acrid bite of exhaust from the elevated highway. Zhou Gui stepped out; the automatic doors’ infrared sensors chimed softly, a green sweep across her wrist terminal—“48 h” still glaring, score still stuck at 4.58, as if time had been nailed to a single sheet of paper.", "A self‑service terminal in the lobby corner pulsed a dim blue UI, scrolling “Device Reclamation Confirmation,” “Data Uploading,” “Credit Settlement.” She inserted the charger into the USB‑C port; the metal plug clicked, a chill traveling up the cable to her hand. The terminal flashed green: “Charger recognized, reclamation phase two entered, please proceed to designated reclamation point within ten minutes.”", "Ten minutes. She lifted her wrist; the terminal now vibrated every three seconds, sweat beads sliding thin tracks under the strap. The lobby PA inserted a smooth synthetic female voice: “Dear user, your care package has been unbound; the reclamation vehicle will arrive at 15:00 sharp. Please bring all accessories to Gate 1.” The voice was temperature‑less, as if piped straight from a server past the brain onto skin.", "Zhou Gui gripped the charger cable, knuckles white. She walked toward Gate 1; each tile underfoot emitted a faint “creak‑creak,” a low heartbeat. The rolling shutter was half‑open, revealing a gray sky and a white box truck parked outside, “智护回收” in red on its side, roof antenna swaying with a soft “rustle‑rustle.”", "The truck’s side door slid; a young man in gray coveralls jumped down, handheld scanner in hand. The scanner’s red beam swept her wrist terminal; green code flared then turned “Reclamation Confirmed.” He said nothing, only handed her a black plastic case, its lid bar‑coded, edges worn to white plastic fiber.", "“Put the charger in, sign.” His voice was flat, a hint of impatient nasal tone. Zhou Gui slipped the charger inside; fingertips touched the cold metal base, sweat instantly absorbed. She signed on the electronic pen; a pale blue trace streaked the screen then vanished.", "“Done.” He reclaimed the case, hit the door‑close button; the truck shuddered, engine a low rumble like distant thunder. Zhou Gui stood still; wind lifted stray hairs onto her damp forehead. The wrist terminal’s vibration finally ceased; the screen showed only a static “4.58,” the red countdown zeroed, a green “Reclamation Complete” icon flashing once on her retina then fading.", "She turned; footsteps echoed across the empty plaza, each step treading the ritual into dust. Far off a rooster crowed again, high and broken, cutting through the highway roar, piercing her eardrum like a fine needle lodged in the gray‑white dawn.", "Zhou Gui paused at the bus stop, pulled out the old phone, scrolled to the top contact, pressed call.", "The screen lit, a line of gray text looping at the bottom: **Calling**.", "She held the phone to her ear, the other hand in her pocket, fingertip pressing the rim of the chipped enamel bowl—its cool base climbing her nail bed, reminding her the bowl no longer belonged to any meal.", "She didn’t redial. The wrist terminal inside her cuff resumed its steady “beep‑beep”—15:00, truck at Gate 1; before that she still had four hours of care work orders to fulfill.", "In the distance the reclamation truck had already started, exhaust condensing into white ribbons in the cold air, drifting away. She quickened her pace; the wrist terminal’s countdown jumped from 4:58 to 4:57, urging her toward the next mandatory “care” shift."]}]};
const L = {"cover_label": "Title Page & Synopsis", "unit": " chars", "by": "By ", "meta_sep": " | ~", "intro_title": "About this book", "prev": "← Previous", "next": "Next →", "start": "Start Reading →", "ch_prefix": "Chapter ", "ch_mid": " | ", "theme_dark": "☀️ Light Mode", "theme_light": "🌓 Dark Mode"};
let currentIndex = -1; // -1 = title page / synopsis
let fontSize = 17;

function renderSidebar() {
    const list = document.getElementById("chapterList");
    list.innerHTML = `<li class="chapter-item ${currentIndex === -1 ? 'active' : ''}" onclick="goToChapter(-1)">
        <span>📖 ${L.cover_label}</span>
    </li>`;
    book.chapters.forEach((ch, idx) => {
        const li = document.createElement("li");
        li.className = "chapter-item" + (currentIndex === idx ? " active" : "");
        li.innerHTML = `<span>${ch.title}</span><span class="ch-words">${ch.words}${L.unit}</span>`;
        li.onclick = () => goToChapter(idx);
        list.appendChild(li);
    });
}

function renderContent() {
    const wrapper = document.getElementById("articleWrapper");
    const label = document.getElementById("currentChLabel");
    if (currentIndex === -1) {
        label.innerText = L.cover_label;
        wrapper.innerHTML = `
            <div class="article-header">
                <h1>${book.title}</h1>
                <div class="article-meta">${L.by}${book.author}${L.meta_sep}${book.total_words.toLocaleString()}${L.unit}</div>
            </div>
            <div class="intro-box">
                <h3 style="margin-bottom:12px;color:var(--accent);">${L.intro_title}</h3>
                <div style="white-space: pre-wrap; line-height:1.75;">${book.description}</div>
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" disabled>${L.prev}</button>
                <button class="nav-btn" onclick="goToChapter(0)">${L.start}</button>
            </div>
        `;
    } else {
        const ch = book.chapters[currentIndex];
        label.innerText = ch.title;
        const pTags = ch.paragraphs.map(p => `<p style="font-size: ${fontSize}px;">${p}</p>`).join("");
        wrapper.innerHTML = `
            <div class="article-header">
                <h1>${ch.title}</h1>
                <div class="article-meta">${L.ch_prefix}${ch.index}${L.ch_mid}${ch.words}${L.unit}</div>
            </div>
            <div class="article-body">
                ${pTags}
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" onclick="goToChapter(currentIndex - 1)">${L.prev}</button>
                <button class="nav-btn" onclick="goToChapter(currentIndex + 1)" ${currentIndex >= book.chapters.length - 1 ? 'disabled' : ''}>${L.next}</button>
            </div>
        `;
    }
    document.getElementById("content-container").scrollTop = 0;
}

function goToChapter(idx) {
    if (idx < -1 || idx >= book.chapters.length) return;
    currentIndex = idx;
    renderSidebar();
    renderContent();
}

function toggleTheme() {
    const current = document.documentElement.getAttribute("data-theme");
    const next = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    document.getElementById("themeBtn").innerText = next === "dark" ? L.theme_dark : L.theme_light;
}

function changeFontSize(delta) {
    fontSize = Math.max(14, Math.min(26, fontSize + delta));
    const paras = document.querySelectorAll(".article-body p");
    paras.forEach(p => p.style.fontSize = fontSize + "px");
}

renderSidebar();
renderContent();
</script>
