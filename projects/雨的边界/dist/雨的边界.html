const book = {"title": "雨的边界", "author": "FutureTxt AI Writer", "description": "2126 年，平流层气溶胶注入、轨道反射环、海洋碱化泵组成的「全球恒温器」每转动一度，季风带就随之偏移，降水成为可计量、可交易的配额。《全球配温协定》以 2040 年代的历史基线为锚，将每个行政区的年均毫米数锁死在档案里。降水仲裁员林檀例行核验青藏高原边缘的 112 号水文站，读数比档案高出 3.7 毫米——误差带内本应为零。她顺着数据痕迹追溯到 2043 年的基线修订会议，发现某国代表在签字时把原本 210 毫米的基线改成 165 毫米，导致该国及其下游 4 亿人口在随后八十年里被合法「少分」雨水。三大集团正准备用同一份伪造基线启动新一轮配温分配，林檀必须在仲裁庭的签字仪式前，把被篡改的数字还原到雨线两侧的土壤里。", "total_words": 18318, "chapters": [{"index": 1, "title": "第1章雨线两侧的毫米", "words": 2291, "paragraphs": ["薄雾像一层湿冷的纱，裹住青藏高原东缘的 112 号水文站。风从山口灌进来，夹着干燥的石英尘味，刮过鼻腔时发出细微的沙沙声；脚下的砂砾在靴底咔嚓作响，指尖触到探头的微振，像一根细细的神经在掌心跳动。林檀吸了一口带着铁锈味的空气，右膝内侧的旧伤隐隐作痛，她熟练地从口袋撕开透皮止痛贴，贴上膝盖，指尖在袖口磨损的金属扣上摩挲了一下——那是十年前那次仲裁留下的痕迹。贴片的胶面在低温下微微发硬，贴上去的瞬间传来一阵微凉的刺痛，随即被体温化开，像把一把生锈的钥匙重新插进了早已熟悉的锁孔。", "她从背包抽出 W‑12 便携式激光雨滴谱仪，屏幕亮起淡蓝光，校准倒计时三秒。探头对准雨线两侧的基准点，激光束在薄雾中划出一道不可见的线，仿佛在空气中刻下一道极细的刀痕。读数跳动，定格在 **112.3 mm ±0.12**。林檀低声复述：“读数 112.3 mm，误差 0.12，符合规定。”屏幕右下角的生物指纹笔闪烁，心率同步确认，指纹与心跳双重认证通过，绿色的对勾在视网膜投影上一闪而过。仪器内部风扇低沉的嗡鸣像某种沉睡的巨兽在呼吸，每一次转动都把微弱的热量散进周围的寒气里。风扇的震动顺着金属外壳传到掌心，指尖能感觉到微弱的电流感，像心跳在金属里回响。", "雨线就在这儿：北侧土壤松散，沙砾混着干燥的石英粉，手指捏起来像握着碎玻璃，指缝间渗出细微的灰白粉尘，随风飘散；南侧仅隔一步，红壤湿黏，青苔气味扑面而来，指尖陷进泥里，带出一丝凉意，泥浆在指缝间拉出细长的丝，像某种古老的胶水。林檀在两侧各采三个样本，数据写入本地缓存，备注栏敲下“需溯源”。指尖敲击虚拟键盘的触感干脆利落，每一次敲击都伴随屏幕上微弱的蓝光脉动，仿佛在为每一毫米的记录打上时间戳。采样管的盖子拧紧时发出轻微的“咔嗒”，金属螺纹在低温下咬合得格外紧实，手指尖传来一阵微微的酸麻。", "仪表的微振顺着手臂传到肩膀，林檀的右膝随着每一次跨越雨线而加剧酸胀。她习惯在结案前在屏幕上划出 “∟” 手势，指关节发出轻微咔哒声，口头禅随之而出：“毫米不说谎”。数据不说话，她只读数、报误差、引用条款。膝盖的疼痛像一根细细的针，每一次屈伸都在提醒她：测量不是抽象的数字，而是骨骼与肌腱在物理法则下的妥协。呼吸间，薄雾在头顶缭绕，冷气顺着领口渗进衣领，皮肤泛起一层细密的鸡皮疙瘩。", "她将谱仪收回背包，指尖触碰袖口的金属扣，冷冽的触感让她想起十年前那次仲裁：好友所在区因她私自向上修正 0.2 mm 而被冻结三年配额，至今无人知晓。右膝的痛感提醒她，每一次跨越雨线都在为那个决定付出代价。背包的尼龙带在肩头勒出一道浅痕，像一条无声的契约，提醒她每一次测量都在用肉体偿还数据的债务。风把远处的松涛声吹得断续，夹杂着某种金属疲劳的低吼，仿佛整座山脉都在为那一点偏差低声呻吟。", "屏幕上弹出一条加密通讯，发件人标注 “老陈”。内容简短，带着轨道清道夫特有的指令口吻：“冷轨窗口 02:00‑06:00 可用，带上磁带。”林檀的瞳孔微缩，指尖在屏幕上划出 “∟”，随即将手势停在半空，指关节再次咔哒一声——这一次，她没有立刻确认，而是让光标在 “✓” 与 “∟” 之间悬停。薄雾依旧吞噬着远近的轮廓，只有仪器风扇的低鸣和膝盖深处的钝痛在提醒她：下一步，依然由毫米决定。", "风卷着海盐与臭氧的味道钻进鼻腔，仪器风扇的低鸣在耳膜上震出细碎的颤栗。林檀把背包带勒紧，尼龙带在锁骨处勒出一道更深的白痕，指腹触到屏幕表面的微凉玻璃感，像触摸一层薄冰。她没点确认，而是把手腕抬高，让额度卡的蓝色水印在雾气里闪烁 —— 年配额 1200 mm，剩余 312 mm，数字在视网膜上投出淡蓝的光斑，随呼吸一明一灭。光斑在瞳孔里折射出细微的彩虹，仿佛每一毫米都在低声计算着生存的天平。", "“老陈，收到。”她对着通讯器低声说，声线被风切成碎片，“冷轨窗口 02:00‑06:00，磁带已在背包侧袋。坐标发我。”对面传来一阵金属摩擦的沙哑笑声，夹杂着轨道清道夫特有的电流嘶鸣：“别让膝盖拖慢脚步，林檀。数字不会替我撒谎，脚底下的轨道也不会等人。”通讯切断的瞬间，屏幕上弹出一串加密坐标，红色光点在雾幕上划出一条细长的弧线，指向废弃磁悬浮枢纽的第七号维护井。红点在视网膜上留下余晖，像一把未拔出的刺，提醒她前路的每一步都被精密地丈量。", "右膝的钝痛随着每一次深呼吸加剧，像有根细钉钉在髌骨下，每一次屈伸都在提醒她：测量不是抽象的数字，而是骨骼与肌腱在物理法则下的妥协。她把谱仪塞进背包深处，指尖触碰到磁带的金属外壳，冰冷的触感顺着指尖爬上手臂，直抵肩胛。风把全息广告牌的光斑吹得更乱，蓝光在灰白天幕里拼凑出 “重访 2035” 的残缺字样，仿佛在嘲笑每一个还在为毫米讨价还价的人。广告牌的投影在雾中忽明忽暗，投射出的光晕在她瞳孔里折射成破碎的几何。", "林檀调整呼吸，膝盖发出一声闷响，像旧机械啮合时的齿轮咬合。她迈出第一步，靴底踩在北侧松散的石英粉上，沙砾在鞋底发出细碎的 “嘶 — 嘶” 声，随即跨过那条看不见的雨线，南侧湿黏的红壤瞬间包裹住脚踝，泥浆拉出细长的丝，缠上裤脚。每一步都在用肉体偿还数据的债务，每一次屈伸都在为十年前那 0.2 mm 的私自修正付出代价。泥浆的腥味混着石英粉的干燥气息钻入鼻腔，形成一种只属于这条雨线的复合气味。", "远处磁悬浮的低鸣再次滚过，电流声混着海盐味钻进耳膜。林檀把手腕上的额度卡投影关掉，蓝色水印消失在雾气里，只留下指尖悬在 “✓” 与 “∟” 之间的微光，像一颗随时可能熄灭的星。她低头看了眼膝盖，膝盖深处的钝痛依旧在提醒：下一步，依然由毫米决定。薄雾在脚下缠绕，仿佛要把每一毫米的距离都吞没，只有她的脚印在两侧交替，清晰地刻在潮湿的土壤上。"]}, {"index": 2, "title": "第2章干区村的冷凝水账本", "words": 2567, "paragraphs": ["夜风从山谷口灌进来，裹着咸涩的盐霜味，夹杂着冷凝塔滴水的单调敲击——像有人用指甲轻敲一排空铁罐，每一下都在薄雾里炸开细碎的回响。林檀把外骨骼的微动模式锁死在低频，膝盖内侧的止痛贴在体温下微微软化，依旧透出一丝钝痛，提醒她每一次跨越雨线都在用骨骼偿还数据的债务。她在背包侧袋摸到那卷旧磁带，边缘磨损露出铜丝，指腹划过时能感觉到数据刻槽的微微凹凸，那是十年前她私自向上修正 0.2 mm 时留下的唯一物证。风里还夹着一丝生锈的铁味，那是废弃轨道枕木在潮湿夜里渗出的铁锈气，顺着鼻腔直抵喉头，让每一次呼吸都带着金属的冷冽。", "干区村藏在雨线南侧十五公里处，废弃集装箱拼搭成的低矮方块在星光下像一堆被遗忘的积木。屋顶铺着薄膜光伏，夜间辐射冷却将空气里的水汽逼成细珠，顺着冷凝塔的导流槽滴进蓄水袋。林檀沿着狭窄的通道走进村心，脚下是压实的盐碱土，踩上去发出细微的“沙沙”声，鼻腔里先是干燥的石英尘，紧接着是青苔腐烂后的湿腻气息，雨线两侧的土壤与空气差别在一步之隔里完成了彻底的翻转。四周墙面斑驳的涂鸦在微光中若隐若现，几行褪色的坐标数字被风沙磨得模糊，只有最新的版本号还勉强可辨。", "阿雅站在一座冷凝塔旁，手里攥着一张泛黄的纸条，指尖沾着霉味纸屑。她是村里的领袖，也是唯一能读懂手写“雨线坐标/基线版本号”的人。见林檀靠近，阿雅没说话，只是把纸条递过来，背面用褪色的墨水写着：“V‑3.1 165 mm”。林檀接过纸条，指尖触到粗糙纸面，心跳在生物指纹笔的感应下同步闪烁，屏幕上跳出的读数依然是 **112.3 mm ±0.12**。她低声复述：“读数 112.3 mm，误差 0.12，符合雨线标准。”指关节发出轻微咔哒声，口头禅随之而出：“毫米不说谎”。纸条边缘的磨损处还残留着一抹淡黄的油渍，那是上次阿雅用废弃润滑脂给塔体轴承上油时留下的痕迹，指尖一碰便能感觉到那层薄薄的滑腻。", "村民们围成半圈，眼神里没有愤怒，只有一种被锁死在数字里的麻木。每户门口都挂着通行证件，蓝色水印在夜色中微微发光，显示“年配额 1200 mm，剩余 312 mm”。林檀从额度卡里划出 0.5 mm，塞进阿雅的手心，指尖触到冰凉的塑料边缘，内心涌起一股酸涩的愧疚——她知道这点额度在账本里只是四舍五入的尾数，却足以让一个孩子多喝一口合成蛋白膏。保险联合体的远程审计探针在冷凝塔顶端闪烁，红光每隔几秒扫过数据流，确认每一滴水都被精确记入碳‑米双单位账本。探针发出的高频啸叫像极了蚊子在耳边盘旋，村民们下意识地缩了缩脖子，却没人敢出声抗议。", "阿雅低声提示：“档案馆还有磁带，老馆长守着原始签字影像。”话音未落，远处传来磁悬浮朝圣巴士的鸣笛，低沉的电流声穿过薄雾，车厢广告在夜色里闪烁：“重访 2035，见证海平面上升的最后一根路灯”。巴士单向驶入放弃区，车厢内弥漫铁锈与潮湿霉味，窗外废弃高楼像骨架刺破天际。林檀看着巴士尾灯消失在雨线的阴影里，指尖在屏幕上划出 “∟” 手势，指关节再咔哒一声，随即将手势改为 “✓”，语义从“确认”转为“见证”。屏幕上的光标在夜色中微微颤动，仿佛在回应她内心的某种誓言。", "她把磁带塞回背包，拉链齿咬合的声音在寂静里显得格外清脆。膝盖又是一阵刺痛，提醒她下一段路程还得跨过更多条看不见的线。远处的轨道清道夫班次正在舱内与 38 ℃ 的高温搏斗，冷却液报警红光闪烁，碎片捕获指标关乎下一年度冷轨槽位优先权。林檀调整呼吸，启动外骨骼，朝着 7 号闸口的冷轨入口迈出第一步。脚下的盐碱土在外骨骼的微震下发出细碎的脆响，像是大地在低声计算着每一步的代价。", "冷轨入口的金属栅栏在夜风中微微颤动，空气里夹杂着臭氧与陈旧润滑脂的酸涩味，吸一口便能尝到铁锈的金属甘苦。外骨骼关节发出低沉的液压嘶鸣，脚踏板下的盐碱土被压成细密的粉末，每一步都伴随细碎的“咔嗒”声在耳膜上回荡。林檀抬头，全息屏幕在雾气中投出淡蓝的配额流水线：“年配额 1200 mm，已用 888 mm，剩余 312 mm”，数字在红光扫描下闪烁，像心跳一样精准。她下意识地捏了捏指尖，指关节再次轻响，低声自语：“数字不会替我撒谎”。", "“通行证。”一个沙哑的电子音从闸机传出，声波在金属管道里折射成刺耳的啸叫。林檀将额度卡贴近感应区，蓝色水印亮起，扣除 0.5 mm 的尾数瞬间写入账本，屏幕跳出“确认 ✓”。她感到指尖传来一阵冰凉的塑料边缘，内心那股酸涩的愧疚再次升起——这点额度在账本里只是四舍五入的尾数，却能让阿雅多喝一口合成蛋白膏。", "“别急，前面还有磁轨检查站。”身后传来一个低沉的男声，带着机油味的呼吸。林檀回头，看见一个穿着磨损防辐射外套的清道夫，手里攥着一根还在冒烟的冷却管，脸上刻着常年高温留下的皱纹。他把管子递过来：“借你用用，冷却液报警别让它把你锁在里头。”", "林檀接过管子，指尖触到金属表面的微微灼热，眉头微蹙又舒展，指关节再次轻响。她把管子塞进外骨骼的散热槽，液压泵的嗡嗡声瞬间平稳下来，红灯熄灭，绿光亮起。磁悬浮轨道在脚下发出低频震动，像巨兽的心跳，推着她向前，穿过闸口，进入那条被精确计算过的冷轨，每一米都在账本里被记为“碳‑米双单位”的代价。远处的朝圣巴士尾灯早已消失在雨线里，只剩下轨道尽头微弱的蓝光，像某种誓言在等待被见证。", "磁轨检查站的闸口在雾里泛着幽蓝，扫描枪的红线扫过林檀的外骨骼，发出一声短促的“滋——”电流声，随即屏幕跳出“碳‑米 0.12 mm，配额同步”。她感到脚底的悬浮磁场像无形的手掌托住脊椎，每一次脉动都把膝盖深处的酸痛压得更实。清道夫把冷却管塞回腰间的挂扣，指尖在金属扣环上摩出细微的火花，随手抹去脸颊上凝结的油汗。", "“配额还够撑到下一季吗？”他问，声音被管道回荡成低沉的共鸣，夹着机油与臭氧的混合味。林檀没抬头，只把指关节再咔哒一声，屏幕上的数字在眼前闪烁：“剩余 311.5 mm，刚好够把阿雅送进下一级合成蛋白线。”她把额度卡贴近二次感应区，蓝光再亮，扣除 0.3 mm，账本里多出一行“见证 ✓”。", "前方的冷轨弯道隐入暗影，轨面覆着一层薄霜，脚下的盐碱土被磁场压成细沙，每一步都发出细碎的“沙沙”声，像大地在低声记账。远处的磁悬浮朝圣巴士鸣笛再响，车厢广告在夜色里闪烁：“重访 2035，见证海平面上升的最后一根路灯”。尾灯被雨吞没，只剩轨道尽头那抹微弱的蓝光，在夜风中微微颤动，等着下一个把毫米算进骨血里的人。"]}, {"index": 3, "title": "第3章档案馆的霉味与磁带", "words": 2275, "paragraphs": ["地下恒温库的空气里漂浮着一层薄薄的霉味，像陈年纸浆在潮湿的黑暗里慢慢发酵，混着磁带机械运转时的低沉嗡鸣，顺着通风管道钻进林檀的鼻腔。她踩在涂有防静电漆的水泥地面上，脚底传来微微的凉意，指尖触到金属货架边缘时，指尖皮肤被一种干涩的粗糙感刮过——那是十几万卷磁带在恒温二十度、湿度三十五百分之五的环境里积累下来的时间尘埃。墙面上挂着几盏老式钠灯，光晕在空气中凝成淡黄的雾团，照亮了货架间狭窄的缝隙，也照出了林檀袖口沾染的微细灰尘。", "老馆长关启明坐在一张斑驳的铁椅上，左眼架着那枚老式光学放大镜，右手指尖沾着几片发黄的纸屑，轻轻搓动，发出细碎的“沙沙”声。他没抬头，只盯着面前那台仍在转动的磁带读取机，屏幕上跳动着版本号 **V‑3.1**，时间戳定格在 **2043‑06‑17 14:23**。机器内部的滚筒在微弱的电流声中缓缓旋转，磁带边缘的氧化层在读取头下泛起一丝幽蓝的荧光，仿佛某种古老的脉搏在黑暗中微弱跳动。", "“纸不撒谎，磁带也不撒谎。”他低声说，语调里夹着一丝不易察觉的颤抖，像是在对自己确认，也像是在对林檀确认。声音被机器的嗡鸣吞没，只剩下嘴唇翕动的轮廓在灯光下若隐若现。", "林檀从口袋里摸出生物指纹笔，笔尖微微发亮，指纹与心率同步闪烁。她把笔尖贴在读取机的认证口上，屏幕弹出 **“身份确认 ✓”**，随即在屏幕上划出那个固定的 **「∟」** 手势，指关节发出轻微的咔哒声。她没有多余的语言，只重复着职业惯用的口头禅：“毫米不说谎”。指尖触碰金属时，一股微弱的静电顺着指关节爬上手腕，让她想起第一次在实验室里握住这支笔时的寒意。", "“三大集团已经在向我施压，”关启明的声音压低，带着一种被压抑的沙哑，“他们想让我把这盘带子销毁，说是‘版本已归档，无需保留’。但我手里还留着一份未上传的校验节点，那是他们不知道的。”他指了指身后的服务器阵列，指尖划过一排闪烁的绿灯，灯光在他的指甲缝里折射出细碎的彩虹，“碳账本的写入流程需要双盲签字，若我现在把原始影像上传，账本会自动标记‘争议版本’，触发气候互毁触发条件。”", "林檀沉默片刻，右膝内侧的旧伤在潮湿的空气里隐隐作响，她下意识地按了按止痛贴，贴布边缘卷起的胶水在指尖发出细微的“嘶”声。随后她伸手轻敲磁带机的金属外壳，指尖感受到细微的振动顺着指骨传到掌心，像是某种心跳在钢铁肋骨里回荡。她知道，只有在冷轨散热窗口开启前，将这段数据写入分布式校验节点，才能在四十八小时的否决窗口内迫使三大集团暂停第 27 次旋钮转动。", "“我不把数据上传到集团服务器，”林檀说，语速平稳，眼神落在关启明沾着霉味纸屑的指尖上，“只上传到分布式校验节点，由你我共同签字，生成不可篡改的哈希。之后的事，交给仲裁庭的程序。”她的声音没有起伏，却在机器的低鸣中显得格外清晰，仿佛每一个音节都被刻在磁带的磁域里。", "关启明终于抬起头，放大镜后的眼神锐利如刀，嘴角勾起一抹疲惫的笑：“好。冷轨窗口在 02:00 到 06:00，散热槽位只留给我们四小时。你带着磁带，我负责把读取头对准原始签字影像。只要不让那些工程师把磁带塞进他们的专用通道，账本就会自己说话。”他的话语里夹着一丝苦涩的幽默，像是在对抗某种不可名状的宿命。", "两人在嗡嗡声中对视，空气里的霉味似乎变得更浓，仿佛每一缕尘埃都在记录着这场交易的重量。林檀把磁带盒塞进随身的防辐射箱，箱盖合上的瞬间发出一声闷响，像某种誓言在金属里落定。箱体内衬的泡沫在压迫下发出细微的“吱呀”声，仿佛在抗议这突如其来的封存。", "磁带机内部的滚筒骤然加速，释放出一阵金属摩擦的尖啸，划破寂静。屏幕骤然闪烁，绿色字符在黑底上跃动：**“版本号 V‑3.1 原始签字影像 2043‑06‑17 14:23”**。光标在字符后闪烁，像一只等待指令的眼睛，静静注视着这段被尘封十七年的真相，等待着它在下一个清晨的冷轨窗口里，被写入那张永不遗忘的碳账本。", "凌晨两点前，磁带机的风扇猛地加速，冷气像一把锋利的刮刀刮过林檀的颧骨，带着臭氧与润滑油混合的金属腥味钻进鼻腔。她把防辐射箱紧贴大腿，箱壁的导热胶在体温下微微发烫，指尖隔着薄薄的碳纤维层仍能摸到磁带盒边缘那道细微的压痕——那是十七年前关启明亲手刻下的校验码，像一道永不愈合的伤口。", "关启明的手指在读取头上方悬停，指尖的指甲缝里还嵌着上周拆卸服务器时残留的锡渣。他低头盯着屏幕，绿色光标每闪烁一次，服务器阵列就发出一声沉闷的“咔嗒”，像是在吞咽什么沉重的东西。他的喉结上下滚动，喉咙里发出一声沙哑的笑：“还差三分钟，散热槽位才会完全打开。别让你的膝盖在那会儿打颤。”", "林檀没接话，只是把右膝内侧的止痛贴再按紧一些，胶水在潮湿空气里发出细微的“嘶”响，像是某种无声的抗议。她感觉到箱体内的泡沫在压力下慢慢回弹，每一次回弹都伴随着微弱的“吱呀”，仿佛在提醒她：时间不等人。", "屏幕上的倒计时从 03:58 跳到 03:57，冷轨的散热阀门在远处发出一声低沉的气动轰鸣，管道里的液氮瞬间膨胀，白雾顺着金属格栅爬上墙面，凝结成细密的霜花。关启明猛地按下“写入”，数据流在光纤里像液态汞般滑过，碳账本的双盲签名模块亮起双行红字：**“争议版本·待仲裁”**。", "空气中霉味被臭氧稀释，只剩下机器运转的单调嗡鸣和两人急促却克制的呼吸。林檀盯着光标停在最后一行，指尖在箱盖边缘轻轻摩挲，指腹传来的微振动像心跳一样同步——四小时窗口的前两分钟已经过去，屏幕上红色的‘争议版本·待仲裁’标签开始闪烁，倒计时 47:59:12 同步跳动——三大集团的授权链在 48 小时内必须做出选择，否则全网碳账本将自动冻结旋钮转动权限。"]}, {"index": 4, "title": "第4章轨道清道夫的冷轨窗口", "words": 2143, "paragraphs": ["舱壁内侧的冷却液管道在微重力下发出低沉的脉动声，像一颗被压抑的心脏在金属腔体里一下下撞击。红色的报警灯以每秒两次的频率闪烁，将老陈右臂义肢上的捕获传感器映得惨白。空气里弥漫着臭氧与过热润滑油混合的金属焦味，每一次呼吸都像把烙铁塞进鼻腔，灼烧着鼻腔黏膜，顺着气管渗入肺叶。林檀贴在膝盖上的止痛贴在汗湿皮肤下发出细微的“嘶”响，右膝内侧的旧伤随着舱体微振隐隐作痛，提醒她距离上次跨越雨线已过去整整十年。", "她把指尖贴在舱壁的冷凝层上，指尖传来一丝薄薄的冰凉，像某种无声的提醒：这里的温度永远在临界点边缘徘徊。空气循环泵持续低频嗡鸣，夹杂着微粒过滤器更换时残留的细微金属碎屑味，那味道像极了地面维修厂里刚切割过钛合金后的余烬。林檀闭上眼，试图把那股味道与十年前雨线南侧的青苔腥气分开，却发现它们在鼻腔深处交织成同一种记忆的纹理——湿冷的土壤、发酵的落叶、还有远处水汽凝结成露珠时的微甜。", "“冷轨不等人。”老陈的声音从通讯器里挤出来，带着机械臂电机的电流噪音，语速快得像在背诵早已烂熟于心的代码，语尾却夹着一丝不易察觉的疲惫：“捕获、锁定、撤离。散热额度 2 MW，数据上传占 1.3，碎片任务还要 0.9。你先把数据写入账本，我腾出 0.4 给激光捕获。”", "林檀没回话，从口袋摸出便携式激光雨滴谱仪，探头在指尖微微震动，屏幕定格在 **112.3 mm ±0.12**——这是她在 112 号水文站最后一次读数，误差带仍在允许范围内。她将生物指纹笔贴在读取口，屏幕弹出 **“身份确认 ✓”**，随即在屏幕上划出固定的 **「∟」** 手势，指关节发出轻微咔哒。数据流像液态汞般滑入光纤，双盲签名模块亮起红字：**“争议版本·待仲裁”**。", "舱内温度计读数攀升至 **38 ℃**，冷却液红光愈发急促。老陈右臂义肢的传感器发出尖锐蜂鸣，捕获臂在真空中划出一道蓝白光痕，第七枚 3 cm 级碎片入钳时，机械臂关节传来金属疲劳的闷响，像一根即将断裂的琴弦在低吼。他咬牙低吼：“再给我三十秒，散热阀全开。”", "老陈的呼吸声在通讯器里变得粗重，每一次吸气都伴随着义肢内部液压油泵的嘶鸣，油液在管路里撞击金属壁，发出沉闷的“咚、咚”声。林檀透过舷窗看到外部星空被碎片光痕切割成无数细碎线段，像一张被撕裂的网，星光在碎片边缘折射出冷冽的蓝白色锋芒。她想起地面上雨线两侧的差异：北侧土壤干燥、沙砾在指尖滑落，气味是石英尘与干燥风，吸一口就像吞下一把细砂；南侧则湿腻、青苔气味顺着鼻腔爬上喉头，脚下红壤粘住鞋底，每一步都带着黏稠的阻力。那一刻她曾在雨线上贴过透皮止痛贴，如今在轨道上依然能闻到那两种气味的残留，仿佛跨越的不仅是纬度，更是两套截然不同的生存逻辑。", "通讯器里传来地面调度的简短指令，语调平直如同自动播报：“配温区通行证件已验证，冷轨窗口延长至 06:00。”林檀在额度卡上划过 **“年配额 1200 mm，剩余 312 mm”**，顺手将一口水的额度——**0.02 额度**——记在备忘栏，提醒自己干区村的孩子们每天只能靠冷凝塔滴下的 **4 L** 维持。她指尖划过屏幕时，微重力让字体微微晃动，像被无形风吹动的干枯树叶。", "老陈的机械臂终于锁定最后一枚碎片，舱内温度骤降两度，红光转为稳定的琥珀色。他长出一口气，语气难得柔和：“数据已写入账本，标记争议版本，倒计时 47:59:12。”屏幕中央弹出全网红色警报——**“检测到基线篡改，旋钮转动权限冻结，倒计时 47:59:12”**。", "警报的红光在林檀视网膜上留下残影，她感觉膝盖深处的旧伤又一次被冻结的冷气刺激，却不再颤抖。她收回指尖，指尖在箱盖边缘摩挲，微振动像心跳同步。低声重复职业口头禅：“毫米不说谎”。", "老陈把捕获臂末端探针插进舱壁维修口，蓝白电弧在真空中炸出细碎火花，照亮他义肢表面细密划痕，每一道划痕都记录着一次次捕获、一次次擦肩而过的死神。 “权限冻结不等于锁死，”老陈声音带着金属质感的沙哑，“老馆长销毁日志，只因那页霉斑纸屑里藏着雨线真实基线。把争议版本导出，挂到备用节点，我来把旋钮的物理锁拆了。”", "林檀点头，指尖在额度卡屏幕上滑过“导出‑争议‑节点 03”，字体在微重力下微微晃动，像被无形风吹动的干枯树叶。她对着通讯器低声念出：“9‑A‑4‑F‑7‑C‑2‑E，校验通过，倒计时 47:55:03。”通讯器那头传来地面调度的金属质感回音：“收到，物理钥匙已授权，雨线控制权移交至备用节点，准备开阀。”", "老陈抽出镀钛六棱杆，旋钮发出一声沉闷的“咔嗒”，舱内温度骤升三度，冷却液泵的嗡鸣转为平稳的脉动，像心脏重新找回节奏。他把钥匙扔进随身的磁吸盒，盒盖合上时发出轻微的磁力吸附声，像心脏在金属腔室里完成一次收缩。林檀握紧额度卡，指尖传来的冰凉感已化作一种坚硬的节奏，随着倒计时的红色数字在视网膜上跳动，她知道接下来的四十八小时，雨线将由他们亲手重写。", "舱壁上的维修口还在冒着淡蓝电弧，冷却液泵的低频脉动突然在一次心跳间隙里停滞，随即以一种从未有过的频率震颤——仿佛整条轨道都在屏息等待下一滴雨的落点。老陈回头，眼里映着那抹微弱的蓝光，低声道：“雨线在呼吸，我们要决定下一滴落在哪里。”林檀没有回答，只是将额度卡贴近胸口，感受着金属的冷意渗入掌心，倒计时继续滴答，红色数字在视网膜上燃烧。"]}, {"index": 5, "title": "第5章保险精算师的概率模型", "words": 2402, "paragraphs": ["冷气从全息墙面渗出，夹着一股淡淡的臭氧与金属冷却液的味道，像一层薄霜贴在林檀鼻尖。蓝色的额度卡水印在半空微微闪烁，投影出的“年配额 1200 mm，剩余 312 mm”在空气中折射出细碎的光斑，低频嗡鸣像心跳一样贴着地板传来，震得脚底骨缝隐隐发麻。她站在保险联合体总部的浮动汇率墙前，指尖悬在全息键盘上方，右膝内侧的旧伤随着空调风微微发紧，止痛贴在汗湿皮肤下发出细微的“嘶”响，胶布边缘卷起的一角在指尖摩挲时泛起一丝粘腻的凉意。墙面上方的全息流水线无声滚动，碳‑米双单位账本的数据流像液态水银般在暗蓝背景里蜿蜒，每一次跳动都伴随一记极轻的电流啁啾，仿佛整栋大楼的呼吸都被压缩进这几立方米的空气里。", "薛澜的右眉上方那条微光数据流纹路随着心率从青转紫，光带在眉骨上方跳动，映出她眼底深处一丝不易察觉的疲惫。她的声音平稳得像在读一份精算报表，语调里没有任何感情色彩，只有冷冰冰的逻辑推演：“风险可定价，生命不可。”屏幕上滚动着“未计数者生存概率模型”，曲线在 12 % 的死亡率下降处形成一个陡峭的拐点，红色的阴影区像一道裂口吞噬着周围的蓝色基线。林檀没有接话，只是从口袋摸出便携式激光雨滴谱仪，金属外壳在掌心传来一股微微的余温，探头在指尖微微震动，屏幕定格在 **112.3 mm ±0.12**——这是她在 112 号水文站最后一次读数，误差带仍在允许范围内。她将生物指纹笔贴在读取口，指尖感受到笔尖微弱的电流刺痛，屏幕弹出“身份确认”，随即在屏幕上划出固定的“∟”手势，指关节发出轻微咔哒，像是一把精密齿轮咬合的瞬间。", "“读数 112.3 mm，误差 0.12，符合标准。”林檀的语调平淡，像在复述一条物理常数，声音在全息墙面的回声里被拉长、压扁，只剩下纯粹的数字。薛澜的瞳孔在全息投影里微微收缩，指尖在悬浮的汇率表上滑过，法域套利平台的汇率每秒跳动一次，碳‑米双单位账本在后台无声运算，数字的流动像一条无形的河在地下暗涌。她终于开口，语速不疾不徐，每一个字都被精准地切分：“模型显示，若把 2043 年基线从 165 mm 修正回 210 mm，U‑Class 死亡率下降 12 %，但会触发偷雨判定，冻结该区三年额度，甚至失去轨道冷轨资格。”", "林檀没看汇率表，目光落在墙角一盏废弃的冷凝塔模型上。模型塔身锈蚀斑驳，夜间滴水声如敲击空罐，仿佛那股潮湿的霉气还沾染在指尖。她低声重复，声音里夹杂着一丝不易察觉的颤抖：“毫米不说谎。”薛澜沉默片刻，指尖在全息键盘上敲下一串指令，屏幕弹出“争议版本·标记”，模型被锁定为“待仲裁”状态，自动推送至碳账本并进入动态基线议程。全息墙面上的光带随之变为琥珀色，低沉的提示音像心跳一样在空气中回荡。", "“已标记。”薛澜的微光纹路恢复青色，眉间的紫光退去，只剩下一抹平静的青绿，“保险联合体将按新版本重新核算赔偿，额度卡下周刷新。”她顿了顿，视线掠过林檀右膝的止痛贴，目光在胶布边缘的微微翘起处停留了半秒，“你还有 12 小时，仲裁庭直播倒计时。”", "林檀收回谱仪，指尖在额度卡上滑过“剩余 312 mm”，指腹感受到卡面微微的凹凸纹理，随即在备忘栏敲下“导出‑争议‑节点 03”。字体在微重力下微微晃动，像被无形的风吹动的干枯树叶，每一笔划动都伴随极轻的静电噼啪声。她低声确认，语气里透出一种近乎仪式感的冷静：“已上传，校验码 9‑A‑4‑F，倒计时同步。”", "通讯器里传来地面调度的冷冽女声，声线经过多层加密仍保留着金属质感的锐利：“收到，仲裁庭直播倒计时 12:00:00，赫尔曼庭长的生物指纹环微光闪烁，屏幕提示‘等待最终签字’。”声音在林檀耳膜上震动，仿佛每一个字都在敲击她胸腔里的某块精密齿轮。", "林檀握紧额度卡，指尖传来的冰凉感不再刺痛，反而像一把锁，终于扣上了下一个四十八小时的齿轮。她感觉掌心的汗水在金属表面蒸发，留下一层薄薄的盐霜，随着呼吸一同升腾，融入全息墙面那无尽的数据洪流之中。远处的浮动汇率墙仍在无声跳动，碳‑米双单位账本的数字像心跳一样持续闪烁，而她站在光影交错的夹缝里，等待着下一个判决的降临。", "林檀的呼吸在全息墙面的琥珀光带里变得可听，微重力下的空气流动带着一股淡淡的臭氧味，混着冷凝塔模型渗出的铁锈腥气，钻进鼻腔又顺着喉咙滑下。薛澜的指尖仍悬在键盘上方，青绿纹路脉动着微弱的电流声，像心脏在光纤里跳动。她没抬头，只把视线投向墙角那盏废弃的冷凝塔，塔身锈斑在光带映照下泛出暗红的晕圈，滴水声依旧有节奏地敲击着空罐，每一下都像在为即将到来的判决计时。", "“仲裁庭直播已接入。”通讯器里的女声再次切入，金属质感的音色里夹着一丝不易察觉的颤动，“赫尔曼庭长的生物指纹环已完成双重校验，等待最终签字。请双方在三十秒内确认版本锁定。”声音像一把细长的刀，割开全息墙面上跳动的碳‑米双单位账本，把数字的河流切成两段。", "林檀低头，指腹在额度卡的“剩余 312 mm”上按压，卡面的微凹纹路在指尖留下一串细微的静电火花。她把备忘栏里的“导出‑争议‑节点 03”再次核对，校验码 9‑A‑4‑F 在微重力下微微晃动，像被无形的风吹动的干枯树叶。薛澜的瞳孔在全息投影里收缩，青绿纹路闪烁一次，随即恢复平静的青色：“版本锁定，争议版本·标记已写入碳账本，动态基线议程同步推送。”", "倒计时在全息墙面上以琥珀色数字倒数，12:00:00 → 11:59:57，每一秒都伴随低沉的提示音，像心跳在金属腔体里回荡。林檀感到掌心的盐霜在蒸发，冷气顺着指缝钻进毛孔，带走最后一丝犹豫。她抬起头，目光穿过光影交错的夹缝，落在远处浮动汇率墙上——数字依旧无声跳动，碳‑米双单位账本的脉搏未曾停歇。", "“签字。”林檀的声音低哑，带着一丝金属的共振，指尖在额度卡上划过“确认”键，静电噼啪声在指尖炸开。薛澜的微光纹路亮起一次刺眼的青白，随即归于沉寂。全息墙面的光带骤然转为深蓝，仲裁庭的直播画面铺开，赫尔曼庭长的生物指纹环在屏幕中央脉动，等待着最后一笔签名落下。"]}, {"index": 6, "title": "第6章仲裁庭的 48 小时博弈", "words": 2123, "paragraphs": ["冷气从全息墙面渗出，夹着臭氧与金属冷却液的味道钻进鼻腔，像一层薄霜贴在林檀的皮肤上；地板传来的低频嗡鸣震得脚底骨缝隐隐发麻，指尖触到签字屏幕边缘时能感觉到微弱的静电刺痛。空气里还漂浮着一丝陈旧的铁锈味，那是放弃区朝圣巴士车厢里常年积攒的霉湿气息，透过通风管道渗进会议室，提醒着每一个坐在旋钮前的人：雨线另一侧的土地早已干裂成盐壳。", "会议室呈椭圆，中央悬浮着一条实时雨线投影，蓝绿相间的等值线随数据流微微抖动。三大集团的工程师、条约机构监察员、保险联合体精算师围成一圈，每人面前放着一枚生物指纹环，指关节在灯光下泛着冷冽的金属光。赫尔曼庭长坐在主位，左手无名指的指纹环随心跳微微闪烁，右手食指轻敲桌面，发出细碎的“咔、咔”声，像在为即将到来的双盲签字计时。桌面上散落的数据芯片在冷气中微微凝结出细小的露珠，折射出会议室顶部隐藏的光纤阵列。", "林檀右膝内侧的旧伤随着空调风微微发紧，止痛贴在汗湿皮肤下发出细微的“嘶”响，胶布边缘卷起的一角在指尖摩挲时泛起一丝粘腻的凉意。她从口袋摸出 W‑12 便携式激光雨滴谱仪，金属外壳在掌心传来一股微微的余温，探头在指尖微微震动，屏幕定格在 **112.3 mm ±0.12**——这是她在 112 号水文站最后一次读数，误差带仍在 **** 允许范围内。她将生物指纹笔贴在读取口，指尖感受到笔尖微弱的电流刺痛，屏幕弹出 **“身份确认 ✓”**，随即在屏幕上划出固定的 **「∟」** 手势，指关节发出轻微咔哒，像是一把精密齿轮咬合的瞬间。", "“读数 112.3 mm，误差 0.12，符合规定。”林檀的语调平淡，像在复述一条物理常数，声音在全息墙面的回声里被拉长、压扁，只剩下纯粹的数字。", "赫尔曼庭长的目光扫过三方代表，语速不疾不徐：“授权链 **** 已完成双盲签字，日志写入碳账本。第 27 次旋钮转动窗口剩余 48 小时，任何一方在 48 h 内连续两次否决将触发 **** 气候互毁。”他的声音带着机械般的平直，指尖在指纹环上轻划，环面光带随之从青转紫。", "北美联邦工程师马克率先开口，指尖在全息键盘上敲出一串指令：“我们提交否决，理由是基线版本 V‑3.1 存在篡改嫌疑，需暂停旋钮直到档案核对完毕。”屏幕上浮现一行红字：**否决 1/2**。", "欧亚联盟监察员叶琳眉头微皱，指尖在指纹环上停留片刻，随后按下确认：“同意暂停，要求在 24 小时内完成原始磁带上链。”第二行红字亮起：**否决 2/2**。", "东亚协同体精算师孙浩沉默了三秒，指尖悬在确认键上方，微光数据流纹路在眉骨上跳动。他低声道：“若再延迟，冷轨拍卖将错过本季度窗口，算力汇率会波动超过 7 %。”他最终按下，**“待确认”** 取代了第三行红字。", "林檀感到右膝深处传来一阵钝痛，止痛贴的胶布边缘在汗水中进一步卷曲。她深吸一口气，掌心汗水在金属表面蒸发，留下一层薄薄的盐霜。全息雨线投影在她眼前微微漂移，蓝绿交界处的 ±0.5 mm 等值线像呼吸一样起伏。", "十年前的那个夜晚在脑海里闪回：她在 112 号站把读数从 112.5 mm 改成 112.3 mm，只为让好友所在区多得 0.2 mm 配额；结果那一季好友所在区被判定“超额”，整片农田被冻结三年，老友在干旱中失去了全部收成。那一刻她听见的不是抗议，而是风吹过干裂土壤的沙沙声，像指甲在黑板上划过。如今同样的指尖悬在同一块屏幕上，唯一不同的是膝盖的旧伤和屏幕上跳动的倒计时。", "“读数不会客气。”她在心里默念，随即对着全息墙面低声重复：“数字不会替我撒谎。”", "倒计时在墙角以秒为单位滚动：**47:59:12**。碳账本的区块链式日志同步刷新，每一笔签字都伴随一次低沉的电流啁啾，像心跳一样贴着地板传来。老陈的加密短讯闪过：冷轨延至 06:30，日志上链。林檀指尖微动，屏幕上的 **「∟」** 手势在光标下闪烁，随时准备转为 **「✓」**。", "赫尔曼庭长的指纹环光带骤然转为深红，他在全息投影前站起身，椅背发出金属疲劳的轻响：“若在剩余 48 小时内无法达成一致，反射环全开、碱化泵全停，全球降水瞬时偏移将超过 15 %。”他的声音在会议室里回荡，带着一种不可逆的终结感。", "林檀感到指尖的静电刺痛加剧，屏幕上的倒计时跳动到 **47:58:03**。她将 W‑12 探头贴近额头，微弱的激光束在视网膜上划出一条细线，仿佛在为即将到来的裁决刻下标尺。全息雨线两侧的土壤气味在她记忆中同时浮现：干燥的石英尘味与湿腻的青苔气，仿佛在同一时刻被压缩进这间狭小的会议室。", "通讯器再次响起，调度员的冷冽女声穿透加密层：“倒计时 00:02:17，请确认最终签字权限。”林檀深吸一口气，指尖在卡面上轻敲三下，屏幕弹出“签字确认·生效”，琥珀光带骤然转为深蓝，低沉提示音如同敲击在她胸腔的钟声。", "全息墙面上的雨线投影在瞬间定格，蓝绿交界不再漂移。林檀的指尖仍悬在签字屏幕，手势未落，会议室只剩下低沉的电流啁啾与空调排风的持续低吼，仿佛整个星球的水循环都在这一刻屏住了呼吸。林檀感到右膝深处的钝痛突然尖锐，止痛贴的胶布终于彻底脱落，露出一小块红肿的皮肤，她没有伸手去按，只是让汗水顺着下颌滑落，滴在冰冷的金属台面上，发出清脆的“滴——答”声。", "墙面投影突然闪烁，倒计时数字出现微微抖动，林檀听见远处传来一声低沉的液压阀开启声。"]}, {"index": 7, "title": "第7章", "words": 2203, "paragraphs": ["风从高原裂口灌进鼻腔，先是干燥的石英尘味，随即夹着一股湿腻的青苔气，像把两块不同的布料硬生生缝在一起。脚下的碎石在靴底发出细碎的“沙沙”声，指尖触到 W‑12 探头时，微振顺着指骨爬上手腕，屏幕定格在 **112.3 mm ±0.12**——误差带仍在允许范围内。林檀把止痛贴贴在右膝内侧，胶布边缘在汗湿皮肤下发出细微的“嘶”响，膝盖深处的钝痛随着每一次跨线而尖锐。她低头看了眼探头表面沾染的灰白粉尘，指腹轻轻蹭过，感受到金属外壳微微的凉意渗入指尖，仿佛整个高原的呼吸都浓缩在这一刻的触感里。风夹着薄雾掠过耳际，带来一丝铁锈与冰雪混合的金属腥，让她不由自主地深吸一口气，胸腔里的冷气顺着气管滑下，指尖仍残留着刚才触碰屏幕时的微凉。", "雨线不再是一条静止的等值线。算法在云端把过去十年实测毫米、碳账本里的蒸发系数、未计数者聚居点的冷凝塔产水量一次性吞进模型，输出一条随实测实时漂移的“浮动带”。全息投影在头顶展开，蓝绿交界像呼吸一样左右摆动，宽度从 ±0.5 mm 膨胀到 ±2.3 mm，随后又收缩回 ±0.8 mm。林檀看着带边缘在两侧土壤上同时留下印记：左侧沙砾干燥，右侧红壤粘手，空气里同时飘着石英尘与青苔腥。她抬起手，指尖在半空中划过投影边缘，感受到光斑在视网膜上留下的余晖，像是把整个气候系统的不确定性握在了掌心。投影边缘的光晕在指尖微微颤动，仿佛每一次呼吸都在重写边界的定义。", "老陈的清道夫班次早已结束，舱内冷却液红光还在闪烁。一段未上传的轨道姿态日志通过加密频道推送到林檀的终端，日志里记录着反射环一次未授权的微调，正是那次微调让浮动带在过去三个月里向北偏移了 0.07°。林檀把日志接入本地节点，屏幕上跳出 **“争议版本·待仲裁”** 标签，碳账本自动在分布式链上打上时间戳。通讯器里传来老陈低沉的语音留言：“别让那帮账本审计员把这笔偏移抹平了，林檀，数据会说话。”她没回话，只把日志的哈希值拖进验证队列，指尖在触控板上滑过，感受到每一次确认的微弱震动。屏幕上绿色的进度条缓缓推进，像心跳一样在寂静的舱内回响。", "档案馆的磁带读取器在低温舱里低吼，关启明戴着光学放大镜，指尖沾着霉味纸屑，将 2043 年 V‑3.1 版本的原始签字影像上链，李薇完成校验。数据流在几秒内汇聚成新的基线曲线，浮动带的中心线随之微微上抬，像一条被轻轻托起的绳索。关启明抬起头，眼镜片反射着屏幕的蓝光，喉咙里发出一声沙哑的叹息：“终于把历史还给它自己了。”空气中弥漫着旧纸张与臭氧混合的陈旧气息。", "保险联合体的索赔模型在同一时刻炸开。薛澜的全息水印在会议室墙面闪烁，红色的概率云团覆盖了整个高原板块，提示若按旧基线执行，未计数者死亡率将在未来十年上升 12 %。平台城邦的额度卡终端同时刷新，年配额从 1200 mm 降至 **1080 mm**，剩余额度在每户屏幕上跳动，居民手中的水杯——每杯约 0.001 额度——在刷新瞬间发出细微的“滴”声。投影里渗出薛澜的声音，带着一丝金属质感的回响：“这是我们必须承担的代价，林檀，别让数字替我们做决定。”林檀盯着墙面上跳动的红云，指尖不自觉地收紧，指甲陷入掌心，感受到一阵尖锐的刺痛，指尖的微汗与石英尘交织成一层薄薄的灰膜。", "干区村的冷凝塔在夜色中滴水，声响像敲击空罐。阿雅站在塔下，手里攥着手写的雨线坐标版本，指尖在纸边缘磨出细微的毛刺。她看着浮动带在头顶缓慢呼吸，嘴角抿出一条浅线，随即把一张磁悬浮朝圣巴士的单程票塞进林檀口袋，车厢里仍弥漫着铁锈与潮湿霉味。阿雅的手指在林檀掌心轻轻摩挲，低声说：“带上这个，下一站的风会记得你。”林檀握住票根，纸张的粗糙感与指尖的汗湿交织，心里涌起一股难以名状的沉重，仿佛整个高原的重量都压在了这张薄薄的票面上。", "林檀收回探头，轻点屏幕边缘的确认键。屏幕弹出 **“确认并见证”**，蓝绿交界在同一时刻锁定，干燥石英尘味与湿腻青苔气在同一秒被记录进碳账本，成为新基线的第一对同步样本。她深吸一口混合着尘埃与青苔的空气，胸腔里的冷气顺着气管滑下，指尖仍残留着刚才触碰屏幕时的微凉，掌心却已经渗出一层薄汗，混合着石英尘与青苔的气息，黏在指纹沟壑里，像某种未干的印记。风在耳边低吼，带走一丝未说完的誓言。", "控制台风扇低沉嗡鸣，冷却液在管路里流动的声响像极了远处冰川融水的细语。会议室的全息投影依旧悬浮，薛澜的水印在墙面上缓缓旋转，红云边缘在数据流冲刷下微微收敛。一枚银色的数据晶体静静躺在桌面中央，晶体表面折射出林檀刚才确认的基线曲线，曲线的每一个拐点都在微光中闪烁。林檀走近，指尖触碰晶体边缘，感受到一股微弱的静电刺痛，像是某种无形的契约在皮肤上留下痕迹。晶体内部微弱的脉动与她心跳同频，仿佛在提醒：每一次确认都是一次契约的重签。", "阿雅的身影出现在门框外，手里仍攥着那张单程票，票角磨损的边缘在灯光下泛着暗金。她没说话，只是把票根轻轻塞进林檀的外套口袋，指尖在布料上划过一道细微的摩擦声。林檀低头，看见票面上印着的「见证 2126，雨线从此会呼吸」的字样在晨雾中若隐若现，墨迹与水汽交融，仿佛正在呼吸。远处的浮动带在数据流中泛起一抹微光，像是一条正在苏醒的脉络，随时准备为下一次漂移重新定义边界。林檀端起桌上的水杯，屏幕上瞬间弹出 **“首杯 0.012 额度”** 的红字，指尖在杯沿微微颤动——是留下，还是把这口水留给下一个等待的人？风声在走廊尽头骤然拔高，像某种倒计时的提示音，逼着她在下一秒做出选择。"]}, {"index": 8, "title": "第8章雨的边界", "words": 2314, "paragraphs": ["清晨的风从“北极星”模块的窗隙钻进来，先是一股干冷的金属味，随即夹着湿润的青苔气息，像把两块不同的布料硬生生缝在一起。林檀靠在床头，指尖仍能感觉到 W‑12 探头残留的微振，细微的震动顺着指骨爬上手腕，带着一种仪器特有的凉意。右膝内侧的旧伤不再在跨过雨线时尖锐刺痛，止痛贴早已撕下，膝盖深处只剩下钝钝的温热，仿佛身体终于学会了与那条呼吸的边界共存。她没有开通长寿订阅，体检报告上“订阅状态：未开通”依旧刺眼，理由依旧是那句刻在心里的话——不想把膝盖的痛交给算法。", "舱壁上的低温辐射板泛着微弱的蓝光，将她的影子拉长成一条细长的银线。空气里漂浮着细微的铁屑，每一次呼吸都能在喉咙里尝到一丝锈味，混合着从循环水管渗出的淡淡氯气。循环泵在管壁上激起的压力波动以 0.7 Hz 的频率敲击着金属肋骨，指尖贴上管壁能感觉到那种像心跳一样的微颤。她伸手摸了摸床沿的合金边框，指腹传来的冷硬感让她确认：这里依然是属于她的、不可被远程覆写的物理坐标。", "窗外的全息投影里，浮动带正以每小时 0.03° 的速度向北滑移，蓝绿交界像一条活着的呼吸线，宽度在 ±0.8 mm 与 ±2.3 mm 之间反复收放。投影边缘的像素在晨光中微微闪烁，仿佛有人在用极细的针尖一次次刺破大气的薄膜。林檀站起身，外骨骼在脚踝处发出轻微的液压嘶鸣，齿轮咬合的节奏与她心跳的频率产生了一种难以言说的共振。她一步步走向模块尽头的小型纪念台，每一步都在金属地板上留下浅浅的凹痕，像是在为后来者刻下某种无声的坐标。", "台面上放着一块灰白的石碑，刻着好友的名字与十年前那次仲裁的日期。石面经过岁月的风蚀，边缘已呈现出细密的蜂窝状孔隙，指尖划过时能感到微微的粗糙，仿佛每一道纹路都在低声诉说那些被雨水冲刷却从未被遗忘的誓言。她从口袋里摸出那枚磨损的金属扣，边缘已被雨水与汗水打磨得圆润，指腹摩挲时能听到细微的“沙沙”声，像是某种古老的誓言在指尖低语。扣环内侧还残留着一抹淡淡的蓝色荧光粉末，那是当年仲裁庭为标记“雨线通过权”而撒下的标识，至今仍在微光中微弱发光。", "“112.3 mm。”她低声念出，声音在狭小的舱室里回荡，带着一丝不易察觉的颤抖。雨滴开始落在石面上，第一滴砸在刻字的凹槽里，发出清脆的“叮”，随后第二滴、第三滴，汇成细细的水线顺着石纹流下，带走灰尘，也带走十年来积压的愧疚。每一滴撞击都在石碑内部激起微不可闻的共振，仿佛大地在回应她的见证。林檀将掌心贴上石碑边缘，指腹感受着蜂窝孔隙里渗出的微凉水汽，屏幕自动记录“确认并见证”，碳账本在后台无声写入新的时间戳，浮动带的算法在同一时刻把两侧土壤的气味——干燥石英尘与湿腻青苔——同时记入数据库，数据流在光纤里以光速滑过，却在她指尖留下了实实在在的温度。", "远处的轨道反射环在晨光中微微颤动，金属支架发出细碎的疲劳声，像某种巨大生物在伸展四肢，为下一次雨线的呼吸做准备。反射环表面的镀层在阳光下泛出油彩般的虹膜，每一次微振都让光斑在舱壁上跳动，投射出破碎的几何图案。林檀深吸一口气，胸腔里的冷气顺着气管滑下，混合着尘埃、青苔、铁锈与潮湿霉味，指尖仍能感受到探头残留的微振，仿佛整个星球的水循环都浓缩在这一刻的触感里。", "身后传来一阵轻微的磁靴摩擦声，随即一个低沉的男声穿透了湿冷的空气：“林檀，雨线那边的传感器阵列刚刚报了异常，湿度梯度在三秒内跳了 12 %。”", "她没回头，只是将手掌贴在石碑边缘，指腹感受着蜂窝孔隙里渗出的微凉水汽，像是在确认某种古老的契约。“是‘雨线通过权’的旧标识在泄漏。”她的声音平静，却夹着一丝不易察觉的沙哑，“十年前仲裁庭撒下的荧光粉末，随雨水渗入地层，现在被地热逼出了表面。”", "男人走近，磁靴在金属地板上留下一串浅浅的磁痕，外骨骼关节在膝盖处发出细碎的“咔嗒”声。他叫陈默，曾是林檀在“浮动带管理局”的搭档，现任边界监测组组长。他的瞳孔在全息投影的微光里闪烁着数据流的倒影，眉骨上那道陈年疤痕在晨光中泛着淡淡的铁锈色。“数据已经上传到碳账本，算法判定这是‘自然渗漏’，不触发‘人为干预’条款。”他顿了顿，指尖在腕部控制台上划过一个“✗”，语气里带着一种疲惫的克制，“但我申请了人工复核，理由是‘历史誓言’条款仍在生效。W‑12B 型阵列以 200 Hz 采样，功耗 0.8 W，误差带 ±0.3 %。”", "林檀终于转身，目光掠过陈默胸口的徽章——一枚被雨水蚀刻成蜂窝状的银色雨滴，边缘还残留着当年的蓝色荧光粉末。她嗅到了他身上混合的气味：润滑油、臭氧、还有那种只有长年在浮动带巡逻才会沾染的湿腻青苔味。“你还记得那句誓言？”她问，指尖轻轻敲击石碑表面，每一次敲击都在石内激起微不可闻的共振。", "陈默沉默了几秒，呼吸在面罩里形成白雾，随即被空气净化器吸走。“记得，”他低声回答，语调像是在对着一台老旧的服务器做最后一次固件升级，“‘只要雨线还在呼吸，我就在这里，替你守着这条边界’。可现在的边界，已经不只是经纬度，而是每一滴雨、每一克碳、每一次算法的判决。”", "远处的反射环再次颤动，镀层在阳光下折射出破碎的彩虹，光斑在舱壁上跳动，将两人的影子拉长、扭曲，最后重叠成一条模糊的线。林檀从口袋里取出那枚磨损的金属扣，扣环内侧的蓝光在晨雾中微微跳动，像一颗不愿熄灭的心跳。她将扣环扣在石碑的一个蜂窝孔隙上，金属与石的接触发出一声细微的“铛”，随即被雨声淹没。", "“复核通过。”陈默在腕部控制台上确认，屏幕上跳出“历史誓言条款生效，边界锁定”。碳账本同步落盘，浮动带算法同步更新了两侧土壤的气味数据——干燥石英尘与湿腻青苔，这一次，数据流里多了一行手写的备注：*见证者：林檀、陈默，雨线仍在呼吸。*", "远处轨道反射环在晨光中微微颤动，仿佛在为新的雨线划定下一次呼吸做准备。"]}]};
const L = {"cover_label": "扉页与作品简介", "unit": "字", "by": "作者：", "meta_sep": " | 全书约 ", "intro_title": "作品概念与梗概", "prev": "← 上一章", "next": "下一章 →", "start": "开始阅读第一章 →", "ch_prefix": "第 ", "ch_mid": " 章 | ", "theme_dark": "☀️ 亮色模式", "theme_light": "🌓 暗色模式"};
let currentIndex = -1; // -1 = title page / synopsis
let fontSize = 17;

function renderSidebar() {
    const list = document.getElementById("chapterList");
    list.innerHTML = `<li class="chapter-item ${currentIndex === -1 ? 'active' : ''}" onclick="goToChapter(-1)">
        <span>📖 ${L.cover_label}</span>
    </li>`;
    book.chapters.forEach((ch, idx) => {
        const li = document.createElement("li");
        li.className = "chapter-item" + (currentIndex === idx ? " active" : "");
        li.innerHTML = `<span>${ch.title}</span><span class="ch-words">${ch.words}${L.unit}</span>`;
        li.onclick = () => goToChapter(idx);
        list.appendChild(li);
    });
}

function renderContent() {
    const wrapper = document.getElementById("articleWrapper");
    const label = document.getElementById("currentChLabel");
    if (currentIndex === -1) {
        label.innerText = L.cover_label;
        wrapper.innerHTML = `
            <div class="article-header">
                <h1>${book.title}</h1>
                <div class="article-meta">${L.by}${book.author}${L.meta_sep}${book.total_words.toLocaleString()}${L.unit}</div>
            </div>
            <div class="intro-box">
                <h3 style="margin-bottom:12px;color:var(--accent);">${L.intro_title}</h3>
                <div style="white-space: pre-wrap; line-height:1.75;">${book.description}</div>
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" disabled>${L.prev}</button>
                <button class="nav-btn" onclick="goToChapter(0)">${L.start}</button>
            </div>
        `;
    } else {
        const ch = book.chapters[currentIndex];
        label.innerText = ch.title;
        const pTags = ch.paragraphs.map(p => `<p style="font-size: ${fontSize}px;">${p}</p>`).join("");
        wrapper.innerHTML = `
            <div class="article-header">
                <h1>${ch.title}</h1>
                <div class="article-meta">${L.ch_prefix}${ch.index}${L.ch_mid}${ch.words}${L.unit}</div>
            </div>
            <div class="article-body">
                ${pTags}
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" onclick="goToChapter(currentIndex - 1)">${L.prev}</button>
                <button class="nav-btn" onclick="goToChapter(currentIndex + 1)" ${currentIndex >= book.chapters.length - 1 ? 'disabled' : ''}>${L.next}</button>
            </div>
        `;
    }
    document.getElementById("content-container").scrollTop = 0;
}

function goToChapter(idx) {
    if (idx < -1 || idx >= book.chapters.length) return;
    currentIndex = idx;
    renderSidebar();
    renderContent();
}

function toggleTheme() {
    const current = document.documentElement.getAttribute("data-theme");
    const next = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    document.getElementById("themeBtn").innerText = next === "dark" ? L.theme_dark : L.theme_light;
}

function changeFontSize(delta) {
    fontSize = Math.max(14, Math.min(26, fontSize + delta));
    const paras = document.querySelectorAll(".article-body p");
    paras.forEach(p => p.style.fontSize = fontSize + "px");
}

renderSidebar();
renderContent();
</script>
