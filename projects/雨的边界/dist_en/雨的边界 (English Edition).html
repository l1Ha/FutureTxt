<script>
const book = {"title": "雨的边界 (English Edition)", "author": "FutureTxt AI Writer", "description": "In 2126 the planet’s climate is governed by the Global Thermostat — a triad of stratospheric aerosol injectors, orbital reflectors, and ocean alkalinity pumps that shift monsoon belts with every degree of adjustment. Under the Global Temperature Accord, each jurisdiction’s annual rainfall quota is frozen to a 2040s baseline, turning precipitation into a tradable allocation. Arbitrator Lin Tan’s routine audit of Hydrological Station 112 on the Tibetan fringe reveals a 3.7‑millimetre excess, a discrepancy that should not exist. Tracing the anomaly to the 2043 baseline revision, she uncovers a delegate’s covert alteration of a key figure from 210 mm to 165 mm, legally depriving the nation and 400 million downstream people of rain for eight decades. As the three dominant consortia prepare to ratify a new allocation cycle using the same falsified baseline, Lin must restore the true numbers before the signing ceremony seals the injustice into the soil on both sides of the rain line.", "total_words": 52112, "chapters": [{"index": 1, "title": "Chapter 1: Millimetres on Both Sides of the Rainline", "words": 6714, "paragraphs": ["Mist pressed the plateau into a damp fingerprint, wrapping Hydrological Station 112 on the eastern edge of the Tibetan Plateau. Wind funneled through the pass, carrying the icy scent of pine needles; it hissed softly as it slipped through the nasal passages. Gravel crunched under boot soles with a fine “shh‑shh,” and the fingertip’s contact with the probe sent a micro‑vibration through the palm, like a slender nerve pulsing in the hand. Lin Tan inhaled air tinged with rust, the old ache on the inner side of her right knee flaring faintly. She deftly tore a transdermal analgesic patch from her pocket, pressed it onto the knee, and brushed her fingertips over the worn metal clasp on her cuff—an imprint left by the arbitration ten years ago. The adhesive stiffened in the cold, delivering a brief, cool sting before body heat softened it, as if a rusted key were being slipped back into a familiar lock.", "She withdrew the W‑12 Portable Laser Raindrop Spectrometer from her pack; the screen glowed a pale blue, counting down three seconds for calibration. The probe locked onto the baseline points on either side of the rainline; the laser beam cut an invisible line through the mist, as though carving an ultra‑fine incision in the air. The reading settled at **112.3 mm ± 0.12**. Lin Tan murmured, “Reading 112.3 mm, error 0.12, conforms to .” The biometric pen in the lower‑right corner of the display flashed; heart‑rate sync confirmed, fingerprint and heartbeat dual‑auth passed, a green check flickered on the retinal projection. The instrument’s internal fan emitted a low hum, like a slumbering beast breathing; each rotation dispersed a faint warmth into the surrounding chill. The vibration traveled through the metal housing to her palm, a subtle electric tingle at the fingertips, echoing a heartbeat inside the metal.", "The rainline lay right here: to the north the soil was loose, gravel mixed with fine white quartz powder that felt like crushed glass between the fingers; a thin gray‑white dust slipped through the gaps and drifted on the wind. Only a step to the south, the red earth was wet and sticky, the scent of moss rising sharply; fingertips sank into the mud, pulling out a cool thread of slurry that stretched like ancient glue. Lin Tan collected three samples on each side, writing the data to local cache and noting “traceability required” in the remarks. The virtual keyboard responded with crisp, decisive taps; each keystroke pulsed a faint blue light on the screen, as if timestamping every millimetre recorded. The sample caps clicked shut with a soft “click,” the metal threads biting tightly in the cold, a faint tingling numbness spreading through the fingertips.", "The instrument’s micro‑vibration traveled up her arm to her shoulder; Lin Tan’s right knee throbbed more sharply with each crossing of the rainline. She habitually drew a “∟” gesture on the display before closing a case, the knuckles clicking softly, and the mantra followed: “Millimetres don’t lie.” Data does not speak; she only reads numbers, reports errors, cites clauses. The knee pain is a fine needle, each flexion and extension reminding her that measurement is not abstract digits but the compromise of bone and tendon under physical law. Between breaths, mist coiled overhead, cold air seeping through the collar, raising a fine stippling of gooseflesh on her skin.", "She returned the spectrometer to her pack, fingertips brushing the metal clasp on the cuff; the cold touch recalled the arbitration a decade ago: a friend’s district had its quota frozen for three years because she had privately corrected the reading upward by 0.2 mm, a fact still unknown to anyone. The knee’s ache reminded her that every crossing of the rainline exacts a price for that decision. The nylon strap of the pack cut a shallow groove across her shoulder, a silent contract reminding her that each measurement repays the data’s debt with flesh. Wind tore the distant pine roar into fragments, mingled with a low metallic groan, as if the entire range were murmuring over that tiny deviation.", "An encrypted message popped up on the screen, sender tagged “Old Chen.” The brief text bore the characteristic directive tone of the Orbital Scavengers: “Cold Slot window 02:00‑06:00 available, bring the tape.” Lin Tan’s pupils contracted; she drew a “∟” on the display, then froze the gesture mid‑air, knuckles clicking again—this time she did not confirm immediately, letting the cursor hover between “✓” and “∟.” The mist continued to swallow near and far outlines; only the instrument’s fan drone and the deep dull ache in her knee reminded her that the next step would still be decided by millimetres.", "Wind drove the taste of sea salt and ozone into her nostrils; the fan’s low hum trembled against her eardrums. Lin Tan tightened the pack straps, the nylon biting a deeper white line across her collarbone; her fingertip met the cool glass of the screen, like touching a thin sheet of ice. She did not press confirm; instead she raised her wrist, letting the blue watermark of the Programmable Quota Card flicker in the fog—annual quota 1200 mm, remaining 312 mm, the numbers projecting faint blue specks on her retina that brightened and dimmed with each breath. The specks refracted tiny rainbows in her pupils, as if every millimetre were quietly calculating the balance of survival.", "“Old Chen, received,” she whispered into the comm, voice shredded by the wind. “Cold Slot window 02:00‑06:00, tape in the side pocket. Send coordinates.” A harsh, metallic laugh crackled back, laced with the Scavengers’ signature electronic screech: “Don’t let the knee slow you down, Lin Tan. Numbers won’t lie for me, and the track beneath my feet won’t wait.” The link cut; an encrypted coordinate string appeared, a red dot tracing a slender arc across the fog‑veil toward the seventh maintenance shaft of the abandoned maglev hub. The red point left an afterimage on her retina, like an un‑drawn thorn reminding her that every step ahead had been precisely measured.", "The dull knee ache sharpened with each deep breath, as though a fine nail were driven beneath the patella; every flexion and extension reiterated that measurement is not abstract numbers but bone and tendon compromising under physical law. She shoved the spectrometer deep into the pack, fingertips contacting the cold metal shell of the tape; the chill climbed the fingers, up the arm, to the scapula. Wind scrambled the light spots of the holographic billboard, blue glare stitching the fragmented characters “Revisit 2035” across the grey‑white sky, mocking everyone still bargaining over millimetres. The projection flickered in the mist, its halos refracting into broken geometry within her pupils.", "Lin Tan regulated her breathing; the knee emitted a muted clunk, like old gears meshing. She took the first step, boot sole grinding on the north side’s loose quartz powder, the grit whispering “shh‑shh” beneath the tread, then crossed the invisible rainline; the south side’s wet red earth instantly clung to her ankle, mud pulling fine threads that wrapped around her trouser cuff. Each step repays the data’s debt with flesh; each flexion pays for the unauthorized 0.2 mm correction ten years ago. The musk of mud mingled with the dry scent of quartz, forming a composite odor unique to this rainline.", "The distant maglev’s low roar rolled over again, electric hiss blended with sea‑salt tang drilling into her ears. Lin Tan switched off the quota‑card projection; the blue watermark vanished into the mist, leaving only the faint glow of her fingertip suspended between “✓” and “∟,” a star that could extinguish at any moment. She glanced down at her knee; the deep dull ache persisted, reminding her: the next step, too, will be decided by millimetres. Mist coiled around her feet, as if trying to swallow every millimetre of distance, yet her footprints alternated clearly on the two sides, sharply etched into the damp soil."]}, {"index": 2, "title": "Chapter 2: The Condensation Water Ledger of the Dry‑Zone Village", "words": 7329, "paragraphs": ["Night wind funneled in from the mouth of the valley, carrying a briny salt‑frost taste mixed with the monotonous tapping of the condensation towers—like fingernails rapping a row of empty tin cans, each strike blooming into a fine echo in the thin mist. Lin Tan locked her exoskeleton’s micro‑motion mode to low frequency; the analgesic patch on the inner side of her knee softened slightly under body heat, yet a dull ache persisted, reminding her that every crossing of the Rainline was a debt paid in bone. She felt the worn magnetic tape in her pack’s side pocket, its frayed edges exposing copper wire; her fingertips traced the faint ridges of the data grooves, the sole physical evidence of the 0.2 mm upward correction she had made a decade ago. The wind also bore a hint of rusted iron, the scent of abandoned orbital sleepers leaching rust in the damp night, crawling up the nostrils and settling in the throat so that every breath tasted of cold metal.", "The Dry‑Zone Village lay fifteen kilometers south of the Rainline, a cluster of low, blocky modules welded from discarded shipping containers that looked like forgotten building blocks under the stars. Their roofs were sheathed in thin‑film photovoltaics; nocturnal radiative cooling forced atmospheric vapor into fine beads that slid down the condensation towers’ guide channels into storage bladders. Lin Tan moved along the narrow corridor into the village heart, her boots crushing compacted saline‑alkali soil that whispered a soft “sh‑sh” with each step. First came the dry quartz dust in the nose, then the damp, rotten‑moss odor—an abrupt inversion of soil and air that occurred within a single stride across the Rainline. Faded graffiti flickered on the walls in the dim light; a few lines of coordinate numbers had been sand‑blasted into illegibility, only the latest version number still barely legible.", "Aya stood beside a condensation tower, clutching a yellowed slip of paper, her fingertips dusted with moldy paper fibers. She was the village’s leader and the only one who could read the handwritten “Rainline coordinate / Baseline version.” Seeing Lin Tan approach, Aya said nothing, simply handing over the slip. On the back, faded ink read: “V‑3.1 165 mm.” Lin Tan took it, feeling the coarse paper; her pulse synced with the biometric pen’s sensor, and the display still showed **112.3 mm ±0.12**. She whispered, “Reading 112.3 mm, error 0.12, within Rainline standard.” Her knuckles clicked faintly, the habitual mantra following: “Millimeters don’t lie.” A thin smear of pale yellow grease lingered at the slip’s worn edge—the residue from the last time Aya had lubed the tower’s bearings with discarded grease; a touch revealed the slick film.", "Villagers formed a half‑circle, their eyes holding no anger, only a numbness locked inside numbers. Every doorway displayed a travel credential, a blue watermark glowing faintly in the night: “Annual Quota 1200 mm, Remaining 312 mm.” Lin Tan withdrew 0.5 mm from her quota card and pressed it into Aya’s palm, fingertips brushing the cold plastic edge; a sour guilt rose—she knew the amount was merely a rounding tail in the ledger, yet enough for a child to swallow one more sip of synthetic protein paste. The Insurance Consortium’s remote audit probes blinked atop the towers, a red beam sweeping the data stream every few seconds, confirming each droplet entered the Carbon‑Meter Dual‑Unit Ledger. The probes’ high‑frequency whine sounded like mosquitoes circling ears; villagers instinctively shrank their necks, but none dared protest.", "Aya murmured, “The archive still has magnetic tapes; the old curator guards the original signed footage.” Before the words faded, a distant maglev pilgrimage bus horn sounded, a low electric hum piercing the mist. The carriage’s advertisement flickered in the darkness: “Revisit 2035, Witness the Last Streetlamp of Rising Seas.” The bus moved one‑way into the abandonment zone; its interior reeked of rust and damp mold, while outside abandoned high‑rises jutted like skeletons against the sky. Lin Tan watched the taillights dissolve into the Rainline’s shadow, traced a “∟” gesture on her screen—knuckles clicking again—then changed it to “✓,” shifting the semantics from “confirm” to “witness.” The cursor trembled faintly in the night, as if responding to some inner oath.", "She slipped the tape back into her pack; the zipper’s teeth meshed with a crisp snap in the silence. Her knee stabbed again, a reminder that the road ahead still demanded crossing more invisible lines. Far off, an orbital scavenger shift wrestled with 38 °C heat inside its pod; coolant alarms flashed red, fragment‑capture metrics deciding next year’s Cold Slot priority. Lin Tan regulated her breathing, activated the exoskeleton, and stepped toward Gate 7’s Cold Slot entrance. The saline‑alkali soil crunched under the exoskeleton’s micro‑vibrations, a fine brittle sound like the earth quietly tallying the cost of each step.", "The metal grille at the Cold Slot entrance shuddered in the night wind; the air tasted of ozone and stale grease, a metallic bitterness on the tongue. The exoskeleton’s joints emitted a low hydraulic hiss; the footplates crushed the soil into a fine powder, each step accompanied by a soft “click‑clack” resonating against the eardrums. Lin Tan looked up; a holo‑screen projected a pale‑blue quota ledger into the mist: “Annual Quota 1200 mm, Used 888 mm, Remaining 312 mm,” the numbers pulsing under the red scan like a heartbeat. She instinctively pinched her fingertips; knuckles clicked once more, a quiet mantra: “Numbers won’t lie for me.”", "“Pass.” A rasping electronic voice issued from the gate, the sound refracting in the metal conduit into a shrill whine. Lin Tan tapped her quota card to the sensor; the blue watermark lit, the 0.5 mm tail deducted and written into the ledger instantly, the screen flashing “Confirmed ✓.” A chill of plastic brushed her fingertips; the familiar sour guilt surged again—this tail was only a rounding artifact in the ledger, yet it could buy Aya another sip of synthetic protein.", "“Don’t rush, there’s a mag‑rail checkpoint ahead.” A low male voice came from behind, scented with machine oil. Lin Tan turned to see a scavenger in a worn radiation‑shield coat, a still‑smoking coolant pipe in hand, his face etched with wrinkles from years of heat. He offered the pipe: “Take it; keep the coolant alarm from locking you inside.”", "Lin Tan accepted, feeling the faint sear of the metal surface; her brow furrowed then relaxed, knuckles clicking again. She slotted the pipe into the exoskeleton’s heat‑sink; the hydraulic pump’s whine steadied, the red alarm died, green light glowed. The maglev rail beneath her feet emitted a low‑frequency vibration, a giant’s heartbeat propelling her forward through the gate, into the precisely calculated Cold Slot where every meter was logged as a “Carbon‑Meter” cost. The pilgrimage bus’s taillights had long vanished into the Rainline; only a faint blue glow at the rail’s end trembled in the night wind, a promise awaiting the next witness who would count millimeters into bone and blood.", "The mag‑rail checkpoint’s gate glowed a ghostly blue in the fog; the scanner’s red line swept over Lin Tan’s exoskeleton, emitting a short “zzt—” electric snap, then the screen read “Carbon‑Meter 0.12 mm, Quota Synced.” She felt the invisible magnetic field cradle her spine like an unseen hand; each pulse pressed the deep knee ache into a more solid weight. The scavenger returned the coolant pipe to his belt hook, fingertips sparking faintly on the metal clasp, wiping condensed oil‑sweat from his cheek.", "“Will the quota last till next season?” he asked, his voice resonating low in the conduit, tinged with oil and ozone. Lin Tan didn’t raise her head; she merely clicked her knuckles again, the numbers flashing before her eyes: “Remaining 311.5 mm, just enough to get Aya into the next synthetic‑protein tier.” She tapped her quota card to the secondary sensor; blue light flared, another 0.3 mm deducted, the ledger gaining a line “Witness ✓.”", "Ahead the Cold Slot curved into darkness, its surface glazed with a thin frost; the magnetic field ground the saline‑alkali soil into fine sand, each step a soft “sh‑sh” like the earth quietly bookkeeping. In the distance the maglev pilgrimage bus horn sounded again, its advertisement blinking in the night: “Revisit 2035, Witness the Last Streetlamp of Rising Seas.” The taillights were swallowed by rain, leaving only that faint blue glimmer at the rail’s terminus, trembling in the night wind, waiting for the next person who would tally millimeters into flesh and blood."]}, {"index": 3, "title": "Chapter 3: The Musty Smell of the Archive and the Magnetic Tapes", "words": 6434, "paragraphs": ["A thin layer of must drifted through the air of the underground constant‑temperature vault, like aged paper pulp fermenting slowly in damp darkness, mingling with the low hum of the tape drives that seeped through the ventilation ducts into Lin Tan’s nostrils. She stood on concrete painted with anti‑static coating; a faint chill rose through the soles of her shoes. When her fingertips brushed the edge of a metal shelf, a dry, gritty roughness scraped across her skin — the accumulated “time dust” of hundreds of thousands of magnetic tapes kept at a steady 20 °C and 35 % humidity. A few old sodium lamps hung on the walls; their halos congealed into pale yellow mist in the air, illuminating the narrow gaps between shelves and the fine gray dust clinging to Lin Tan’s cuff.", "Old Curator Guan Qiming sat on a mottled iron chair, a vintage optical magnifier perched over his left eye, yellowed paper fragments stuck to the fingertips of his right hand. He rubbed them gently, producing a soft “shhh” sound. He did not look up, eyes fixed on the tape reader still turning before him. The screen flickered with version **V‑3.1**, timestamp frozen at **2043‑06‑17 14:23**. Inside the machine the rollers rotated slowly amid a faint electrical whine; the oxide layer at the tape’s edge glowed a ghostly blue beneath the read head, as if an ancient pulse were beating weakly in the dark.", "“Paper does not lie, and magnetic tape does not lie either,” he murmured, a barely perceptible tremor in his voice, as though confirming it to himself as much as to Lin Tan. The words were swallowed by the machine’s hum, leaving only the outline of his moving lips visible in the lamp light.", "Lin Tan withdrew the biometric fingerprint pen from her pocket; its tip glowed faintly, fingerprint and heartbeat flashing in sync. She pressed the tip to the reader’s authentication port. The screen displayed **“Identity confirmed ✓”**, then she traced the fixed **「∟」** gesture on the display, a faint click sounding from her knuckle. She offered no extra words, only the professional mantra: “Millimetres do not lie.” As her fingertip touched metal, a weak static charge crawled up her wrist, recalling the chill of the first time she had gripped this pen in the lab.", "“The Three Great Blocs are already pressuring me,” Guan Qiming’s voice dropped, a suppressed rasp. “They want me to destroy this reel, claiming the ‘version is archived, no need to retain.’ But I still hold an unpublished checksum node they don’t know about.” He pointed toward the server array behind him, his fingertip brushing a row of blinking green LEDs; the light fractured into tiny rainbows in the crevices of his nails. “The carbon ledger’s write process requires a double‑blind signature. If I upload the original footage now, the ledger will automatically flag ‘disputed version,’ triggering the climate‑mutual‑destruction condition .”", "Lin Tan paused; the old injury on the inner side of her right knee throbbed in the humid air. She instinctively pressed the analgesic patch; the lifted edge of the adhesive hissed softly at her fingertips. Then she reached out and lightly tapped the metal casing of the tape drive, feeling a subtle vibration travel through her fingertips to her palm, like a heartbeat resonating inside steel ribs. She knew that only before the Cold Slot’s cooling window opened could this data be written to the distributed verification nodes, forcing the Three Great Blocs to halt the 27th dial turn within the forty‑eight‑hour veto window.", "“I will not upload the data to the Blocs’ servers,” Lin Tan said, voice steady, eyes on Guan Qiming’s dust‑speckled fingertips. “Only to the distributed verification nodes, co‑signed by you and me, producing an immutable hash. What follows belongs to the Arbitration Tribunal’s procedure.” Her tone carried no inflection, yet each syllable seemed etched into the magnetic domains of the tape amid the machine’s low drone.", "Guan Qiming finally lifted his head; the eyes behind the magnifier were sharp as blades, a weary smile tugging at the corner of his mouth. “Good. The Cold Slot window runs 02:00‑06:00, the cooling slots allotted to us for only four hours. You take the tape; I’ll align the read head with the original signature footage. As long as we keep the engineers from shoving the tape into their proprietary channel, the ledger will speak for itself.” A bitter humor laced his words, as if resisting some unspeakable fate.", "The two faced each other in the humming gloom; the musty scent seemed to thicken, as though every mote of dust recorded the weight of this transaction. Lin Tan slipped the tape cartridge into her personal radiation‑shielded case; the lid thudded shut with a dull thump, like a vow settling into metal. The foam lining protested with a faint “creak” under the pressure.", "The drive’s rollers suddenly accelerated, releasing a sharp metallic screech that sliced the silence. The screen flashed, green characters dancing on black: **“Version V‑3.1 original signature footage 2043‑06‑17 14:23.”** The cursor blinked after the line, a patient eye awaiting instruction, quietly watching the seventeen‑year‑old truth wait for the next dawn’s Cold Slot window to be inscribed onto the ever‑remembering carbon ledger.", "Before 02:00 the drive’s fans surged, a blast of cold air raking across Lin Tan’s cheekbones like a keen scraper, carrying a metallic tang of ozone and lubricant into her nose. She pressed the shielded case against her thigh; the thermal paste on the case warmed slightly against her skin. Through the thin carbon‑fiber layer her fingertips could still feel the faint indentation on the cartridge’s edge — the verification code Guan Qiming had etched by hand seventeen years ago, a wound that never healed.", "Guan Qiming’s fingers hovered above the read head, flecks of solder from last week’s server teardown still lodged under his nails. He stared at the screen; each blink of the green cursor elicited a heavy “clunk” from the server racks, as if they were swallowing something massive. His Adam’s apple bobbed, a hoarse laugh escaping his throat: “Three more minutes until the cooling slots fully open. Don’t let your knee buckle then.”", "Lin Tan did not reply, only pressed the analgesic patch tighter against her inner knee; the adhesive hissed faintly in the damp air, a silent protest. She sensed the foam inside the case slowly rebound under pressure, each rebound accompanied by a soft “creak,” reminding her that time waits for no one.", "The countdown on the screen ticked from 03:58 to 03:57. In the distance the Cold Slot’s vent valves let out a low pneumatic roar; liquid nitrogen expanded instantly, white vapor climbing the metal grilles and frosting into delicate crystals on the walls. Guan Qiming slammed “Write.” Data streamed through the fiber like liquid mercury; the carbon ledger’s double‑blind signature module lit two rows of red text: **“Disputed version·Pending arbitration.”**", "The musty odor was diluted by ozone, leaving only the monotonous drone of machinery and the two’s rapid, restrained breathing. Lin Tan watched the cursor halt on the final line, her fingertip brushing the case’s edge; the micro‑vibration transmitted to her fingertip synced like a heartbeat — two minutes of the four‑hour window already elapsed, the countdown **47:59:12** still whispering in her ears. Suddenly the case’s latch jammed; the lid lifted a fraction, revealing an unregistered tape, its edge bearing a faded handwritten label: **“Spare.”** Guan Qiming’s fingertip hovered over the latch, lips moving, but only half a sentence escaped: “If this reel…”"]}, {"index": 4, "title": "Chapter 4: The Orbital Scavengers' Cold Slot Window", "words": 6170, "paragraphs": ["The coolant pipes lining the bulkhead thrummed with a low, muffled pulse in micro‑gravity, like a restrained heart striking the metal cavity beat by beat. Red alarm lamps flashed twice per second, bleaching the capture sensors on Old Chen’s right‑arm prosthesis a sickly white. The air reeked of ozone mixed with overheated lubricant, a metallic scorch that turned every breath into a soldering iron shoved up the nostrils, searing the mucosa and slipping down the trachea into the lungs. The analgesic patch stuck to Lin Tan’s knee hissed faintly beneath sweat‑slick skin; the old injury on the inner side of her right knee throbbed dully with each微振 of the hull, reminding her that a full decade had passed since she last crossed the Rainline.", "She pressed her fingertips against the condensation layer on the bulkhead, feeling a thin veneer of cold—a silent reminder that the temperature here forever hovered on the knife‑edge of criticality. The air‑circulation pump droned at a low frequency, laced with the faint metallic grit left behind when the particulate filters were swapped, a scent identical to the embers left after cutting titanium alloy in a ground‑side maintenance bay. Lin Tan closed her eyes, trying to separate that odor from the mossy, brine‑laden air of the Rainline’s southern fringe ten years ago, only to find the two intertwining deep in her nasal passages into a single texture of memory: damp cold soil, fermenting leaf litter, the faint sweetness of dew condensing on distant vapor.", "“Cold Slot doesn’t wait.” Old Chen’s voice squeezed through the comms, laced with the electric whine of his prosthetic’s motors, delivered at the speed of a well‑rehearsed script, yet its tail carried a barely perceptible weariness: “Capture, lock, withdraw. Thermal budget two megawatts, data upload consumes 1.3, debris task needs 0.9. You write the data to the ledger first; I’ll free 0.4 for the laser capture.”", "Lin Tan didn’t reply. She pulled the Portable Laser Raindrop Spectrometer (W‑12) from a pocket; the probe trembled minutely at her fingertip, the display frozen at **112.3 mm ±0.12**—the last reading she had taken at Hydrological Station 112, still within tolerance. She pressed the biometric stylus to the reader; the screen flashed **“Identity confirmed ✓”**, then she traced the fixed **「∟」** gesture across the glass, joints clicking softly. The data stream slid into the fiber like liquid mercury; the dual‑blind signature module lit up in red: **“Disputed version·Pending arbitration.”**", "The cabin temperature gauge climbed to **38 ℃**; the coolant’s red pulse grew more frantic. Old Chen’s prosthetic sensors shrieked, the capture arm carving a blue‑white streak through vacuum. When the seventh 3‑cm fragment clamped into the jaws, the arm’s joints emitted a dull metallic groan, like a piano string about to snap. He gritted his teeth and growled: “Give me thirty more seconds—thermal valves wide open.”", "Old Chen’s breathing grew ragged in the comms, each inhale accompanied by the hydraulic pump’s hiss inside the prosthesis, fluid hammering against metal walls with a heavy “thud, thud.” Through the viewport Lin Tan saw the starfield sliced into countless fine segments by the debris trails, a torn net where starlight refracted cold, blue‑white edges along fragment rims. She recalled the contrast on the ground: the northern side of the Rainline—dry soil, quartz dust slipping through fingertips, the scent of silica and arid wind, each breath like swallowing a handful of fine sand; the southern side—clammy, moss‑laden, the aroma climbing the nasal passage to the throat, red laterite clinging to soles, every step a viscous resistance. Back then she had slapped a transdermal analgesic patch on the Rainline itself; now, in orbit, the residue of those two smells lingered, as if she had crossed not merely latitude but two entirely different survival logics.", "A terse ground‑control directive crackled over the comms, flat as an automated broadcast: “Thermal‑zone transit credentials verified; Cold Slot window extended to 06:00.” Lin Tan glanced at her Programmable Quota Card: **“Annual quota 1200 mm, remaining 312 mm.”** She logged a single sip’s allowance—**0.02 quota**—in the memo, a reminder that children in the arid villages survived on the **4 L** dripped daily from the Condensation Towers. In micro‑gravity the characters on the screen shivered, like dry leaves stirred by an invisible wind.", "Old Chen’s arm finally locked the last fragment; cabin temperature dropped two degrees, the red glow steadied to a stable amber. He exhaled long, voice unusually gentle: “Data written to ledger, marked disputed version, countdown 47:59:12.” A fleet‑wide crimson alert blossomed center‑screen—**“Baseline tampering detected; dial‑turn authority frozen; countdown 47:59:12.”**", "The alarm’s afterimage burned on Lin Tan’s retina; the old knee injury flared again under the sudden chill, yet she no longer trembled. She withdrew her fingertips, brushing the edge of the hatch; the micro‑vibration synced with her heartbeat. In a low murmur she repeated the professional mantra: “Millimeters don’t lie.”", "Old Chen inserted the probe of his capture arm into the bulkhead maintenance port; a blue‑white arc erupted in vacuum, scattering fine sparks that illuminated the dense lattice of scratches on his prosthetic—each groove a record of a capture, each near‑miss a brush with death.", "“Authority frozen doesn’t mean locked,” Old Chen’s voice carried a metallic rasp. “The Old Curator burned the logs because that mold‑stained scrap of paper hid the true Rainline baseline. Export the disputed version, hang it on backup node 03; I’ll strip the dial’s physical lock.”", "Lin Tan nodded, sliding her fingertip across the quota‑card screen to **“Export‑Dispute‑Node 03”**; the characters wavered in micro‑gravity like dry leaves in an unseen breeze. She spoke into the comms: “9‑A‑4‑F‑7‑C‑2‑E, checksum verified, countdown 47:55:03.” The ground controller’s metallic echo returned: “Received; physical key authorized; Rainline control transferred to backup node; ready to open valve.”", "Old Chen withdrew a titanium‑coated hex rod; the dial gave a heavy “clunk.” Cabin temperature spiked three degrees; the coolant pump’s whine settled into a steady pulse, like a heart rediscovering its rhythm. He tossed the key into his magnetic snap‑box; the lid sealed with a soft magnetic click, a heartbeat in a metal chamber. Lin Tan clenched the quota card, the cold at her fingertips hardening into a firm cadence, syncing with the scarlet countdown burning on her retina. She knew the next forty‑eight hours would see the Rainline rewritten by their own hands.", "The maintenance port still sputtered faint blue arcs; the coolant pump’s low‑frequency pulse faltered for a single cardiac interval, then shuddered at a frequency never felt before—as if the entire orbit held its breath, awaiting the next droplet’s landing. Old Chen turned, eyes reflecting that weak blue glow, voice low: “The Rainline is breathing; we decide where the next drop falls.” Lin Tan offered no answer, only pressed the quota card against her chest, feeling the metal’s chill seep into her palm, the countdown ticking on, red numbers blazing across her vision."]}, {"index": 5, "title": "Chapter 5: The Insurance Actuary's Probability Model", "words": 6821, "paragraphs": ["Cold air seeped from the holo‑wall, carrying a faint scent of ozone and metal coolant, like a thin frost settling on Lin Tan’s nostrils. The blue quota‑card watermark flickered in mid‑air, projecting “Annual Quota 1200 mm, Remaining 312 mm” as specks of light that refracted in the air; a low‑frequency hum throbbed through the floor like a heartbeat, vibrating the bones of her feet. She stood before the floating exchange‑rate wall at the Insurance Consortium headquarters, fingertips hovering over the holo‑keyboard. The old injury on the inner side of her right knee tightened with the draft from the vents; the analgesic patch on sweat‑damp skin emitted a faint “hiss,” the peeled corner of the tape turning cool and tacky under her touch. Above, the holo‑assembly line scrolled silently; the data stream of the Carbon‑Meter Dual‑Unit Ledger wound like liquid mercury across a dark‑blue background, each pulse accompanied by a barely audible electric chirp, as if the whole building’s breath had been compressed into these few cubic metres of air.", "The faint data‑stream line above Xue Lan’s right eyebrow shifted from cyan to violet with her heart rate, the light band pulsing on her brow and revealing a barely perceptible weariness in her eyes. Her voice was as flat as a actuarial table, devoid of affect, only cold logic: “Risk can be priced; life cannot.” The screen displayed the “Uncounted Survival Probability Model”; the curve formed a steep inflection at a 12 % mortality decline, a red shadow region like a fissure devouring the surrounding blue baseline. Lin Tan did not reply; she simply drew the Portable Laser Raindrop Spectrometer (W‑12) from her pocket. The metal casing warmed her palm, the probe trembling slightly at her fingertips. The readout locked at **112.3 mm ± 0.12**—the last reading she had taken at Hydrological Station 112, the error band still within the allowable range . She pressed the biometric stylus to the reader, feeling a faint electric sting at the tip; the screen popped up “Identity Confirmed,” and she traced the fixed “∟” gesture on the surface, knuckles clicking softly like a precision gear engaging.", "“Reading 112.3 mm, error 0.12, within standard.” Lin Tan’s tone was flat, as if reciting a physical constant; her voice stretched and flattened in the holo‑wall’s echo until only pure numbers remained. Xue Lan’s pupils contracted slightly in the projection; her fingertip slid across the suspended exchange‑rate table, the jurisdictional‑arbitrage platform’s rate ticking once per second, the Carbon‑Meter Dual‑Unit Ledger silently crunching in the background, numbers flowing like an unseen river surging underground. She finally spoke, each word precisely segmented: “The model shows that if the 2043 baseline is corrected from 165 mm back to 210 mm, U‑Class mortality drops 12 %, but it would trigger a rain‑theft ruling , freezing the zone’s quota for three years and even revoking its orbital Cold Slot eligibility.”", "Lin Tan did not glance at the rate table; her gaze settled on a discarded Condensation Tower model in the corner. The tower’s rust‑mottled body dripped at night like taps on an empty can, as though the damp, moldy scent still clung to her fingertips. She repeated quietly, a barely audible tremor in her voice: “Millimeters don’t lie.” Xue Lan fell silent for a moment, then entered a string of commands on the holo‑keyboard. The screen flashed “Disputed Version·Mark,” the model locked to “Pending Arbitration,” automatically pushed to the Carbon Ledger and entered onto the Dynamic Baseline Agenda. The light band on the holo‑wall shifted to amber; a low prompt tone pulsed like a heartbeat in the air.", "“Marked.” Xue Lan’s micro‑light pattern returned to cyan, the violet at her brow receding, leaving only a calm teal. “The Insurance Consortium will recalculate compensation per the new version; quota cards refresh next week.” She paused, her gaze brushing the analgesic patch on Lin Tan’s right knee, lingering half a second on the lifted edge of the tape. “You have 12 hours; the Arbitration Tribunal live countdown.”", "Lin Tan pocketed the spectrometer, fingertip sliding over “Remaining 312 mm” on the quota card, feeling the card’s subtle texture. She tapped “Export‑Dispute‑Node 03” in the memo field. The characters shivered in micro‑gravity, like dry leaves stirred by an invisible wind; each stroke produced a faint static crackle. She confirmed in a low voice, a ritualistic calm in her tone: “Uploaded, checksum 9‑A‑4‑F, countdown synced.”", "A crisp female voice from ground control crackled through the comms, its timbre sharpened by layers of encryption yet retaining a metallic edge: “Received. Arbitration Tribunal live countdown 12:00:00. Chief Arbitrator Hermann’s biometric fingerprint ring flashing; screen reads ‘Awaiting Final Signature.’” The words vibrated against Lin Tan’s eardrums, each syllable striking a precise gear in her chest.", "Lin Tan clenched the quota card; the cold at her fingertips no longer stung but felt like a lock finally engaging the next forty‑eight‑hour gear. She sensed sweat evaporating on the metal, leaving a thin salt crust that rose with her breath and merged into the endless data torrent of the holo‑wall. The distant floating exchange‑rate wall continued its silent jump; the Carbon‑Meter Dual‑Unit Ledger’s digits blinked like a persistent heartbeat, while she stood in the interstice of light and shadow, awaiting the next judgment.", "Lin Tan’s breathing became audible within the amber light band on the holo‑wall; the micro‑gravity air carried a faint ozone tang mixed with the iron‑rust scent seeping from the Condensation Tower model, threading into her nostrils and sliding down her throat. Xue Lan’s fingertips remained poised over the keyboard, the teal pattern pulsing with a faint electric murmur, like a heart beating in fiber optics. She did not raise her head, only directing her gaze to the abandoned tower in the corner; its rust stains glowed a dark crimson halo under the light band, the rhythmic drips still striking the hollow can, each drop a metronome for the impending verdict.", "“Arbitration Tribunal feed connected.” The female voice cut in again, a barely perceptible quiver in its metallic timbre. “Chief Arbitrator Hermann’s biometric fingerprint ring has completed dual verification, awaiting final signature. Both parties confirm version lock within thirty seconds.” The voice sliced through the pulsing Carbon‑Meter Dual‑Unit Ledger on the holo‑wall, cleaving the river of numbers in two.", "Lin Tan lowered her eyes, pressing the pad of her finger onto “Remaining 312 mm” on the quota card; the card’s micro‑grooves sparked a fine series of static discharges at her tip. She re‑checked the memo entry “Export‑Dispute‑Node 03,” the checksum 9‑A‑4‑F trembling in micro‑gravity like dry leaves in an unseen wind. Xue Lan’s pupils contracted in the projection; the teal pattern flashed once, then settled back to calm cyan: “Version locked. Disputed Version·Mark written to Carbon Ledger ; Dynamic Baseline Agenda synced.”", "The countdown on the holo‑wall ticked down in amber numerals, 12:00:00 → 11:59:57, each second accompanied by a deep prompt tone resonating like a heartbeat in a metal cavity. Lin Tan felt the salt crust on her palm evaporate, cold air slipping through her fingers, carrying away the last hesitation. She lifted her head, gaze piercing the intersecting light and shadow to the distant floating exchange‑rate wall—numbers still jumping silently, the Carbon‑Meter Dual‑Unit Ledger’s pulse unbroken.", "“Sign.” Lin Tan’s voice was hoarse, edged with a metallic resonance; her fingertip brushed the “Confirm” key on the quota card, a burst of static crackling at the tip. Xue Lan’s micro‑light flared a blinding cyan‑white, then fell into stillness. The holo‑wall’s light band snapped to deep blue; the Arbitration Tribunal live feed expanded, Chief Arbitrator Hermann’s biometric fingerprint ring pulsing at the centre of the screen, waiting for the final signature to fall."]}, {"index": 6, "title": "Chapter 6: The Arbitration Tribunal’s 48‑Hour Gambit", "words": 5652, "paragraphs": ["Cold air seeped from the holo‑walls, carrying the scent of ozone and metal coolant into the nostrils, a thin frost clinging to Lin Tan’s skin; a low‑frequency hum rose from the floor, vibrating the bones of her feet, and a faint static prickle tingled at her fingertips when they brushed the edge of the signing screen. A stale rust odor still drifted in the air—the mildew‑laden breath that had accumulated for years inside the Maglev Pilgrimage Bus cabins of the Abandoned Zone, slipping through the ventilation ducts into the conference room, reminding every hand on the dial that the land beyond the Rainline had long since cracked into a salt crust.", "The room was oval. A real‑time Rainline projection hovered at its center, blue‑green contour lines trembling with each data pulse. Engineers from the Three Great Blocs, GTTO auditors, and Insurance Consortium actuaries formed a circle, each a biometric fingerprint ring glinting coldly on their knuckles. Chairman Hermann sat at the head, the ring on his left ring finger pulsing with his heartbeat, his right index finger tapping the table in a crisp “click‑click,” as if timing the imminent double‑blind signature. Data chips scattered across the tabletop condensed tiny droplets in the chill, refracting the hidden fiber‑optic array overhead.", "An old ache in Lin Tan’s right knee tightened with the draft; the analgesic patch hissed against sweat‑slick skin, a curled corner turning cool and tacky under her fingertip. She withdrew the Portable Laser Raindrop Spectrometer (W‑12) from her pocket; its metal housing radiated a faint residual warmth, the probe trembling minutely at her fingertip. The display froze at **112.3 mm ± 0.12**—the last reading she had taken at Hydrological Station 112, still within the tolerance band. She pressed the biometric stylus to the reader, feeling the faint current bite, and the screen flashed **“Identity confirmed ✓.”** With a practiced motion she drew the fixed **「∟」** gesture; the joints clicked like a precision gear meshing.", "“Reading 112.3 mm, error 0.12, compliant with .” Lin Tan’s voice was flat, a recitation of a physical constant, stretched and flattened by the holo‑wall’s echo until only pure numbers remained.", "Chairman Hermann’s gaze swept the three delegations, his cadence measured: “Authorization chain **** has completed double‑blind signing; the log is written to the carbon ledger. The 27th dial‑turn window has 48 hours remaining; any party that issues two consecutive vetoes within 48 h will trigger **** climate mutually assured destruction.” His tone was mechanically even; a swipe of his fingertip across the ring shifted its light band from cyan to violet.", "North American Federation engineer Mark spoke first, fingers dancing across the holo‑keyboard: “We submit a veto on the grounds that Baseline version V‑3.1 shows signs of tampering; the dial must be halted until archive verification is complete.” A red line appeared on the screen: **Veto 1/2**.", "Eurasian Alliance auditor Ye Lin frowned, fingertip hovering over her ring before confirming: “Agree to the pause; require original magnetic‑tape upload to the ledger within 24 hours.” A second red line lit: **Veto 2/2**.", "East Asian Synergy actuary Sun Hao fell silent for three seconds, fingertip suspended above the confirm key, micro‑data streams flickering across his brow. He murmured, “Further delay will miss this quarter’s Cold Slot auction; the compute‑standard exchange rate would swing more than 7 %.” He finally pressed; **“Pending confirmation”** replaced the third red line.", "A dull throb rose from the depths of Lin Tan’s right knee; the patch’s adhesive curled further in the sweat. She inhaled sharply, palm sweat evaporating on the metal, leaving a thin salt film. The holo‑Rainline drifted before her eyes; the ±0.5 mm contour at the blue‑green border rose and fell like breath.", "Ten years earlier flashed in memory: at Station 112 she had altered a reading from 112.5 mm to 112.3 mm so a friend’s district could gain an extra 0.2 mm Quota. That season the district was ruled “over‑quota,” its fields frozen for three years; the friend lost the entire harvest to drought. What she heard then was not protest but the whisper of wind over cracked earth, a fingernail on a blackboard. Now the same fingertip hovered over the same screen, the only differences the knee’s scar and the ticking countdown.", "“Numbers don’t lie.” She repeated silently, then aloud to the holo‑wall: “The data will not deceive me.”", "The countdown in the corner ticked in seconds: **47:59:12**. The carbon ledger’s blockchain‑style log refreshed in sync; each signature emitted a low electronic chirp, resonating through the floor like a heartbeat. Old Chen’s encrypted flash arrived: Cold Slot postponed to 06:30, log uploaded. Lin Tan’s fingertip twitched; the **「∟」** gesture blinked under the cursor, ready to become **「✓」.**", "Chairman Hermann’s ring flared deep crimson. He rose before the projection; the chair emitted a faint metallic fatigue groan. “If consensus is not reached within the remaining 48 hours, the Sunshade Ring will open fully, the Alkalinity Pumps will shut down, and global precipitation will shift instantly by more than 15 %.” His voice reverberated with irreversible finality.", "Lin Tan felt the static bite at her fingertips intensify; the countdown jumped to **47:58:03**. She pressed the W‑12 probe to her forehead; a thin laser traced a line across her retina, as if inscribing a ruler for the coming judgment. The two soil scents of the Rainline’s opposing banks rose simultaneously in memory: dry quartz dust and damp moss, compressed into this cramped room at the same instant.", "The comms crackled again; the dispatcher’s icy female voice pierced the encryption: “Countdown 00:02:17, confirm final signing authority.” Lin Tan drew a breath, tapped the card three times; the screen popped “Sign confirmed·Effective,” the amber band snapping to deep blue, a low chime striking like a bell in her chest.", "The holo‑Rainline froze instantly; the blue‑green boundary ceased its drift. Lin Tan’s fingertip remained suspended over the signing screen, gesture uncompleted. The room held only the deep electronic chirps and the continuous low roar of the HVAC, as if the planet’s hydrological cycle itself had held its breath. A sharp spike of pain lanced from her right knee; the patch finally peeled away, revealing a small swollen patch of skin. She did not reach to press it, merely let sweat trace her jaw and fall onto the cold metal tabletop with a clear **“drip—tap.”**", "The wall projection flickered; the countdown digits shuddered. From afar a low hydraulic valve sighed open."]}, {"index": 7, "title": "Chapter 7: Wind From the Plateau Rift", "words": 6366, "paragraphs": ["Wind poured through the fissure of the plateau into her nostrils—first a cold, iron‑rust breath, then a damp, mossy stench, as if the entire mountain range were breathing softly. Fine grit whispered beneath her boots, and when her fingertips brushed the W‑12 probe a faint vibration climbed her finger bones to her wrist; the screen froze at **112.3 mm ±0.12**—the error band still within tolerance. Lin Tan pressed a pain‑relief patch onto the inner side of her right knee; the adhesive hissed faintly against sweat‑slick skin, and the deep ache in the joint sharpened with every step across the line. She glanced down at the gray‑white dust coating the probe’s housing, rubbed her fingertip across it, feeling the metal’s cool seep into her fingertips, as though the whole plateau’s respiration were concentrated in that single touch. Mist‑laden wind skimmed her ears, carrying a metallic tang of rust and ice; she inhaled involuntarily, the cold air sliding down her trachea, while her fingertips still retained the faint chill from the screen.", "The Rainline was no longer a static contour. In the cloud the algorithm swallowed ten years of measured millimeters, evaporation coefficients from the Carbon‑Meter Dual‑Unit Ledger, and water‑production figures from the Condensation Towers of the uncounted settlements, spitting out a “floating band” that drifted in real time with the measurements. A holographic projection unfolded overhead; the blue‑green boundary swung left and right like breathing, its width swelling from ±0.5 mm to ±2.3 mm before contracting back to ±0.8 mm. Lin Tan watched the band’s edges imprint simultaneously on the soils on either side: the left side dry gravel, the right side sticky red earth, the air scented with quartz dust and moss. She lifted her hand, fingertip tracing the projected edge, feeling the after‑image on her retina—as if she held the climate system’s uncertainty in her palm. The halo at the projection’s fringe trembled at her fingertip, as though each breath rewrote the definition of the boundary.", "Old Chen’s scavenger shift had long ended, yet the coolant’s red warning light still pulsed inside the Scavenger‑7 Pod. An unpublished orbital attitude log arrived via an encrypted channel on Lin Tan’s terminal; the log recorded an unauthorized micro‑adjustment of the Orbital Sunshade Ring, the very tweak that had nudged the floating band northward by 0.07° over the past three months. Lin Tan fed the log into the local node; the screen flashed **“Disputed Version·Pending Arbitration”**, and the Carbon‑Meter Dual‑Unit Ledger automatically stamped a timestamp on the distributed ledger. A low voice message crackled from the comm: “Don’t let those ledger auditors smooth this drift away, Lin Tan. The data will speak.” She didn’t reply, merely dragged the log’s hash into the verification queue, feeling each confirmation’s faint haptic click. A green progress bar crept forward like a heartbeat echoing in the silent pod.", "In the archive’s cryogenic vault the tape reader growled. Guan Qiming, magnifying lenses perched on his nose, fingertips dusted with the musty scent of old paper, uploaded the original signed footage of the 2043 V‑3.1 version onto the chain; Li Wei completed verification. Within seconds the data streams converged into a new baseline curve, and the floating band’s central line lifted slightly, like a rope gently hoisted. Guan Qiming raised his head, glasses reflecting the screen’s blue glow, and let out a rasping sigh: “Finally history has been returned to itself.” The air was thick with the mingled odor of aged paper and ozone.", "At the same moment the Insurance Consortium’s claims model detonated. Xue Lan’s holographic watermark flickered across the conference‑room walls; a crimson probability cloud swallowed the entire plateau sector, warning that adherence to the old baseline would raise the uncounted’s mortality rate by 12 % over the next decade. The platform city‑states’ Programmable Quota Card terminals refreshed simultaneously, annual quota dropping from 1200 mm to **1080 mm**; remaining balances jumped on every household display, and each resident’s water cup—roughly 0.001 quota per cup—emitted a soft “ding” at the instant of refresh. Xue Lan’s voice seeped from the projection, edged with a metallic reverberation: “This is the price we must pay, Lin Tan. Don’t let the numbers decide for us.” Lin Tan stared at the pulsing red cloud on the wall, fingertips tightening until nails bit into her palm, a sharp sting flaring; a thin film of sweat and quartz dust melded on her fingertips into a faint gray veil.", "In the night the Condensation Tower of the dry‑zone village dripped, each drop sounding like a tap on an empty can. Aya stood beneath it, clutching a handwritten Rainline coordinate version, the paper’s edge frayed where her fingers had worn it. She watched the floating band breathe overhead, lips pressing into a shallow line, then slipped a one‑way ticket for the Maglev Pilgrimage Bus into Lin Tan’s pocket; the carriage still reeked of rust and damp mildew. Aya’s fingers brushed Lin Tan’s palm, whispering, “Take this. The wind at the next stop will remember you.” Lin Tan gripped the ticket stub, the paper’s roughness intertwining with her sweaty fingertips, a nameless heaviness rising in her chest as if the whole plateau’s weight pressed onto that thin slip.", "Lin Tan withdrew the probe, tapping the confirm key at the screen’s edge. The display popped **“Confirm and Witness”**; the blue‑green frontier locked in that instant, dust scent and damp moss aroma recorded together into the Carbon‑Meter Dual‑Unit Ledger as the first paired synchronous samples of the new baseline. She drew a deep breath of air laced with dust and moss, cold sliding down her trachea, fingertips still cool from the screen, while a thin sheen of sweat—mixed with quartz dust and moss—coated the ridges of her fingerprints like an unset seal. The wind howled in her ears, carrying away an unspoken vow.", "The console fan droned low; coolant flowing through the pipes whispered like distant glacial melt. The conference room’s hologram still hovered, Xue Lan’s watermark rotating slowly on the wall, the red cloud’s fringe tightening under the data stream’s wash. A silver data crystal lay centered on the table, its surface refracting the baseline curve Lin Tan had just confirmed; each inflection point shimmered in the faint light. Lin Tan approached, fingertip grazing the crystal’s edge, feeling a faint static bite—as if an invisible contract left its mark on her skin. The crystal’s weak pulse synced with her heartbeat, a reminder that every confirmation is a re‑signing of the pact.", "Aya’s silhouette appeared in the doorway, still clutching the one‑way ticket, its worn corner catching a dull gold in the light. She said nothing, merely slipped the stub into Lin Tan’s coat pocket, the fabric whispering against her fingertip. Lin Tan looked down; the ticket bore the words **“Witness 2126, the Rainline will breathe from now on”**, ink bleeding into the morning mist as if the text itself were inhaling. Far off, the floating band rippled with a faint glow in the data flow, like a waking vessel ready to redraw the boundary for the next drift. Lin Tan lifted the cup on the table; the screen instantly flashed **“First cup 0.012 quota”** in red, her fingertip trembling at the rim—stay, or leave this sip for the next waiting soul? The wind at the corridor’s end surged sharply, a rising countdown tone forcing her to choose in the next second."]}, {"index": 8, "title": "Chapter 8: The Boundary of Rain", "words": 6626, "paragraphs": ["The morning wind slipped through the window seams of the *Polaris* module, first a dry, cold metallic tang, then a damp, mossy scent—as if two air masses of different temperature were wrestling in the narrow corridor. Lin Tan leaned against the headboard; her fingertips still felt the faint residual vibration of the W‑12 probe, a subtle tremor climbing the phalanges to her wrist, carrying the characteristic chill of an instrument. The old injury on the inner side of her right knee no longer stabbed sharply when she crossed the rainline; the analgesic patch had long been peeled away, leaving only a dull warmth deep in the joint, as though her body had finally learned to coexist with that breathing frontier. She had never activated a longevity subscription; the “Subscription Status: Inactive” line on her medical report still glared, the reason unchanged—the words etched in her heart: *I don’t want to hand the pain in my knee over to an algorithm.*", "The low‑temperature radiator panels on the bulkhead glowed a faint blue, stretching her shadow into a thin silver line. Fine iron filings floated in the air; each breath tasted of rust in the throat, mingled with a faint chlorine seep from the recirculating water pipes. Pressure waves from the circulation pump struck the metal ribs at 0.7 Hz, a heartbeat‑like micro‑tremor she could feel by pressing a fingertip to the pipe wall. She ran her hand along the alloy frame of the bunk, the cold hardness confirming that this spot remained her own, an immutable physical coordinate that could not be remotely overwritten.", "Outside the holographic projection, the floating band drifted northward at 0.03° per hour; the blue‑green interface pulsed like a living breath, its width oscillating between ±0.8 mm and ±2.3 mm. Pixels at the projection’s edge flickered in the dawn light, as if a needle‑fine tip were repeatedly piercing the atmospheric membrane. Lin Tan rose; her exoskeleton emitted a soft hydraulic hiss at the ankles, the gear meshing rhythm resonating inexplicably with her own pulse. She walked step by step toward the small memorial platform at the module’s far end, each footfall leaving a shallow dent in the metal deck—silent coordinates for those who would follow.", "Atop the platform lay a gray‑white stele, inscribed with a friend’s name and the date of the arbitration ten years past. Wind‑erosion had honeycombed the stone’s edges into a fine lattice of pores; fingertips tracing them felt a faint roughness, as though every groove whispered the vows washed by rain yet never forgotten. From her pocket she withdrew a worn metal clasp, its edges smoothed by rain and sweat into a gentle curve; rubbing it produced a faint “shhh” like an ancient oath murmuring at her fingertips. A trace of pale blue fluorescent powder still clung to the clasp’s inner rim—the marker the Arbitration Tribunal had scattered to denote “Rainline Passage Rights”—still glowing weakly in the dim light.", "“112.3 mm.” She whispered the figure, the sound reverberating in the cramped cabin with a barely perceptible tremor. Raindrops began to strike the stele; the first landed in an engraved groove with a clear “ding,” followed by a second, a third, forming thin rivulets that traced the stone’s veins, carrying away dust and the decade’s accumulated guilt. Each impact set off an almost inaudible resonance within the stone, as if the earth itself were answering her testimony. Lin Tan pressed her palm to the stele’s edge, fingertips sensing the cool moisture seeping from the honeycomb pores; the screen automatically logged “Confirmed and Witnessed,” the carbon ledger silently writing a new timestamp in the background. At the same instant, the floating‑band algorithm recorded the scents of the soils on both sides—dry‑land mineral dust and damp moss—into the database, data streams sliding through fiber at light speed, yet leaving a tangible warmth at her fingertips.", "Far off, the Orbital Sunshade Ring trembled faintly in the dawn, its metal struts emitting a fine fatigue creak, like a colossal organism stretching its limbs in preparation for the next breath of the rainline. The ring’s coating shimmered with oil‑slick iridescence; each micro‑vibration sent light spots dancing across the bulkhead, projecting fractured geometric patterns. Lin Tan inhaled deeply; cold air slid down her trachea, mixing dust, moss, iron rust, and damp mold, while her fingertips still registered the probe’s lingering micro‑vibration—as if the planet’s entire hydrological cycle were concentrated in this moment of touch.", "A faint magnetic‑boot scuff sounded behind her, then a low male voice cut through the chill dampness: “Lin Tan, the sensor array on the rainline just reported an anomaly—humidity gradient jumped 12 % in three seconds.”", "She did not turn, merely kept her hand on the stele’s edge, feeling the cool vapor seep from the honeycomb pores, as if confirming an ancient pact. “It’s the old ‘Rainline Passage Rights’ marker leaking,” she said calmly, though a hint of hoarseness lingered. “The fluorescent powder the Tribunal scattered ten years ago seeped into the strata with the rain; geothermal heat is now forcing it back to the surface.”", "The man approached, magnetic boots leaving a faint magnetic trace on the deck, his exoskeleton’s knee joints clicking softly. He was Chen Mo, once Lin Tan’s partner at the Floating‑Band Administration, now head of the Boundary Monitoring Group. His pupils reflected the hologram’s data streams; the old scar on his brow caught a faint rust hue in the morning light. “The data’s already uploaded to the carbon ledger; the algorithm classifies this as ‘natural seepage,’ not triggering the ‘human intervention’ clause.” He paused, swiping a “✗” on his wrist console, his tone weary yet restrained. “But I’ve requested a manual review, citing the still‑active ‘Historical Oath’ clause. W‑12B array sampling at 200 Hz, power draw 0.8 W, error band ±0.3 %.”", "Lin Tan finally turned, her gaze sweeping over the badge on Chen Mo’s chest—a silver raindrop etched into a honeycomb pattern by rain, its rim still dusted with the blue fluorescent powder. She caught his scent: lubricating oil, ozone, and the distinctive damp moss that only years of patrolling the floating band could impart. “Do you still remember the oath?” she asked, fingertips tapping the stele’s surface, each tap stirring an almost inaudible resonance within the stone.", "Chen Mo fell silent for a few seconds; his breath fogged inside his mask before the air purifier whisked it away. “I remember,” he replied quietly, his cadence like a final firmware upgrade to an aging server. “‘As long as the rainline keeps breathing, I’ll be here, guarding this boundary for you.’ But now the boundary isn’t just latitude and longitude—it’s every drop of rain, every gram of carbon, every algorithmic verdict.”", "The distant Sunshade Ring shuddered again; its coating refracted shattered rainbows, light spots dancing on the bulkhead, stretching and twisting the two shadows until they merged into a single blurred line. Lin Tan retrieved the worn clasp from her pocket; the blue glow inside its rim pulsed faintly in the morning mist, like a heart refusing to stop. She fastened the clasp into one of the stele’s honeycomb pores; metal met stone with a soft “clink,” instantly swallowed by the rain’s roar.", "“Review cleared.” Chen Mo confirmed on his wrist console; the screen flashed “Historical Oath Clause Active, Boundary Locked.” The carbon ledger settled in sync; the floating‑band algorithm updated the soil‑scent data on both sides—dry‑land mineral dust and damp moss—and this time the data stream carried an extra handwritten line: *Witnesses: Lin Tan, Chen Mo; the rainline still breathes.*", "Far away, the Orbital Sunshade Ring trembled once more in the dawn, as if readying the next breath of the rainline. const L = {"cover_label": "Title Page & Synopsis", "unit": " chars", "by": "By ", "meta_sep": " | ~", "intro_title": "About this book", "prev": "← Previous", "next": "Next →", "start": "Start Reading →", "ch_prefix": "Chapter ", "ch_mid": " | ", "theme_dark": "☀️ Light Mode", "theme_light": "🌓 Dark Mode"};
let currentIndex = -1; // -1 = title page / synopsis
let fontSize = 17;

function renderSidebar() {
    const list = document.getElementById("chapterList");
    list.innerHTML = `<li class="chapter-item ${currentIndex === -1 ? 'active' : ''}" onclick="goToChapter(-1)">
        <span>📖 ${L.cover_label}</span>
    </li>`;
    book.chapters.forEach((ch, idx) => {
        const li = document.createElement("li");
        li.className = "chapter-item" + (currentIndex === idx ? " active" : "");
        li.innerHTML = `<span>${ch.title}</span><span class="ch-words">${ch.words}${L.unit}</span>`;
        li.onclick = () => goToChapter(idx);
        list.appendChild(li);
    });
}

function renderContent() {
    const wrapper = document.getElementById("articleWrapper");
    const label = document.getElementById("currentChLabel");
    if (currentIndex === -1) {
        label.innerText = L.cover_label;
        wrapper.innerHTML = `
            <div class="article-header">
                <h1>${book.title}</h1>
                <div class="article-meta">${L.by}${book.author}${L.meta_sep}${book.total_words.toLocaleString()}${L.unit}</div>
            </div>
            <div class="intro-box">
                <h3 style="margin-bottom:12px;color:var(--accent);">${L.intro_title}</h3>
                <div style="white-space: pre-wrap; line-height:1.75;">${book.description}</div>
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" disabled>${L.prev}</button>
                <button class="nav-btn" onclick="goToChapter(0)">${L.start}</button>
            </div>
        `;
    } else {
        const ch = book.chapters[currentIndex];
        label.innerText = ch.title;
        const pTags = ch.paragraphs.map(p => `<p style="font-size: ${fontSize}px;">${p}</p>`).join("");
        wrapper.innerHTML = `
            <div class="article-header">
                <h1>${ch.title}</h1>
                <div class="article-meta">${L.ch_prefix}${ch.index}${L.ch_mid}${ch.words}${L.unit}</div>
            </div>
            <div class="article-body">
                ${pTags}
            </div>
            <div class="nav-buttons">
                <button class="nav-btn" onclick="goToChapter(currentIndex - 1)">${L.prev}</button>
                <button class="nav-btn" onclick="goToChapter(currentIndex + 1)" ${currentIndex >= book.chapters.length - 1 ? 'disabled' : ''}>${L.next}</button>
            </div>
        `;
    }
    document.getElementById("content-container").scrollTop = 0;
}

function goToChapter(idx) {
    if (idx < -1 || idx >= book.chapters.length) return;
    currentIndex = idx;
    renderSidebar();
    renderContent();
}

function toggleTheme() {
    const current = document.documentElement.getAttribute("data-theme");
    const next = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    document.getElementById("themeBtn").innerText = next === "dark" ? L.theme_dark : L.theme_light;
}

function changeFontSize(delta) {
    fontSize = Math.max(14, Math.min(26, fontSize + delta));
    const paras = document.querySelectorAll(".article-body p");
    paras.forEach(p => p.style.fontSize = fontSize + "px");
}

renderSidebar();
renderContent();
</script>
